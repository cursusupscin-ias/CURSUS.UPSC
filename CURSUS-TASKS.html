 try{

      palettes={

      },
      mode=['light','dark','auto'].includes(set.mode)?set.mode:'dark',
      resolved=mode==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'d':'l'):mode[0],
      v=(palettes[set.theme]||palettes.orbital)[resolved],root=document.documentElement;
  root.dataset.m=resolved;
  ['bg','soft','line','ink','mute','faint','acc'].forEach(function(k,i){root.style.setProperty('--'+k,v[i])});
  root.style.setProperty('--faint','color-mix(in srgb,'+v[5]+' 45%,'+v[4]+')');
  var premium=set.theme==='ink';
  root.style.setProperty('--card',premium?(resolved==='d'?'#151616':'#FFFFFF'):'color-mix(in srgb,var(--soft) 72%,var(--bg))');
  root.style.setProperty('--surface',premium?(resolved==='d'?'#1C1D1D':'#FAF9F5'):'color-mix(in srgb,var(--soft) 55%,var(--bg))');
  root.style.setProperty('--elevated',premium?(resolved==='d'?'#1C1D1D':'#FAF9F5'):'color-mix(in srgb,var(--soft) 38%,var(--bg))');
  root.style.colorScheme=resolved==='d'?'dark':'light';
 }catch(e){}
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#F7F7F8;--line:#E7E7EA;--ink:#0A0A0A;--mute:#6B6B73;--faint:#A1A1AA;--acc:#2563EB;--on:#fff;--red:#DC2626;--grn:#16A34A;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{font-size:14px}
body{font:1rem/1.5 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.ti{max-width:1180px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2563EB,#7C3AED 45%,#DB2777 75%,#EA580C);display:grid;place-items:center;color:#fff;font-size:.9rem}
.tabs{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:10px}
.tab{border:0;background:none;padding:6px 15px;border-radius:8px;font-weight:500;color:var(--mute);cursor:pointer}
.tab.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
main{max-width:1180px;margin:0 auto;padding:22px 18px 80px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.65rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}h3{font-size:1rem;font-weight:600}
.sub{color:var(--mute);font-size:.88rem}.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 15px;position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--acc))}
.kpi b{display:block;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}.kpi span{font-size:.82rem;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:500;font-size:.9rem;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);color:var(--on);border-color:var(--acc)}.btn.sm{padding:3px 8px;font-size:.8rem}.btn.red{color:var(--red)}
.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);outline:none;min-width:0}.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
textarea.inp{width:100%;min-height:64px;resize:vertical}
.add{display:grid;grid-template-columns:1fr auto auto auto auto;gap:7px}
.sec{font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.t{display:flex;align-items:center;gap:9px;padding:8px 3px;border-bottom:1px solid var(--line)}.t:last-child{border-bottom:0}.cp .t{padding:4px 2px}.cp .card{padding:11px 13px}.cp main{gap:10px}
.ck{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--faint);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-size:.75rem;line-height:1;padding:0}
.ck.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}
.tx{flex:1;min-width:0;overflow-wrap:anywhere}.t.done .tx{color:var(--faint);text-decoration:line-through}.tm{font-size:.78rem;color:var(--mute);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}.x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:1.1rem;padding:0 3px;line-height:1}.x:hover{color:var(--red)}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--acc))}
.empty{color:var(--mute);font-size:.88rem;padding:6px 0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.col{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:240px}.col.td{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.ch{display:flex;align-items:baseline;justify-content:space-between;cursor:pointer}.ch span{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}.ch b{font-size:1.25rem}.col.td .ch b{color:var(--acc)}
.col .t{padding:5px 0;gap:7px;font-size:.92rem}.col .ck{width:16px;height:16px}.qa{width:100%;font-size:.88rem;padding:5px 8px;border-style:dashed;margin-top:auto}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dw{text-align:center;font-size:.78rem;font-weight:600;color:var(--mute);text-transform:uppercase}
.tile{border:1px solid var(--line);border-radius:10px;min-height:78px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.tile:hover{border-color:var(--acc)}.tile.td{outline:2px solid var(--acc)}
.tile b{font-size:.95rem}.tile small{font-size:.74rem;color:var(--mute);font-weight:600}.dots{display:flex;gap:3px;flex-wrap:wrap}.dots i{width:6px;height:6px;border-radius:50%}
.mood{display:flex;gap:6px}.mood button{font-size:1.4rem;border:1px solid var(--line);background:none;border-radius:10px;padding:2px 8px;cursor:pointer;opacity:.55}.mood button.on{opacity:1;border-color:var(--acc);background:var(--soft)}
.fl{display:flex;flex-direction:column;gap:4px}.fl label{font-size:.82rem;font-weight:600;color:var(--mute)}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.thc{border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:none;text-align:left;display:flex;flex-direction:column;gap:7px}.thc.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.thc div{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid rgba(128,128,128,.25)}.thc div i{flex:1}.thc span{font-weight:600;font-size:.9rem}
.dz{display:flex;gap:5px;flex-wrap:wrap}.dz label{border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:.82rem;cursor:pointer}
@media(max-width:1000px){.wk{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.col{min-height:0}}
@media(max-width:760px){.cols,.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}.add{grid-template-columns:1fr 1fr}.add .inp:first-child{grid-column:1/-1}.brand span{display:none}main{padding:16px 12px 70px}.tile{min-height:58px;padding:4px 5px}.tile small{display:none}}
.tabs{overflow-x:auto;max-width:100%}.tab{white-space:nowrap}
.add2{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;align-items:end}
.tmv{display:block;font-size:.78rem;color:var(--mute);font-weight:600}
.mg8{display:grid;grid-template-columns:repeat(7,1fr) 70px;gap:7px}
.wp{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px;border-radius:10px;background:var(--soft);cursor:pointer;text-align:center}.wp b{font-size:.95rem}
.ring{width:112px;height:112px;flex:none}.ring text{font:700 20px var(--font);fill:var(--ink)}
.hw{overflow-x:auto}.ht{border-collapse:separate;border-spacing:3px;font-size:.78rem}.ht th{font-weight:600;color:var(--mute);padding:0 2px;min-width:22px}.ht td.n{white-space:nowrap;padding-right:10px;font-size:.92rem}.ht td.s{white-space:nowrap;color:var(--mute);padding-left:8px}
.hc{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--soft);cursor:pointer;transition:background .15s,transform .15s}.hc:hover{transform:scale(1.15)}.hc.on{background:var(--c);border-color:var(--c)}
.rt{width:100%;border-collapse:collapse;font-size:.9rem}.rt td,.rt th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}.rt th{color:var(--mute);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}

const dl=(name,txt)=>{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-sa]');if(!b)return;const a=b.dataset.sa,id=+b.dataset.id;
if(a==='sync')start(user);
else if(a==='out'){clearTimeout(timer);if(hash(APP.json())!==meta.syncedHash){while(busy)await new Promise(r=>setTimeout(r,100));await push();if(hash(APP.json())!==meta.syncedHash&&!confirm('Some recent changes could not be synced to the cloud yet. Sign out anyway?'))return}await signOutFn()}
else if(a==='snap'){await snap('manual');SYNC.fill()}
else if(a==='export')dl('cursus-tasks-backup-'+new Date().toISOString().slice(0,10)+'.json',APP.json());
else if(a==='dl'){const r=await getSnap(id);if(r)dl('cursus-tasks-snapshot-'+new Date(r.t).toISOString().slice(0,10)+'.json',r.json)}
else if(a==='rs'){const r=await getSnap(id);if(r&&confirm('Replace your current data with this snapshot? Your current data is saved as a snapshot first.')){await snap('before-restore');APP.load(r.json);SYNC.changed();SYNC.fill()}}});
document.addEventListener('change',async e=>{if(e.target.id!=='impf')return;const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(!j||!Array.isArray(j.tasks))throw 0;if(!confirm('Replace ALL current data with this backup file? A safety snapshot of your current data is saved first.'))return;await snap('before-import');APP.load(j);SYNC.changed();SYNC.fill()}catch(x){alert('That file is not a valid CURSUS TASKS backup.')}});
addEventListener('online',()=>push());

/* ---------- sign-in ---------- */
const MSG={'auth/unauthorized-domain':'This website address is not authorised in Firebase. Add it under Authentication > Settings > Authorized domains.','auth/popup-closed-by-user':'Sign-in was cancelled.','auth/network-request-failed':'No connection. Check your internet and try again.','auth/operation-not-allowed':'Google sign-in is not switched on in Firebase yet.'};
function showAuth(m){q('#auth').classList.remove('off');q('#gbtn').style.display='';q('#amsg').textContent=m||'';if(m){const p=q('#pv');p.style.display='';p.textContent='Continue offline (changes stay on this device until sync works)';p.onclick=()=>q('#auth').classList.add('off')}}
if(!OK){setState('pv');q('#amsg').textContent='Firebase is not set up yet. Paste your config into the CFG block near the end of this file.';q('#pv').style.display='';q('#pv').onclick=()=>q('#auth').classList.add('off')}
else{try{const A=await import(G+'firebase-app.js'),H=await import(G+'firebase-auth.js');F=await import(G+'firebase-firestore.js');const app=A.initializeApp(CFG);auth=H.getAuth(app);db=F.getFirestore(app);signOutFn=()=>H.signOut(auth);
const prov=()=>new H.GoogleAuthProvider();
q('#gbtn').onclick=async()=>{q('#amsg').textContent='';try{await H.signInWithPopup(auth,prov())}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return H.signInWithRedirect(auth,prov());q('#amsg').textContent=MSG[e.code]||('Sign-in failed: '+(e.code||e.message))}};
H.onAuthStateChanged(auth,u=>{if(u)start(u);else{unsub&&unsub();unsub=null;user=null;ready=0;setState('off');showAuth('')}})}
catch(e){setState('err');showAuth('Could not load Firebase. Check your internet connection and reload.')}}
</script>

<script>
(function(){
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,Q=['Small orbits, repeated daily, become a trajectory.','Do the next task, not all of them.','Consistency is the quiet engine of rank.','One focused hour beats three scattered ones.','Revise today what you will need on the exam day.','Progress you can see is progress you repeat.','Start the session; motivation follows the first page.','Protect the streak, forgive the slip.','Your future self is watching this hour.','Finish what is on the board, then rest.'];
let last=0,asked=0,ob=null,sh=0;
const CT=window.CT={tick(){const h=document.getElementById('cthero');if(!h||typeof S==='undefined'||!S)return;
 if(tab!=='today'){h.hidden=true;return}
 const d=new Date(),hr=d.getHours(),g=hr<5?'Good night':hr<12?'Good morning':hr<17?'Good afternoon':hr<21?'Good evening':'Good night',nm=(S.set.name||'').trim(),
 ts=S.tasks.filter(t=>t.date===TD()),dn=ts.filter(t=>t.done).length,p=ts.length?dn/ts.length:0,C=2*Math.PI*50,
 q=Q[Math.floor(d/864e5)%Q.length];
 h.hidden=false;
 h.innerHTML=`<div class="ctc"><div><h2>${g},<br><b data-ct="name" title="Change your name">${nm?esc(nm):'add your name'}</b></h2><div class="ctk" id="ctclk"></div><div class="ctd">${d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="ctq">${q}</div></div>
 <div class="ctorb" role="img" aria-label="${dn} of ${ts.length} tasks done today"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="4"/><circle class="ctpg" cx="60" cy="60" r="50" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px var(--acc))"/><g class="ctst" style="transform:rotate(0deg)"><path d="M60 5 L61.8 10.2 L67 12 L61.8 13.8 L60 19 L58.2 13.8 L53 12 L58.2 10.2Z" fill="var(--acc)" style="filter:drop-shadow(0 0 5px var(--acc))"/></g></svg><div class="ctv"><div><span id="ctn">0</span><small>OF ${ts.length} DONE</small></div></div></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const pg=h.querySelector('.ctpg'),st=h.querySelector('.ctst');if(pg)pg.style.strokeDashoffset=C*(1-p);if(st)st.style.transform='rotate('+Math.round(p*360)+'deg)'}));
 const el=h.querySelector('#ctn'),from=last;last=dn;if(RM||from===dn){el.textContent=dn}else{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(from+(dn-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
 CT.clock();
 if(!nm&&!S.set.nameAsked&&!asked&&!sessionStorage.ctask){const a=document.getElementById('auth');if(!a||a.classList.contains('off')){asked=1;setTimeout(()=>CT.ask(),RM?300:2800)}}},
 clock(){const e=document.getElementById('ctclk');if(e)e.textContent=new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})},
 ask(){if(document.querySelector('.ctm'))return;const m=document.createElement('div');m.className='ctm';m.innerHTML=`<div class="ctbx" role="dialog" aria-label="Your name"><h3>What should we call you?</h3><div class="sub">Your name appears in your daily greeting and reports. You can change it any time in Settings.</div><input class="inp" id="ctnm" maxlength="40" placeholder="Your name" value="${esc(S.set.name||'')}"><div class="row" style="justify-content:flex-end"><button class="btn" id="ctsk">Not now</button><button class="btn pri" id="ctsv">Save name</button></div></div>`;
 document.body.appendChild(m);const i=m.querySelector('#ctnm');i.focus();
 const done=v=>{if(v!==null){S.set.name=v.trim().slice(0,40)}S.set.nameAsked=1;sessionStorage.ctask=1;m.remove();save();render()};
 m.querySelector('#ctsv').onclick=()=>done(i.value);m.querySelector('#ctsk').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')done(i.value);if(e.key==='Escape')done(null)}}};
setInterval(CT.clock,1000);setInterval(()=>{if(typeof S!=='undefined'&&S&&S.set.theme==='timed')apply()},60000);
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-ct=name]'))CT.ask()});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.cc;if(!k)return;S.set.cust=Object.assign({bg:'#0a0a12',acc:'#E3B341'},S.set.cust,{[k]:e.target.value});S.set.theme='custom';save();apply()});
/* header collapse */
addEventListener('scroll',()=>{const t=document.querySelector('.top');if(t)t.classList.toggle('sm',scrollY>40)},{passive:true});
/* glow, tilt, magnet, ripple */
let lc=null,lb=null;const rs=c=>{if(c){c.style.transform=''}};
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const T=e.target;if(!T.closest)return;
 const c=T.closest('.card,.kpi');
 if(c){const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
  if(!RM&&r.width<560&&r.height<420)c.style.transform=`perspective(900px) rotateX(${(-(y/r.height-.5)*6).toFixed(2)}deg) rotateY(${((x/r.width-.5)*7).toFixed(2)}deg)`;else c.style.transform=''}
 if(lc&&lc!==c)rs(lc);lc=c;
 const b=RM?null:T.closest('.fab,.btn.pri,.tab');
 if(b){const r=b.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)*.18,dy=(e.clientY-r.top-r.height/2)*.18;b.style.transform=`translate(${Math.max(-6,Math.min(6,dx))}px,${Math.max(-6,Math.min(6,dy))}px)`}
