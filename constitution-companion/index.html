<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Constitution Companion - CURSUS UPSC</title>
<style>
:root{--bg:#eaeef7;--sf:rgba(255,255,255,.58);--sf2:rgba(255,255,255,.8);--ink:#0f172a;--mu:#64748b;--ln:rgba(15,23,42,.09);--ac:#2563eb;--as:rgba(37,99,235,.1);--onac:#fff;--ok:#16a34a;--b1:#c7d7ff;--b2:#e2d4ff;--b3:#cdeefa;--sh:0 8px 32px rgba(30,41,90,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c10;--sf:rgba(28,31,40,.72);--sf2:rgba(44,48,60,.88);--ink:#e8ecf6;--mu:#93a0ba;--ln:rgba(255,255,255,.08);--ac:#8ab4f8;--as:rgba(138,180,248,.12);--onac:#0a0c10;--ok:#4ade80;--b1:#141b2e;--b2:#15141d;--b3:#0f1a1d;--sh:0 8px 32px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c10;--sf:rgba(28,31,40,.72);--sf2:rgba(44,48,60,.88);--ink:#e8ecf6;--mu:#93a0ba;--ln:rgba(255,255,255,.08);--ac:#8ab4f8;--as:rgba(138,180,248,.12);--onac:#0a0c10;--ok:#4ade80;--b1:#141b2e;--b2:#15141d;--b3:#0f1a1d;--sh:0 8px 32px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 8% 12%,var(--b1),transparent 70%),radial-gradient(560px 460px at 92% 18%,var(--b2),transparent 70%),radial-gradient(600px 500px at 55% 100%,var(--b3),transparent 70%)}
h1,h2,h3,h4,.serif{font-family:"Inter",system-ui,sans-serif;letter-spacing:-.02em}
.glass,.top,nav,.card{background:var(--sf);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--ln);box-shadow:var(--sh)}
.top{display:flex;align-items:center;gap:12px;margin:12px 14px 0;padding:10px 16px;border-radius:16px}
.brand{display:flex;align-items:center;gap:12px}.lg{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;font-size:17px}
.brand b{display:block;font-size:15px;line-height:1.2;font-weight:650}.brand small{color:var(--mu);font-size:12px}.sp{flex:1}
button{font:500 13.5px/1 "Inter",system-ui,sans-serif;cursor:pointer;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);padding:9px 14px;border-radius:10px;transition:.18s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}button.p{background:var(--ac);color:var(--onac);border-color:var(--ac)}
#mb{display:none}
.wrap{display:flex;gap:14px;padding:14px;align-items:flex-start}
nav{width:290px;flex:none;border-radius:16px;padding:10px;overflow-y:auto;max-height:calc(100vh - 100px);position:sticky;top:14px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer;transition:.15s}
nav a:hover{background:var(--as)}nav a.on{background:var(--as);color:var(--ac);font-weight:600;box-shadow:inset 3px 0 0 #ff9933}nav a.on i{color:var(--ac)}nav a i{font-style:normal;color:var(--mu);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
nav h5{margin:16px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
main{flex:1;min-width:0;max-width:940px;padding:10px 4px 40px}
.card{border-radius:18px;padding:20px 22px;margin-bottom:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.g .card{margin:0}
h1{font-size:30px;font-weight:700;margin:0 0 4px}h2{font-size:11.5px;margin:0 0 12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.mu{color:var(--mu)}.bar{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.big{font-size:36px;font-weight:700;letter-spacing:-.03em}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:6px 0}
.tabs{display:inline-flex;max-width:100%;gap:2px;overflow-x:auto;padding:4px;margin:18px 0 16px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tabs button{border:0;background:none;color:var(--mu);white-space:nowrap;padding:8px 14px;box-shadow:none}.tabs button:hover{transform:none;color:var(--ink)}.tabs button.on{background:var(--sf2);color:var(--ink);font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.c{font-size:15px}.c ul{padding-left:20px;margin:4px 0}.c li{margin:5px 0}.c h4{font-size:17px;font-weight:650;margin:24px 0 6px}.c h4:first-child{margin-top:0}.c p{margin:9px 0}.c b{font-weight:600}.c pre{overflow-x:auto;background:var(--as);padding:12px;border-radius:10px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace}
.ck{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}.ck input,.ans input{accent-color:var(--ac);width:18px;height:18px;margin-top:3px;flex:none}
.ans{display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--as);border:1px solid var(--ln);border-radius:14px;padding:14px 18px;margin:22px 0 4px;font-weight:600}
textarea{width:100%;min-height:96px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font:inherit;resize:vertical;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.tm{font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
@media(max-width:800px){#mb{display:block}.wrap{padding:10px}nav{position:fixed;z-index:5;left:10px;top:calc(10px + env(safe-area-inset-top,0px));bottom:10px;max-height:none;transform:translateX(-120%);transition:.22s;background:var(--sf2)}nav.open{transform:none}h1{font-size:24px}}
.top{position:relative;overflow:hidden}.top::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#ff9933 0 33.4%,#dfe3ea 33.4% 66.6%,#138808 66.6%)}.lg{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;padding:2px;box-shadow:0 0 0 2px var(--sf2),0 3px 10px rgba(0,0,0,.2)}.hero{display:flex;align-items:center;gap:20px;margin:4px 0 24px}.hi{width:92px;height:92px;border-radius:16px;object-fit:contain;background:#fff;padding:6px;box-shadow:0 0 0 3px var(--sf2),0 10px 28px rgba(0,0,0,.2)}.hero h1{font-size:34px;margin:0}.rg{display:flex;justify-content:center;padding:4px 0}.card{transition:transform .2s,box-shadow .2s}.g .card:hover{transform:translateY(-2px)}h1{letter-spacing:-.03em}@media(max-width:800px){.hero h1{font-size:26px}.hi{width:72px;height:72px}}
</style></head><body>

<div class="wrap"><nav id="nv"></nav><main id="mn"></main></div>

const D=[{"n": 1, "title": "Foundational Architecture — Preamble & Part I (Articles 1–4)", "secs": [{"t": "Articles", "h": "<h4>A. The Preamble<\/h4><ul><li><b>Identity:<\/b> Serves as the key to the minds of the framers and outlines the core national philosophy.<\/li><li><b>Core Keywords Sequence:<\/b> Sovereign, Socialist, Secular, Democratic, Republic.<\/li><li><b>Core Objectives:<\/b> Justice (Social, Economic, Political), Liberty (Thought, Expression, Belief, Faith, Worship), Equality (Status, Opportunity), and Fraternity (Assuring dignity of the individual and unity &amp; integrity of the Nation).<\/li><li><b>Key Amendment:<\/b> The 42nd Constitutional Amendment Act, 1976 added three words: Socialist, Secular, and Integrity.<\/li><\/ul><h4>B. Part I: The Union and Its Territory (Articles 1–4)<\/h4><ul><li><b>Article 1:<\/b> Name and territory of the Union<\/li><ul><li><b>Clause (1):<\/b> &quot;India, that is Bharat, shall be a Union of States.&quot;<\/li><li><b>Clause (2):<\/b> States and territories specified in the First Schedule.<\/li><li><b>Clause (3):<\/b> Territory of India comprises:<\/li><ul><li>Territories of States.<\/li><li>Union Territories specified in First Schedule.<\/li><li>Such other territories as may be acquired.<\/li><\/ul><\/ul><li><b>Article 2:<\/b> Admission or establishment of new States<\/li><ul><li>Empowers Parliament to admit into the Union or establish new States that were not previously part of India on terms and conditions it thinks fit. (e.g., Admission of Sikkim).<\/li><\/ul><li><b>Article 3:<\/b> Formation of new States and alteration of areas, boundaries or names of existing States<\/li><ul><li>Empowers Parliament to reorganize internal state boundaries through 5 actions (F-I-D-A-N):<\/li><ul><li>Form a new State.<\/li><li>Increase the area of any State.<\/li><li>Diminish the area of any State.<\/li><li>Alter the boundaries of any State.<\/li><li>Name alteration of any State.<\/li><\/ul><li><b>The Proviso (Procedure &amp; Trap):<\/b><\/li><ul><li>A Bill under Art. 3 can be introduced only on the prior recommendation of the President.<\/li><li>Where the proposal affects the area/boundary/name of a State, the President must refer the Bill to the concerned State Legislature for its views within a specified period.<\/li><li><b>Crucial Rule:<\/b> Parliament is NOT bound by the views expressed by the State Legislature.<\/li><\/ul><\/ul><li><b>Article 4:<\/b> Laws under Articles 2 &amp; 3<\/li><ul><li><b>Clause (1):<\/b> Laws under Art. 2 or 3 shall contain consequential amendments to the First Schedule (List of States) and Fourth Schedule (Rajya Sabha seats).<\/li><li><b>Clause (2):<\/b> No such law shall be deemed to be an amendment of the Constitution for the purposes of Article 368. (Requires only a Simple Majority in Parliament).<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Preamble Nature &amp; Order<\/h4><ul><li><b>Mnemonic:<\/b> &quot;Super Smooth Silk Dress Ready&quot;<\/li><li><b>Decoding:<\/b><\/li><ul><li>Sovereign<\/li><li>Socialist<\/li><li>Secular<\/li><li>Democratic<\/li><li>Republic<\/li><\/ul><li><b>Tamil-English Association:<\/b> &quot;Triple-S D-R&quot; → &quot;மூன்று S, ஒரு DR&quot; (Sovereign-Socialist-Secular Democratic Republic).<\/li><\/ul><h4>Mnemonic 2: 42nd Amendment Added Words<\/h4><ul><li><b>Mnemonic:<\/b> S-S-I (&quot;Super Safe India&quot;)<\/li><li><b>Decoding:<\/b> Socialist, Secular, Integrity.<\/li><\/ul><h4>Mnemonic 3: Article 1 to 4 Scope Memory Map<\/h4><ul><li><b>Article 1:<\/b> &quot;1st Name Tag&quot; → Name &amp; Territory (Identity card of India).<\/li><li><b>Article 2:<\/b> &quot;OUTSIDE ENTRY&quot; → Admission of brand-new territories outside India.<\/li><li><b>Article 3:<\/b> &quot;INSIDE REDRAW&quot; (Action code: C-A-N-D-O / F-I-D-A-N) → Internal reorganization of existing States.<\/li><li><b>Article 4:<\/b> &quot;FOR-GET 368&quot; → Simple majority is enough; Article 368 does NOT apply.<\/li><\/ul>"}, {"t": "Connections", "h": "<ul><li><b>Art. 1 ↔ First &amp; Fourth Schedules:<\/b> Changing territory under Art. 1 automatically updates the First Schedule (Territorial Extent) and Fourth Schedule (Rajya Sabha Seat Distribution) via Art. 4(1).<\/li><li><b>Art. 3 ↔ Art. 368 (Cession vs Reorganization):<\/b> Reorganizing internal state boundaries passes by simple majority (Art. 4). However, ceding Indian territory to a foreign power cannot be done under Art. 3; it requires a Constitutional Amendment under Article 368 (Berubari Union Case, 1960).<\/li><li><b>Art. 3 ↔ Federal Structure:<\/b> Highlights that India is an &quot;Indestructible Union of Destructible States&quot;, standing in contrast to the USA (&quot;Indestructible Union of Indestructible States&quot;).<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Berubari Union Case (1960):<\/h4><ul><ul><li><b>Ruling:<\/b> Parliament&#x27;s power to diminish state area under Art. 3(c) does not include the power to cede Indian territory to a foreign state. Cession requires an Amendment under Art. 368.<\/li><li><b>Application:<\/b> Used in the 100th Constitutional Amendment Act, 2015, which ratified the exchange of 111 Indian enclaves for 51 Bangladesh enclaves. 2. Babulal Parate v. State of Bombay (1960):<\/li><li><b>Ruling:<\/b> The views of the State Legislature under the Art. 3 proviso are purely consultative. Parliament is free to accept or reject them or make fresh amendments to the Bill without re-referring it to the State. 3. SR Bommai v. Union of India (1994):<\/li><li><b>Ruling:<\/b> Declared Secularism, Federalism, and Democracy as part of the Basic Structure anchored in the Preamble. 4. Contemporary Examples:<\/li><li><b>Andhra Pradesh Reorganisation Act, 2014:<\/b> Created Telangana under Art. 3 despite opposition from the AP State Assembly.<\/li><li><b>Jammu &amp; Kashmir Reorganisation Act, 2019:<\/b> Bifurcated the State of J&amp;K into UT of J&amp;K and UT of Ladakh under Art. 3.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p>When writing a Mains answer on Federalism, State Reorganization, or the Basic Structure:<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;The Indian Federation is structurally defined under Article 1 as a &#x27;Union of States&#x27;, reflecting an indestructible entity created not by a contractual agreement among sovereign units, but as an administrative framework where internal boundaries remain flexible under Article 3.&quot;<\/p><ul><li>Mains Body Arguments (Asymmetric / Unitary Tilt):<\/li><ul><li>Cite Article 3 Proviso to demonstrate the centralizing tilt in Indian Federalism (non-binding nature of state legislative views).<\/li><li>Contrast Article 4(2) (internal territorial changes via simple majority) with the Berubari Union Precedent (1960) (cession requiring Art. 368 ratification).<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;While Article 3 provides essential flexibility for linguistic, cultural, and development-oriented state reorganization, constitutional propriety requires adhering to cooperative federalism by engaging in meaningful consultation with affected states.&quot;<\/p>"}, {"t": "Drill", "h": "<p>Test your recall and application ability. Write down or mentalize your answers before checking back:<\/p><p><b>1. Direct Recall:<\/b> What are the exact 5 actions Parliament can take regarding state boundaries under Article 3(a) through 3(e)? 2. Reverse Recall: Under which Article is it specified that an Act created for forming a new state will not be considered a Constitutional Amendment under Article 368? 3. UPSC Mains Analytical Trap: Suppose India signs a treaty to resolve a border dispute by transferring a small inhabited border village to Bhutan. Can Parliament execute this simply by passing a law under Article 3? Which landmark Supreme Court judgment governs this situation? 4. Sequential Precision: Name the 3 words added to the Preamble by the 42nd Amendment Act, 1976.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedule 1 to 12 (Mastered in previous lesson)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Current lesson complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Up Next)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35)<\/span><\/label>"}], "nchk": 4}, {"n": 2, "title": "Part II — Citizenship (Articles 5–11)", "secs": [{"t": "Articles", "h": "<p>Part II of the Constitution addresses the determination of Indian citizenship at the time of the commencement of the Constitution (January 26, 1950) [passage 4, passage 54].<\/p><h4>PART II: CITIZENSHIP (ARTICLES 5–11)<\/h4><p>│<\/p><h4>┌─────────────────────────┬──────────┴──────────┬───────────<\/h4><p>──────────────┐<\/p><pre>│ At Commencement      │ Migration Context │ Overseas &amp; Dual │\n│ (Art. 5)    │ (Art. 6 &amp; 7)     │ (Art. 8 &amp; 9)   │<\/pre><h4>└─────────────────────────┴─────────────────────┴───────────<\/h4><p>──────────────┘ │ ┌──────────┴──────────┐ │ Statutory Powers │ │ (Art. 10 &amp; 11)  │ └─────────────────────┘<\/p><h4>Article 5: Citizenship at the Commencement of the Constitution<\/h4><ul><li><b>Core Requirement:<\/b> Person must have domicile in the territory of India at commencement [passage 54].<\/li><li><b>Plus ANY ONE of the following 3 conditions:<\/b> 1. Art. 5(a): Person was born in the territory of India [passage 54]. 2. Art. 5(b): Either parent was born in the territory of India [passage 54]. 3. Art. 5(c): Person has been ordinarily resident in India for not less than 5 years immediately preceding Jan 26, 1950 (i.e., resident since at least Jan 26, 1945) [passage 54].<\/li><\/ul><h4>Article 6: Citizenship of Persons Migrated from Pakistan to India<\/h4><ul><li><b>Prerequisite:<\/b> Person, or either parent, or any grandparent was born in undivided India as defined in the Government of India Act, 1935 [passage 55].<\/li><li><b>Cut-Off Date:<\/b> 19th July 1948 (the date the permit system for migration was introduced) [passage 55].<\/li><ul><li><b>Category A (Migrated BEFORE July 19, 1948):<\/b> Deemed a citizen if ordinarily resident in India since migration [passage 55].<\/li><li>Category B (Migrated ON or AFTER July 19, 1948): Must be registered as a citizen by an officer appointed by the Dominion Government upon application submitted before Jan 26, 1950 [passage 55].<\/li><li><b>6-Month Proviso:<\/b> No person can be registered under Category B unless resident in India for at least 6 months immediately preceding the application [passage 56].<\/li><\/ul><\/ul><h4>Article 7: Citizenship of Migrants to Pakistan<\/h4><ul><li><b>General Rule:<\/b> A person who migrated from India to the territory now included in Pakistan after March 1, 1947 ceases to be an Indian citizen [passage 56].<\/li><li><b>Proviso (Resettlement Exception):<\/b> If a migrant returned to India under a permit for permanent return/resettlement issued under authority of law, they are deemed to have migrated to India after July 19, 1948 (i.e., eligible for citizenship via Art. 6(b) registration after 6 months of residence) [passage 57].<\/li><\/ul><p><b>Article 8:<\/b> Citizenship of Persons of Indian Origin Residing Outside India (PIOs/NRIs)<\/p><ul><li><b>Prerequisite:<\/b> Any person who, or either of whose parents or grandparents, was born in India (GOI Act, 1935) and is ordinarily residing in any country outside undivided India [passage 57].<\/li><li><b>Mechanism:<\/b> Deemed a citizen if registered as a citizen of India by the diplomatic or consular representative of India in that country upon application [passage 57].<\/li><\/ul><p><b>Article 9:<\/b> Persons Voluntarily Acquiring Citizenship of a Foreign State<\/p><ul><li><b>Single Citizenship Mandate:<\/b> No person shall be a citizen under Art. 5, 6, or 8 if they have voluntarily acquired foreign citizenship [passage 58].<\/li><li>Establishes the constitutional prohibition against dual citizenship.<\/li><\/ul><h4>Article 10: Continuance of the Rights of Citizenship<\/h4><ul><li>Guarantees that every person who is or is deemed to be a citizen under Articles 5–10 shall continue to be a citizen, subject to any law passed by Parliament [passage 58].<\/li><\/ul><p><b>Article 11:<\/b> Parliament to Regulate Citizenship by Law<\/p><ul><li>Explicitly states that nothing in Articles 5–10 limits Parliament&#x27;s sovereign power to make laws regarding the acquisition, termination, and all other matters relating to citizenship [passage 59].<\/li><li>Pursuant to Article 11, Parliament enacted The Citizenship Act, 1955.<\/li><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic: &quot;D-P-P-O-V-C-P&quot; (Articles 5 to 11)<\/h4><ul><li>Article 5 — Domicile at Commencement (&quot;Domicile in India&quot;) [passage 54].<\/li><li>Article 6 — Pakistan to India (&quot;Pakistan incoming migrants&quot;) [passage 54, passage 55].<\/li><li>Article 7 — Pakistan outgoing &amp; returned (&quot;Pakistan outgoing migrants&quot;) [passage 56].<\/li><li>Article 8 — Overseas Indian Origin (&quot;Outside India&quot;) [passage 57].<\/li><li>Article 9 — Voluntary Foreign Citizenship (&quot;Void Indian status / No Dual&quot;) [passage 58].<\/li><li>Article 10 — Continuance (&quot;Continued status guaranteed&quot;) [passage 58].<\/li><li>Article 11 — Parliament&#x27;s Power (&quot;Parliament makes Act&quot;) [passage 59].<\/li><\/ul><h4>Tamil-English Phonetic Map:<\/h4><ul><li><b>Art 5:<\/b> வாசம் (Domicile) → &quot;வாசம் இருந்தால் குடிமை&quot; (Residence + Birth/Parents).<\/li><li><b>Art 6:<\/b> வந்தவர் (Incoming) → பாகிஸ்தானில் இருந்து இந்தியா வந்தவர்.<\/li><li><b>Art 7:<\/b> போனவர் (Outgoing) → பாகிஸ்தானுக்கு போனவர் (மற்றும் திரும்பியவர்).<\/li><li><b>Art 8:<\/b> வெளியூர் (Overseas) → வெளிநாட்டில் வாழும் இந்திய வம்சாவளி.<\/li><li><b>Art 9:<\/b> வேற்று நாடு (Foreign) → வேற்று நாட்டில் குடியுரிமை பெற்றால் இந்திய குடியுரிமை ரத்து.<\/li><li><b>Art 10:<\/b> தொடர்ச்சி (Continuance) → குடியுரிமையின் தொடர்ச்சி.<\/li><li><b>Art 11:<\/b> பாராளுமன்றம் (Parliament) → சட்டம் இயற்றும் பாராளுமன்ற அதிகாரம்.<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>A. Constitutional Text vs. Statutory Law (Crucial Distinction)<\/h4><ul><li><b>Constitutional Articles 5–10:<\/b> These provisions were one-time snapshot provisions to identify who became a citizen on January 26, 1950 [passage 4, passage 54].<\/li><li><b>Post-1950 Acquisition &amp; Loss:<\/b> Articles 5–10 do not govern post-1950 citizenship. Post-1950 acquisition (Birth, Descent, Registration, Naturalization, Incorporation of Territory) and loss (Renunciation, Termination, Deprivation) are governed entirely by The Citizenship Act, 1955 enacted under Article 11 [passage 59].<\/li><\/ul><h4>B. Fundamental Rights Linked to Citizenship Status<\/h4><p>Knowing which Fundamental Rights apply only to Citizens versus all Persons is vital for Prelims and Mains:<\/p><h4>FUNDAMENTAL RIGHTS COVERAGE<\/h4><p>│ ┌────────────────────────┴────────────────────────┐<\/p><pre>│                             │\nCITIZENS ONLY                          ALL PERSONS\n(Arts 15, 16, 19, 29, 30)         (Arts 14, 20, 21, 21A, 22,<\/pre><p>23, 24, 25, 26, 27, 28)<\/p><ul><li><b>Citizens Only (Exclusive Rights):<\/b><\/li><ul><li><b>Article 15:<\/b> Protection against discrimination on grounds only of religion, race, caste, sex, or place of birth [passage 61].<\/li><li><b>Article 16:<\/b> Equality of opportunity in public employment [passage 66].<\/li><li><b>Article 19:<\/b> Six fundamental freedoms (speech, assembly, association, movement, residence, profession) [passage 70, passage 71].<\/li><li><b>Article 29 &amp; 30:<\/b> Cultural and educational protection for minorities/citizens [passage 7].<\/li><li><b>Electoral &amp; Constitutional Eligibility:<\/b> Right to vote (Art. 326) [passage 35] and eligibility for constitutional posts (President, VP, SC/HC Judges, Governors, MPs, MLAs).<\/li><\/ul><li>Available to All Persons (Citizens + Foreigners, except Enemy Aliens):<\/li><ul><li>Article 14 (Equality before law) [passage 61], Article 20 (Protection against conviction) [passage 76], Article 21 (Life &amp; personal liberty) [passage 77], Article 21A (Right to education) [passage 77], Article 22 (Protection against arrest) [passage 78], and Articles 25–28 (Religious freedom) [passage 84, passage 86, passage 87].<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Single Citizenship &amp; Unity of Nation:<\/h4><ul><ul><li><b>Pradeep Jain v. Union of India (1984):<\/b> The Supreme Court held that unlike the United States (which has dual citizenship of the Union and individual States), India has only one citizenship—Indian citizenship. There is no separate state citizenship. Domicile in India is singular. 2. Voluntary Acquisition &amp; Termination Mechanism:<\/li><li><b>Izhar Ahmad v. Union of India (1962):<\/b> The Supreme Court upheld the constitutional validity of Section 9(2) of the Citizenship Act, 1955 (read with Art. 9 [passage 58]), holding that obtaining a foreign passport creates a conclusive presumption of voluntary acquisition of foreign citizenship, automatically terminating Indian citizenship.<\/li><li><b>State of U.P. v. Shah Mohammad (1969):<\/b> Reaffirmed that determination of whether a citizen has lost citizenship under Art. 9 [passage 58] or statutory provisions lies exclusively with the Central Government, not ordinary criminal courts. 3. Infiltration, National Security &amp; Constitutional Duty:<\/li><li><b>Sarbananda Sonowal v. Union of India (2005):<\/b> The Supreme Court struck down the Illegal Migrants (Determination by Tribunal) Act, 1983 (IMDT Act), ruling that un-demarcated illegal migration creates &quot;external aggression and internal disturbance&quot; under Article 355 [passage 38], placing a constitutional obligation on the Union to protect state borders and verify citizenship. 4. Overseas Citizens of India (OCI) &amp; Contemporary Developments:<\/li><li><b>Status:<\/b> OCI is a statutory cardholder facility under Section 7A of the Citizenship Act, 1955 (amended in 2005/2015), not dual citizenship. OCIs do not have voting rights (Art. 326) [passage 35], nor rights to hold constitutional office or public employment (Art. 16) [passage 66].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Citizenship Amendments, Federal Security, and Human Rights<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part II of the Constitution (Articles 5–11) established a flexible citizenship regime at independence, balancing territorial domicile with the humanitarian fallout of Partition [passage 54, passage 55]. By vesting absolute legislative competence over post-1950 citizenship in Parliament under Article 11 [passage 59], the Constitution established citizenship as an exclusive Union subject (List I, Entry 17) [passage 425], vital for national integrity and uniform rights across the federation.&quot;<\/p><ul><li>Mains Body Arguments (Union Supremacy &amp; Rights Interface):<\/li><ul><li><b>Legislative Competence:<\/b> Cite List I, Entry 17 (Seventh Schedule) [passage 425] read with Article 11 [passage 59] to explain why State Assemblies cannot pass binding laws regarding citizenship, as citizenship is an exclusive executive and legislative domain of the Union.<\/li><li><b>Constitutional Rights Gradient:<\/b> Differentiate between rights reserved exclusively for citizens (Articles 15, 16, 19, 29, 30) [passage 61, passage 66, passage 70] and universal human rights guaranteed to all persons under Article 21 (Life and Liberty) [passage 77].<\/li><li><b>National Security vs. Judicial Scrutiny:<\/b> Reference Sarbananda Sonowal (2005) to show how Article 355 mandates Union action against illegal influx while maintaining constitutional procedures [passage 38].<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, while Article 11 empowers Parliament to adapt citizenship regulations to emerging geopolitical and humanitarian realities [passage 59], such statutory enactments must remain harmonized with the Basic Structure doctrine, balancing state security with non-arbitrariness under Article 14 [passage 61].&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your memory and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What are the exact cut-off dates mentioned in Article 6 (migration from Pakistan) [passage 55] and Article 7 (migration to Pakistan) [passage 56]? 2. Reverse Recall: Which Article explicitly states that obtaining foreign citizenship voluntarily leads to the immediate cessation of Indian citizenship eligibility at commencement? [passage 58] 3. UPSC Prelims Analytical Trap: A non-citizen foreigner residing in India wants to file a writ petition under Article 32 alleging violation of their fundamental right to freedom of speech (Article 19(1)(a)) [passage 70] and equality of opportunity in government jobs (Article 16) [passage 66]. Will the petition be maintainable? Why or why not? 4. Mains Applied Comparison: State Legislative Assemblies occasionally pass resolutions opposing Central citizenship legislation. From a constitutional perspective (referencing Article 11 [passage 59] and List I [passage 425]), what is the legal validity of such state legislative resolutions?<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights — General &amp; Equality (Articles 12–18) (Up Next)<\/span><\/label>"}], "nchk": 4}, {"n": 3, "title": "Part III — Fundamental Rights: Foundations & Right to Equality (Articles", "secs": [{"t": "Articles", "h": "<h4>12–18)<\/h4><p>Part III of the Constitution (Articles 12–35) is termed the &quot;Magna Carta of India&quot; [passage 3, passage 46]. Before detailing specific rights, the Constitution establishes two vital foundational pillars: Article 12 (defining against whom rights are enforceable) and Article 13 (defining what laws can be declared unconstitutional) [passage 46, passage 47].<\/p><h4>PART III: GENERAL FOUNDATIONS &amp; RIGHT TO EQUALITY<\/h4><p>│<\/p><h4>┌─────────────────────────┬───────────┴───────────┬─────────<\/h4><p>────────────────┐ │ General Foundations │ Formal &amp; Substantive│ Affirmative Action │ │ (Arts. 12 &amp; 13)  │ Equality (Art. 14) │ (Arts. 15 &amp; 16) │<\/p><h4>└─────────────────────────┴───────────────────────┴─────────<\/h4><p>────────────────┘ │ ┌──────────┴──────────┐ │ Social Abolition │ │ (Arts. 17 &amp; 18) │ └─────────────────────┘<\/p><h4>A. General Foundations (Articles 12 &amp; 13)<\/h4><ul><li><b>Article 12:<\/b> Definition of &quot;The State&quot;<\/li><ul><li>Defines &quot;the State&quot; for the purpose of Part III to include [passage 46]: 1. The Government and Parliament of India (Executive and Legislature of the Union) [passage 46]. 2. The Government and the Legislature of each of the States [passage 46]. 3. All local authorities (e.g., Municipalities, Panchayats, District Boards) within the territory of India [passage 46]. 4. Other authorities within the territory of India or under the control of the Government of India [passage 46].<\/li><\/ul><li><b>Article 13:<\/b> Laws Inconsistent with or in Derogation of Fundamental Rights<\/li><ul><li><b>Art. 13(1):<\/b> Pre-Constitutional Laws: All laws in force prior to Jan 26, 1950, in so far as they are inconsistent with Part III, are void to the extent of such inconsistency (Doctrine of Eclipse &amp; Severability) [passage 47].<\/li><li><b>Art. 13(2):<\/b> Post-Constitutional Laws: The State shall not make any law that takes away or abridges Part III rights; any law made in contravention is void to the extent of the contravention [passage 47].<\/li><li><b>Art. 13(3):<\/b> Definition of &quot;Law&quot;: Includes any Ordinance, order, bye-law, rule, regulation, notification, custom, or usage having the force of law in India [passage 48].<\/li><li><b>Art. 13(4):<\/b> Amendment Exemption Clause: Inserted by the 24th Constitutional Amendment Act, 1971, stating that nothing in Art. 13 applies to any amendment of the Constitution made under Article 368 [passage 48, passage 50].<\/li><\/ul><\/ul><h4>B. Right to Equality (Articles 14–18)<\/h4><ul><li><b>Article 14:<\/b> Equality Before Law &amp; Equal Protection of the Laws<\/li><ul><li>Mandates that the State shall not deny to any person (citizen or foreigner): 1. Equality before the law (British origin: negative concept, absence of special privilege, rule of law) [passage 49]. 2. Equal protection of the laws (American origin: positive concept, equal treatment under equal circumstances, reasonable classification) [passage 49].<\/li><\/ul><li><b>Article 15:<\/b> Prohibition of Discrimination on Specific Grounds<\/li><ul><li><b>Art. 15(1):<\/b> State shall not discriminate against any citizen on grounds ONLY of Religion, Race, Caste, Sex, Place of Birth (5 grounds) [passage 49].<\/li><li><b>Art. 15(2):<\/b> No citizen shall be subjected to restriction regarding access to shops, public restaurants, hotels, or use of wells, tanks, bathing ghats, roads maintained out of State funds (enforceable against private individuals too) [passage 49, passage 50].<\/li><li><b>Art. 15(3):<\/b> Special Provisions Exception: State can make special provisions for women and children [passage 50].<\/li><li><b>Art. 15(4):<\/b> Social &amp; Educational Advancement: Added by the 1st CAA, 1951 (Champakam Dorairajan case); allows special provisions for socially and educationally backward classes (SEBCs), SCs, and STs [passage 51, passage 53].<\/li><li><b>Art. 15(5):<\/b> Private Educational Institutions Reservation: Added by the 93rd CAA, 2005; allows reservation in educational institutions (aided or unaided private), excluding minority educational institutions (Art. 30) [passage 51, passage 53].<\/li><li><b>Art. 15(6):<\/b> EWS Educational Reservation: Added by the 103rd CAA, 2019; permits up to 10% reservation for Economically Weaker Sections (EWS) in educational institutions [passage 52, passage 53].<\/li><\/ul><li><b>Article 16:<\/b> Equality of Opportunity in Public Employment<\/li><ul><li><b>Art. 16(1) &amp; (2):<\/b> Equality of opportunity in public employment; no citizen discriminated against on grounds ONLY of Religion, Race, Caste, Sex, Place of Birth, DESCENT, or RESIDENCE (7 grounds) [passage 54].<\/li><li><b>Art. 16(3):<\/b> Residence Requirement Law: Parliament (and not State Legislatures) can prescribe residence requirements for specific classes of employment in a State/UT [passage 54, passage 94].<\/li><li><b>Art. 16(4):<\/b> Backward Class Reservation: Allows State to reserve appointments/posts for any backward class not adequately represented in public services [passage 55].<\/li><li><b>Art. 16(4A):<\/b> Promotion Reservation: Added by 77th CAA, 1995 &amp; 85th CAA, 2001; enables reservation in promotions with consequential seniority for SCs and STs [passage 55, passage 56].<\/li><li><b>Art. 16(4B):<\/b> Carry-Forward Rule: Added by 81st CAA, 2000; backlog vacancies can be filled in subsequent years without counting toward the 50% ceiling rule in that year [passage 55, passage 56].<\/li><li><b>Art. 16(5):<\/b> Religious Office Exemption: Incumbent of an office connected with a religious/denominational institution can belong to that specific religion/denomination [passage 57].<\/li><li><b>Art. 16(6):<\/b> EWS Public Employment Reservation: Added by 103rd CAA, 2019; up to 10% reservation for EWS in civil posts and services [passage 57, passage 60].<\/li><\/ul><li><b>Article 17:<\/b> Abolition of Untouchability<\/li><ul><li>Absolute prohibition of &quot;Untouchability&quot; in any form [passage 58]. Enforcement of any disability arising from it is an offence punishable by law [passage 58]. Parliament enacted the Protection of Civil Rights Act, 1955 under Article 35(a)(ii) [passage 94, passage 569].<\/li><\/ul><li><b>Article 18:<\/b> Abolition of Titles<\/li><ul><li><b>Art. 18(1):<\/b> State shall confer no title except military or academic distinctions [passage 58].<\/li><li><b>Art. 18(2):<\/b> Citizens prohibited from accepting titles from foreign States [passage 58].<\/li><li><b>Art. 18(3) &amp; (4):<\/b> Foreigners holding offices of profit/trust under the State cannot accept foreign titles, presents, or emoluments without the consent of the President [passage 58, passage 59].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: General Structure of Articles 12 to 18<\/h4><ul><li><b>Mnemonic:<\/b> &quot;S-L-E-D-E-U-T&quot; (&quot;Sledge Out Titles&quot;)<\/li><li><b>Decoding:<\/b><\/li><ul><li><b>Art. 12:<\/b> State Definition [passage 46]<\/li><li><b>Art. 13:<\/b> Laws Invalid / Judicial Review [passage 47]<\/li><li><b>Art. 14:<\/b> Equality before Law [passage 49]<\/li><li><b>Art. 15:<\/b> Discrimination Prohibition (5 grounds) [passage 49]<\/li><li><b>Art. 16:<\/b> Employment Opportunity (7 grounds) [passage 54]<\/li><li><b>Art. 17:<\/b> Untouchability Abolished [passage 58]<\/li><li><b>Art. 18:<\/b> Titles Abolished [passage 58]<\/li><\/ul><\/ul><h4>Mnemonic 2: Non-Discrimination Grounds Trap (Art. 15 vs. Art. 16)<\/h4><ul><li><b>Article 15 (5 Grounds):<\/b> R-R-C-S-P (&quot;Religion, Race, Caste, Sex, Place of birth&quot;) [passage 49].<\/li><li><b>Article 16 (7 Grounds):<\/b> R-R-C-S-P + D-R (&quot;Article 15 grounds PLUS Descent and Residence&quot;) [passage 54].<\/li><li><b>Tamil-English Association:<\/b> &quot;15-ல 5 தான், 16-ல 7 (வம்சாவளி D மற்றும் வாசம் R சேர்க்க வேண்டும்)&quot;.<\/li><\/ul>"}, {"t": "Connections", "h": "<ul><li>Art. 12 &amp; 13 ↔ Arts. 32 &amp; 226 (Judicial Review Mechanics): Article 13 acts as the substantive trigger for judicial review by declaring non-compliant laws void [passage 47], while Article 32 (Supreme Court) [passage 90] and Article 226 (High Court) [passage 192] provide the remedial enforcement mechanism.<\/li><li>Art. 13(4) ↔ Art. 368 (The Amending Power Saga): The conflict between Parliament&#x27;s power to amend Part III and judicial review evolved through landmark cases:<\/li><li>𝑆ℎ𝑎𝑛𝑘𝑎𝑟𝑖𝑃𝑟𝑎𝑠𝑎𝑑(1951) → 𝐺𝑜𝑙𝑎𝑘𝑛𝑎𝑡ℎ(1967) → 24𝑡ℎ𝐶𝐴𝐴(1971) → 𝐾𝑒𝑠𝑎𝑣𝑎𝑛𝑎𝑛𝑑𝑎𝐵ℎ𝑎𝑟𝑎𝑡𝑖(1973) → 𝑀𝑖𝑛𝑒𝑟<\/li><li>The Supreme Court held that while Parliament can amend any Part III right under Art. 368, it cannot destroy the Basic Structure of the Constitution.<\/li><li>Arts. 14, 15, 16 ↔ Part IV DPSPs (Arts. 38, 39, 46): Substantive equality under Articles 15(4) and 16(4) acts as the practical constitutional instrument to realize the directive principles of minimizing income inequality (Art. 38(2)) [passage 97] and promoting educational/economic interests of weaker sections (Art. 46) [passage 105].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Test for &quot;Other Authorities&quot; under Article 12:<\/h4><ul><ul><li><b>Ajay Hasia v. Khalid Mujib (1981):<\/b> Laid down the 6-point test to determine if a body is an instrumentality or agency of the State under Art. 12 [passage 46] (e.g., deep pervasive State control, financial assistance, monopoly status).<\/li><\/ul><\/ul><p>2. New Concept of Equality (Anti-Arbitrariness):<\/p><ul><ul><li>E.P. Royappa v. State of Tamil Nadu (1974) &amp; Maneka Gandhi v. State of Union of India (1978): Equality under Art. 14 [passage 49] is a dynamic concept; arbitrariness and equality are sworn enemies. An arbitrary executive action violates Art. 14.<\/li><\/ul><\/ul><p><b>3. The Reservation Paradigm &amp; Limits:<\/b><\/p><ul><ul><li>Indra Sawhney v. Union of India (1992) [Mandal Case]:<\/li><ul><li>Upheld 27% reservation for OBCs under Art. 16(4) [passage 55].<\/li><li>Held total reservation should not exceed 50%.<\/li><li>Mandated exclusion of the &quot;Creamy Layer&quot;.<\/li><li>Declared reservation in promotions unconstitutional (prompting Parliament to enact Art. 16(4A) via 77th CAA) [passage 55, passage 56].<\/li><\/ul><li>M. Nagaraj v. Union of India (2006) &amp; Jarnail Singh (2018): Upheld SC/ST promotion reservation under Art. 16(4A) [passage 55], requiring the State to collect quantifiable data showing backwardness and inadequacy of representation while maintaining administrative efficiency under Article 335 [passage 366].<\/li><li><b>Janhit Abhiyan v. Union of India (2022):<\/b> A 5-judge bench upheld the validity of the 103rd CAA, 2019 (EWS reservation under Arts. 15(6) and 16(6)) [passage 52, passage 57], holding that economic criteria alone can form a valid basis for affirmative action and that the 50% ceiling applies to caste-based reservations, not EWS.<\/li><\/ul><\/ul><p><b>4. National Awards vs. Constitutional Titles:<\/b><\/p><ul><ul><li><b>Balaji Raghavan v. Union of India (1996):<\/b> Upheld National Awards (Bharat Ratna, Padma awards), ruling they are decorations, not titles under Art. 18 [passage 58]. However, awardees cannot use them as prefixes or suffixes to their names.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Substantive Equality, Executive Discretion, and Affirmative Action Architecture<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;The Right to Equality under Articles 14–18 transitions Indian constitutionalism from formal equality (equal treatment of all) to substantive equality (equalizing unequal starting points) [passage 49, passage 51]. Grounded in the anti-arbitrariness doctrine established in E.P. Royappa, these provisions protect individuals against state overreach while enabling social justice through affirmative action [passage 46, passage 55].&quot;<\/p><ul><li>Mains Body Arguments (Anti-Arbitrariness &amp; Reservation Balance):<\/li><ul><li><b>Expanding Article 12 Reach:<\/b> Cite the Ajay Hasia test to argue why privatized public utilities or statutory bodies carrying out public duties must remain accountable under Part III [passage 46].<\/li><li><b>Judicial Synthesis of Substantive Equality:<\/b> Use Indra Sawhney (1992) and Janhit Abhiyan (2022) to demonstrate how the judiciary balances the 50% rule with expanding social welfare needs (OBC &amp; EWS provisions under Arts. 15(6) and 16(6)) [passage 52, passage 55, passage 57].<\/li><li><b>Residence Discrimination Trap:<\/b> Cite Article 16(3) read with Article 35(a)(i) [passage 54, passage 94] to analyze state laws attempting to enforce local domicile quotas in private/public jobs without Parliamentary authorization.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, the Right to Equality is not a static prohibition against classification, but an active instrument of social transformation that balances individual merit with compensatory justice, upholding the Basic Structure of the Constitution.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical ability:<\/h4><p><b>1. Direct Recall:<\/b> What are the two additional grounds of non-discrimination present in Article 16(2) [passage 54] that are NOT present in Article 15(1) [passage 49]? 2. Reverse Recall: Which Constitutional Amendment Act added Article 15(5) [passage 51, passage 53] allowing reservations for SC/ST/SEBCs in private educational institutions? Which educational institutions are explicitly excluded from this clause? [passage 51] 3. UPSC Prelims Analytical Trap: A State Government passes an executive notification reserving 80% of all state government jobs for local residents of that State. Is this notification constitutionally valid under Article 16? Which institution has the exclusive power to enact residence requirements for public employment? [passage 54, passage 94] 4. Mains Applied Question: Discuss how the Supreme Court&#x27;s ruling in Janhit Abhiyan (2022) expanded the constitutional understanding of affirmative action beyond traditional caste-based criteria under Articles 15(6) and 16(6) [passage 52, passage 57].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: General &amp; Right to Equality (Articles 12–18) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part III: Right to Freedom (Articles 19–22) (Up Next)<\/span><\/label>"}], "nchk": 5}, {"n": 4, "title": "Part III — Right to Freedom (Articles 19–22)", "secs": [{"t": "Articles", "h": "<p>Articles 19 through 22 constitute the essential core of personal liberty and democratic freedoms under Part III of the Constitution [passage 1, passage 50].<\/p><h4>RIGHT TO FREEDOM (ARTICLES 19–22)<\/h4><p>│<\/p><h4>┌────────────────────────┬──────────┴──────────┬────────────<\/h4><p>────────────┐<\/p><pre>│ Six Democratic    │ Protection in │ Life &amp; Personal   │\n│ Freedoms (Art. 19) │ Convictions    │ Liberty       │\n│            │ (Art. 20)     │ (Arts. 21 &amp; 21A) │<\/pre><h4>└────────────────────────┴─────────────────────┴────────────<\/h4><p>────────────┘ │ ┌──────────┴──────────┐<\/p><pre>│ Arrest &amp;       │\n│ Preventive      │<\/pre><p>│ Detention (Art.22)│ └─────────────────────┘<\/p><p><b>Article 19:<\/b> Protection of Certain Rights Regarding Freedom of Speech, etc.<\/p><ul><li><b>Scope:<\/b> Guaranteed exclusively to citizens of India [passage 50].<\/li><li><b>The Six Fundamental Freedoms [Article 19(1)]:<\/b><\/li><ul><li><b>Art. 19(1)(a):<\/b> Right to freedom of speech and expression [passage 50].<\/li><li><b>Art. 19(1)(b):<\/b> Right to assemble peaceably and without arms [passage 50].<\/li><li><b>Art. 19(1)(c):<\/b> Right to form associations, unions, or co-operative societies (Co-operative societies added by 97th CAA, 2011) [passage 50, passage 51].<\/li><li><b>Art. 19(1)(d):<\/b> Right to move freely throughout the territory of India [passage 50].<\/li><li><b>Art. 19(1)(e):<\/b> Right to reside and settle in any part of the territory of India [passage 51].<\/li><li><b>[Art. 19(1)(f):<\/b> Right to property — OMITTED by the 44th Constitutional Amendment Act, 1978] [passage 51, passage 54].<\/li><li><b>Art. 19(1)(g):<\/b> Right to practise any profession, or carry on any occupation, trade, or business [passage 51].<\/li><\/ul><li>Reasonable Restrictions Framework [Articles 19(2) to 19(6)]:<\/li><ul><li>Rights under Art. 19 are not absolute; they are subject to statutory reasonable restrictions imposed by the State under specified constitutional grounds [passage 51, passage 52]:<\/li><li><b>Art. 19(2) Grounds for 19(1)(a) [8 Grounds]:<\/b> Sovereignty and integrity of India, Security of the State, Friendly relations with foreign States, Public order, Decency or morality, Contempt of court, Defamation, or Incitement to an offence [passage 52].<\/li><li><b>Art. 19(3) Grounds for 19(1)(b) [2 Grounds]:<\/b> Sovereignty and integrity of India, Public order [passage 52].<\/li><li><b>Art. 19(4) Grounds for 19(1)(c) [3 Grounds]:<\/b> Sovereignty and integrity of India, Public order, Morality [passage 53].<\/li><li>Art. 19(5) Grounds for 19(1)(d) &amp; (e) [2 Grounds]: Interests of the general public, Protection of the interests of any Scheduled Tribe [passage 53].<\/li><li><b>Art. 19(6) Grounds for 19(1)(g):<\/b> Interests of the general public, prescribing technical qualifications, or State monopoly in trade/industry [passage 55, passage 56].<\/li><\/ul><\/ul><p><b>Article 20:<\/b> Protection in Respect of Conviction for Offences<\/p><p>Available to all persons (citizens and foreigners) [passage 56]. Provides three distinct immunities against arbitrary penal action:<\/p><p>1. Article 20(1) — Protection Against Ex Post Facto Law: No person shall be convicted of any offence except for violation of a law in force at the time of commission of the act, nor subjected to a penalty greater than that prescribed at that time [passage 56]. (Applies only to criminal law, not civil liability or taxes). 2. Article 20(2) — Protection Against Double Jeopardy: No person shall be prosecuted and punished for the same offence more than once [passage 57]. (Applies before judicial courts/tribunals, not departmental or administrative proceedings). 3. Article 20(3) — Protection Against Self-Incrimination: No person accused of any offence shall be compelled to be a witness against himself [passage 57].<\/p><h4>Article 21: Protection of Life and Personal Liberty<\/h4><ul><li><b>Text:<\/b> &quot;No person shall be deprived of his life or personal liberty except according to procedure established by law.&quot; [passage 57]<\/li><li>Available to all persons [passage 57].<\/li><li>Formulates the bedrock of basic rights, expanded judicially from procedural checking to substantive fairness (&quot;Due Process of Law&quot;).<\/li><\/ul><h4>Article 21A: Right to Education<\/h4><ul><li><b>Text:<\/b> The State shall provide free and compulsory education to all children of the age of six to fourteen years in such manner as the State may, by law, determine [passage 57].<\/li><li><b>Inserted by:<\/b> 86th Constitutional Amendment Act, 2002 (enforced from April 1, 2010) [passage 57, passage 58].<\/li><\/ul><h4>Article 22: Protection Against Arrest and Detention in Certain Cases<\/h4><p>Divides detention into two distinct categories: Punitive Detention and Preventive Detention [passage 58, passage 59, passage 60].<\/p><ul><li>A. Punitive Detention Procedural Safeguards [Articles 22(1) &amp; 22(2)]:<\/li><ul><li>Right to be informed as soon as may be of the grounds of arrest [passage 58].<\/li><li>Right to consult and be defended by a legal practitioner of choice [passage 58].<\/li><li>Right to be produced before the nearest magistrate within 24 hours of arrest (excluding journey time) [passage 59].<\/li><li>Right not to be detained beyond 24 hours without the magistrate&#x27;s authorization [passage 59].<\/li><\/ul><li><b>B. Exceptions [Article 22(3)]:<\/b><\/li><ul><li>Safeguards in Art. 22(1) and 22(2) do NOT apply to [passage 59]: 1. Enemy aliens [passage 59]. 2. Persons arrested or detained under any law providing for preventive detention [passage 59, passage 60].<\/li><\/ul><li>C. Preventive Detention Safeguards [Articles 22(4) to 22(7)]:<\/li><ul><li><b>3-Month Advisory Board Limit:<\/b> Maximum period of preventive detention without Advisory Board approval is 3 months [passage 60]. (Note: The 44th CAA 1978 proposed reducing this to 2 months, but that clause has not been brought into force by notification) [passage 60, passage 61].<\/li><li><b>Communication of Grounds:<\/b> Authority must communicate the grounds of detention to the detainee as soon as possible and allow the earliest opportunity to make a representation [passage 64].<\/li><li><b>Public Interest Exception:<\/b> Authority is not required to disclose facts that it considers against the public interest [passage 64].<\/li><li><b>Parliamentary Competence [Art. 22(7)]:<\/b> Parliament can prescribe circumstances, maximum detention periods, and Advisory Board procedures by law [passage 65].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: The 6 Freedoms of Article 19(1)<\/h4><ul><li><b>Mnemonic:<\/b> &quot;S-A-A-M-R-P&quot; (&quot;Speak And Associate, Move, Reside, Produce&quot;)<\/li><li><b>Decoding:<\/b><\/li><ul><li>19(1)(a) — Speech &amp; Expression [passage 50]<\/li><li>19(1)(b) — Assembly (peaceful) [passage 50]<\/li><li>19(1)(c) — Association / Unions / Co-operatives [passage 50]<\/li><li>19(1)(d) — Movement across India [passage 50]<\/li><li>19(1)(e) — Residence &amp; Settlement [passage 51]<\/li><li>19(1)(g) — Profession, Trade, Business [passage 51]<\/li><\/ul><li><b>Tamil-English Association:<\/b> &quot;பேசு (Speech), கூடு (Assembly), சங்கம் வை (Association), நகர் (Movement), தங்கு (Residence), தொழில் செய் (Profession)&quot;.<\/li><\/ul><h4>Mnemonic 2: Article 20 Immunities<\/h4><ul><li><b>Mnemonic:<\/b> &quot;P-J-I&quot; (&quot;Past law, Jeopardy, Incrimination&quot;)<\/li><li><b>Decoding:<\/b><\/li><ul><li><b>20(1):<\/b> Past Law Protection (Ex Post Facto) [passage 56]<\/li><li><b>20(2):<\/b> Jeopardy Protection (Double Jeopardy) [passage 57]<\/li><li><b>20(3):<\/b> Incrimination Prohibition (Self-Incrimination) [passage 57]<\/li><\/ul><\/ul><h4>Mnemonic 3: Article 22 Punitive Arrest Rights<\/h4><ul><li><b>Mnemonic:<\/b> &quot;G-L-M&quot;<\/li><li><b>Decoding:<\/b> Grounds informed [passage 58], Legal advisor consulted [passage 58], Magistrate within 24 Hours [passage 59].<\/li><\/ul>"}, {"t": "Connections", "h": "<ul><li>The Golden Triangle (Articles 14, 19, &amp; 21):<\/li><ul><li>Established in Maneka Gandhi v. Union of India (1978). State action depriving personal liberty under Article 21 [passage 57] cannot be tested in isolation; it must also satisfy the non-arbitrariness test of Article 14 [passage 41] and the reasonable restrictions test of Article 19 [passage 51, passage 52].<\/li><\/ul><li>Articles 19 &amp; 21 Emergency Immunity (Articles 358 &amp; 359):<\/li><ul><li><b>Article 358:<\/b> Suspends Article 19 freedoms automatically, but ONLY when Emergency is declared on grounds of War or External Aggression (not Armed Rebellion) [passage 431].<\/li><li><b>Article 359:<\/b> Empowers the President to suspend enforcement of Part III rights during emergency, EXCEPT Articles 20 and 21, which can never be suspended [passage 434].<\/li><\/ul><li><b>The Education Triad:<\/b><\/li><ul><li><b>Article 21A (Fundamental Right:<\/b> Free &amp; compulsory education for 6–14 years) [passage 57] ↔ Article 45 (DPSP: Early childhood care under 6 years) [passage 96] ↔ Article 51A(k) (Fundamental Duty of parents/guardians) [passage 102].<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Procedural due process vs. Procedure established by law:<\/h4><ul><ul><li><b>A.K. Gopalan v. State of Madras (1950):<\/b> Adopted a narrow view, holding that &quot;procedure established by law&quot; under Art. 21 [passage 57] meant any procedure enacted by Parliament, regardless of procedural fairness.<\/li><li><b>Maneka Gandhi v. Union of India (1978):<\/b> Overruled Gopalan; held that procedure depriving life/liberty must be just, fair, and reasonable, effectively importing the American doctrine of &quot;Substantive Due Process&quot; into Article 21. 2. Right to Privacy as a Fundamental Right:<\/li><li><b>K.S. Puttaswamy v. Union of India (2017):<\/b> A unanimous 9-judge bench declared the Right to Privacy an intrinsic part of the Right to Life and Personal Liberty under Article 21 [passage 57]. 3. Freedom of Speech, Internet &amp; Media Governance:<\/li><li><b>Shreya Singhal v. Union of India (2015):<\/b> Struck down Section 66A of the Information Technology Act for overbreadth and vagueness, reinforcing Art. 19(1)(a) [passage 50] against unconstitutional speech restrictions under Art. 19(2) [passage 52].<\/li><li><b>Anuradha Bhasin v. Union of India (2020):<\/b> Declared freedom of speech and trade over the Internet protected under Articles 19(1)(a) and 19(1)(g) [passage 50, passage 51]. Indefinite internet shutdowns were declared illegal under the proportionality test. 4. Self-Incrimination &amp; Modern Forensics:<\/li><li><b>Selvi v. State of Karnataka (2010):<\/b> Held that involuntary administration of narco-analysis, polygraph tests, or brain-mapping violates the right against self-incrimination under Article 20(3) [passage 57] and personal liberty under Article 21 [passage 57].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<h4>Mains Topic: Preventive Detention, Digital Liberties, and Due Process<\/h4><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Articles 19–22 form the structural arch of civil liberties in the Constitution, balancing personal freedom with public order [passage 50, passage 57, passage 58]. Judicially reinforced through the &#x27;Golden Triangle&#x27; doctrine, these provisions ensure that state interference with individual liberty is governed not by executive discretion, but by fair, just, and reasonable procedures.&quot;<\/p><ul><li>Mains Body Arguments (Proportionality &amp; Preventive Detention):<\/li><ul><li><b>Testing State Restrictions:<\/b> Cite the proportionality test (Puttaswamy / Anuradha Bhasin) when analyzing state curbs on digital communication, verifying if restrictions satisfy a legitimate goal, rational nexus, necessity, and least-restrictive means under Article 19(2) [passage 52].<\/li><li><b>Preventive Detention Paradox:<\/b> Contrast Article 22(4) safeguards [passage 60] with state security mandates, emphasizing judicial demands for procedural adherence (D.K. Basu guidelines).<\/li><li><b>Emergency Protection Shield:<\/b> Highlight Articles 358 and 359 read with the 44th Amendment Act to show that Article 20 and Article 21 remain enforceable even under a National Emergency [passage 431, passage 434].<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, the Right to Freedom under Articles 19–22 serves as a bulwark against executive arbitrariness, requiring continuous judicial vigilance to harmonize democratic freedoms with national security.&quot;<\/p>"}, {"t": "Drill", "h": "<p><b>1. Direct Recall:<\/b> What are the 8 constitutional grounds under which the State can impose reasonable restrictions on Freedom of Speech and Expression (Article 19(1)(a)) under Article 19(2)? [passage 52] 2. Reverse Recall: Under which Article and clause is a person protected against being prosecuted and punished twice for the exact same offence? [passage 57] 3. UPSC Prelims Analytical Trap: During a Proclamation of National Emergency declared on grounds of &quot;Armed Rebellion&quot;, can the President suspend the right to move courts for the enforcement of Article 19 and Article 21? [passage 431, passage 434] 4. Mains Applied Question: Discuss how the Supreme Court&#x27;s ruling in Anuradha Bhasin (2020) extended Article 19 rights to digital networks and established the doctrine of proportionality for administrative orders.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: General &amp; Right to Equality (Articles 12–18) (Lesson 3)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part III: Right to Freedom (Articles 19–22) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part III: Rights against Exploitation, Religion, Culture &amp; Remedies (Articles<\/span><\/label><p>23–35) (Up Next)<\/p>"}], "nchk": 6}, {"n": 5, "title": "Part III — Fundamental Rights: Exploitation, Religion, Culture, Savings &", "secs": [{"t": "Articles", "h": "<h4>Constitutional Remedies (Articles 23–35)<\/h4><p>This lesson covers the remaining foundational rights in Part III, spanning protection against human exploitation, religious freedoms, minority cultural safeguards, statutory protection clauses, and the supreme enforcement mechanism under Article 32 [passage 4, passage 5, passage 6, passage 94].<\/p><h4>EXPLOITATION, RELIGION, CULTURAL &amp; REMEDIAL RIGHTS (ARTICLES 23–35)<\/h4><p>│<\/p><h4>┌───────────────────────────┬─────────┴───────────┬─────────<\/h4><p>──────────────────┐ │ Right against Exploitation│ Freedom of Religion │ Cultural &amp; Educational │<\/p><pre>│ (Arts. 23 &amp; 24)       │ (Arts. 25–28)   │ (Arts. 29 &amp; 30)      │<\/pre><h4>└───────────────────────────┴─────────────────────┴─────────<\/h4><p>──────────────────┘ │<\/p><h4>┌───────────────────────────┼─────────────────────┬─────────<\/h4><p>──────────────────┐ │ Savings of Certain Laws │ Right to Remedies │ Military &amp; Enforcement │<\/p><pre>│ (Arts. 31A, 31B, 31C) │ (Art. 32)     │ Powers (Arts. 33, 34, 35) │<\/pre><h4>└───────────────────────────┴─────────────────────┴─────────<\/h4><p>──────────────────┘<\/p><h4>A. Right against Exploitation (Articles 23–24)<\/h4><ul><li><b>Article 23:<\/b> Prohibition of Traffic in Human Beings and Forced Labour<\/li><ul><li><b>Art. 23(1):<\/b> Prohibits traffic in human beings, begar (unpaid forced labor), and other similar forms of forced labor [passage 77]. Any contravention is an offence punishable in accordance with law [passage 77].<\/li><li><b>Art. 23(2) State Exception:<\/b> Allows the State to impose compulsory service for public purposes (e.g., military conscription, civic duties) [passage 77]. In imposing such service, the State shall not discriminate on grounds only of religion, race, caste, or class (Note: &quot;Sex&quot; and &quot;Place of Birth&quot; are notably absent here) [passage 77].<\/li><\/ul><li><b>Article 24:<\/b> Prohibition of Employment of Children in Factories, etc.<\/li><ul><li>Prohibits any child below the age of fourteen years from being employed in any factory, mine, or engaged in any other hazardous employment [passage 78].<\/li><\/ul><\/ul><h4>B. Right to Freedom of Religion (Articles 25–28)<\/h4><ul><li><b>Article 25:<\/b> Freedom of Conscience and Free Profession, Practice, and Propagation of Religion<\/li><ul><li><b>Art. 25(1):<\/b> Guarantees to all persons (citizens &amp; foreigners) equal entitlement to freedom of conscience and the right freely to profess, practise, and propagate religion [passage 78].<\/li><li><b>4 Mandatory Constitutional Overrides:<\/b> Subject to public order, morality, health, and to the other provisions of Part III [passage 78].<\/li><li><b>Art. 25(2) State Savings:<\/b> Allows the State to make laws: 1. Regulating/restricting economic, financial, political, or other secular activity associated with religious practice [passage 79]. 2. Providing for social welfare/reform or throwing open Hindu religious institutions of a public character to all classes and sections of Hindus [passage 79].<\/li><li><b>Explanation I:<\/b> Wearing and carrying of kirpans is deemed included in the profession of the Sikh religion [passage 79].<\/li><li><b>Explanation II:<\/b> References to &quot;Hindus&quot; in sub-clause (b) shall be construed as including persons professing the Sikh, Jaina, or Buddhist religion [passage 80].<\/li><\/ul><li><b>Article 26:<\/b> Freedom to Manage Religious Affairs<\/li><ul><li>Protects every religious denomination or any section thereof (subject to public order, morality, and health) with 4 specific rights [passage 80]: 1. Art. 26(a): Establish and maintain institutions for religious and charitable purposes [passage 80]. 2. Art. 26(b): Manage its own affairs in matters of religion [passage 80]. 3. Art. 26(c): Own and acquire movable and immovable property [passage 81]. 4. Art. 26(d): Administer such property in accordance with law [passage 81].<\/li><\/ul><li><b>Article 27:<\/b> Freedom as to Payment of Taxes for Promotion of Any Particular Religion<\/li><ul><li>No person shall be compelled to pay any taxes, the proceeds of which are specifically appropriated in payment of expenses for the promotion or maintenance of any particular religion or religious denomination [passage 81].<\/li><li><b>(Distinction:<\/b> Prohibits specific religious taxes, but permits secular fees for administrative or security arrangements).<\/li><\/ul><li><b>Article 28:<\/b> Freedom as to Attendance at Religious Instruction in Educational Institutions<\/li><ul><li><b>Art. 28(1):<\/b> No religious instruction shall be provided in any educational institution wholly maintained out of State funds [passage 81].<\/li><li><b>Art. 28(2) Trust Exemption:<\/b> Does not apply to institutions administered by the State but established under an endowment or trust requiring religious instruction [passage 82].<\/li><li><b>Art. 28(3) Voluntarism Rule:<\/b> In State-recognized or State-aided institutions, no person/minor shall be compelled to attend religious instruction/worship without their (or guardian&#x27;s) express consent [passage 82].<\/li><\/ul><\/ul><h4>C. Cultural and Educational Rights (Articles 29–30)<\/h4><ul><li><b>Article 29:<\/b> Protection of Interests of Minorities<\/li><ul><li><b>Art. 29(1):<\/b> Any section of citizens residing in India having a distinct language, script, or culture of its own has the right to conserve the same [passage 83]. (Applies to minorities AND majorities).<\/li><li><b>Art. 29(2):<\/b> No citizen shall be denied admission into any educational institution maintained by the State or receiving aid out of State funds on grounds ONLY of religion, race, caste, language (4 grounds) [passage 83].<\/li><\/ul><li><b>Article 30:<\/b> Right of Minorities to Establish and Administer Educational Institutions<\/li><ul><li><b>Art. 30(1):<\/b> All minorities, whether based on religion or language, shall have the right to establish and administer educational institutions of their choice [passage 83].<\/li><li><b>Art. 30(1A):<\/b> Inserted by 44th CAA, 1978; obligates the State to fix compensation amounts during compulsory acquisition of minority institution property so as not to restrict or abrogate their right [passage 84].<\/li><li><b>Art. 30(2):<\/b> State shall not discriminate in granting aid to educational institutions on the ground that it is under minority management [passage 84].<\/li><\/ul><\/ul><h4>D. Savings of Certain Laws (Articles 31A, 31B, 31C)<\/h4><p><b>(Note:<\/b> Article 31, Right to Property, was OMITTED by the 44th Amendment Act, 1978, and made a constitutional right under Article 300A in Part XII) [passage 85, passage 263].<\/p><ul><li><b>Article 31A:<\/b> Saving of Laws Providing for Acquisition of Estates, etc.<\/li><ul><li>Added by 1st CAA, 1951; protects 5 categories of agrarian/corporate reform laws from being challenged under Article 14 or Article 19 [passage 85, passage 87].<\/li><\/ul><li><b>Article 31B:<\/b> Validation of Certain Acts and Regulations (Ninth Schedule Shield)<\/li><ul><li>Added by 1st CAA, 1951; immunizes laws listed in the Ninth Schedule from judicial invalidation on fundamental rights grounds [passage 90, passage 508].<\/li><\/ul><li><b>Article 31C:<\/b> Saving of Laws Giving Effect to Certain Directive Principles<\/li><ul><li>Added by 25th CAA, 1971; laws enacted to give effect to DPSPs under Article 39(b) and 39(c) cannot be declared void for violating Article 14 or Article 19 [passage 91].<\/li><\/ul><\/ul><p>E. Right to Constitutional Remedies &amp; Operational Powers (Articles 32–35)<\/p><ul><li><b>Article 32:<\/b> Remedies for Enforcement of Part III Rights<\/li><ul><li>Dr. B.R. Ambedkar termed Article 32 &quot;the very heart and soul of the Constitution.&quot;<\/li><li><b>Art. 32(1):<\/b> Guaranteed right to move the Supreme Court by appropriate proceedings for enforcement of Part III rights [passage 94].<\/li><li><b>Art. 32(2):<\/b> Empowers Supreme Court to issue directions, orders, or writs (Habeas Corpus, Mandamus, Prohibition, Quo Warranto, Certiorari) [passage 94].<\/li><li><b>Art. 32(3):<\/b> Parliament may by law empower any other court to exercise writ powers locally [passage 95].<\/li><li><b>Art. 32(4):<\/b> Right guaranteed shall not be suspended except as otherwise provided by the Constitution (e.g., Art. 359 during National Emergency) [passage 95, passage 358].<\/li><\/ul><li><b>Article 33:<\/b> Power of Parliament to Modify Rights for Forces<\/li><ul><li>Empowers Parliament exclusively to restrict/abrogate Part III rights for Armed Forces, Police, Intelligence/Counter-Intelligence agencies, and Telecommunication service personnel of forces to ensure proper discharge of duty and discipline [passage 96, passage 97].<\/li><\/ul><li><b>Article 34:<\/b> Restriction on Rights While Martial Law Is in Force<\/li><ul><li>Allows Parliament to indemnify state/union servants or validate punishments/sentences passed during Martial Law in any area [passage 97].<\/li><\/ul><li><b>Article 35:<\/b> Legislation to Give Effect to Part III<\/li><ul><li>Vests exclusive legislative power in Parliament (and denies it to State Legislatures) to prescribe punishments for offences under Part III (e.g., Art. 17 Untouchability, Art. 23 Forced Labour) and enact residence employment laws under Art. 16(3) [passage 98, passage 99].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Core Sequence of Articles 23 to 32<\/h4><ul><li><b>Mnemonic:<\/b> &quot;E-X-R-E-L-M-I-N-S-W&quot;<\/li><li><b>Decoding:<\/b><\/li><ul><li><b>Art. 23:<\/b> Exploitation / Forced Labour prohibition [passage 77]<\/li><li><b>Art. 24:<\/b> eXclude Child Labour under 14 [passage 78]<\/li><li><b>Art. 25:<\/b> Religious Profession &amp; Propagation [passage 78]<\/li><li><b>Art. 26:<\/b> Establish &amp; Manage Denominations [passage 80]<\/li><li><b>Art. 27:<\/b> Levy / Tax Prohibition for Religion [passage 81]<\/li><li><b>Art. 28:<\/b> Instruction / Worship in Schools [passage 81]<\/li><li><b>Art. 29:<\/b> Minority Culture Conservation [passage 83]<\/li><li><b>Art. 30:<\/b> Institutions of Minorities [passage 83]<\/li><li><b>Art. 31A-C:<\/b> Savings Shield [passage 85, passage 90, passage 91]<\/li><li><b>Art. 32:<\/b> Writs &amp; Remedies [passage 94]<\/li><\/ul><\/ul><h4>Mnemonic 2: The 5 Constitutional Writs under Article 32<\/h4><ul><li><b>Mnemonic:<\/b> &quot;H-M-P-Q-C&quot; (&quot;How Many People Question Authority&quot;): 1. Habeas Corpus → &quot;To have the body&quot; (Unlawful detention check). 2. Mandamus → &quot;We command&quot; (Performance of public duty). 3. Prohibition → &quot;To forbid&quot; (Prevents lower court from exceeding jurisdiction; preventive). 4. Quo Warranto → &quot;By what authority?&quot; (Legality of claim to public office). 5. Certiorari → &quot;To be certified / informed&quot; (Quashes illegal orders; preventive &amp; curative).<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 23 &amp; 24:<\/b> சுரண்டல் எதிர்ப்பு (23 = மனித கடத்தல் தடை, 24 = குழந்தை தொழிலாளர் தடை).<\/li><li><b>Art. 25-28:<\/b> மத சுதந்திரம் (25 = தனிநபர் நம்பிக்கை, 26 = சபை நிர்வாகம், 27 = மத வரி தடை, 28 = வழிபாட்டு விலக்கு).<\/li><li><b>Art. 29 &amp; 30:<\/b> சிறுபான்மையினர் உரிமை (29 = மொழி/கலாச்சாரம், 30 = கல்வி நிறுவனங்கள்).<\/li><li><b>Art. 32:<\/b> நீதிப்பேராணைகள் (Writs) → அரசியலமைப்பின் இதயம் மற்றும் ஆன்மா.<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>JUDICIAL REMEDIES COMPARISON<\/h4><p>│ ┌────────────────────────┴────────────────────────┐<\/p><pre>│                        │\nARTICLE 32 (SUPREME COURT)             ARTICLE 226 (HIGH COURT)\n✦ Fundamental Rights ONLY          ✦ Fundamental Rights + Other Legal Rights\n✦ Fundamental Right itself       ✦ Discretionary Remedy\n✦ Narrower Subject Scope          ✦ Wider Geographic / Subject Scope<\/pre><ul><li>Article 32 vs. Article 226 (Writ Jurisdiction Comparison):<\/li><ul><li><b>Scope:<\/b> Article 32 can be invoked ONLY for enforcing Part III Fundamental Rights [passage 94]. Article 226 can be invoked for Fundamental Rights AND &quot;for any other purpose&quot; (ordinary legal rights) [passage 159]. Thus, High Court writ jurisdiction is broader in scope than Supreme Court writ jurisdiction.<\/li><li><b>Status:<\/b> Moving Supreme Court under Article 32 is itself a Fundamental Right [passage 94]. Moving High Court under Article 226 is a constitutional remedy, but not listed inside Part III [passage 159].<\/li><\/ul><li>Article 31C ↔ Articles 14 &amp; 19 (The Fundamental Rights vs DPSPs Boundary):<\/li><ul><li>Kesavananda Bharati (1973) upheld the first part of Article 31C (saving laws for Art. 39(b) and (c) from Arts. 14 &amp; 19) [passage 91, passage 93], but struck down the second part (judicial review immunity) as a violation of the Basic Structure.<\/li><\/ul><li>Article 25(2)(b) ↔ Article 17 (Social Reform Synergy):<\/li><ul><li>Opening Hindu religious institutions to all sections under Article 25(2)(b) [passage 79] operates in tandem with the abolition of untouchability under Article 17 [passage 63].<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Forced Labour &amp; Minimum Wages (Article 23):<\/h4><ul><ul><li>PUDR v. Union of India (1982) [Asiad Workers Case]: The Supreme Court ruled that paying less than the prescribed minimum wage constitutes &quot;forced labour&quot; under Article 23 [passage 77], as economic compulsion deprives a worker of choice.<\/li><\/ul><\/ul><p>2. Essential Religious Practices Test &amp; Individual Dignity (Articles 25 &amp; 26):<\/p><ul><ul><li><b>S.R. Bommai v. Union of India (1994):<\/b> Reaffirmed Secularism as a basic feature of the Constitution.<\/li><li>Indian Young Lawyers Association v. State of Kerala (2018) [Sabarimala Temple Case]: Held that freedom of conscience and worship under Article 25 [passage 78] applies equally to women. Institutional religious practices under Article 26 [passage 80] must yield to overarching rights to individual dignity and equality. 3. Minority Educational Rights &amp; State Regulation (Article 30):<\/li><li>T.M.A. Pai Foundation v. State of Karnataka (2002) &amp; P.A. Inamdar (2005): Clarified that while minority institutions have autonomy under Art. 30(1) [passage 83], the State can impose reasonable regulatory measures regarding academic excellence, national security, and non-exploitative service conditions for teachers without violating Art. 30. 4. Judicial Review of Ninth Schedule Laws (Article 31B):<\/li><li><b>I.R. Coelho v. State of Tamil Nadu (2007):<\/b> Held that laws placed in the Ninth Schedule after April 24, 1973 (Kesavananda Bharati judgment date) are open to judicial review. If a Ninth Schedule law violates Part III rights that form part of the Basic Structure, it will be struck down. 5. Judicial Review as Basic Structure (Article 32 &amp; 226):<\/li><li><b>L. Chandra Kumar v. Union of India (1997):<\/b> Declared the writ jurisdiction of Supreme Court (Art. 32) [passage 94] and High Courts (Art. 226) [passage 159] an integral part of the Basic Structure. It struck down statutory provisions that sought to exclude High Court jurisdiction over administrative tribunals.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Religious Freedom vs. Constitutional Morality, Judicial Remedies, and Minority Rights<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Articles 23–35 structure the protective and remedial shield of Part III, safeguarding vulnerable groups against social exploitation, guaranteeing freedom of conscience, protecting cultural diversity, and providing a direct enforcement mechanism through Article 32 [passage 77, passage 78, passage 83, passage 94]. As Dr. Ambedkar noted, the efficacy of substantive rights depends entirely on the strength of their constitutional remedies [passage 94].&quot;<\/p><ul><li>Mains Body Arguments (Constitutional Morality &amp; Judicial Review):<\/li><ul><li>Essential Religious Practices &amp; Individual Rights: Apply the Sabarimala precedent (2018) to argue how individual liberty under Article 25 [passage 78] takes precedence when denominational claims under Article 26 [passage 80] conflict with fundamental equality (Art. 14/15) [passage 49, passage 54].<\/li><li><b>Ninth Schedule Accountability:<\/b> Cite I.R. Coelho (2007) to demonstrate how Article 31B [passage 90] can no longer be used as a blanket exemption from judicial review if laws destroy the Basic Structure.<\/li><li><b>Writ Architecture:<\/b> Compare Article 32 [passage 94] and Article 226 [passage 159] to explain the dual-tier enforcement framework ensuring accountability across central and state authorities.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;By balancing group cultural autonomy under Article 30 [passage 83] with non-negotiable judicial enforcement under Article 32 [passage 94], the Constitution guarantees that individual rights remain protected against both state overreach and majoritarian pressure.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical ability:<\/h4><p><b>1. Direct Recall:<\/b> What are the four specific constitutional grounds under which the freedom to profess, practise, and propagate religion (Article 25(1)) can be restricted by the State? [passage 78] 2. Reverse Recall: Which Article explicitly empowers Parliament alone to make penal laws for acts declared as offences under Part III (such as Article 17 and Article 23)? [passage 98, passage 99] 3. UPSC Prelims Analytical Trap: A citizen files an Article 32 writ petition before the Supreme Court demanding enforcement of a statutory right under an ordinary Act of Parliament. Is this petition maintainable under Article 32? Explain the difference between Article 32 and Article 226 in this context [passage 94, passage 159]. 4. Mains Applied Comparison: What was the significance of the I.R. Coelho (2007) ruling regarding the Ninth Schedule (Article 31B) [passage 90] and the Basic Structure doctrine?<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: General &amp; Right to Equality (Articles 12–18) (Lesson 3)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part III: Right to Freedom (Articles 19–22) (Lesson 4)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part III: Exploitation, Religion, Culture &amp; Remedies (Articles 23–35) (Current<\/span><\/label><p>Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Up Next)<\/span><\/label>"}], "nchk": 7}, {"n": 6, "title": "Part IV — Directive Principles of State Policy (Articles 36–51)", "secs": [{"t": "Articles", "h": "<p>Part IV of the Indian Constitution (Articles 36–51) sets out the Directive Principles of State Policy (DPSPs) [passage 4]. Borrowed primarily from the Irish Constitution of 1937 (which inherited them from the Spanish Constitution), DPSPs represent the social and economic goals of the welfare state [passage 100, passage 101].<\/p><p>While not classified explicitly within the text of the Constitution, DPSPs are traditionally categorized into three ideology-based streams for UPSC analytical clarity: Socialistic, Gandhian, and Liberal-Intellectual.<\/p><h4>PART IV: DIRECTIVE PRINCIPLES OF STATE POLICY (ARTICLES 36–51)<\/h4><p>│<\/p><h4>┌─────────────────────────────┬──────────────┴──────────────<\/h4><p>┬─────────────────────────────┐ │ Foundational Principles │ Socialistic Principles │ Gandhian Principles │<\/p><pre>│ (Arts. 36 &amp; 37)     │ (Arts. 38, 39, 39A, 41, │ (Arts. 40, 43, 43B, 46, │\n│                 │ 42, 43, 43A, 47)      │     47, 48)       │<\/pre><h4>└─────────────────────────────┴─────────────────────────────<\/h4><p>┴─────────────────────────────┘ │ ┌──────────┴──────────┐ │ Liberal-Intellectual│ │ (Arts. 44, 45, 48, │ │ 48A, 49, 50, 51) │ └─────────────────────┘<\/p><h4>A. Foundational Architectur
