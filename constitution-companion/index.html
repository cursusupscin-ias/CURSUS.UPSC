empowers ECI to maintain election integrity in unprovided situations.<\/li><li><b>Insulating the Multi-Member Commission:<\/b> Highlight the procedural asymmetry under Article 324(5) [passage 311, passage 312], citing Anoop Baranwal (2023) on the necessity of transparent selection mechanisms.<\/li><li><b>Judicial Review Limits:<\/b> Explain how Article 329(b) [passage 317] prevents election process delays by restricting post-announcement challenges to election petitions.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, granting constitutional protection under Article 324(5) [passage 311] uniformly to all Election Commissioners will further strengthen the electoral machinery.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> Which Constitutional Amendment Act reduced the voting age for elections to the Lok Sabha and State Legislative Assemblies under Article 326 from 21 years to 18 years? [passage 314, passage 316] 2. Reverse Recall: Under which Article is the Election Commission granted plenary power over the superintendence, direction, and control of elections to Parliament and State Legislatures? [passage 308] 3. UPSC Prelims Analytical Trap: Is the Election Commission of India (Article 324) [passage 308] responsible for conducting elections to Panchayats and Municipalities? [passage 13, passage 15, passage 208, passage 228] 4. Mains Applied Question: Discuss the significance of the Supreme Court&#x27;s Constitution Bench ruling in Anoop Baranwal v. Union of India (2023) regarding the appointment process of the Chief Election Commissioner and Election Commissioners under Article 324(2) [passage 309].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Lesson 21)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Lesson 22)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"14\"><span>Part XV: Elections &amp; Electoral Machinery (Articles 324–329A) (Current Lesson<\/span><\/label><p>Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"15\"><span>Part XVI: Special Provisions Relating to Certain Classes (Articles 330–342A) (Up<\/span><\/label><p>Next)<\/p>"}], "nchk": 16}, {"n": 24, "title": "Part XVI — Special Provisions Relating to Certain Classes (Articles", "secs": [{"t": "Articles", "h": "<h4>330–342A)<\/h4><p>Part XVI of the Constitution (Articles 330–342A) provides specialized political, administrative, and developmental safeguards for specific disadvantaged or historically underrepresented groups—namely Scheduled Castes (SCs), Scheduled Tribes (STs), Socially and Educationally Backward Classes (SEBCs/OBCs), Women, and formerly Anglo-Indians [passage 20, passage 21, passage 22, passage 23].<\/p><h4>PART XVI: SPECIAL PROVISIONS RELATING TO CERTAIN CLASSES (ARTICLES<\/h4><p>330–342A)<\/p><h4>│<\/h4><p>┌─────────────────────────────┬─────────────┴──────────────┬ ─────────────────────────────┐<\/p><pre>│ Electoral Reservations     │ Service Claims &amp;        │ Constitutional        │<\/pre><pre>│ (Arts. 330–334A)         │ Efficiency (Art. 335)   │ Commissions            │<\/pre><pre>│                    │                  │ (Arts. 338, 338A, 338B)   │<\/pre><h4>└─────────────────────────────┴────────────────────────────┴<\/h4><p>─────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Union Control &amp; List│<\/h4><pre>│ Specifications     │<\/pre><pre>│ (Arts. 339–342A)       │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. Electoral Reservations &amp; Representation (Articles 330–334A)<\/h4><ul><li><b>Article 330:<\/b> Reservation of Seats for SCs and STs in the House of the People<\/li><ul><li>Seats shall be reserved in the Lok Sabha for Scheduled Castes, Scheduled Tribes (except STs in autonomous districts of Assam), and STs in autonomous districts of Assam [passage 20, passage 256].<\/li><li><b>Proportionality Principle [Art. 330(2)]:<\/b> Number of reserved seats in any State or UT bears the same proportion to total seats allotted to that State/UT in Lok Sabha as the SC or ST population bears to total population [passage 256].<\/li><\/ul><li><b>Article 330A:<\/b> Reservation of Seats for Women in the House of the People<\/li><ul><li>Inserted by the 106th Constitutional Amendment Act, 2023 (Nari Shakti Vandan Adhiniyam) [passage 20, passage 259].<\/li><li>Reserves as nearly as may be, one-third (33%) of total seats in the Lok Sabha directly for women, including 1/3rd of seats reserved for SCs and STs [passage 259].<\/li><\/ul><li><b>Article 331:<\/b> Representation of the Anglo-Indian Community in Lok Sabha [DISCONTINUED]<\/li><ul><li>Empowered the President to nominate not more than 2 members of the Anglo-Indian community to Lok Sabha if inadequately represented [passage 21, passage 260].<\/li><li>(Discontinued / Lapsed via 104th CAA, 2019) [passage 271].<\/li><\/ul><li><b>Article 332:<\/b> Reservation of Seats for SCs and STs in Legislative Assemblies<\/li><ul><li>Seats reserved for SCs and STs in the Legislative Assembly of every State based on population proportion [passage 21, passage 260, passage 261].<\/li><\/ul><li><b>Article 332A:<\/b> Reservation of Seats for Women in Legislative Assemblies<\/li><ul><li>Inserted by the 106th CAA, 2023 [passage 21, passage 268].<\/li><li>Reserves as nearly as may be, 1/3rd of total direct seats in every State Legislative Assembly for women, including 1/3rd of SC/ST reserved seats [passage 268, passage 269].<\/li><\/ul><li><b>Article 333:<\/b> Representation of Anglo-Indians in Legislative Assemblies [DISCONTINUED]<\/li><ul><li>Empowered Governor to nominate 1 member of the Anglo-Indian community to the State Assembly [passage 21, passage 269]. (Discontinued via 104th CAA, 2019) [passage 271].<\/li><\/ul><li><b>Article 334:<\/b> Expiration Period for Reservations<\/li><ul><li><b>104th Constitutional Amendment Act, 2019:<\/b> Extended SC/ST political reservations in Lok Sabha and Assemblies for 80 years from commencement (i.e. until January 25, 2030) [passage 270, passage 271, passage 272], while letting Anglo-Indian nomination expire at 70 years (i.e. January 25, 2020) [passage 271, passage 272].<\/li><\/ul><li><b>Article 334A:<\/b> Implementation Timeline for Women&#x27;s Reservation<\/li><ul><li>Inserted by the 106th CAA, 2023 [passage 21, passage 272].<\/li><li>Women&#x27;s reservations (Arts. 239AA, 330A, 332A) shall take effect AFTER a delimitation exercise is conducted based on the published figures of the first census taken after 2023 [passage 272].<\/li><li><b>Sunset Clause:<\/b> Shall cease to have effect 15 years from commencement unless extended by Parliament [passage 272].<\/li><\/ul><\/ul><h4>B. Services &amp; Administrative Efficiency (Articles 335–337)<\/h4><ul><li><b>Article 335:<\/b> Claims of SCs and STs to Services and Posts<\/li><ul><li>Claims of SCs and STs shall be taken into consideration in making appointments to Union and State public services, consistently with the maintenance of efficiency of administration [passage 22, passage 274].<\/li><li><b>Proviso (82nd CAA, 2000):<\/b> Clarifies that nothing in Art. 335 prevents the State from providing relaxation in qualifying marks in examinations or lowering standards of evaluation for reservations in promotions for SCs and STs [passage 275].<\/li><\/ul><li><b>Articles 336 &amp; 337:<\/b> Provisions for Anglo-Indian Community [EXPIRED]<\/li><ul><li>Temporary transitional reservations in railway, customs, postal posts (Art. 336) [passage 23, passage 276] and educational grants (Art. 337) [passage 23, passage 277], which ceased after 10 years from 1950 [passage 277, passage 278].<\/li><\/ul><\/ul><h4>C. Constitutional Commissions (Articles 338, 338A, 338B)<\/h4><h4>THE TRIAD OF CONSTITUTIONAL COMMISSIONS (ARTS. 338, 338A, 338B)<\/h4><h4>│<\/h4><h4>┌────────────────────────────────────────────┼──────────────<\/h4><p>──────────────────────────────┐<\/p><pre>│                            │                             │<\/pre><pre>NATIONAL COMMISSION FOR                       NATIONAL COMMISSION FOR<\/pre><p>NATIONAL COMMISSION FOR<\/p><pre>SCHEDULED CASTES (NCSC)                       SCHEDULED TRIBES (NCST)<\/pre><p>BACKWARD CLASSES (NCBC)<\/p><pre>✦ Article 338                    ✦ Article 338A                      ✦ Article 338B<\/pre><pre>✦ 89th CAA, 2003 (Bifurcated)            ✦ 89th CAA, 2003 (Inserted)               ✦ 102nd<\/pre><p>CAA, 2018 (Inserted)<\/p><p><b>✦ Composition:<\/b> 1 Chair + 1 Vice-Chair + 3 Members (Appointed by President under hand &amp; seal)<\/p><p><b>✦ Civil Court Powers:<\/b> Summoning, Document Production, Affidavits, Public Records<\/p><ul><li><b>Article 338:<\/b> National Commission for Scheduled Castes (NCSC)<\/li><ul><li>Establishes NCSC consisting of a Chairperson, Vice-Chairperson, and 3 other Members appointed by the President by warrant under hand and seal [passage 23, passage 279, passage 280].<\/li><li>Investigates/monitors constitutional safeguards for SCs, inquires into specific complaints, and advises on socio-economic planning [passage 281].<\/li><li><b>Civil Court Powers [Art. 338(8)]:<\/b> Summons witnesses, requires discovery of documents, receives evidence on affidavit [passage 284, passage 285].<\/li><li><b>Mandatory Consultation Clause [Art. 338(9)]:<\/b> Union and State Governments SHALL consult NCSC on all major policy matters affecting SCs [passage 285].<\/li><li>(Includes Anglo-Indian safeguards under Art. 338(10)) [passage 285].<\/li><\/ul><li><b>Article 338A:<\/b> National Commission for Scheduled Tribes (NCST)<\/li><ul><li>Inserted by the 89th CAA, 2003 (bifurcating the former joint commission) [passage 23, passage 285, passage 287].<\/li><li>Identical composition (1+1+3), civil court powers, and mandatory consultation clause for STs [passage 287, passage 292, passage 293].<\/li><\/ul><li><b>Article 338B:<\/b> National Commission for Backward Classes (NCBC)<\/li><ul><li>Granted constitutional status via the 102nd CAA, 2018 [passage 23, passage 293, passage 295].<\/li><li>Identical structure (1+1+3), civil court powers, and consultation mandate for Socially and Educationally Backward Classes (SEBCs) [passage 293, passage 298, passage 299].<\/li><\/ul><\/ul><p>D. Union Control, Investigation Commissions &amp; List Specifications (Articles 339–342A)<\/p><ul><li><b>Article 339:<\/b> Union Control Over Scheduled Area Administration &amp; ST Welfare<\/li><ul><li>President appoints a Commission to report on Scheduled Area administration and ST welfare [passage 23, passage 300]. Union executive power extends to giving directions to States for ST welfare schemes [passage 301].<\/li><\/ul><li><b>Article 340:<\/b> Commission to Investigate Conditions of Backward Classes<\/li><ul><li>President may appoint a Commission to investigate SEBC conditions and recommend remedial measures [passage 23, passage 301]. (Historic commissions appointed under Art. 340: Kaka Kalelkar 1953, Mandal Commission 1979, Justice Rohini Commission 2017).<\/li><\/ul><li><b>Article 341 &amp; 342:<\/b> Scheduled Castes &amp; Scheduled Tribes List Notifications<\/li><ul><li><b>Art. 341(1) &amp; 342(1):<\/b> President, after consultation with the Governor of a State/UT, specifies by public notification the castes/races/tribes deemed to be SCs or STs for that State/UT [passage 23, passage 302, passage 304, passage 305].<\/li><li>Art. 341(2) &amp; 342(2) Exclusive Parliamentary In/Exclusion: Parliament ONLY by law can include in or exclude from the Central List of SCs or STs [passage 304, passage 305]. Presidential notifications cannot be varied by executive orders [passage 304, passage 305].<\/li><\/ul><li><b>Article 342A:<\/b> Socially and Educationally Backward Classes (SEBCs / OBCs)<\/li><ul><li>Inserted by 102nd CAA, 2018 [passage 23, passage 308] and amended by 105th CAA, 2021 [passage 308, passage 310].<\/li><li><b>Art. 342A(1) &amp; (2) Central List:<\/b> President specifies SEBCs for the Central List; Parliament exclusively modifies this list by law [passage 308, passage 309].<\/li><li>Art. 342A(3) Restoration of State Lists (105th CAA, 2021): Explicitly restores the power of every State or UT to prepare and maintain, by law, its OWN State List of SEBCs for its own state-level purposes, which may differ from the Central List [passage 310].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> The Three Constitutional Commissions Triad — &quot;338 - 338A - 338B&quot;<\/p><ul><li><b>338:<\/b> NCSC (Scheduled Castes) [passage 279]<\/li><li><b>338A:<\/b> NCST (Scheduled Tribes — 89th CAA 2003) [passage 285, passage 287]<\/li><li><b>338B:<\/b> NCBC (Backward Classes — 102nd CAA 2018) [passage 293, passage 295]<\/li><\/ul><p><b>Mnemonic 2:<\/b> Presidential List Specification Sequence (341 - 342 - 342A)<\/p><ul><li><b>341:<\/b> Scheduled Castes [passage 302, passage 304]<\/li><li><b>342:<\/b> Scheduled Tribes [passage 305]<\/li><li><b>342A:<\/b> Socially and Educationally Backward Classes (SEBCs) [passage 308]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 330A &amp; 332A:<\/b> மகளிர் இடஒதுக்கீ டு 33% (Women&#x27;s Reservation) → 106-வது அரசியலமைப்பு திருத்தம், 2023 (மக்களவை மற்றும் சட்டப்பேரவைகளில்) [passage 259, passage 268].<\/li><li><b>Art. 334:<\/b> இடஒதுக்கீ டு நீட்டிப்பு (Reservation Extension) → 104-வது திருத்தம் மூலம் எஸ்சி/எஸ்டி இடஒதுக்கீ டு 2030 வரை நீட்டிப்பு; ஆங்கிலோ-இந்தியர் நியமனம் முடிவுற்றது [passage 271, passage 272].<\/li><li><b>Art. 335 Proviso:<\/b> தகுதி மதிப்பெண் தளர்வு (Qualifying Marks Relaxation) → எஸ்சி/எஸ்டி பிரிவினருக்கு பணி உயர்வில் தளர்வு அளிக்கும் 82-வது திருத்தம் [passage 275].<\/li><li><b>Art. 342A(3):<\/b> மாநில ஓபிசி பட்டியல் அதிகாரம் (State OBC List Restoration) → 105-வது திருத்தம் (2021) மூலம் மாநில அரசுகளின் தனியான ஓபிசி பட்டியல் தயாரிக்கும் அதிகாரம் மீ ட்டெடுக்கப்பட்டது [passage 310].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>RESERVATION ARCHITECTURE: FUNDAMENTAL RIGHTS vs. PART XVI<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────────────┴───────────<\/h4><p>────────────────────────────────────┐<\/p><pre>│                                                          │<\/pre><pre>PART III FUNDAMENTAL RIGHTS                             PART XVI SPECIAL PROVISIONS<\/pre><pre>✦ Art. 15(4) &amp; 15(5) — Educational Reservation           ✦ Art. 330 &amp; 332 — Political Seats<\/pre><p>in Lok Sabha/Assemblies<\/p><pre>✦ Art. 16(4) &amp; 16(4A) — Employment &amp; Promotion Reservation       ✦ Art. 335 — Service<\/pre><p>Claims &amp; Efficiency Balancing<\/p><pre>✦ Judicial Enforcement via Art. 32                  ✦ Time-bound Protection under Art. 334 /<\/pre><p>334A<\/p><h4>1. Article 16(4) / 16(4A) ↔ Article 335 Efficiency Balancing<\/h4><ul><li>While Article 16(4A) permits reservation in promotion with consequential seniority for SCs/STs [passage 45], Article 335 mandates that such claims must be balanced against the maintenance of administrative efficiency [passage 274].<\/li><li>The 82nd CAA 2000 inserted the proviso to Article 335 [passage 275] to validate qualifying mark relaxations for SC/ST promotions without violating constitutional efficiency mandates.<\/li><\/ul><p>2. The 102nd vs. 105th CAA Constitutional Loophole Resolution (Art. 342A)<\/p><ul><li>The 102nd CAA 2018 inserted Article 342A [passage 308]. In Jaishri Laxmanrao Patil (Maratha Reservation Case, 2021), the Supreme Court interpreted Art. 342A as stripping State Governments of the power to identify backward classes.<\/li><li>Parliament reacted by passing the 105th CAA 2021, inserting Article 342A(3) [passage 310] to explicitly restore State powers to notify their own State SEBC lists.<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Reservation Limits &amp; Creamy Layer Doctrine:<\/h4><ul><ul><li><b>Indra Sawhney v. Union of India (1992):<\/b><\/li><ul><li>Upheld 27% OBC reservation under Article 16(4) [passage 45].<\/li><li>Enforced a strict 50% ceiling on total reservations and introduced the &quot;Creamy Layer&quot; exclusion for backward classes. 2. Constitutional Validity of Promotion Reservations (Article 335 Proviso):<\/li><\/ul><li><b>M. Nagaraj v. Union of India (2006):<\/b><\/li><ul><li>Upheld the constitutional validity of Article 16(4A) [passage 45] and Article 335 Proviso [passage 275].<\/li><li>Imposed three quantifiable conditions for SC/ST promotion reservations: (i) Backwardness, (ii) Inadequacy of representation, and (iii) Overall administrative efficiency under Article 335 [passage 274].<\/li><\/ul><li><b>Jarnail Singh v. Lachhmi Narain Gupta (2018):<\/b><\/li><ul><li>Modified M. Nagaraj by ruling that States need NOT collect empirical data on backwardness for SCs/STs (since backwardness is presumed).<\/li><li>Applied the &quot;Creamy Layer&quot; principle to SCs and STs for promotion reservations. 3. State Autonomy over OBC Identification (Article 342A):<\/li><\/ul><li>Jaishri Laxmanrao Patil v. Chief Minister, Maharashtra (2021) [Maratha Reservation Case]:<\/li><ul><li>Struck down Maratha reservation for exceeding the 50% ceiling.<\/li><li>Prompted the enactment of the 105th CAA 2021 inserting Article 342A(3) [passage 310] to restore State List powers over SEBC identification.<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Affirmative Action Architecture, Political Reservations for Women, and State Autonomy under Article 342A<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XVI (Articles 330–342A) provides the constitutional blueprint for protective discrimination and democratic inclusion in India [passage 20, passage 21, passage 22, passage 23]. Combining electoral reservations (Articles 330/332) [passage 256, passage 260], women&#x27;s political empowerment (106th CAA 2023) [passage 259, passage 268], administrative claims balanced with efficiency (Article 335) [passage 274], and constitutional commissions (Articles 338–338B) [passage 279, passage 287, passage 293], this framework converts structural equity into enforceable rights.&quot;<\/p><ul><li>Mains Body Arguments (Administrative Efficiency &amp; Restored Federal Autonomy):<\/li><ul><li><b>Balancing Equity and Merit:<\/b> Analyze Article 335 [passage 274] and the 82nd CAA Proviso [passage 275] in light of M. Nagaraj (2006) and Jarnail Singh (2018).<\/li><li><b>Transformative Women&#x27;s Reservation:<\/b> Evaluate Articles 330A and 332A [passage 259, passage 268] (106th CAA 2023) and the delimitation-linked timeline under Article 334A [passage 272].<\/li><li><b>Restoring Federal Autonomy:<\/b> Cite the 105th CAA 2021 inserting Article 342A(3) [passage 310] to highlight how State power to identify SEBCs was preserved following judicial review.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, enforcing the 50% ceiling (Indra Sawhney) while utilizing sub-categorization under Article 340 [passage 301] will ensure that reservation benefits reach the most marginalized.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact period specified for the duration of political reservations for SCs and STs under Article 334 following the 104th Constitutional Amendment Act, 2019? [passage 270, passage 272] 2. Reverse Recall: Which Article was inserted by the 105th Constitutional Amendment Act, 2021 to explicitly restore the power of States and UTs to maintain their own lists of Socially and Educationally Backward Classes (SEBCs)? [passage 310] 3. UPSC Prelims Analytical Trap: Does the National Commission for Scheduled Castes (Article 338) [passage 279] or National Commission for Backward Classes (Article 338B) [passage 293] possess civil court powers when investigating complaints? [passage 284, passage 298] 4. Mains Applied Question: Discuss the constitutional interplay between the affirmative action provisions under Articles 15(4) &amp; 16(4) [passage 41, passage 45] and the administrative efficiency mandate under Article 335 [passage 274] in light of the M. Nagaraj (2006) and Jarnail Singh (2018) judgments.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Lesson 21)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Lesson 22)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"14\"><span>Part XV: Elections &amp; Electoral Machinery (Articles 324–329A) (Lesson 23)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"15\"><span>Part XVI: Special Provisions Relating to Certain Classes (Articles 330–342A)<\/span><\/label><p>(Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"16\"><span>Part XVII: Official Language (Articles 343–351) (Up Next)<\/span><\/label>"}], "nchk": 17}, {"n": 25, "title": "Part XVII — Official Language of the Union, Regional Languages,", "secs": [{"t": "Articles", "h": "<h4>Language of Courts &amp; Special Directives<\/h4><p>(Articles 343–351)<\/p><p>Part XVII of the Constitution (Articles 343–351) addresses the delicate linguistic diversity of India by laying down the framework for official communication at the Union level, regional official languages, court languages, and special administrative directives for linguistic minorities [passage 44, passage 45, passage 46].<\/p><h4>PART XVII: OFFICIAL LANGUAGE ARCHITECTURE (ARTICLES 343–351)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬────────────┴────────────┬───<\/h4><p>──────────────────────────┐<\/p><pre>│ Chapter I: Union Language │ Chapter II: Regional           │ Chapter III: Language of   │<\/pre><pre>│ (Arts. 343–344)          │ Languages                │ Courts &amp; Enactments       │<\/pre><pre>│                   │ (Arts. 345–347)            │ (Arts. 348–349)       │<\/pre><h4>└─────────────────────────────┴─────────────────────────┴───<\/h4><p>──────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Chapter IV: Special │<\/h4><pre>│ Directives        │<\/pre><pre>│ (Arts. 350–351)       │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. Chapter I: Language of the Union (Articles 343–344)<\/h4><ul><li><b>Article 343:<\/b> Official Language of the Union<\/li><ul><li><b>Art. 343(1) Union Language Mandate:<\/b> The official language of the Union shall be Hindi in Devanagari script [passage 325].<\/li><li><b>Numerals:<\/b> The form of numerals to be used for official purposes shall be the international form of Indian numerals [passage 325].<\/li><li><b>Art. 343(2) 15-Year Transitional Clause:<\/b> For a period of 15 years from the commencement of the Constitution (until January 26, 1965), English shall continue to be used for all official purposes of the Union for which it was used prior to 1950 [passage 325].<\/li><li><b>Art. 343(3) Parliamentary Power to Extend:<\/b> Parliament may by law provide for the continued use of English or Devanagari numerals beyond the 15-year period [passage 326]. (Pursuant to Art. 343(3), Parliament enacted the Official Languages Act, 1963, permitting the indefinite continued use of English alongside Hindi for official Union business).<\/li><\/ul><li><b>Article 344:<\/b> Commission and Committee of Parliament on Official Language<\/li><ul><li><b>Art. 344(1) Official Language Commission:<\/b> President constitutes a Commission at the end of 5 years and 10 years from commencement, consisting of a Chairman and members representing the languages specified in the Eighth Schedule [passage 327].<\/li><li><b>Art. 344(2) Mandate of Commission:<\/b> Recommends on [passage 327, passage 328]: 1. Progressive use of Hindi for Union official purposes [passage 328]. 2. Restrictions on the use of English [passage 328]. 3. Language to be used in SC/HC proceedings and for statutory enactments under Art. 348 [passage 328]. 4. Form of numerals [passage 328].<\/li><li><b>Art. 344(3) Safeguard Clause:<\/b> In making recommendations, the Commission shall have due regard to industrial, cultural, and scientific advancement of India, and the just claims and interests of persons belonging to non-Hindi speaking areas in public services [passage 329].<\/li><li><b>Art. 344(4) Parliamentary Committee:<\/b> Consists of 30 members (20 from Lok Sabha, 10 from Rajya Sabha) elected by proportional representation by single transferable vote (PR-STV) [passage 329]. Recommends its opinion on the Commission report to the President [passage 330].<\/li><\/ul><\/ul><h4>B. Chapter II: Regional Languages (Articles 345–347)<\/h4><ul><li><b>Article 345:<\/b> Official Language or Languages of a State<\/li><ul><li>State Legislature may by law adopt any one or more of the languages in use in the State or Hindi as the official language(s) for that State [passage 330].<\/li><li>Until such law is enacted, English continues to be used for those official purposes within the State [passage 331].<\/li><\/ul><li><b>Article 346:<\/b> Official Language for Communication Between States &amp; Union<\/li><ul><li>The official language authorised for Union use (English/Hindi) serves as the official language for inter-state and Union-State communication [passage 331].<\/li><li><b>Proviso:<\/b> If two or more States agree that Hindi shall be the official language for communication between them, Hindi may be used for such inter-state communication [passage 332].<\/li><\/ul><li><b>Article 347:<\/b> Special Provision Relating to Minority Languages in a State<\/li><ul><li>On a demand being made, if the President is satisfied that a substantial proportion of a State&#x27;s population desires the use of any language spoken by them, the President may direct that such language be officially recognised throughout that State or any part thereof [passage 332].<\/li><\/ul><\/ul><p><b>C. Chapter III:<\/b> Language of Courts &amp; Statutory Enactments (Articles 348–349)<\/p><ul><li><b>Article 348:<\/b> Language of Supreme Court, High Courts, Bills, and Acts<\/li><ul><li>Art. 348(1) Supreme Court &amp; High Court Mandatory Baseline: Until Parliament by law otherwise provides, ALL proceedings in the Supreme Court and in every High Court SHALL BE IN THE ENGLISH LANGUAGE [passage 333].<\/li><li><b>Authoritative Texts in English:<\/b> Authoritative texts of all Bills, Acts passed by Parliament/State Assemblies, Ordinances, Rules, Regulations, and Bye-laws shall be in the English language [passage 333, passage 334].<\/li><li><b>Art. 348(2) High Court Proceedings Exception:<\/b> Governor of a State may, WITH THE PREVIOUS CONSENT OF THE PRESIDENT, authorise the use of Hindi or any other official language of the State in proceedings of that High Court [passage 334].<\/li><ul><li><b>Judgment Proviso:<\/b> This authorisation SHALL NOT APPLY TO ANY JUDGMENT, DECREE, OR ORDER passed or made by such High Court (which must remain in English) [passage 335].<\/li><\/ul><li><b>Art. 348(3) State Translation Mandate:<\/b> Where a State Legislature prescribes any language other than English for Bills/Acts, an English translation published under the Governor&#x27;s authority shall be deemed the authoritative text in English [passage 335].<\/li><\/ul><li><b>Article 349:<\/b> Special Procedure for Language Legislation<\/li><ul><li>During the initial 15-year period, no Bill altering language provisions under Art. 348(1) could be introduced in Parliament without the previous sanction of the President [passage 336]. President must consider recommendations under Art. 344 before sanctioning [passage 336].<\/li><\/ul><\/ul><p><b>D. Chapter IV:<\/b> Special Directives &amp; Eighth Schedule (Articles 350–351)<\/p><ul><li><b>Article 350:<\/b> Language Used in Grievance Redressal<\/li><ul><li>Every person is entitled to submit a grievance representation to any officer or authority of the Union or State in ANY of the languages used in the Union or State [passage 337]. (No representation can be rejected solely on the ground that it is in a non-official/minority language).<\/li><\/ul><li><b>Article 350A:<\/b> Primary Education in Mother-Tongue (7th CAA, 1956)<\/li><ul><li>Added by the 7th Constitutional Amendment Act, 1956 [passage 338].<\/li><li>Duty of every State and local authority to provide adequate facilities for instruction in the mother-tongue at the primary stage of education to children belonging to linguistic minority groups [passage 337]. President may issue directions to States to secure these facilities [passage 337].<\/li><\/ul><li><b>Article 350B:<\/b> Special Officer for Linguistic Minorities (7th CAA, 1956)<\/li><ul><li>Added by the 7th Constitutional Amendment Act, 1956 [passage 338].<\/li><li>Appointed by the President [passage 338]. Investigates all matters relating to safeguards provided for linguistic minorities under the Constitution and reports to the President at intervals [passage 338]. Reports are laid before each House of Parliament and sent to the concerned State Governments [passage 338].<\/li><\/ul><li><b>Article 351:<\/b> Directive for Development of the Hindi Language<\/li><ul><li>It shall be the duty of the Union to promote the spread of the Hindi language and develop it so that it serves as a medium of expression for all elements of the composite culture of India [passage 339].<\/li><li><b>Vocabulary Source Hierarchy:<\/b> Enrich Hindi by assimilating forms, style, and expressions used in Hindustani and other languages specified in the Eighth Schedule, drawing for its vocabulary primarily on Sanskrit and secondarily on other languages [passage 339].<\/li><\/ul><\/ul><h4>E. Eighth Schedule Recognized Languages (22 Languages)<\/h4><h4>EVOLUTION OF THE EIGHTH SCHEDULE (22 LANGUAGES)<\/h4><h4>│<\/h4><h4>┌───────────────────────────┬───────────────┴───────────────<\/h4><p>┬───────────────────────────┐<\/p><pre>│ Original 14 Languages     │ 21st CAA, 1967             │ 71st CAA, 1992          │\n│ (1950)              │ Added: Sindhi (15th)       │ Added: Konkani, Manipuri, │<\/pre><pre>│                 │                      │ Nepali (KMN - 16, 17, 18) │<\/pre><h4>└───────────────────────────┴───────────────────────────────<\/h4><p>┴───────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ 92nd CAA, 2003         │<\/pre><h4>│ Added: Bodo, Dogri, │<\/h4><h4>│ Maithili, Santhali │<\/h4><h4>│ (BDMS - 19 to 22) │<\/h4><h4>└─────────────────────┘<\/h4><p>1. Assamese [passage 495] | 2. Bengali [passage 495] | 3. Bodo [passage 495] (92nd CAA 2003) | 4. Dogri [passage 496] (92nd CAA 2003) | 5. Gujarati [passage 496] | 6. Hindi [passage 496] | 7. Kannada [passage 496] | 8. Kashmiri [passage 496] | 9. Konkani [passage 496] (71st CAA 1992) | 10. Maithili [passage 496] (92nd CAA 2003) | 11. Malayalam [passage 496] | 12. Manipuri [passage 496] (71st CAA 1992) | 13. Marathi [passage 496] | 14. Nepali [passage 496] (71st CAA 1992) | 15. Odia [passage 496] (Renamed from Oriya by 96th CAA 2011) | 16. Punjabi [passage 496] | 17. Sanskrit [passage 496] | 18. Santhali [passage 497] (92nd CAA 2003) | 19. Sindhi [passage 497] (21st CAA 1967) | 20. Tamil [passage 497] | 21. Telugu [passage 497] | 22. Urdu [passage 497].<\/p>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Language Chapters Sequence (343 to 351) — &quot;U-R-C-S&quot;<\/h4><ul><li><b>343–344:<\/b> Union Language &amp; Parliamentary Committee [passage 325, passage 327, passage 329]<\/li><li><b>345–347:<\/b> Regional Languages &amp; Minority Speech Protection [passage 330, passage 331, passage 332]<\/li><li><b>348–349:<\/b> Courts Language (Supreme Court / High Court English Requirement) [passage 333, passage 336]<\/li><li><b>350–351:<\/b> Special Directives (Mother-tongue, Minority Officer &amp; Hindi Development) [passage 337, passage 338, passage 339]<\/li><\/ul><h4>Mnemonic 2: Eighth Schedule Amendment Additions — &quot;S - KMN - BDMS&quot;<\/h4><ul><li><b>21st CAA (1967):<\/b> Sindhi [passage 497]<\/li><li><b>71st CAA (1992):<\/b> Konkani, Manipuri, Nepali (KMN) [passage 496]<\/li><li><b>92nd CAA (2003):<\/b> Bodo, Dogri, Maithili, Santhali (BDMS) [passage 495, passage 496, passage 497]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 343:<\/b> மத்திய அரசின் அலுவல் மொழி (Union Official Language) → தேவநாகரி வடிவ இந்தி மற்றும் சர்வதேச இந்திய எண்கள் [passage 325].<\/li><li><b>Art. 348(1):<\/b> நீதிமன்றங்களின் மொழி (Language of Courts) → உச்சநீதிமன்றம் மற்றும் உயர்நீதிமன்றங்களின் நடவடிக்கைகள் ஆங்கிலத்தில் மட்டுமே இருக்க வேண்டும் [passage 333].<\/li><li><b>Art. 350A:<\/b> தாய்மொழி வழிக் கல்வி (Primary Mother-Tongue Instruction) → 7-வது அரசியலமைப்பு திருத்தம், 1956 [passage 337, passage 338].<\/li><li><b>Art. 350B:<\/b> மொழி சிறுபான்மையினருக்கான சிறப்பு அதிகாரி (Special Officer for Linguistic Minorities) → குடியரசுத் தலைவரால் நியமிக்கப்படுபவர் [passage 338].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>PARLIAMENTARY / LEGISLATIVE LANGUAGE vs. PART XVII<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                  │<\/pre><pre>ARTICLE 120 (PARLIAMENT)                          ARTICLE 210 (STATE LEGISLATURE)<\/pre><pre>✦ Transaction in Hindi or English              ✦ Transaction in State Official Language(s),<\/pre><pre>✦ Presiding Officer can permit Mother-Tongue           Hindi, or English\n✦ Subject to Art. 348 Court Language                ✦ Presiding Officer can permit<\/pre><p>Mother-Tongue<\/p><pre>overriding clause                        ✦ Subject to Art. 348 Court Language<\/pre><h4>overriding clause<\/h4><h4>1. Article 120 / 210 ↔ Article 348 Override Synergy<\/h4><ul><li>Article 120 (Parliament) [passage 108] and Article 210 (State Legislature) [passage 165] govern floor proceedings in legislative chambers, but both explicitly state that they operate &quot;subject to the provisions of Article 348&quot; [passage 108, passage 165], preserving the primacy of English for statutory Bills, Acts, and judicial authoritative texts [passage 333, passage 334].<\/li><\/ul><p><b>2. Linguistic Minority Safeguards:<\/b> Article 29/30 vs. Article 350A/350B<\/p><ul><li>Article 29(1) (Part III Fundamental Right) guarantees any section of citizens having a distinct language, script, or culture the right to conserve the same [passage 5].<\/li><li>Article 350A &amp; 350B (Part XVII Special Directives) provide administrative enforcement mechanisms through primary education mother-tongue facilities and a Presidential Special Officer [passage 337, passage 338].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Mother-Tongue Instruction &amp; Educational Autonomy:<\/h4><ul><ul><li>State of Bombay v. Bombay Education Society (1954): The SC held that forcing students to learn only in specific languages or denying admission based on language violates Article 29(2) [passage 5] and Article 30(1) [passage 5].<\/li><li>State of Karnataka v. Associated Management of Primary &amp; Secondary Schools (2014): A 5-judge Constitution Bench held that while Article 350A directs States to provide primary mother-tongue facilities [passage 337], the State cannot compel private unaided schools to medium-of-instruction mandates. The choice of medium of instruction falls under the Freedom of Speech and Expression (Art. 19(1)(a)) [passage 67]. 2. Authoritative Text Primacy in Courts (Article 348):<\/li><li>Nityanand Sharma v. State of Bihar (1996) &amp; Madhu Limaye (1970): The Supreme Court affirmed that under Article 348(1)(a) [passage 333], proceedings in the Supreme Court must be conducted in English. Pleadings in Hindi or regional languages cannot be insisted upon without constitutional or statutory authorization.<\/li><li><b>Judgments in High Courts:<\/b> Under Article 348(2) Proviso [passage 335], even if a Governor authorizes Hindi in High Court arguments, judgments, decrees, and orders MUST remain in English [passage 335] unless Parliament alters the law.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Official Language Policy, Linguistic Minorities Protection, and Judicial Court Language Dynamics<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XVII (Articles 343–351) designs the linguistic framework of Indian federalism [passage 44, passage 45, passage 46]. Balancing Union official administration under Article 343 [passage 325] with regional state language autonomy (Article 345) [passage 330], judicial uniformity under Article 348 [passage 333], and minority directives (Articles 350A/350B) [passage 337, passage 338], this design reconciles national integration with linguistic pluralism.&quot;<\/p><ul><li>Mains Body Arguments (Judicial English &amp; Minority Rights):<\/li><ul><li><b>Judicial Consistency:<\/b> Explain why Article 348(1) [passage 333] mandates English for High Courts and Supreme Court to preserve pan-India legal precedent integrity (Art. 141) [passage 13, passage 142].<\/li><li><b>Grassroots Educational Access:<\/b> Analyze Article 350A [passage 337] and Associated Management (2014) regarding parental choice versus state directives.<\/li><li><b>Eighth Schedule Recognition:<\/b> Evaluate the role of the Eighth Schedule (22 Languages) [passage 495, passage 496, passage 497] in preserving cultural heritage.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, promoting the Three-Language Formula while strengthening the Special Officer for Linguistic Minorities (Article 350B) [passage 338] will uphold cooperative linguistic federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact numerical composition (Lok Sabha vs. Rajya Sabha) of the Parliamentary Committee on Official Language constituted under Article 344(4)? [passage 329] 2. Reverse Recall: Which Article imposes a constitutional duty on the Union to promote the spread of Hindi and draw its vocabulary primarily on Sanskrit? [passage 339] 3. UPSC Prelims Analytical Trap: Under Article 348(2) [passage 334], can a Governor authorise the use of Hindi for delivering judgments, decrees, or orders in a High Court? [passage 335] 4. Mains Applied Question: Discuss the constitutional safeguards available for linguistic minorities under Articles 29, 30, 350A, and 350B [passage 5, passage 337, passage 338] and their judicial interpretation in State of Karnataka v. Associated Management (2014).<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Lesson 21)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Lesson 22)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"14\"><span>Part XV: Elections &amp; Electoral Machinery (Articles 324–329A) (Lesson 23)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"15\"><span>Part XVI: Special Provisions Relating to Certain Classes (Articles 330–342A)<\/span><\/label><p>(Lesson 24)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"16\"><span>Part XVII: Official Language (Articles 343–351) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"17\"><span>Part XVIII: Emergency Provisions (Articles 352–360) (Up Next)<\/span><\/label>"}], "nchk": 18}, {"n": 26, "title": "Part XVIII — Emergency Provisions: National Emergency,", "secs": [{"t": "Articles", "h": "<h4>President&#x27;s Rule &amp; Financial Emergency<\/h4><p>(Articles 352–360)<\/p><p>Part XVIII of the Constitution (Articles 352–360) provides extraordinary constitutional mechanisms that allow the Union to convert India&#x27;s federal structure into a temporary unitary system to safeguard the sovereignty, security, and financial stability of the nation [passage 30, passage 31, passage 289, passage 298, passage 317].<\/p><h4>PART XVIII: EMERGENCY PROVISIONS ARCHITECTURE (ARTICLES 352–360)<\/h4><h4>│<\/h4><h4>┌──────────────────────────────┬─────────────┴──────────────<\/h4><p>┬──────────────────────────────┐<\/p><pre>│ National Emergency          │ President&#x27;s Rule         │ Financial Emergency         │<\/pre><pre>│ (Arts. 352–355, 358–359)       │ (Arts. 356–357)        │ (Art. 360)            │<\/pre><h4>└──────────────────────────────┴────────────────────────────<\/h4><p>┴──────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Fundamental Rights │<\/h4><pre>│ Impact          │<\/pre><h4>│ (Arts. 358 &amp; 359) │<\/h4><h4>└─────────────────────┘<\/h4><p>A. National Emergency (Articles 352–355)<\/p><ul><li><b>Article 352:<\/b> Proclamation of Emergency<\/li><ul><li><b>Art. 352(1) Three Grounds:<\/b> The President may proclaim a National Emergency if satisfied that a grave emergency exists threatening the security of India or any part thereof by [passage 289]:<\/li><ul><li>War [passage 289]; OR<\/li><li>External Aggression [passage 289]; OR<\/li><li>Armed Rebellion [passage 289].<\/li><li><b>(Note:<\/b> The term &quot;Armed Rebellion&quot; was substituted for &quot;internal disturbance&quot; by the 44th Constitutional Amendment Act, 1978 to prevent misuse) [passage 291].<\/li><\/ul><li>Art. 352(3) Mandatory Written Cabinet Decision: The President SHALL NOT issue a Proclamation under Art. 352(1) unless the decision of the Union Cabinet (Prime Minister + Cabinet Ministers under Art. 75) has been communicated to him in writing [passage 290].<\/li><li>Art. 352(4) Parliamentary Approval &amp; Special Majority: Must be laid before each House of Parliament and ceases to operate at the expiration of 1 month unless approved by resolutions of both Houses [passage 290]. (Reduced from 2 months to 1 month by 44th CAA). Must be passed by a Special Majority in both Houses (Majority of total membership + not less than 2/3rds present and voting).<\/li><li><b>Art. 352(5) Periodic 6-Month Approval:<\/b> An approved Proclamation remains in force for 6 months [passage 292]. Can be extended indefinitely for periods of 6 months at a time through repeated Parliamentary resolutions [passage 292].<\/li><li>Art. 352(8) Lok Sabha Disapproval Sitting Mechanism: If a written notice signed by not less than 1/10th of the total members of Lok Sabha is given to the Speaker (or President if out of session), a special sitting of Lok Sabha must be held within 14 days to consider disapproving the Emergency [passage 293, passage 294].<\/li><\/ul><li><b>Article 353:<\/b> Effect of Proclamation of Emergency<\/li><ul><li><b>Executive Direction [Art. 353(a)]:<\/b> Union executive power extends to giving directions to any State as to how its executive power is to be exercised [passage 295].<\/li><li><b>Legislative Overriding [Art. 353(b)]:<\/b> Parliament&#x27;s law-making power extends to matters in the State List (List II) [passage 295].<\/li><\/ul><li><b>Article 354:<\/b> Revenue Distribution Adjustment<\/li><ul><li>President may by order modify or adjust the constitutional distribution of revenues between Union and States (Arts. 268 to 279) during the emergency [passage 297].<\/li><\/ul><li><b>Article 355:<\/b> Union Duty to Protect States<\/li><ul><li>It shall be the duty of the Union to protect every State against external aggression and internal disturbance, and to ensure that the Government of every State is carried on in accordance with the provisions of this Constitution [passage 298].<\/li><\/ul><\/ul><h4>B. President&#x27;s Rule / State Emergency (Articles 356–357)<\/h4><ul><li><b>Article 356:<\/b> Failure of Constitutional Machinery in States<\/li><ul><li><b>Art. 356(1) Invocation Grounds:<\/b> If the President, on receipt of a report from the Governor of a State or otherwise, is satisfied that a situation has arisen in which the Government of the State cannot be carried on in accordance with the provisions of this Constitution, the President may by Proclamation [passage 298]: 1. Assume to himself all or any executive functions of the State Government, Governor, or any authority other than the State Legislature [passage 299]. 2. Declare that powers of the State Legislature shall be exercisable by or under the authority of Parliament [passage 300].<\/li><li><b>Proviso (High Court Protection):<\/b> The President CANNOT assume any powers exercisable by a High Court or suspend any constitutional provision relating to High Courts [passage 300].<\/li><li><b>Linkage with Article 365:<\/b> Under Article 365, if a State fails to comply with or give effect to directions given by the Union, it is lawful for the President to hold that a situation has arisen where government cannot be carried on in accordance with the Constitution [passage 32, passage 330].<\/li><li><b>Art. 356(3) Parliamentary Approval:<\/b> Must be approved by both Houses of Parliament within 2 MONTHS by a Simple Majority [passage 301].<\/li><li>Art. 356(4) Duration &amp; 3-Year Absolute Ceiling: Remains in force for 6 months upon approval [passage 302]. Can be extended every 6 months for a maximum total period of 3 years [passage 302].<\/li><li>Art. 356(5) 1-Year Restriction Clause (44th CAA, 1978): Beyond 1 year, a resolution extending President&#x27;s Rule CANNOT be passed unless [passage 304, passage 305]: 1. A National Emergency is in operation in India or any part of the State [passage 305]; AND 2. The Election Commission certifies that continuing President&#x27;s Rule is necessary due to difficulties in conducting Legislative Assembly elections [passage 305].<\/li><\/ul><li><b>Article 357:<\/b> Legislative Delegations under President&#x27;s Rule<\/li><ul><li>Parliament can delegate state law-making authority to the President [passage 306]. Laws made during President&#x27;s Rule continue in force after the Proclamation ceases until repealed or amended by the competent State Legislature [passage 308].<\/li><\/ul><\/ul><h4>C. Impact on Fundamental Rights (Articles 358–359)<\/h4><h4>ARTICLE 358 vs. ARTICLE 359 COMPARISON MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                  │<\/pre><pre>ARTICLE 358 (SUSPENSION OF ART. 19)                     ARTICLE 359 (SUSPENSION OF<\/pre><p>ENFORCEMENT)<\/p><pre>✦ Applies ONLY during External Emergency               ✦ Applies during both External &amp; Internal<\/pre><p>Emergencies<\/p><pre>(War or External Aggression)                 (War, External Aggression, or Armed Rebellion)<\/pre><pre>✦ Suspends Article 19 rights AUTOMATICALLY               ✦ Does NOT suspend rights<\/pre><p>automatically; requires a<\/p><h4>specific Presidential Order<\/h4><pre>✦ Operates Pan-India across entire emergency           ✦ Operates for specified territories &amp;<\/pre><p>duration in order<\/p><pre>✦ Suspends Article 19 completely                ✦ CANNOT suspend enforcement of Articles<\/pre><p>20 and 21<\/p><ul><li><b>Article 358:<\/b> Suspension of Article 19 During Emergencies<\/li><ul><li>Art. 358(1) External Emergency Restriction (44th CAA): Suspends Article 19 ONLY when National Emergency is proclaimed on grounds of War or External Aggression [passage 309]. It does NOT suspend Article 19 if emergency is declared on grounds of Armed Rebellion [passage 309].<\/li><li><b>Recital Clause Requirement [Art. 358(2)]:<\/b> Protects only those laws and executive actions that contain an explicit recital stating they are made in relation to the Proclamation of Emergency [passage 311, passage 312].<\/li><\/ul><li><b>Article 359:<\/b> Suspension of Judicial Enforcement of Part III Rights<\/li><ul><li><b>Art. 359(1):<\/b> President may by order declare that the right to move any court for the enforcement of specified Fundamental Rights remains suspended during emergency [passage 312].<\/li><li>Non-Suspendable Rights Proviso (44th CAA, 1978): The Presidential Order CANNOT suspend the right to move court for enforcement of ARTICLE 20 (Protection in respect of conviction for offences) and ARTICLE 21 (Protection of life and personal liberty) [passage 312, passage 313].<\/li><\/ul><\/ul><h4>D. Financial Emergency (Article 360)<\/h4><ul><li><b>Article 360:<\/b> Provisions as to Financial Emergency<\/li><ul><li><b>Art. 360(1) Ground:<\/b> Declared by the President if satisfied that a situation has arisen threatening the financial stability or credit of India or any part of its territory [passage 317]. (Has NEVER been declared in India).<\/li><li><b>Art. 360(2) Approval:<\/b> Must be approved by Parliament within 2 MONTHS by a Simple Majority [passage 318, passage 319].<\/li><li><b>Art. 360(3) Executive Consequences:<\/b> 1. Union gives directions to States to observe canons of financial propriety [passage 320]. 2. Directions requiring reduction of salaries/allowances of State civil servants [passage 320]. 3. Mandates reservation of all Money Bills and Financial Bills (Art. 207) for Presidential consideration after passage by State Assemblies [passage 321].<\/li><li>Art. 360(4)(b) Salary Reduction of Supreme Court &amp; High Court Judges: Empowers President to order reduction of salaries and allowances of all Union officers, INCLUDING Judges of the Supreme Court and High Courts [passage 321].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: The Emergency Triad Articles — &quot;352 - 356 - 360&quot;<\/h4><ul><li><b>352:<\/b> National Emergency (War, External Aggression, Armed Rebellion) [passage 289]<\/li><li><b>356:<\/b> President&#x27;s Rule (Failure of Constitutional Machinery in State) [passage 298]<\/li><li><b>360:<\/b> Financial Emergency (Financial Stability / Credit Threat) [passage 317]<\/li><\/ul><h4>Mnemonic 2: Parliamentary Approval Windows &amp; Majorities<\/h4><ul><li><b>Article 352 (National Emergency):<\/b> Approved within 1 MONTH by Special Majority [passage 290].<\/li><li><b>Article 356 (President&#x27;s Rule):<\/b> Approved within 2 MONTHS by Simple Majority [passage 301].<\/li><li><b>Article 360 (Financial Emergency):<\/b> Approved within 2 MONTHS by Simple Majority [passage 319].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 352:<\/b> தேசிய அவசரநிலை (National Emergency) → போர், வெளிநாட்டு ஆக்கிரமிப்பு, ஆயுதமேந்திய கிளர்ச்சி [passage 289].<\/li><li><b>Art. 356:<\/b> குடியரசுத் தலைவர் ஆட்சி (President&#x27;s Rule) → மாநிலத்தில் அரசியலமைப்பு இயந்திரம் செயலிழப்பு [passage 298].<\/li><li><b>Art. 360:<\/b> நிதி அவசரநிலை (Financial Emergency) → நீதிபதிகள் உட்பட அனைவரின் சம்பளக் குறைப்பு அதிகாரம் [passage 317, passage 321].<\/li><li><b>Art. 359:<\/b> அடிப்படை உரிமைகள் பாதுகாப்பு (Non-Suspendable Rights) → 20 மற்றும் 21 ஆகிய உறுப்புகளை எந்தவொரு அவசரநிலையிலும் நிறுத்த முடியாது [passage 312, passage 313].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>THE ENFORCEMENT &amp; CONSTITUTIONAL FAILURE CHAIN<\/h4><h4>│<\/h4><h4>┌──────────────────────────────────────┴────────────────────<\/h4><p>──────────────────┐<\/p><pre>│                                                 │<\/pre><pre>ARTICLE 256 / 257 DIRECTIONS                    ARTICLE 365 PRESUMPTION OF FAILURE<\/pre><pre>✦ Union gives binding executive directions       ✦ Failure of State to comply with Union<\/pre><p>directions<\/p><pre>to State Government                      ✦ Deemed a situation where State government<\/pre><p>cannot be carried on per Constitution<\/p><h4>────────────────────────────────────────────────────────────<\/h4><p>───────────────────┘<\/p><h4>│<\/h4><h4>▼<\/h4><h4>ARTICLE 356 PROCLAMATION (PRESIDENT&#x27;S RULE)<\/h4><h4>✦ President assumes State Executive powers<\/h4><h4>✦ State Assembly powers transferred to Parliament<\/h4>"}, {"t": "Cases", "h": "<h4>1. Judicial Review of Article 356 &amp; The Floor Test Mandate:<\/h4><ul><ul><li>S.R. Bommai v. Union of India (1994 - 9-Judge Constitution Bench):<\/li><ul><li>Held that Presidential Proclamation under Article 356 [passage 298] is subject to Judicial Review.<\/li><li>The floor of the Legislative Assembly is the ONLY legitimate arena to test the majority of a Ministry (Floor Test).<\/li><li>Secularism is a Basic Feature of the Constitution; a State Government acting against secularism invites action under Article 356 [passage 298].<\/li><li>Assembly cannot be dissolved until Parliament approves the Proclamation under Article 356(3) [passage 301] (can only be kept under suspended animation).<\/li><\/ul><\/ul><\/ul><p><b>2. Arbitrary Assembly Dissolution Guidelines:<\/b><\/p><ul><ul><li><b>Rameshwar Prasad v. Union of India (2006):<\/b> SC held that recommending President&#x27;s Rule to prevent a political party from staking a claim to form a government is unconstitutional and mala fide.<\/li><\/ul><\/ul><p><b>3. Emergency Safeguards &amp; Basic Structure:<\/b><\/p><ul><ul><li><b>Minerva Mills Ltd. v. Union of India (1980):<\/b> Upheld that judicial review over emergency proclamations cannot be barred by constitutional amendments.<\/li><li>ADM Jabalpur v. Shivkant Shukla (1976) [Habeas Corpus Case] Overruled: The historic error of ADM Jabalpur (which allowed suspension of personal liberty during emergency) was formally corrected by the 44th CAA 1978 (protecting Articles 20 and 21) [passage 312, passage 313] and explicitly overruled in K.S. Puttaswamy v. Union of India (2017).<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Emergency Architecture, Federal Balance, Judicial Scrutiny of Article 356, and 44th Amendment Safeguards<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XVIII (Articles 352–360) constructs the constitutional architecture for emergency governance in India [passage 30, passage 31, passage 289, passage 298, passage 317]. Differentiating between National Emergency (Article 352) [passage 289], President&#x27;s Rule (Article 356) [passage 298], and Financial Emergency (Article 360) [passage 317], this framework balances state preservation with constitutional democracy through procedural checks introduced by the 44th Constitutional Amendment Act, 1978 [passage 291, passage 305, passage 312].&quot;<\/p><ul><li>Mains Body Arguments (Judicial Restraints &amp; Fundamental Protections):<\/li><ul><li><b>Restraining Federal Overreach:<\/b> Analyze Article 356 [passage 298] through S.R. Bommai (1994), proving how mandatory Floor Tests and judicial review prevent political misuse.<\/li><li><b>Insulating Core Fundamental Rights:<\/b> Highlight Article 359 [passage 312] read with the 44th CAA 1978, ensuring Articles 20 and 21 remain non-suspendable under any circumstances [passage 312, passage 313].<\/li><li><b>Tightening National Emergency Invocation:<\/b> Explain Article 352(3) [passage 290] written Cabinet advice requirement and the substitution of &quot;armed rebellion&quot; [passage 289, passage 291].<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, strictly adhering to S.R. Bommai principles and safeguarding Articles 20 and 21 [passage 312] preserves cooperative federalism and individual liberty during crisis governance.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact voting majority and time limit required for Parliament to approve a Proclamation of National Emergency under Article 352(4)? [passage 290] 2. Reverse Recall: Which Article explicitly provides that the right to move any court for the enforcement of Articles 20 and 21 CANNOT be suspended during an emergency? [passage 312, passage 313] 3. UPSC Prelims Analytical Trap: Does Article 358 automatically suspend Article 19 when a National Emergency is declared on the ground of &quot;Armed Rebellion&quot;? [passage 309] 4. Mains Applied Question: Analyze the impact of the Supreme Court&#x27;s 9-judge bench decision in S.R. Bommai v. Union of India (1994) on the exercise of Presidential discretion under Article 356 [passage 298].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Lesson 21)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Lesson 22)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"14\"><span>Part XV: Elections &amp; Electoral Machinery (Articles 324–329A) (Lesson 23)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"15\"><span>Part XVI: Special Provisions Relating to Certain Classes (Articles 330–342A)<\/span><\/label><p>(Lesson 24)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"16\"><span>Part XVII: Official Language (Articles 343–351) (Lesson 25)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"17\"><span>Part XVIII: Emergency Provisions (Articles 352–360) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"18\"><span>Parts XIX, XX, XXI &amp; XXII: Miscellaneous, Amendment (Art. 368), Special<\/span><\/label><p>Provisions &amp; Repeals (Articles 361–395) (Final Synthesis Lesson Up Next)<\/p>"}], "nchk": 19}, {"n": 27, "title": "Parts XIX, XX, XXI & XXII — Amendment Procedure (Art. 368), Special", "secs": [{"t": "Articles", "h": "<h4>Provisions (Arts. 370–371J) &amp;<\/h4><p>Miscellaneous, Temporary, Transition &amp; Repeals (Articles 361–395)<\/p><p>The concluding parts of the Constitution (Articles 361–395) encompass executive immunities (Part XIX), the formal constitutional amendment machinery (Part XX), temporary, transitional, and special provisions for specific States (Part XXI), and short title, commencement, authoritative text in Hindi, and repeals (Part XXII) [passage 32, passage 33, passage 34, passage 35, passage 36, passage 330, passage 350, passage 371, passage 481].<\/p><h4>CONCLUDING PARTS ARCHITECTURE (ARTICLES 361–395)<\/h4><h4>│<\/h4><h4>┌──────────────────────────┬──────────┴──────────┬──────────<\/h4><p>────────────────┐<\/p><pre>│ Part XIX: Miscellaneous │ Part XX: Amendment │ Part XXI: Special          │<\/pre><pre>│ Immunities &amp; Protection │ Power &amp; Procedure │ Provisions for States       │<\/pre><pre>│ (Arts. 361–367)       │ (Art. 368)       │ (Arts. 369–392)      │<\/pre><h4>└──────────────────────────┴─────────────────────┴──────────<\/h4><p>────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ Part XXII: Short    │<\/pre><pre>│ Title &amp; Repeals     │\n│ (Arts. 393–395)     │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. Part XIX: Miscellaneous Provisions &amp; Immunities (Articles 361–367)<\/h4><ul><li><b>Article 361:<\/b> Protection of President and Governors<\/li><ul><li><b>Art. 361(1) Personal Immunity:<\/b> The President or Governor shall NOT be answerable to any court for the exercise and performance of the powers and duties of his office or for any act done or purporting to be done by him [passage 330]. (Subject to Art. 61 impeachment investigation) [passage 330].<\/li><li><b>Art. 361(2) Absolute Criminal Immunity:<\/b> No criminal proceedings whatsoever shall be instituted or continued against the President or Governor in any court during his term of office [passage 331].<\/li><li><b>Art. 361(3) Arrest Immunity:<\/b> No process for the arrest or imprisonment of the President or Governor shall issue from any court during his term of office [passage 331].<\/li><li><b>Art. 361(4) Civil Notice Clause:<\/b> No civil proceedings claiming relief for personal acts can be instituted during office until 2 MONTHS AFTER written notice has been delivered to him stating the cause of action, party details, and relief claimed [passage 331, passage 332].<\/li><\/ul><li><b>Article 361A:<\/b> Protection of Publication of Proceedings of Parliament and State Assemblies<\/li><ul><li>Added by 44th CAA, 1978 [passage 32, passage 332]. Protects media/persons from civil or criminal liability for publishing substantially true reports of legislative proceedings, provided publication is without malice [passage 332, passage 333].<\/li><\/ul><li><b>Article 363:<\/b> Bar to Interference by Courts in Disputes Arising Out of Certain Treaties, Agreements, etc.<\/li><ul><li>Excludes court jurisdiction over disputes arising out of pre-constitutional treaties, covenants, or agreements executed with rulers of former Indian Princely States [passage 334].<\/li><\/ul><li><b>Article 363A:<\/b> Abolition of Privy Purses<\/li><ul><li>Inserted by the 26th Constitutional Amendment Act, 1971 [passage 32, passage 336]. Terminated all recognition granted to Rulers of Indian States and abolished Privy Purses [passage 336].<\/li><\/ul><li><b>Article 365:<\/b> Effect of Failure to Comply with Union Directions<\/li><ul><li>Where a State fails to comply with or give effect to any direction given by the Union under any provision of this Constitution, it shall be lawful for the President to hold that a situation has arisen where government cannot be carried on in accordance with the Constitution (invoking Art. 356) [passage 338, passage 339].<\/li><\/ul><li><b>Article 366:<\/b> Definitions<\/li><ul><li>Contains formal definitions for key constitutional terms including &quot;Agricultural income&quot;, &quot;Corporation tax&quot;, &quot;Goods and services tax&quot; (Art. 366(12A)) [passage 340], &quot;Scheduled Castes&quot; (Art. 366(24)) [passage 346], &quot;Scheduled Tribes&quot; (Art. 366(25)) [passage 347], and &quot;Socially and Educationally Backward Classes&quot; (Art. 366(26C)) [passage 347].<\/li><\/ul><\/ul><h4>B. Part XX: Amendment of the Constitution (Article 368)<\/h4><ul><li><b>Article 368:<\/b> Power of Parliament to Amend the Constitution and Procedure Therefor<\/li><ul><li><b>Art. 368(1) Constituent Power:<\/b> Parliament may in exercise of its constituent power amend by way of addition, variation, or repeal any provision of this Constitution in accordance with the procedure laid down in this Article [passage 350].<\/li><li>Art. 368(2) Introduction &amp; Special Majority Mandate:<\/li><ul><li>An amendment can be initiated ONLY by the introduction of a Bill in either House of Parliament (NOT in State Legislatures) [passage 350].<\/li><li><b>Special Majority Requirement:<\/b> Must be passed in each House by a majority of the total membership of that House AND by a majority of not less than two-thirds (2/3rds) of members present and voting [passage 350].<\/li><li><b>NO Joint Sitting:<\/b> No provision for a joint sitting under Article 108 if a deadlock arises between Lok Sabha and Rajya Sabha over an Amendment Bill [passage 94].<\/li><\/ul><li>Art. 368(2) Proviso — State Ratification Requirements:<\/li><ul><li>If an amendment seeks to make any change in federal provisions, it ALSO REQUIRES RATIFICATION BY LEGISLATURES OF NOT LESS THAN ONE-HALF (50%) OF THE STATES by simple resolutions passed by those Legislatures before the Bill is presented to the President for assent [passage 350, passage 351, passage 355].<\/li><li>Federal Provisions Requiring State Ratification: 1. Election of the President (Arts. 54 &amp; 55) [passage 351]. 2. Extent of executive power of Union &amp; States (Arts. 73 &amp; 162) [passage 351]. 3. Supreme Court and High Courts (Part V Chap IV, Part VI Chap V, Art. 241) [passage 351, passage 352]. 4. Distribution of legislative powers (Part XI Chap I &amp; Seventh Schedule Lists) [passage 352, passage 353]. 5. Goods and Services Tax Council (Art. 279A) [passage 353]. 6. Representation of States in Parliament (Fourth Schedule) [passage 353]. 7. Article 368 itself [passage 354].<\/li><\/ul><li><b>Art. 368(3) Exclusion of Art. 13(2):<\/b> Nothing in Article 13 (definition of &quot;law&quot;) shall apply to any amendment made under Article 368 [passage 355].<\/li><li>Art. 368(4) &amp; (5) Clause Deletions / Judicial Review Primacy: Clauses (4) and (5) (inserted by 42nd CAA attempting to bar judicial review) were struck down as unconstitutional by the SC in Minerva Mills (1980) [passage 355].<\/li><\/ul><\/ul><p><b>C. Part XXI:<\/b> Temporary, Transitional &amp; Special Provisions (Articles 369–392)<\/p><h4>SPECIAL PROVISIONS FOR STATES (ARTICLES 370–371J)<\/h4><h4>│<\/h4><h4>┌───────────────────────────┬───────────────┴───────────────<\/h4><p>┬───────────────────────────┐<\/p><pre>│ Art. 370: J&amp;K       │ Art. 371A: Nagaland        │ Art. 371B &amp; 371C: Assam │<\/pre><p>│ Abrogated/Operative Text │ Customary law, land, minerals │ &amp; Manipur Hill Committees │<\/p><pre>│ (C.O. 272 &amp; 273, 2019)   │ protected from Central Acts │                 │<\/pre><h4>└───────────────────────────┴───────────────────────────────<\/h4><p>┴───────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ Arts. 371D–371J:   │<\/pre><h4>│ AP, Sikkim, Mizoram,│<\/h4><pre>│ Arunachal, Goa,    │<\/pre><h4>│ Karnataka-Hyderabad │<\/h4><h4>└─────────────────────┘<\/h4><ul><li><b>Article 370:<\/b> Temporary Provisions with respect to the State of Jammu and Kashmir<\/li><ul><li>Rendered inoperative in its historical form via Presidential Orders C.O. 272 and C.O. 273 (August 2019) issued under Art. 370(3) [passage 356, passage 357], applying all provisions of the Constitution of India in full to the UTs of J&amp;K and Ladakh (upheld in In Re Article 370, 2023).<\/li><\/ul><li><b>Articles 371 to 371J:<\/b> Asymmetric Federalism Special Provisions for States<\/li><ul><li><b>Article 371 (Maharashtra &amp; Gujarat):<\/b> Special responsibility of Governor for establishing separate Development Boards for Vidarbha, Marathwada, Saurashtra, and Kutch [passage 370, passage 371].<\/li><li><b>Article 371A (Nagaland - 13th CAA 1962):<\/b> Parliamentary Acts shall NOT apply to Nagaland regarding Naga religious/social practices, customary law, civil/criminal customary justice, and ownership and transfer of land and its resources, UNLESS the Nagaland Assembly so decides by resolution [passage 371, passage 372].<\/li><li><b>Article 371B (Assam - 22nd CAA 1969):<\/b> Committee of Assembly consisting of members elected from tribal areas [passage 376].<\/li><li><b>Article 371C (Manipur - 27th CAA 1971):<\/b> Committee of Assembly for Hill Areas; Governor report to President [passage 377, passage 378].<\/li><li>Articles 371D &amp; 371E (Andhra Pradesh &amp; Telangana - 32nd CAA 1973): Equitable opportunities in public employment/education; establishment of Central University in AP [passage 379, passage 388].<\/li><li><b>Article 371F (Sikkim - 36th CAA 1975):<\/b> Special provisions following Sikkim&#x27;s integration; Assembly strength not less than 30 [passage 388, passage 389].<\/li><li><b>Article 371G (Mizoram - 53rd CAA 1986):<\/b> Protects Mizo customary law, land transfer, and religion from Parliamentary Acts unless Assembly so decides [passage 397]; minimum Assembly strength 40 [passage 398].<\/li><li>Article 371H (Arunachal Pradesh - 55th CAA 1986): Special responsibility of Governor regarding law and order [passage 398]; minimum Assembly strength 30 [passage 401].<\/li><li><b>Article 371I (Goa - 56th CAA 1987):<\/b> Minimum Assembly strength 30 members [passage 401].<\/li><li><b>Article 371J (Karnataka - 98th CAA 2012):<\/b> Special provisions for Hyderabad-Karnataka region (Kalyana-Karnataka); separate Development Board, reservation in education and public employment [passage 402, passage 403].<\/li><\/ul><li><b>Article 392:<\/b> Power of the President to Remove Difficulties<\/li><ul><li>Executive adaptation order power during the transition from the Government of India Act 1935 to the Constitution [passage 478, passage 479].<\/li><\/ul><\/ul><p><b>D. Part XXII:<\/b> Short Title, Commencement, Authoritative Text in Hindi &amp; Repeals (Articles 393–395)<\/p><ul><li><b>Article 393:<\/b> Short Title<\/li><ul><li><b>Text:<\/b> &quot;This Constitution may be cited as the Constitution of India.&quot; [passage 481]<\/li><\/ul><li><b>Article 394:<\/b> Commencement<\/li><ul><li>Came into full force on January 26, 1950 (Republic Day) [passage 481, passage 482].<\/li><li><b>Articles Enforced Immediately on Nov 26, 1949:<\/b> Articles 5, 6, 7, 8, 9 (Citizenship) [passage 481], 60 (Presidential Oath) [passage 481], 324 (Election Commission) [passage 481], 366, 367, 379, 380, 388, 391, 392, and 393 [passage 481].<\/li><\/ul><li><b>Article 394A:<\/b> Authoritative Text in the Hindi Language<\/li><ul><li>Added by 58th CAA, 1987 [passage 36, passage 482]. President causes to be published authoritative text of the Constitution in Hindi [passage 482, passage 483].<\/li><\/ul><li><b>Article 395:<\/b> Repeals<\/li><ul><li>Formally repealed the Government of India Act, 1935, and the Indian Independence Act, 1947, together with all enactments amending or supplementing them [passage 484]. (Abolition of Privy Council Jurisdiction Act 1949 was retained) [passage 484].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> Asymmetric Federalism Articles (371 to 371J) — &quot;N-A-M-AP-S-M-A-G-K&quot;<\/p><ul><li><b>371A:<\/b> Nagaland (13th CAA) [passage 371]<\/li><li><b>371B:<\/b> Assam (22nd CAA) [passage 376]<\/li><li><b>371C:<\/b> Manipur (27th CAA) [passage 377]<\/li><li><b>371D/E:<\/b> AP &amp; Telangana (32nd CAA) [passage 379]<\/li><li><b>371F:<\/b> Sikkim (36th CAA) [passage 388]<\/li><li><b>371G:<\/b> Mizoram (53rd CAA) [passage 397]<\/li><li><b>371H:<\/b> Arunachal Pradesh (55th CAA) [passage 398]<\/li><li><b>371I:<\/b> Goa (56th CAA) [passage 401]<\/li><li><b>371J:<\/b> Karnataka / Hyderabad-Karnataka (98th CAA) [passage 402]<\/li><\/ul><h4>Mnemonic 2: Article 368 Amendment Flow — &quot;I-S-R-A&quot;<\/h4><ul><li>Initiation ONLY in Parliament (either House) [passage 350]<\/li><li>Special Majority in each House independently (2/3rd present + voting AND absolute majority) [passage 350]<\/li><li>Ratification by 50% State Assemblies for federal provisions (Proviso) [passage 350, passage 351]<\/li><li>Assent mandatory by President (24th CAA 1971) [passage 350].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 361:<\/b> குடியரசுத் தலைவர்/ஆளுநர் விலக்கு (Personal Immunity) → பதவிக் காலத்தில் குற்றவியல் நடவடிக்கைகளில் இருந்து முழுமையான விலக்கு [passage 330, passage 331].<\/li><li><b>Art. 368:<\/b> அரசியலமைப்பு திருத்தச் சட்டம் (Amendment Procedure) → நாடாளுமன்றத்தின் சிறப்பு பெரும்பான்மை; கூட்டாட்சி விதிகளுக்கு 50% மாநிலங்களின் ஒப்புதல் [passage 350, passage 351].<\/li><li><b>Art. 371A / 371G:<\/b> நாகாலாந்து / மிசோரம் சிறப்பு சட்டம் (Customary Protection) → பழங்குடியினரின் நிலம் மற்றும் கலாச்சார உரிமைகளில் நாடாளுமன்ற சட்டங்கள் நேரடியாகப் பொருந்தாது [passage 371, passage 397].<\/li><li><b>Art. 395:<\/b> சட்டங்கள் நீக்கம் (Repeals) → 1935 இந்திய அரசுச் சட்டம் மற்றும் 1947 இந்திய சுதந்திரச் சட்டம் ஆகியவை நீக்கப்பட்டன [passage 484].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>THE EVOLUTION OF AMENDMENT POWER vs. BASIC STRUCTURE<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                    │<\/pre><pre>SHANKARI PRASAD (1951) &amp; SAJJAN SINGH (1965)                GOLAK NATH (1967)<\/pre><pre>✦ Parliament can amend ANY part of Constitution       ✦ Fundamental Rights are &quot;sacrosanct&quot;<\/pre><pre>✦ &quot;Law&quot; under Art. 13(2) does NOT include Art. 368     ✦ Parliament CANNOT amend Part III<\/pre><h4>───────────────────────────────────────────────────────┴────<\/h4><p>───────────────────────────────<\/p><h4>│<\/h4><h4>▼<\/h4><p>24TH CAA, 1971 \\\\(\\rightarrow\\\\) KESAVANANDA BHARATI (1973) \\\\(\\rightarrow\\\\) MINERVA MILLS (1980)<\/p><p><b>✦ Kesavananda Bharati:<\/b> Parliament can amend any provision under Art. 368 BUT cannot alter or destroy<\/p><h4>the **BASIC STRUCTURE** of the Constitution<\/h4><p><b>✦ Minerva Mills:<\/b> Judicial Review under Art. 368 is itself part of the Basic Structure<\/p><h4>1. Article 13(2) ↔ Article 368 Constitutional Friction<\/h4><ul><li>Article 13(2) prohibits the State from making any &quot;law&quot; that takes away or abridges Fundamental Rights [passage 42].<\/li><li>Article 368(3) explicitly clarifies that &quot;Nothing in Article 13 shall apply to any amendment made under this Article&quot; [passage 355]. However, under the Basic Structure Doctrine (Kesavananda Bharati, 1973), if a constitutional amendment violates a basic feature of the Constit
