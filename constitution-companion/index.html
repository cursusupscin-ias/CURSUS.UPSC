)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part VI: The State Executive — Governor, CM &amp; AG (Articles 152–167) (Current<\/span><\/label><p>Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part VI: State Legislature — Composition, Officers &amp; Conduct (Articles 168–212)<\/span><\/label><p>(Up Next)<\/p>"}], "nchk": 14}, {"n": 15, "title": "Part VI — State Legislature: Composition, Creation/Abolition of", "secs": [{"t": "Articles", "h": "<h4>Councils, Officers, Procedure &amp; Privileges<\/h4><p>(Articles 168–212)<\/p><p>Chapter III of Part VI (Articles 168–212) defines the state legislative organ [passage 9, passage 144]. While Parliament is strictly bicameral, State Legislatures may be unicameral (Legislative Assembly only) or bicameral (Legislative Assembly and Legislative Council) [passage 144, passage 147].<\/p><h4>PART VI CHAPTER III: STATE LEGISLATURE (ARTICLES 168–212)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬─────────────┴──────────────┬<\/h4><p>─────────────────────────────┐<\/p><pre>│ Structure &amp; Creation      │ Officers &amp; Secretariat   │ Disqualifications &amp;      │\n│ (Arts. 168–177)       │ (Arts. 178–187)        │ Quorum (Arts. 188–193)    │<\/pre><h4>└─────────────────────────────┴────────────────────────────┴<\/h4><p>─────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Legislative/Budget │<\/h4><h4>│ Procedure &amp; Assent │<\/h4><pre>│ (Arts. 194–212)   │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. General Architecture, Composition &amp; Abolition (Articles 168–177)<\/h4><ul><li><b>Article 168:<\/b> Constitution of Legislatures in States<\/li><ul><li>Consists of the Governor and either one House (Legislative Assembly) or two Houses (Legislative Assembly and Legislative Council) [passage 144, passage 147].<\/li><li><b>Bicameral States:<\/b> Currently 6 States have a Legislative Council: Andhra Pradesh, Bihar, Karnataka, Maharashtra, Telangana, and Uttar Pradesh [passage 144, passage 147].<\/li><\/ul><li><b>Article 169:<\/b> Abolition or Creation of Legislative Councils in States<\/li><ul><li>Parliament may by law provide for the abolition or creation of a Legislative Council in a State [passage 147].<\/li><li><b>Prerequisite Resolution:<\/b> The Legislative Assembly of the State must pass a resolution to that effect by a special majority: 1. Majority of the total membership of the Assembly [passage 147]; AND 2. Majority of not less than 2/3rds of members present and voting [passage 147].<\/li><li>Art. 169(3) Constitutional Amendment Exemption: Such parliamentary law shall NOT be deemed an amendment of the Constitution for the purposes of Article 368 [passage 148].<\/li><\/ul><li><b>Article 170:<\/b> Composition of the Legislative Assemblies (Vidhan Sabha)<\/li><ul><li>Chosen by direct election from territorial constituencies [passage 148].<\/li><li><b>Strength Limits:<\/b> Maximum 500 members, minimum 60 members [passage 148]. (Exceptions under special provisions: Sikkim (30), Mizoram (40), Goa (40), Arunachal Pradesh (30), Nagaland (46)) [passage 435, passage 443, passage 447, passage 450].<\/li><li><b>Delimitation Freeze:<\/b> Population census base remains frozen to the 2001 census until figures for the first census after 2026 are published [passage 149, passage 150].<\/li><\/ul><li><b>Article 171:<\/b> Composition of the Legislative Councils (Vidhan Parishad)<\/li><ul><li><b>Maximum Strength:<\/b> Shall not exceed 1/3rd of the total strength of the Legislative Assembly of that State [passage 151].<\/li><li><b>Minimum Strength:<\/b> Shall not be less than 40 members [passage 151].<\/li><li><b>Five-Fold Electoral Breakdown [Art. 171(3)]:<\/b> 1. 1/3rd elected by local bodies (municipalities, district boards) [passage 152]. 2. 1/12th elected by graduates of at least 3 years&#x27; standing [passage 152]. 3. 1/12th elected by teachers (at least secondary school level, 3 years&#x27; experience) [passage 153]. 4. 1/3rd elected by MLAs from amongst non-members [passage 153]. 5. 1/6th nominated by the Governor from persons with special knowledge in Literature, Science, Art, Co-operative Movement, and Social Service (L-S-A-C-S) [passage 153, passage 154].<\/li><\/ul><li><b>Article 172:<\/b> Duration of State Legislatures<\/li><ul><li><b>Legislative Assembly:<\/b> Term is 5 years from its first meeting unless sooner dissolved [passage 154]. Extended during Emergency by Parliament up to 1 year at a time [passage 155].<\/li><li><b>Legislative Council:<\/b> Permanent body not subject to dissolution; 1/3rd members retire every 2nd year [passage 155].<\/li><\/ul><li><b>Article 173:<\/b> Qualifications for Membership<\/li><ul><li>Citizen of India taking Third Schedule oath [passage 156]; minimum age 25 years for Assembly, 30 years for Council [passage 157].<\/li><\/ul><li><b>Article 174–177:<\/b> Sessions, Address &amp; Rights of Advocate-General<\/li><ul><li><b>Art. 174:<\/b> Governor summons session (gap between sessions shall not exceed 6 months), prorogues, or dissolves Assembly [passage 157, passage 158].<\/li><li><b>Art. 176:<\/b> Special address by Governor at the first session after general election and first session of each year [passage 159].<\/li><li><b>Art. 177:<\/b> Ministers and the Advocate-General have the right to speak and take part in proceedings of either House/committee, BUT WITHOUT THE RIGHT TO VOTE [passage 160].<\/li><\/ul><\/ul><p>B. Officers of the State Legislature (Articles 178–187)<\/p><ul><li><b>Assembly Officers (Arts. 178–181):<\/b> Speaker and Deputy Speaker chosen by the Assembly [passage 161]. Vacate office if losing Assembly membership; resign to each other; removed by Effective Majority (14 days&#x27; notice) [passage 161, passage 162]. Speaker does not preside during removal proceedings, but has a vote in the first instance (no casting vote) [passage 163, passage 164].<\/li><li><b>Council Officers (Arts. 182–185):<\/b> Chairman and Deputy Chairman chosen by the Council [passage 164]. Removed by Effective Majority [passage 165].<\/li><li><b>Art. 186 &amp; 187:<\/b> Salaries charged on State Consolidated Fund [passage 167, passage 198]; separate secretarial staff [passage 168].<\/li><\/ul><h4>C. Conduct of Business, Quorum &amp; Disqualifications (Articles 188–193)<\/h4><ul><li><b>Article 188 &amp; 189:<\/b> Oath before Governor [passage 170]. Voting by simple majority; Presiding officer has casting vote only [passage 170]. Quorum is 10 members or 1/10th of total strength, whichever is greater [passage 170].<\/li><li><b>Article 190:<\/b> Vacation of Seats<\/li><ul><li>Double membership prohibited [passage 171]. Absence for 60 consecutive days without permission allows seat to be declared vacant [passage 172].<\/li><\/ul><li><b>Article 191:<\/b> Disqualifications for Membership<\/li><ul><li><b>Grounds:<\/b> Office of profit, unsound mind, undischarged insolvent, non-citizen, disqualified under Parliamentary law, or disqualified under the Tenth Schedule (Anti-defection) [passage 174, passage 175].<\/li><\/ul><li><b>Article 192:<\/b> Decision on Disqualifications<\/li><ul><li>Disqualifications under Art. 191(1) are referred to the Governor, who MUST obtain Election Commission opinion and ACT ACCORDINGLY [passage 176, passage 177]. (Defection under 191(2) is decided by the Presiding Officer) [passage 175, passage 530].<\/li><\/ul><li><b>Article 193:<\/b> Penalty of Rs. 500 per day for sitting/voting before oath or when disqualified [passage 178].<\/li><\/ul><h4>D. Privileges &amp; Asymmetric Legislative Procedure (Articles 194–201)<\/h4><ul><li><b>Article 194:<\/b> Powers, Privileges &amp; Immunities<\/li><ul><li>Freedom of speech in Legislature; absolute court immunity for anything said or any vote given inside the House [passage 179].<\/li><\/ul><li><b>Articles 196–199:<\/b> Passage of Bills &amp; Legislative Council&#x27;s Limited Power<\/li><ul><li><b>Ordinary Bills (Art. 197):<\/b> 1. No Joint Sitting in State Legislature! 2. In first instance, Legislative Council can delay an Ordinary Bill passed by Assembly for 3 months [passage 185]. 3. If Assembly passes it again, Council can delay for 1 additional month [passage 186]. 4. Maximum delay capacity of Legislative Council = 4 MONTHS TOTAL [passage 185, passage 186].<\/li><li><b>Money Bills (Arts. 198–199):<\/b> Council cannot originate Money Bills; can delay for a maximum of 14 DAYS ONLY [passage 187, passage 189]. Speaker&#x27;s certificate is final [passage 192].<\/li><\/ul><li><b>Article 200:<\/b> Governor&#x27;s Options on Bills<\/li><ul><li>When a Bill is presented, Governor can [passage 193]: 1. Give Assent [passage 193]; or 2. Withhold Assent [passage 193]; or 3. Return Bill (if non-Money Bill) for reconsideration; if passed again, Governor must assent [passage 193]; or 4. Reserve Bill for Consideration of the President [passage 193].<\/li><li><b>Mandatory Reservation Proviso:<\/b> Governor MUST reserve any Bill that derogates from High Court powers, endangering its constitutional position [passage 194].<\/li><\/ul><li><b>Article 201:<\/b> Bills Reserved for Presidential Consideration<\/li><ul><li>President may assent or withhold assent [passage 194]. If returned with a message, Legislature must reconsider within 6 months [passage 195]. If passed again, President is NOT bound to give assent [passage 195, passage 196].<\/li><\/ul><\/ul><h4>E. Financial Procedure &amp; General Provisions (Articles 202–212)<\/h4><ul><li><b>Art. 202–207:<\/b> Annual Financial Statement (Budget) [passage 196]; Charged expenditure non-votable [passage 199]; Demands for Grants in Assembly only on Governor&#x27;s recommendation [passage 200]; Appropriation Bills [passage 200]; Votes on Account [passage 204].<\/li><li><b>Art. 210–212:<\/b> Official language (State official language, Hindi, English, or mother tongue) [passage 209]; Courts prohibited from inquiring into legislative procedural irregularities [passage 213].<\/li><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> Legislative Council Nomination Fields (Art. 171(5)) — &quot;L-S-A-C-S&quot; 🚨<\/p><ul><li>Literature, Science, Art, Co-operative Movement, Social Service [passage 154].<\/li><li><b>UPSC Trap:<\/b> &quot;Co-operative Movement&quot; exists in Article 171(5) for Legislative Council [passage 154], but was NOT present in Article 80(3) for Rajya Sabha! [passage 70].<\/li><\/ul><p><b>Mnemonic 2:<\/b> Legislative Council Electoral Ratios — &quot;1/3 - 1/12 - 1/12 - 1/3 - 1/6&quot;<\/p><ul><li>1/3 Local Bodies [passage 152]<\/li><li>1/12 Graduates [passage 152]<\/li><li>1/12 Teachers [passage 153]<\/li><li>1/3 MLAs [passage 153]<\/li><li>1/6 Governor&#x27;s Nominees [passage 153].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 169:<\/b> சட்டமேலவை உருவாக்கம்/நீக்கம் (Council Creation/Abolition) → சட்டமன்ற சிறப்பு தீர்மானம் + நாடாளுமன்ற சாதாரண சட்டம் [passage 147, passage 148].<\/li><li><b>Art. 197:<\/b> சட்டமேலவையின் காலதாமத அதிகாரம் (4 Months Delay Limit) → கூட்டுத் தொடர் இல்லை! மேலவை அதிகபட்சமாக 4 மாதங்கள் மட்டுமே தாமதிக்க முடியும் [passage 185, passage 186].<\/li><li><b>Art. 200:<\/b> ஆளுநரின் ஒப்புதல் (Assent &amp; Reservation) → குடியரசுத் தலைவரின் பரிசீலனைக்கு மசோதாவை ஒதுக்குதல் [passage 193].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>PARLIAMENT vs. STATE LEGISLATURE BICAMERAL MATRIX<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                   │<\/pre><pre>PARLIAMENT (RS vs. LS)                       STATE LEGISLATURE (LC vs. LA)<\/pre><p>✦ Rajya Sabha is a permanent Constitutional chamber ✦ Legislative Council can be CREATED or ABOLISHED<\/p><pre>✦ Equality in Ordinary Bills              ✦ Council has NO equal power (Dilatory chamber)\n✦ Disagreement leads to JOINT SITTING (Art. 108)         ✦ NO JOINT SITTING! Assembly<\/pre><p>overrides Council<\/p><pre>✦ RS can delay ordinary bill for 6 months          ✦ LC can delay ordinary bill for 3+1 = 4<\/pre><p>months max<\/p><ul><li>The Assent Loophole Paradox (Art. 200 vs. Art. 201):<\/li><ul><li>If Governor returns a Bill under Art. 200 and Assembly re-passes it, Governor must assent [passage 193].<\/li><li>However, if Governor reserves the Bill under Art. 200 for the President, and the President returns it under Art. 201, even if the State Legislature re-passes it within 6 months, the President is NOT bound to assent [passage 195, passage 196].<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Assent Delays &amp; Executive Pocket Veto:<\/h4><ul><ul><li>State of Punjab v. Principal Secretary to Governor (2023): The Supreme Court held that the Governor cannot sitting indefinitely on Bills presented under Article 200 [passage 193]. If the Governor withholds assent, he must return the Bill to the Legislative Assembly for reconsideration. The Governor cannot use a &quot;pocket veto&quot; to paralyze democratic law-making. 2. Defection &amp; Privilege Jurisdiction:<\/li><li>Kihoto Hollohan (1992) &amp; Sita Soren (2024): Confirmed that legislative immunity under Article 194(2) [passage 179] does not protect against bribery charges, and Speaker decisions under Tenth Schedule are subject to judicial review [passage 530, passage 571].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Role of Legislative Councils, Governor&#x27;s Assent Dynamics, and State Legislative Privileges<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Chapter III of Part VI (Articles 168–212) defines the legislative architecture of States [passage 9, passage 144]. Designed with single-chamber dominance—where Legislative Councils serve as advisory dilatory chambers rather than equal revisory bodies—and governed by Article 200 (Assent mechanics) [passage 185, passage 186, passage 193], this framework balances popular mandate with constitutional checks.&quot;<\/p><ul><li>Mains Body Arguments (Assent Timeframes &amp; Bicameral Utility):<\/li><ul><li><b>Judicial Limits on Assent Delays:<\/b> Cite State of Punjab (2023) to argue that the first proviso to Article 200 [passage 193] obligates Governors to act expeditiously rather than frustrating the Assembly&#x27;s mandate.<\/li><li><b>Asymmetric Power Structure:<\/b> Explain why the Constitution intentionally omitted Joint Sittings (Art. 108) [passage 94] at the state level, placing absolute legislative authority in the Legislative Assembly under Article 197 [passage 185, passage 186].<\/li><li><b>Privilege vs Rule of Law:<\/b> Reference Sita Soren (2024) to analyze Article 194(2) [passage 179] immunity boundaries.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, establishing clear timeframes for Gubernatorial assent under Article 200 [passage 193] and rationalizing the creation of Legislative Councils under Article 169 [passage 147] will strengthen state legislative governance.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact maximum period a Legislative Council can delay an Ordinary Bill passed by the Legislative Assembly for the first time and second time? [passage 185, passage 186] 2. Reverse Recall: Under which Article can Parliament create or abolish a Legislative Council if the State Assembly passes a resolution by special majority? [passage 147] 3. UPSC Prelims Analytical Trap: Is a law passed by Parliament under Article 169 to create a Legislative Council deemed an amendment of the Constitution under Article 368? [passage 148] 4. Mains Applied Question: Discuss the significance of the Supreme Court&#x27;s ruling in State of Punjab v. Principal Secretary to Governor (2023) regarding the Governor&#x27;s powers under Article 200 [passage 193].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Executive (Articles 152–167) (Lesson 14)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part VI: State Legislature (Articles 168–212) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part VI: Legislative Power of Governor &amp; High Courts (Articles 213–237) (Up<\/span><\/label><p>Next)<\/p>"}], "nchk": 10}, {"n": 16, "title": "Part VI — Ordinance Power of Governor, High Courts & Subordinate", "secs": [{"t": "Articles", "h": "<h4>Courts (Articles 213–237)<\/h4><p>Chapters IV, V, and VI of Part VI (Articles 213–237) define the extraordinary legislative authority of the Governor, the state judiciary apex (High Courts), and the district-level judicial administration (Subordinate Courts) [passage 8, passage 9, passage 11].<\/p><h4>ORDINANCE POWER, HIGH COURTS &amp; SUBORDINATE COURTS (ARTICLES 213–237)<\/h4><h4>│<\/h4><h4>┌─────────────────────────┬───────────┴───────────┬─────────<\/h4><p>────────────────┐<\/p><pre>│ Governor&#x27;s Ordinance │ High Court Org. &amp;          │ Writ &amp; Supervisory     │<\/pre><pre>│ Power (Art. 213)       │ Appointments         │ Jurisdiction       │<\/pre><pre>│                 │ (Arts. 214–225)      │ (Arts. 226–232)       │<\/pre><p>└─────────────────────────┴───────────────────────┴───────── ────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Subordinate Courts │<\/h4><pre>│ &amp; Control         │<\/pre><pre>│ (Arts. 233–237)       │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. Governor&#x27;s Legislative Power (Article 213)<\/h4><ul><li><b>Article 213:<\/b> Power of Governor to Promulgate Ordinances During Recess of Legislature<\/li><ul><li><b>Art. 213(1) Recess Condition:<\/b> Promulgated ONLY when the Legislative Assembly is not in session (or when either House is not in session in a bicameral State) and the Governor is satisfied that immediate action is necessary [passage 134].<\/li><li>Three Mandatory Presidential Instruction Clauses [Art. 213(1) Proviso]: The Governor SHALL NOT promulgate an Ordinance without prior instructions from the President if [passage 135]: 1. A Bill containing the same provisions would under this Constitution have required the previous sanction of the President for its introduction into the Legislature [passage 135]; OR 2. The Governor would have deemed it necessary to reserve a Bill containing the same provisions for the consideration of the President [passage 135]; OR 3. An Act of the State Legislature containing the same provisions would under this Constitution have been invalid unless reserved for and received the assent of the President (e.g., Article 254(2) Concurrent List repugnancy) [passage 135, passage 137].<\/li><li><b>Art. 213(2) Parliamentary Expiry:<\/b> Ordinance has the same force as an Act of the State Legislature [passage 135, passage 136]. Must be laid before the Assembly (and Council, if any) and ceases to operate at the expiration of SIX WEEKS from the reassembly of the Legislature [passage 136].<\/li><li><b>Maximum Life of State Ordinance:<\/b> 6 months + 6 weeks [passage 62, passage 136].<\/li><\/ul><\/ul><h4>B. The High Courts in the States (Articles 214–231)<\/h4><ul><li><b>Article 214 &amp; 215:<\/b> High Court Establishment &amp; Court of Record<\/li><ul><li><b>Art. 214:<\/b> There shall be a High Court for each State [passage 138].<\/li><li><b>Art. 215 Court of Record:<\/b> Every High Court shall be a court of record with power to punish for contempt of itself [passage 138, passage 139].<\/li><\/ul><li><b>Article 216 &amp; 217:<\/b> Constitution, Appointments &amp; Qualifications<\/li><ul><li><b>Art. 216 Composition:<\/b> Consists of a Chief Justice and such other Judges as the President may from time to time deem necessary to appoint [passage 139]. (Note: No fixed statutory cap on High Court judges; decided by President).<\/li><li><b>Art. 217(1) Appointment &amp; Retirement Age:<\/b> Every High Court Judge is appointed by the President by warrant under hand and seal after consultation with the CJI, Governor of the State, and Chief Justice of the concerned High Court [passage 139, passage 140]. Holds office until attaining the age of 62 years (increased from 60 to 62 by 15th CAA, 1963) [passage 139, passage 141].<\/li><li>Removal Ground &amp; Procedure [Art. 217(1)(b) ↔ Art. 218]: Removed ONLY by the President after an address by both Houses of Parliament passed by a special majority under Article 124(4) on grounds of &quot;proved misbehaviour or incapacity&quot; [passage 141, passage 144].<\/li><li><b>Art. 217(2) Qualifications:<\/b> Must be a citizen of India AND [passage 141]:<\/li><ul><li>Has for at least 10 years held a judicial office in the territory of India [passage 141]; OR<\/li><li>Has for at least 10 years been an Advocate of a High Court [passage<\/li><\/ul><\/ul><\/ul><h4>🚨<\/h4><p>141].<\/p><ul><ul><ul><li><b>UPSC Trap:<\/b> There is NO &quot;Distinguished Jurist&quot; category for High Court appointment! That provision exists exclusively under Article 124(3)(c) for the Supreme Court [passage 73, passage 141].<\/li><\/ul><\/ul><li><b>Articles 219–225:<\/b> Conduct, Transfer &amp; Jurisdiction<\/li><ul><li><b>Art. 219 Oath:<\/b> Administered by the Governor of the State according to the Third Schedule [passage 144, passage 473].<\/li><li><b>Art. 220 Post-Retirement Practice Restriction:<\/b> A permanent High Court Judge cannot plead or act in any court or authority in India EXCEPT the Supreme Court and OTHER High Courts [passage 145]. (Prohibited from practicing in the same High Court where permanent Judge).<\/li><li><b>Art. 222 Transfer of Judges:<\/b> President transfers a Judge from one High Court to another after consultation with CJI [passage 147].<\/li><li><b>Art. 224 Additional &amp; Acting Judges:<\/b> Appointed by President for a temporary period not exceeding 2 years due to arrears of work [passage 148, passage 150]. Must retire on reaching 62 years [passage 139].<\/li><\/ul><li><b>Articles 226 &amp; 227:<\/b> Writ &amp; Supervisory Jurisdictions<\/li><ul><li><b>Article 226:<\/b> Power of High Courts to Issue Certain Writs<\/li><ul><li>Power to issue directions, orders, or writs (Habeas Corpus, Mandamus, Prohibition, Quo Warranto, Certiorari) throughout its territorial jurisdiction [passage 155]: 1. For the enforcement of Fundamental Rights (Part III) [passage 155]; AND 2. &quot;For any other purpose&quot; (ordinary legal rights) [passage 155].<\/li><li><b>Territorial Nexus Clause [Art. 226(2)]:<\/b> High Court can issue writs even if the seat of Government/authority is outside its territory, provided the cause of action arises wholly or in part within its territorial limits [passage 155, passage 158].<\/li><\/ul><li><b>Article 227:<\/b> Power of Superintendence over All Courts<\/li><ul><li>High Court has superintendence over all courts and tribunals throughout its territory [passage 159].<\/li><li><b>Exclusion Clause [Art. 227(4)]:<\/b> Does NOT extend to courts or tribunals constituted under laws relating to the Armed Forces [passage 162].<\/li><\/ul><\/ul><li><b>Articles 228–231:<\/b> Administrative Expenses &amp; Common High Courts<\/li><ul><li><b>Art. 229:<\/b> Administrative expenses of High Court charged upon the Consolidated Fund of the State [passage 167].<\/li><li><b>Art. 231 Common High Court:<\/b> Parliament may by law establish a common High Court for two or more States or States and Union Territories [passage 169]. (e.g., Punjab and Haryana High Court, Bombay High Court, Gauhati High Court).<\/li><\/ul><\/ul><h4>C. Subordinate Courts Architecture (Articles 233–237)<\/h4><ul><li><b>Article 233:<\/b> Appointment of District Judges<\/li><ul><li><b>Art. 233(1):<\/b> Appointments, posting, and promotion of District Judges in any State are made by the Governor of the State IN CONSULTATION WITH THE HIGH COURT [passage 171, passage 172].<\/li><li>Art. 233(2) Direct Bar Recruitment Qualifications: A person not already in judicial service is eligible ONLY IF: 1. Has been for not less than 7 years an Advocate or Pleader [passage 172]; AND 2. Is recommended by the High Court for appointment [passage 172].<\/li><\/ul><li><b>Article 234:<\/b> Recruitment of Judicial Officers (Other than District Judges)<\/li><ul><li>Appointments to the State Judicial Service (Civil Judge Junior Division / Judicial Magistrates) are made by the Governor in accordance with rules made after consultation with the State Public Service Commission (SPSC) AND the High Court [passage 175].<\/li><\/ul><li><b>Article 235:<\/b> Control over Subordinate Courts<\/li><ul><li><b>High Court Vested Authority:<\/b> The administrative control over District Courts and courts subordinate thereto—including posting, promotion, grant of leave, and disciplinary control—is STRICTLY VESTED IN THE HIGH COURT [passage 176].<\/li><\/ul><li><b>Article 236 &amp; 237:<\/b> Definitions &amp; Magisterial Application<\/li><ul><li><b>Art. 236:<\/b> Defines &quot;District Judge&quot; to include City Civil Court Judge, Additional District Judge, Sessions Judge, Additional/Assistant Sessions Judge, Chief Presidency Magistrate, Chief Judge Small Cause Court [passage 177].<\/li><li><b>Art. 237:<\/b> Governor can by public notification apply Subordinate Court provisions to specific classes of Magistrates in the State [passage 178].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> Art. 213 Proviso (When Governor Needs Presidential Instructions for Ordinance)<\/p><ul><li><b>Mnemonic:<\/b> &quot;S-R-I&quot; (&quot;Sanction, Reserve, Invalid&quot;)<\/li><ul><li>Sanction needed for Bill introduction [passage 135]<\/li><li>Reserve Bill necessary for President [passage 135]<\/li><li>Invalid without Presidential Assent [passage 135]<\/li><\/ul><\/ul><h4>Mnemonic 2: Subordinate Court Appointments (Articles 233 to 235)<\/h4><ul><li><b>Mnemonic:<\/b> &quot;D-G-C&quot;<\/li><ul><li><b>233:<\/b> District Judges (Governor + High Court) [passage 171, passage 172]<\/li><li><b>234:<\/b> General Judicial Recruitment (Governor + SPSC + High Court) [passage 175]<\/li><li><b>235:<\/b> Control vested strictly in High Court [passage 176]<\/li><\/ul><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 213:<\/b> ஆளுநரின் அவசரச் சட்டம் (Governor Ordinance) → குடியரசுத் தலைவரின் முன் உத்தரவு தேவைப்படும் சூழ்நிலைகள் [passage 134, passage 135].<\/li><li><b>Art. 226 vs 32:<\/b> நீதிப்பேராணை அதிகாரம் (Writ Scope) → Art. 226 அடிப்படை உரிமைகள் + இதர சட்ட உரிமைகளுக்குப் பொருந்தும் (உயர்நீதிமன்றத்தின் பரந்த அதிகாரம்) [passage 155].<\/li><li><b>Art. 233:<\/b> மாவட்ட நீதிபதி நியமனம் (District Judge Appointment) → ஆளுநர் + உயர்நீதிமன்ற ஆலோசனை (7 ஆண்டுகள் வழக்கறிஞர் அனுபவம்) [passage 171, passage 172].<\/li><li><b>Art. 235:<\/b> கீ ழமை நீதிமன்றங்கள் கட்டுப்பாடு (Control over Subordinate Courts) → உயர்நீதிமன்றத்தின் முழுமையான நிர்வாகக் கட்டுப்பாடு [passage 176].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>ARTICLE 32 (SUPREME COURT) vs. ARTICLE 226 (HIGH COURT)<\/h4><h4>│<\/h4><h4>┌──────────────────────────────────────────┴────────────────<\/h4><p>──────────────────────────┐<\/p><pre>│                                                       │<\/pre><pre>SUPREME COURT (ART. 32)                           HIGH COURT (ART. 226)<\/pre><pre>✦ Guaranteed Fundamental Right inside Part III        ✦ Constitutional Remedy outside Part III<\/pre><pre>✦ Enforces Fundamental Rights ONLY                   ✦ Enforces Fundamental Rights + &quot;Any<\/pre><p>Other Purpose&quot;<\/p><pre>✦ Narrower Subject Scope                        ✦ Broader Subject Scope<\/pre><pre>✦ Wider Territorial Reach (Pan-India)            ✦ Restricted Territorial Jurisdiction (State/UT)<\/pre><pre>✦ Cannot refuse to entertain a FR petition          ✦ Discretionary remedy; can direct to<\/pre><p>alternative remedy<\/p><h4>Subordinate Court Appointment Matrix (Articles 233 vs. 234 vs. 235)<\/h4><pre>Category         District Judges         Other Judicial Posts     Administrative Control\n(Art. 233) [passage       (Art. 234) [passage     (Art. 235) [passage 176]\n171]                      175]\nAppointing        Governor [passage      Governor [passage         Vested in High Court\nAuthority         171]                   175]                      [passage 176]<\/pre><pre>Consultative      High Court Only        SPSC + High Court         High Court Exclusively\nBody              [passage 172]          [passage 175]             [passage 176]<\/pre><pre>Direct Bar        7 Years Practice as    Competitive Exam          Promotable Cadre\nExperience        Advocate [passage      (SPSC/HC) [passage        [passage 176]\n172]                   175]<\/pre>"}, {"t": "Cases", "h": "<p>1. Re-promulgation of Ordinances as Unconstitutional Fraud (Article 213):<\/p><ul><ul><li><b>D.C. Wadhwa v. State of Bihar (1987):<\/b> The SC declared that re-promulgating Ordinances repeatedly without passing them through the State Legislature is a fraud on the Constitution.<\/li><li><b>Krishna Kumar Singh v. State of Bihar (2017):<\/b> A 7-judge bench ruled that the Governor&#x27;s satisfaction under Article 213 [passage 134] is subject to judicial review. An ordinance must be placed before the Legislature; failure to do so invalidates any actions taken under it.<\/li><\/ul><\/ul><p>2. Writ Jurisdiction as Basic Structure (Article 226 &amp; 227):<\/p><ul><ul><li><b>L. Chandra Kumar v. Union of India (1997):<\/b> Declared the writ and supervisory powers of High Courts under Articles 226 and 227 [passage 155, passage 159] an integral part of the Basic Structure. Statutory provisions excluding HC judicial review over Administrative Tribunals were struck down.<\/li><\/ul><\/ul><p>3. Judicial Independence in Subordinate Courts (Articles 233–235):<\/p><ul><ul><li>All India Judges&#x27; Association v. Union of India (1992 &amp; 2002): The Supreme Court affirmed that the judicial service is a single integrated framework. Control over subordinate judiciary under Article 235 [passage 176] belongs exclusively to High Courts to prevent executive interference by State Governments.<\/li><li>Chandramouleshwar Prasad v. Patna High Court (1969): Held that &quot;consultation&quot; under Article 233 [passage 172] means meaningful consultation; the Governor cannot appoint a District Judge independently without HC recommendation.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> High Court Writ Jurisdiction, Judicial Control over Subordinate Courts, and Ordinance Raj in States<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part VI (Articles 213–237) designs the state judicial and extraordinary legislative apparatus [passage 8, passage 9, passage 11]. Anchored in the Governor&#x27;s ordinance power (Article 213) [passage 134], High Court writ jurisdiction (Article 226) [passage 155], and High Court administrative control over subordinate judiciary (Article 235) [passage 176], this constitutional framework balances state accountability with judicial independence.&quot;<\/p><ul><li>Mains Body Arguments (Writ Primacy &amp; Subordinate Separation):<\/li><ul><li><b>Broader Scope of Article 226:<\/b> Contrast Article 32 with Article 226 [passage 155], citing L. Chandra Kumar (1997) to demonstrate that High Courts function as constitutional courts of first instance for legal and fundamental rights.<\/li><li><b>Ordinance Restraints:<\/b> Reference Krishna Kumar Singh (2017) to show that Article 213 [passage 134] cannot bypass the primary legislative mandate of State Assemblies.<\/li><li><b>Insulating District Judiciary:<\/b> Highlight Article 235 [passage 176] and Chandramouleshwar Prasad (1969), showing how High Court control over postings and promotions preserves trial court independence from executive dominance.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, strictly adhering to Article 235 supervisory norms [passage 176] and establishing clear judicial review checks against re-promulgated ordinances under Article 213 [passage 134] remain vital for state rule of law.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What are the three specific conditions under the proviso to Article 213(1) where the Governor MUST obtain Presidential instructions before promulgating an Ordinance? [passage 135] 2. Reverse Recall: Which Article explicitly vests the administrative control over District Courts and subordinate courts strictly in the High Court? [passage 176] 3. UPSC Prelims Analytical Trap: Does the qualification clause for High Court Judges under Article 217(2) [passage 141] include the &quot;distinguished jurist&quot; criterion? How does this compare to Supreme Court Judge qualifications under Article 124(3)? [passage 73, passage 141] 4. Mains Applied Question: Compare the writ jurisdiction of High Courts under Article 226 [passage 155] with the writ jurisdiction of the Supreme Court under Article 32 [passage 54, passage 159], highlighting key differences in subject-matter scope and discretion.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Executive (Articles 152–167) (Lesson 14)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part VI: State Legislature (Articles 168–212) (Lesson 15)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part VI: Ordinance Power, High Courts &amp; Subordinate Courts (Articles 213–237)<\/span><\/label><p>(Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives (Articles<\/span><\/label><p>239–243ZT) (Up Next)<\/p>"}], "nchk": 11}, {"n": 17, "title": "Parts VIII, IX, IXA & IXB — Union Territories & Local Self-Government", "secs": [{"t": "Articles", "h": "<h4>Architecture (Articles 239–243ZT)<\/h4><p>Parts VIII, IX, IXA, and IXB structure the governance of Union Territories and democratic decentralization down to grassroots rural and urban self-governments and co-operatives [passage 6, passage 7, passage 9, passage 10, passage 11].<\/p><h4>LOCAL SELF-GOVERNMENT &amp; UT ARCHITECTURE (ARTICLES 239–243ZT)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬─────────────┴──────────────┬<\/h4><p>─────────────────────────────┐<\/p><pre>│ Union Territories (UTs)    │ Part IX: Panchayats       │ Part IXA: Municipalities │<\/pre><pre>│ (Arts. 239–241)           │ (Arts. 243–243O)       │ (Arts. 243P–243ZG)        │<\/pre><h4>└─────────────────────────────┴────────────────────────────┴<\/h4><p>─────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ Part IXB:       │<\/pre><pre>│ Co-operative        │<\/pre><pre>│ Societies       │<\/pre><h4>│ (Arts. 243ZH–243ZT) │<\/h4><h4>└─────────────────────┘<\/h4><h4>A. Part VIII: The Union Territories (Articles 239–241)<\/h4><ul><li><b>Article 239:<\/b> Administration of Union Territories<\/li><ul><li><b>Art. 239(1):<\/b> Every UT shall be administered by the President, acting through an Administrator appointed by him with such designation as he specifies (e.g., Lieutenant Governor, Administrator) [passage 124].<\/li><li><b>Art. 239(2) Dual Charge:<\/b> President may appoint the Governor of an adjoining State as Administrator of a UT; such Governor acts independently of his State Council of Ministers [passage 125].<\/li><\/ul><li><b>Article 239A:<\/b> Creation of Local Legislatures / Council of Ministers<\/li><ul><li>Inserted by 14th CAA, 1962; empowers Parliament by law to create a Legislature (elected or partly nominated), Council of Ministers, or both for Puducherry (and extended to J&amp;K UT via J&amp;K Reorganisation Act, 2019) [passage 125, passage 127].<\/li><li><b>Non-Art. 368 Exemption [Art. 239A(2)]:<\/b> Such law shall not be deemed an amendment of the Constitution for the purposes of Article 368 [passage 126].<\/li><\/ul><li><b>Article 239AA:<\/b> Special Provisions with Respect to Delhi (NCT of Delhi)<\/li><ul><li>Inserted by 69th CAA, 1991 [passage 127, passage 130]; designated UT of Delhi as the National Capital Territory (NCT) of Delhi, with Administrator designated as Lieutenant Governor (LG) [passage 127].<\/li><li><b>Legislative Assembly [Art. 239AA(2)]:<\/b> Direct election; power to make laws on State List and Concurrent List matters [passage 128, passage 131].<\/li><li>3 Excluded State List Entries [Art. 239AA(3)(a)]: Legislative Assembly of Delhi CANNOT make laws regarding [passage 131]: 1. Entry 1: Public Order [passage 131] 2. Entry 2: Police [passage 131] 3. Entry 18: Land [passage 131] (And Entry 64, 65, 66 in so far as they relate to Entries 1, 2, and 18) [passage 131].<\/li><li><b>10% Cabinet Ceiling [Art. 239AA(4) Proviso]:<\/b> Council of Ministers shall consist of not more than 10% of total members in the Legislative Assembly (Max 7 Ministers for 70 seats).<\/li><li><b>LG Reference Proviso [Art. 239AA(4)]:<\/b> In case of a difference of opinion between LG and Ministers on any matter, LG shall refer it to the President for decision and act according to that decision [passage 132].<\/li><\/ul><li><b>Article 239AB:<\/b> Failure of Constitutional Machinery in NCT Delhi<\/li><ul><li>President can suspend operation of Article 239AA during constitutional failure [passage 133, passage 134].<\/li><\/ul><li><b>Article 239B &amp; 240:<\/b> Ordinance &amp; Presidential Regulation Powers<\/li><ul><li><b>Art. 239B:<\/b> Administrator of Puducherry/Delhi can promulgate Ordinances during recess with prior instructions from the President [passage 135].<\/li><li><b>Art. 240:<\/b> President can make regulations for peace, progress, and good government of Andaman &amp; Nicobar, Lakshadweep, Dadra &amp; Nagar Haveli and Daman &amp; Diu, and Puducherry (when assembly is dissolved/suspended) [passage 139, passage 141, passage 142]. Regulations can amend/repeal Parliamentary Acts [passage 143].<\/li><\/ul><li><b>Article 241:<\/b> High Courts for Union Territories<\/li><ul><li>Parliament may by law constitute a High Court for a UT or extend an existing High Court&#x27;s jurisdiction over it [passage 143, passage 144]. (Delhi is the only UT with its own independent High Court since 1966).<\/li><\/ul><\/ul><h4>B. Part IX: The Panchayats (Articles 243–243O) — 73rd CAA, 1992<\/h4><p>Added the Eleventh Schedule containing 29 functional subjects [passage 30, passage 145, passage 539].<\/p><ul><li><b>Article 243 &amp; 243A:<\/b> Definitions &amp; Gram Sabha<\/li><ul><li><b>Gram Sabha (Art. 243A):<\/b> Primary body consisting of all persons registered in the electoral rolls of a village; exercises powers provided by State law [passage 146, passage 147].<\/li><\/ul><li><b>Article 243B &amp; 243C:<\/b> 3-Tier Structure &amp; Composition<\/li><ul><li><b>3-Tier Mandate:<\/b> Panchayats at Village, Intermediate, and District levels [passage 148].<\/li><li><b>20-Lakh Population Exemption [Art. 243B(2)]:<\/b> States with a population not exceeding 20 lakhs need NOT constitute intermediate-level Panchayats [passage 148].<\/li><li><b>Electoral Mode [Art. 243C]:<\/b> All seats filled by direct election [passage 150]. Chairperson at intermediate and district levels is elected indirectly by and from elected members [passage 152, passage 153]. Chairperson at village level is elected as State law provides [passage 152].<\/li><\/ul><li><b>Article 243D:<\/b> Reservation of Seats<\/li><ul><li><b>SC/ST Reservation:<\/b> Reserved in proportion to population ratio; rotated among constituencies [passage 153].<\/li><li>Mandatory 1/3rd Women Reservation [Art. 243D(3) &amp; (4)]: Not less than 1/3rd of total direct seats AND 1/3rd of Chairperson offices at all levels MUST be reserved for women [passage 154, passage 156].<\/li><li>(83rd CAA, 2000 added Art. 243D(3A) exempting Arunachal Pradesh from SC reservations) [passage 172].<\/li><\/ul><li><b>Article 243E:<\/b> 5-Year Term &amp; Re-election<\/li><ul><li><b>5-Year Duration [Art. 243E(1)]:<\/b> Elections must be completed before term expiry or within 6 months of dissolution [passage 157, passage 158].<\/li><li><b>Remainder Term Rule [Art. 243E(4)]:<\/b> A Panchayat reconstituted upon early dissolution serves ONLY for the remainder of the 5-year period [passage 159]. If remaining period is less than 6 months, no election is required [passage 158].<\/li><\/ul><li><b>Article 243F:<\/b> Disqualifications (21-Year Minimum Age)<\/li><ul><li><b>Age criterion:<\/b> No person disqualified for being under 25 years if attained 21 years of age [passage 159, passage 160].<\/li><\/ul><li><b>Articles 243G–243K:<\/b> Devolution, Finance &amp; Election Commission<\/li><ul><li><b>Art. 243G:<\/b> Powers over 11th Schedule (29 subjects) for economic development &amp; social justice [passage 161, passage 162].<\/li><li><b>Art. 243I:<\/b> State Finance Commission (SFC): Constituted every 5 years by the Governor to review financial position [passage 163, passage 164].<\/li><li><b>Art. 243K:<\/b> State Election Commission (SEC): State Election Commissioner appointed by Governor [passage 167]. Removed ONLY in like manner and on like grounds as a High Court Judge [passage 168].<\/li><\/ul><li><b>Article 243M:<\/b> Exempted Areas &amp; PESA Act, 1996<\/li><ul><li>Part IX does NOT apply to Scheduled Areas (Art. 244(1)), Tribal Areas (Art. 244(2)), States of Nagaland, Meghalaya, and Mizoram, hill areas of Manipur, and Darjeeling Gorkha Hill Council [passage 170, passage 171]. (Parliament extended Part IX to Scheduled Areas via PESA Act, 1996) [passage 173].<\/li><\/ul><li><b>Article 243O:<\/b> Bar to Court Interference<\/li><ul><li>Delimitation/allotment of seats cannot be questioned in court; elections challenged only via election petition [passage 174, passage 175].<\/li><\/ul><\/ul><p><b>C. Part IXA:<\/b> The Municipalities (Articles 243P–243ZG) — 74th CAA, 1992<\/p><p>Added the Twelfth Schedule containing 18 functional subjects [passage 30, passage 175, passage 540].<\/p><ul><li><b>Article 243Q:<\/b> 3-Tier Urban Bodies<\/li><ul><li><b>Nagar Panchayat:<\/b> For transitional areas (rural to urban) [passage 177].<\/li><li><b>Municipal Council:<\/b> For smaller urban areas [passage 177].<\/li><li><b>Municipal Corporation:<\/b> For larger urban areas [passage 177].<\/li><li><b>Industrial Township Exemption:<\/b> Governor may exempt urban areas managed by industrial establishments [passage 178].<\/li><\/ul><li><b>Article 243S:<\/b> Wards Committees<\/li><ul><li>Mandatory for Municipalities having a population of 3 lakhs or more [passage 181].<\/li><\/ul><li><b>Article 243T, 243U, 243V:<\/b> SC/ST/Women (1/3rd) reservation [passage 183, passage 184]; 5-year duration [passage 186]; 21-year minimum age [passage 188].<\/li><li><b>Article 243ZD &amp; 243ZE:<\/b> Planning Committees (DPC &amp; MPC)<\/li><ul><li>District Planning Committee (DPC - Art. 243ZD): Consolidates rural/urban plans [passage 198]. Not less than 4/5ths members shall be elected by/from elected members of District Panchayat and Municipalities in rural/urban population ratio [passage 199].<\/li><li>Metropolitan Planning Committee (MPC - Art. 243ZE): For Metropolitan areas (population 10 lakhs+) [passage 176, passage 201]. Not less than 2/3rds members shall be elected by/from elected members of Municipalities and Chairpersons of Panchayats in urban/rural population ratio [passage 202].<\/li><\/ul><\/ul><p><b>D. Part IXB:<\/b> The Co-operative Societies (Articles 243ZH–243ZT) — 97th CAA, 2011<\/p><ul><li><b>Art. 243ZJ Board Size &amp; Term:<\/b> Maximum 21 Directors [passage 211]; 5-year term [passage 212]; mandatory reservation of 1 seat for SC/ST and 2 seats for Women [passage 211]; max 2 co-opted experts (non-voting in elections) [passage 212, passage 213].<\/li><li><b>Art. 243ZL Board Supersession Ceiling:<\/b> Board cannot be superseded/suspended for more than 6 months (1 year for banking co-operatives) [passage 215, passage 217]. No supersession if no government shareholding/financial assistance [passage 216].<\/li><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Core Sequence of Part IX Panchayats (243A to 243O)<\/h4><ul><li><b>243A:<\/b> Assembly of Village (Gram Sabha) [passage 147]<\/li><li><b>243B:<\/b> Building Tiers (3 Tiers / 20 Lakh exception) [passage 148]<\/li><li><b>243C:<\/b> Composition &amp; Direct Elections [passage 148, passage 150]<\/li><li><b>243D:<\/b> Diversity Reservation (1/3rd Women) [passage 153, passage 154]<\/li><li><b>243E:<\/b> Expiration &amp; 5-year Duration [passage 157]<\/li><li><b>243F:<\/b> Fails / Disqualifications (21 years age) [passage 159, passage 160]<\/li><li><b>243G:<\/b> Grant of 29 Functions (11th Schedule) [passage 161, passage 162]<\/li><li><b>243I:<\/b> Income Review (State Finance Commission) [passage 163, passage 164]<\/li><li><b>243K:<\/b> Kommissioner for Elections (SEC removed like HC Judge) [passage 167, passage 168]<\/li><li><b>243M:<\/b> Missing Areas (Exempted States/Schedules) [passage 170]<\/li><li><b>243O:<\/b> Ouster of Courts [passage 174]<\/li><\/ul><h4>Mnemonic 2: DPC vs MPC Member Election Fractions<\/h4><ul><li>District Planning Committee (243ZD) → 4/5ths elected [passage 199].<\/li><li>Metropolitan Planning Committee (243ZE) → 2/3rds elected [passage 202].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 239AA:<\/b> டெல்லி சிறப்பு அந்தஸ்து (NCT Delhi) → பொது அமைதி, காவல்துறை, நிலம் தவிர்க்கப்பட்ட துறைகள் [passage 127, passage 131].<\/li><li><b>Art. 243D &amp; 243T:<\/b> பெண்கள் இடஒதுக்கீ டு (1/3rd Minimum) → குறைந்தபட்சம் 33% இடஒதுக்கீ டு [passage 154, passage 184].<\/li><li><b>Art. 243K &amp; 243ZA:<\/b> மாநில தேர்தல் ஆணையம் (SEC) → உயர்நீதிமன்ற நீதிபதி போன்றே பதவி நீக்கம் செய்யப்பட வேண்டும் [passage 167, passage 168, passage 195].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>LOCAL BODY PLANNING COMMITTEES COMPARISON MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                  │<\/pre><pre>DISTRICT PLANNING COMMITTEE (DPC - Art. 243ZD)               METROPOLITAN PLANNING<\/pre><p>COMMITTEE (MPC - Art. 243ZE)<\/p><pre>✦ Jurisdiction: Entire District            ✦ Jurisdiction: Metropolitan Area (Pop 10 Lakhs+)<\/pre><pre>✦ Elected Member Ratio: Min 4/5ths                ✦ Elected Member Ratio: Min 2/3rds<\/pre><pre>✦ Ratio Basis: Rural vs. Urban population ratio     ✦ Ratio Basis: Urban vs. Rural population<\/pre><p>ratio<\/p><p>The 97th CAA Judicial Partial Invalidation (Union of India v. Rajendra N. Shah, 2021)<\/p><ul><li><b>Background:<\/b> The 97th CAA 2011 inserted Part IXB for Co-operative Societies [passage 48, passage 210].<\/li><li><b>Supreme Court Ruling:<\/b> The SC held that Co-operative Societies is a State List subject (Entry 32) [passage 523]. Inserting Part IXB affected state legislative autonomy without obtaining ratification by at least half the State Legislatures under the Article 368(2) proviso [passage 355].<\/li><li><b>Outcome:<\/b> Struck down Part IXB in so far as it applies to State Co-operative Societies, but UPHELD Part IXB for Multi-State Co-operative Societies and UTs [passage 208, passage 225, passage 226].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. NCT Delhi Governance &amp; Executive Power (Article 239AA):<\/h4><ul><ul><li>State (NCT of Delhi) v. Union of India (2018 - 5-Judge Bench):<\/li><ul><li>Held that LG is bound by the aid and advice of the Council of Ministers on all subjects except the 3 excluded entries (Public Order, Police, Land) [passage 131].<\/li><li>Reference to President under Art. 239AA(4) proviso [passage 132] is an exception, not the rule.<\/li><\/ul><li>Government of NCT of Delhi v. Union of India (2023 - 5-Judge Bench):<\/li><ul><li>Affirmed that civil services (Entry 41 State List) fall under the legislative and executive control of the elected Delhi Government. 2. State Election Commission Independence (Article 243K):<\/li><\/ul><li>K. Kishan Rao v. State of A.P. (1998) &amp; Kishan Singh Tomar (2006):<\/li><ul><li>SC held that state governments must strictly comply with SEC directives for conducting local body elections before the 5-year term expires.<\/li><\/ul><li>N. Ramesh Kumar v. State of Andhra Pradesh (2021):<\/li><ul><li>SC struck down a State Ordinance attempting to cut short the tenure of the State Election Commissioner, reaffirming that under Art. 243K(2) [passage 168], SEC removal security is identical to a High Court Judge. 3. Reservation Limits in Panchayats (Article 243D(6) / 243T(6)):<\/li><\/ul><li>K. Krishna Murthy v. Union of India (2010) &amp; Vikas Kishanrao Gawali (2021):<\/li><ul><li>Established the &quot;Triple Test&quot; for OBC reservation in local bodies: 1. Set up a dedicated Commission to conduct empirical inquiry into backwardness. 2. Specify proportion of reservation required per local body. 3. Ensure overall reservation for SC/ST/OBC does NOT exceed 50% ceiling.<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Democratic Decentralization, State Election Commission Autonomy, and NCT Delhi Federal Framework<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Parts VIII, IX, IXA, and IXB structure municipal and rural local self-governance alongside specialized UT administration [passage 124, passage 145, passage 175, passage 207]. Anchored in the 73rd and 74th Constitutional Amendment Acts (1992), this framework operationalizes Directive Principle Article 40 (Gram Panchayats) [passage 2, passage 46], converting local bodies into constitutionally protected third-tier institutions.&quot;<\/p><ul><li>Mains Body Arguments (Functional Devolution &amp; Executive Autonomy):<\/li><ul><li>Triple-F Challenge (Funds, Functions, Functionaries): Analyze how incomplete devolution under Articles 243G (11th Schedule) [passage 161, passage 162] and 243W (12th Schedule) [passage 189, passage 190] weakens local self-government.<\/li><li><b>SEC Protection:<\/b> Cite N. Ramesh Kumar (2021) to demonstrate why Article 243K(2) [passage 168] judicial removal security is vital to insulate SECs from state executive interference.<\/li><li><b>Asymmetric Federalism in Delhi:<\/b> Reference NCT Delhi Judgments (2018 &amp; 2023) to explain the balance between national capital security under Article 239AA(3) [passage 131] and elected cabinet accountability under Article 239AA(4) [passage 131, passage 132].<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, enforcing the 50% reservation ceiling (Vikas Gawali 2021) and granting financial autonomy through State Finance Commissions under Article 243I [passage 163] will fulfill the promise of grassroots democracy.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What are the three specific State List subjects explicitly excluded from the legislative competence of the NCT of Delhi Legislative Assembly under Article 239AA(3)(a)? [passage 131] 2. Reverse Recall: Under which Article is a State Election Commissioner granted removal security identical to a High Court Judge? [passage 168] 3. UPSC Prelims Analytical Trap: Compare the elected member fraction requirements for the District Planning Committee (Article 243ZD) [passage 199] and the Metropolitan Planning Committee (Article 243ZE) [passage 202]. What are their exact minimum ratios? 4. Mains Applied Question: Discuss the constitutional significance of the Supreme Court&#x27;s ruling in Union of India v. Rajendra N. Shah (2021) regarding the 97th Constitutional Amendment Act and Part IXB [passage 48, passage 210].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled &amp; Tribal Areas (Articles 244–244A) (Up Next)<\/span><\/label>"}], "nchk": 10}, {"n": 18, "title": "Part X & Fifth/Sixth Schedules — Scheduled and Tribal Areas", "secs": [{"t": "Articles", "h": "<h4>Governance (Articles 244–244A)<\/h4><p>Part X of the Constitution contains Articles 244 and 244A, establishing a distinct administrative and constitutional framework for Scheduled Areas and Tribal Areas in India [passage 10, passage 118].<\/p><p>Because tribal communities possess unique socio-cultural heritages and customary legal traditions, the Constitution exempts these areas from general state administrative mechanisms and subjects them to special protective governance regimes under the Fifth Schedule and Sixth Schedule [passage 118, passage 273, passage 285].<\/p><h4>PART X: SCHEDULED &amp; TRIBAL AREAS (ARTICLES 244 &amp; 244A)<\/h4><h4>│<\/h4><h4>┌────────────────────────────────────────┴──────────────────<\/h4><p>──────────────────────┐<\/p><pre>│                                                     │<\/pre><pre>ARTICLE 244(1): FIFTH SCHEDULE                        ARTICLE 244(2): SIXTH SCHEDULE<\/pre><pre>✦ Scheduled Areas &amp; Scheduled Tribes                 ✦ Tribal Areas in 4 States ONLY:<\/pre><pre>in States OTHER than AMTM                        Assam, Meghalaya, Tripura, Mizoram (AMTM)<\/pre><pre>✦ Executive/Advisory Administration                ✦ Autonomous District/Regional Councils\n(Tribes Advisory Council)                  (Legislative, Executive, Judicial &amp; Financial)<\/pre><h4>────────────────────────────────────────────────────────────<\/h4><p>───────────────────────<\/p><h4>ARTICLE 244A: AUTONOMOUS STATE PROVISION<\/h4><p>✦ Parliamentary power to create an Autonomous State within Assam comprising tribal areas<\/p><p>✦ Created via 22nd CAA, 1969 (Basis for historical creation of Meghalaya)<\/p><h4>A. Fundamental Architecture (Articles 244 &amp; 244A)<\/h4><ul><li><b>Article 244:<\/b> Administration of Scheduled Areas and Tribal Areas<\/li><ul><li><b>Art. 244(1) Fifth Schedule Mandate:<\/b> The provisions of the Fifth Schedule apply to the administration and control of Scheduled Areas and Scheduled Tribes in any State other than the States of Assam, Meghalaya, Tripura, and Mizoram [passage 118].<\/li><li><b>Art. 244(2) Sixth Schedule Mandate:<\/b> The provisions of the Sixth Schedule apply to the administration of the tribal areas in the four North-Eastern States of Assam, Meghalaya, Tripura, and Mizoram (AMTM) [passage 118, passage 285].<\/li><\/ul><li><b>Article 244A:<\/b> Formation of an Autonomous State in Assam<\/li><ul><li>Inserted by the 22nd Constitutional Amendment Act, 1969 [passage 120].<\/li><li>Empowers Parliament by law to form within the State of Assam an autonomous State comprising (wholly or in part) all or any of the tribal areas specified in Part I of the Sixth Schedule table [passage 118], and create for it: 1. A body (elected or partly nominated) to function as a Legislature for the autonomous State [passage 119]; OR 2. A Council of Ministers [passage 119]; or both [passage 119].<\/li><li>Constitutional Amendment Exemption [Art. 244A(4)]: Any such parliamentary law shall NOT be deemed to be an amendment of the Constitution for the purposes of Article 368 [passage 122].<\/li><\/ul><\/ul><h4>B. The Fifth Schedule Architecture (Article 244(1))<\/h4><p>Applies to 10 States currently containing Scheduled Areas (Andhra Pradesh, Telangana, Odisha, Jharkhand, Chhattisgarh, Madhya Pradesh, Rajasthan, Gujarat, Maharashtra, and Himachal Pradesh).<\/p><ul><li>Part A — Executive Reach &amp; Presidential Oversight (Paras 1–3):<\/li><ul><li><b>Para 2:<\/b> Executive power of the State extends to the Scheduled Areas therein [passage 274].<\/li><li><b>Para 3:<\/b> The Governor of each State having Scheduled Areas shall annually, or whenever required by the President, make a report to the President regarding the administration of Scheduled Areas [passage 274]. The Union executive power extends to giving directions to the State as to administration [passage 274].<\/li><\/ul><li>Part B — Tribes Advisory Council &amp; Regulation-Making Power (Paras 4–5):<\/li><ul><li><b>Para 4 Tribes Advisory Council (TAC):<\/b><\/li><ul><li>Established in each State having Scheduled Areas (and if the President directs, also in any State having Scheduled Tribes but not Scheduled Areas) [passage 275].<\/li><li>Consists of not more than 20 members, of whom as nearly as may be 3/4ths shall be representatives of Scheduled Tribes in the State Legislative Assembly [passage 275].<\/li><li><b>Duties:<\/b> Advise on welfare and advancement of STs referred by the Governor [passage 277].<\/li><\/ul><li><b>Para 5 Laws Applicable to Scheduled Areas:<\/b><\/li><ul><li><b>Power to Exclude/Modify Laws [Para 5(1)]:<\/b> Governor may by public notification direct that any Act of Parliament or State Legislature shall NOT apply to a Scheduled Area, or shall apply subject to specified exceptions/modifications (can be retrospective) [passage 278].<\/li><li>Governor&#x27;s Regulation-Making Power [Para 5(2)]: Governor may make regulations for peace and good government [passage 279], including: 1. Prohibiting/restricting transfer of land by or among ST members [passage 279]. 2. Regulating allotment of land to ST members [passage 279]. 3. Regulating money-lending to ST members [passage 280].<\/li><li><b>Repeal/Amendment Power [Para 5(3)]:<\/b> Governor regulations may repeal/amend any Act of Parliament or State Legislature [passage 280].<\/li><li><b>Presidential Assent Pre-requisite [Para 5(4)]:<\/b> All regulations made by Governor must be submitted forthwith to the President and shall have no effect until assented to by the President [passage 281].<\/li><li><b>Mandatory TAC Consultation [Para 5(5)]:<\/b> No regulation shall be made unless the Governor has consulted the Tribes Advisory Council [passage 281].<\/li><\/ul><\/ul><li>Part C &amp; D — Declaration of Scheduled Areas &amp; Non-Art. 368 Amendment (Paras 6–7):<\/li><ul><li><b>Para 6:<\/b> Scheduled Areas declared by order of the President [passage 281]. President may alter boundaries, increase areas, or rescind orders after consultation with the Governor [passage 282, passage 284].<\/li><li><b>Para 7 Amendment of Schedule:<\/b> Parliament may by law amend the Fifth Schedule; such law shall NOT be deemed an amendment of the Constitution for the purposes of Article 368 [passage 285].<\/li><\/ul><\/ul><h4>C. The Sixth Schedule Architecture (Article 244(2) &amp; 275(1))<\/h4><p>Applies exclusively to Tribal Areas in Assam, Meghalaya, Tripura, and Mizoram (AMTM) [passage 118, passage 285].<\/p><ul><li><b>Para 1 Autonomous Districts &amp; Regions:<\/b><\/li><ul><li>Tribal areas in AMTM are constituted as Autonomous Districts [passage 285]. If different STs inhabit a district, the Governor may divide it into Autonomous Regions [passage 286].<\/li><li>Governor can alter boundaries, create new districts, or unite districts [passage 286].<\/li><\/ul><li>Para 2 Autonomous District Councils (ADCs) &amp; Regional Councils (ARCs):<\/li><ul><li>Every Autonomous District has an Autonomous District Council (ADC) [passage 291, passage 292].<\/li><li><b>Composition Standard:<\/b> Consists of not more than 30 members [passage 285], of whom not more than 4 are nominated by the Governor and the rest are elected on adult suffrage [passage 285].<\/li><li><b>Tenure:<\/b> Elected members hold office for 5 years; nominated members hold office during the pleasure of the Governor [passage 285].<\/li><li>(Exception — Bodoland Territorial Council in Assam): BTC consists of up to 46 members (40 elected + 6 nominated) [passage 289].<\/li><\/ul><li><b>Para 3 Legislative Powers of ADCs/ARCs:<\/b><\/li><ul><li>Power to make laws regarding allotment/use of land [passage 305], forest management (other than reserved forests) [passage 306], jhum/shifting cultivation [passage 306], village/town police and administration [passage 306, passage 307], inheritance of property, marriage and divorce, and social customs [passage 307].<\/li><li><b>Governor&#x27;s Assent Mandatory:<\/b> All laws made by ADCs/ARCs must be submitted to the Governor and shall have no effect until assented to by him [passage 308].<\/li><\/ul><li><b>Para 4 &amp; 5 Administration of Justice:<\/b><\/li><ul><li>ADCs/ARCs can constitute Village Councils and Courts to try suits/cases where all parties belong to Scheduled Tribes [passage 308].<\/li><li>High Court and Supreme Court retain overall appellate and constitutional jurisdiction [passage 309].<\/li><\/ul><li><b>Para 8–10 Financial &amp; Taxation Powers:<\/b><\/li><ul><li>Power to assess and collect land revenue and levy taxes on professions, trades, animals, vehicles, boats, and entry of goods [passage 321, passage 322].<\/li><li><b>Mineral Royalty Share [Para 9]:<\/b> Share of royalties from mineral prospecting/extraction licenses granted by the State Government made over to the ADC [passage 322]. Disputes determined by Governor in discretion [passage 323].<\/li><\/ul><li>Para 12 Application of Parliamentary &amp; State Laws:<\/li><ul><li><b>In Meghalaya, Tripura, and Mizoram:<\/b> Acts of Parliament or State Legislature do NOT automatically apply to autonomous districts; applying them with modifications requires notification by the President (for Central Acts) or Governor / ADC (for State Acts) [passage 331, passage 334, passage 336, passage 337, passage 339].<\/li><\/ul><li><b>Para 21 Non-Art. 368 Amendment:<\/b> Amendments to the Sixth Schedule by Parliament shall NOT be deemed an amendment under Article 368 [passage 368, passage 369].<\/li><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: The Sixth Schedule AMTM States<\/h4><ul><li><b>Mnemonic:<\/b> &quot;A-M-T-M&quot;<\/li><ul><li>Assam [passage 118, passage 285]<\/li><li>Meghalaya [passage 118, passage 285]<\/li><li>Tripura [passage 118, passage 285]<\/li><\/ul><\/ul><h4>🚨<\/h4><ul><ul><li>Mizoram [passage 118, passage 285]<\/li><\/ul><li><b>UPSC Trap:<\/b> Manipur and Nagaland are NOT in the Sixth Schedule! Manipur has Special Provisions under Article 371C [passage 212] and Nagaland under Article 371A [passage 204].<\/li><\/ul><h4>Mnemonic 2: Fifth Schedule vs Sixth Schedule Core Comparison<\/h4><ul><li><b>Fifth Schedule:<\/b> Tribes Advisory Council (TAC = Advisory Body of 20) [passage 275].<\/li><li><b>Sixth Schedule:<\/b> Autonomous District Council (ADC = Mini-Legislature/Executive/Judicial Body of 30) [passage 285, passage 292, passage 305, passage 308].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 244(1) - 5th Schedule:<\/b> ஐந்தாவது அட்டவணை (Scheduled Areas) → பழங்குடியினர் ஆலோசனைக் குழு (TAC - 20 உறுப்பினர்கள்) [passage 275].<\/li><li><b>Art. 244(2) - 6th Schedule:<\/b> ஆறாவது அட்டவணை (AMTM States) → தன்னாட்சி மாவட்டக் குழுக்கள் (ADC - 30 உறுப்பினர்கள்) [passage 285].<\/li><li><b>Art. 244A:<\/b> அசாமில் தன்னாட்சி மாநிலம் (Autonomous State in Assam) → 22-வது அரசியலமைப்பு திருத்தம், 1969 [passage 118, passage 120].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>FIFTH SCHEDULE vs. SIXTH SCHEDULE ARCHITECTURAL MATRIX<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                    │<\/pre><pre>FIFTH SCHEDULE (Art. 244(1))                     SIXTH SCHEDULE (Art. 244(2))<\/pre><pre>✦ Applies to 10 States (excluding AMTM)            ✦ Applies to 4 AMTM States ONLY<\/pre><pre>✦ Advisory Body: Tribes Advisory Council (TAC)       ✦ Legislative Body: Autonomous District<\/pre><p>Council (ADC)<\/p><pre>✦ Governor can exclude/modify Parliament/State Acts       ✦ Laws made by ADCs require<\/pre><p>Governor/President Assent<\/p><pre>✦ Focus: Land protection, money-lending regulation       ✦ Focus: Local self-government &amp;<\/pre><p>customary tribal law<\/p><pre>✦ PESA Act 1996 extends Part IX Panchayats here           ✦ Exempted from Part IX / IXA (Art.<\/pre><p>243M / 243ZC)<\/p><p>1. Article 244 ↔ PESA Act, 1996 (Panchayats Extension to Scheduled Areas)<\/p><ul><li>Under Article 243M(1), Part IX Panchayats do not apply directly to Fifth Schedule areas [passage 101].<\/li><li>However, under Article 243M(4)(b), Parliament enacted the Provisions of the Panchayats (Extension to the Scheduled Areas) Act, 1996 (PESA) [passage 104], extending village self-government to Fifth Schedule areas while upholding traditional customary law and vesting absolute authority over minor forest produce, land alienation prevention, and project approvals in the Gram Sabha.<\/li><\/ul><h4>2. Financial Backing: Article 275(1) Grants-in-Aid<\/h4><ul><li>Under the first proviso to Article 275(1), mandatory grants-in-aid are paid out of the Consolidated Fund of India to States to meet development scheme costs approved by GoI for promoting ST welfare or raising Scheduled Area administration levels [passage 131, passage 132].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Land Transfer Prohibition in Scheduled Areas (Fifth Schedule):<\/h4><ul><ul><li><b>Samatha v. State of Andhra Pradesh (1997):<\/b><\/li><ul><li>A landmark 3-judge bench held that under Para 5(2) of the Fifth Schedule [passage 279], &quot;person&quot; includes the State Government.<\/li><li>The State Government cannot lease out tribal land in Scheduled Areas to non-tribals or private mining corporations. All government land, forest land, and private tribal land in Scheduled Areas must remain under tribal control. 2. Tribal Customary Law &amp; Mineral Ownership:<\/li><\/ul><li>Amarendra Pratap Singh v. Tej Bahadur Prajapati (2004):<\/li><ul><li>The Supreme Court affirmed that non-tribal encroachments and land transfers in Scheduled Areas through fraudulent means violate Para 5(2)(a) [passage 279] and are void ab initio.<\/li><\/ul><li>Thressiamma Jacob v. Geologist, Dept. of Mining (2013):<\/li><ul><li>SC confirmed that sub-soil mineral rights generally belong to the landowner unless explicitly restricted by statute. 3. Gram Sabha Absolute Authority under PESA Act, 1996:<\/li><\/ul><li>Orissa Mining Corporation v. Ministry of Environment &amp; Forests (2013) [Niyamgiri Case]:<\/li><ul><li>SC upheld the constitutional primacy of the Gram Sabha under PESA 1996 read with Article 244(1) [passage 118] and the Forest Rights Act (FRA) 2006. Ruled that bauxite mining on Niyamgiri hills could proceed only if approved by the local Dongria Kondh Gram Sabhas.<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Tribal Autonomous Governance, Fifth vs Sixth Schedule, and PESA Implementation<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part X (Articles 244 &amp; 244A) establishes a dual constitutional mechanism for tribal governance, differentiating between the administrative oversight of the Fifth Schedule and the legislative autonomy of the Sixth Schedule [passage 118, passage 273, passage 285]. Operationalized through presidential declarations and custom-protective bodies, this framework safeguards indigenous rights.&quot;<\/p><ul><li>Mains Body Arguments (Autonomous Autonomy &amp; Land Rights):<\/li><ul><li><b>Judicial Safeguard against Land Alienation:<\/b> Cite Samatha (1997) to explain how Fifth Schedule Para 5(2) [passage 279] shields tribal land from private corporate exploitation.<\/li><li><b>Grassroots Democracy via PESA:<\/b> Reference Orissa Mining Corp (2013) to analyze how PESA 1996 operationalizes Article 244(1) [passage 118] by making the Gram Sabha the ultimate authority over natural resources.<\/li><li><b>Sixth Schedule ADC Reforms:<\/b> Analyze how ADCs under Sixth Schedule Para 2 [passage 285] provide deep local self-government, while highlighting challenges of financial dependence on State Cabinets.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, implementing PESA in letter and spirit and granting financial autonomy to Autonomous District Councils under Article 275(1) [passage 131] will ensure democratic tribal development without cultural alienation.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact maximum membership of a Tribes Advisory Council (TAC) under Paragraph 4 of the Fifth Schedule, and what proportion must be ST MLAs? [passage 275] 2. Reverse Recall: Which Constitutional Amendment Act inserted Article 244A enabling Parliament to create an Autonomous State within Assam? [passage 120] 3. UPSC Prelims Analytical Trap: Are laws passed by Parliament under Paragraph 7 of the Fifth Schedule [passage 285] or Paragraph 21 of the Sixth Schedule [passage 369] deemed amendments of the Constitution under Article 368? 4. Mains Applied Question: Compare the legislative and administrative authority of an Autonomous District Council (Sixth Schedule) [passage 285, passage 292, passage 305, passage 308] with a Tribes Advisory Council (Fifth Schedule) [passage 275, passage 277].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations — Legislative &amp; Administrative (Articles<\/span><\/label><p>245–263) (Up Next)<\/p>"}], "nchk": 11}, {"n": 19, "title": "Part XI — Centre-State Relations: Legislative & Administrative", "secs": [{"t": "Articles", "h": "<h4>(Articles 245–263)<\/h4><p>Part XI of the Constitution structures the federal mechanism of India into two core operational domains: Chapter I (Legislative Relations: Articles 245–255) and Chapter II (Administrative Relations: Articles 256–263) [passage 20, passage 22, passage 245, passage 258].<\/p><h4>PART XI: CENTRE-STATE RELATIONS (ARTICLES 245–263)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────┴─────────────────────<\/h4><p>────────────────┐<\/p><pre>│                                               │<\/pre><pre>CHAPTER I: LEGISLATIVE RELATIONS                            CHAPTER II: ADMINISTRATIVE<\/pre><p>RELATIONS<\/p><pre>(Articles 245–255)                            (Articles 256–263)\n✦ Territorial Limits &amp; List Distribution (Arts. 245–246)    ✦ Mandatory Compliance &amp;<\/pre><p>Directions (Arts. 256–257)<\/p><pre>✦ GST Legislative Mechanism (Art. 246A)                    ✦ Entrustment of Functions (Arts.<\/pre><p>258–258A)<\/p><pre>✦ Residuary Powers in Parliament (Art. 248)                ✦ Full Faith &amp; Credit Clause (Art.<\/pre><p>261)<\/p><pre>✦ 5 Extraordinary Bridges to State List (Arts. 249, 250, 252,   ✦ Inter-State Water Dispute Bar<\/pre><p>(Art. 262)<\/p><pre>253, 356/357)                                  ✦ Inter-State Council Mechanism (Art. 263)<\/pre><h4>✦ Repugnancy Rule &amp; Presidential Assent Proviso (Art. 254)<\/h4><h4>A. Chapter I: Legislative Relations (Articles 245–255)<\/h4><ul><li><b>Article 245:<\/b> Extent of Laws Made by Parliament and by State Legislatures<\/li><ul><li><b>Art. 245(1) Territorial Scope:<\/b> Parliament may make laws for the whole or any part of the territory of India; a State Legislature may make laws for the whole or any part of the State [passage 245].<\/li><li><b>Art. 245(2) Extra-Territorial Operation:<\/b> No law made by Parliament shall be deemed invalid on the ground that it has extra-territorial operation [passage 246]. (Note: State Legislatures cannot enact extra-territorial laws unless a territorial nexus exists).<\/li><\/ul><li><b>Article 246:<\/b> Subject-Matter Distribution of Laws (Seventh Schedule)<\/li><ul><li><b>Art. 246(1) Union List Primacy:<\/b> Parliament has exclusive power to make laws regarding matters in List I (Union List) in the Seventh Schedule, &quot;notwithstanding anything in clauses (2) and (3)&quot; [passage 246, passage 491].<\/li><li><b>Art. 246(2) Concurrent List:<\/b> Parliament and State Legislatures have power to make laws regarding matters in List III (Concurrent List), subject to clause (1) [passage 246, passage 507].<\/li><li><b>Art. 246(3) State List Exclusivity:<\/b> Subject to clauses (1) and (2), the State Legislature has exclusive power to make laws for the State regarding matters in List II (State List) [passage 247, passage 502].<\/li><li><b>Art. 246(4) UT Legislative Power:<\/b> Parliament has power to make laws regarding any matter in the State List for any part of India not included in a State (i.e., Union Territories) [passage 247].<\/li><\/ul><li><b>Article 246A:<\/b> Special Provision with Respect to Goods and Services Tax (GST)<\/li><ul><li>Inserted by the 101st Constitutional Amendment Act, 2016 [passage 247, passage 248].<\/li><li><b>Art. 246A(1) Simultaneous Power:<\/b> Parliament and State Legislatures have simultaneous power to make laws with respect to goods and services tax imposed by the Union or by such State [passage 247].<\/li><li>Art. 246A(2) Inter-State Trade Exclusive Power: Parliament has exclusive power to make GST laws where supply of goods/services takes place in the course of inter-State trade or commerce [passage 249].<\/li><\/ul><li><b>Article 247:<\/b> Power of Parliament to Establish Additional Courts<\/li><ul><li>Parliament may by law establish additional courts for better administration of laws made by Parliament under the Union List [passage 249].<\/li><\/ul><li><b>Article 248:<\/b> Residuary Powers of Legislation<\/li><ul><li><b>Art. 248(1):<\/b> Subject to Article 246A, Parliament has exclusive power to make any law regarding any matter not enumerated in the Concurrent List or State List [passage 250].<\/li><li><b>Art. 248(2):<\/b> Residuary power explicitly includes the power of imposing residuary taxes [passage 250].<\/li><\/ul><\/ul><p>Five Constitutional Circumstances Where Parliament Legisdates on State List Items:<\/p><p><b>1. Article 249:<\/b> Legislation in National Interest (Rajya Sabha Resolution)<\/p><ul><ul><li>If the Council of States (Rajya Sabha) declares by resolution supported by not less than 2/3rds of members present and voting that it is necessary/expedient in the national interest, Parliament can legislate on a State List matter [passage 250].<\/li><li>Resolution remains in force for a period not exceeding 1 year at a time [passage 250]. Laws made under Art. 249 cease to have effect 6 months after the resolution ceases to operate [passage 250, passage 252]. 2. Article 250: Legislation During Proclamation of Emergency<\/li><li>While a Proclamation of Emergency (Article 352) is in operation, Parliament has power to make laws for the whole or any part of India regarding any State List matter [passage 251].<\/li><li>Laws cease to have effect 6 months after the Proclamation ceases to operate [passage 252]. 3. Article 252: Legislation by Consent of Two or More States<\/li><li>If Legislatures of two or more States pass resolutions requesting Parliament to regulate a State List matter, Parliament can pass an Act for those States [passage 253].<\/li><li>Applies to consenting States and any other State adopting it afterwards by resolution [passage 253].<\/li><li><b>Amendment / Repeal Rule [Art. 252(2)]:<\/b> Such Parliamentary Act can be amended or repealed ONLY by an Act of Parliament, NOT by State Legislatures [passage 254]. 4. Article 253: Legislation to Give Effect to International Agreements<\/li><li>Parliament has power to make any law for India to implement any treaty, agreement, or convention with any other country or decision made at international conferences [passage 254]. 5. President&#x27;s Rule (Article 356) / Ar
