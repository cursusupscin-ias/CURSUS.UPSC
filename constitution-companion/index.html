Privileges           ✦ Art. 194 — State Legislative Privileges<\/pre><p>A. Disqualification Decision Authority Paradox (Art. 103 vs. Tenth Schedule)<\/p><ul><li><b>General Disqualification (Art. 102(1)):<\/b> Decided by the President based on the binding opinion of the Election Commission under Article 103 [passage 123, passage 125].<\/li><li><b>Defection Disqualification (Art. 102(2)):<\/b> Decided by the Speaker / Chairman of the respective House under Paragraph 6 of the Tenth Schedule [passage 123, passage 530].<\/li><\/ul><p>B. Article 105(2) vs. Article 19(1)(a) (Absolute Immunity vs. Restricted Freedom)<\/p><ul><li>An ordinary citizen&#x27;s freedom of speech (Art. 19(1)(a)) is subject to 8 reasonable restrictions under Art. 19(2) [passage 50, passage 51, passage 52].<\/li><li>An MP&#x27;s freedom of speech inside Parliament under Article 105(1) &amp; (2) is absolute in court proceedings—no court can entertain civil or criminal liability for anything said or voted inside the House [passage 126]. It is restricted only by parliamentary procedure (Art. 118) [passage 144] and Article 121 (prohibiting discussion on conduct of SC/HC Judges) [passage 147].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Bribery Immunity Overruled (Article 105(2)):<\/h4><ul><ul><li><b>P.V. Narasimha Rao v. State (1998):<\/b> A 3-2 majority held that MPs who took bribes and voted in Parliament were immune from criminal prosecution under Article 105(2) [passage 126].<\/li><li><b>Sita Soren v. Union of India (March 2024):<\/b> A 7-judge Constitution Bench unanimously overruled P.V. Narasimha Rao (1998). The SC held that bribery is complete the moment money is accepted; immunity under Article 105(2) / Article 194(2) [passage 126, passage 219] does not protect MPs/MLAs from criminal prosecution for taking bribes to vote or speak in the House. 2. Judicial Review of Speaker&#x27;s Removal Orders (Tenth Schedule / Article 102(2)):<\/li><li><b>Kioto Hollohan v. Zachillhu (1992):<\/b> Upheld the Speaker&#x27;s power under the 10th Schedule [passage 530] but struck down Para 7 (court exclusion) [passage 532, passage 533]. Held that the Speaker&#x27;s decision is subject to judicial review by High Courts and Supreme Court for perversity, mala fides, or violation of constitutional mandate. 3. Expulsion of Members &amp; Privilege Jurisdiction:<\/li><li>Raja Ram Pal v. Hon&#x27;ble Speaker, Lok Sabha (2007) [Cash-for-Query Case]: Upheld Parliament&#x27;s power to expel its members under Article 105(3) [passage 127] for misconduct. Reaffirmed that while courts will not judge parliamentary procedural irregularities (Art. 122) [passage 148], total unconstitutionality or illegality of expulsion orders remains open to judicial review. 4. Speaker&#x27;s Resignation Verification (Article 101(3)(b)):<\/li><li><b>33rd CAA, 1974 Impact:<\/b> Added the proviso to Article 101(3)(b) [passage 119] to prevent forced resignations of MPs/MLAs during political agitations by empowering the Presiding Officer to conduct an inquiry and reject non-voluntary resignations [passage 119].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Parliamentary Productivity, Speaker&#x27;s Impartiality, and Parliamentary Privileges<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Articles 79–106 design the legislative heart of Indian democracy, structuring parliamentary composition, accountability, and freedom of debate [passage 8, passage 93, passage 126]. Anchored in Articles 100 (quorum and voting) [passage 115, passage 116], 102/103 (disqualification regime) [passage 122, passage 123, passage 125], and 105 (parliamentary privileges) [passage 126], this constitutional machinery balances legislative autonomy with public accountability.&quot;<\/p><ul><li>Mains Body Arguments (Speaker Neutrality, Privileges &amp; Criminal Immunity):<\/li><ul><li><b>Evolving Privilege Jurisprudence:<\/b> Cite Sita Soren (2024) to explain how the Supreme Court harmonized Article 105(2) [passage 126] with the rule of law (Art. 14) [passage 49], confirming that constitutional immunity cannot be shielded to validate corruption.<\/li><li><b>Disqualification Mechanics:<\/b> Contrast Article 103 (President&#x27;s decision on EC advice for Art. 102(1)) [passage 123, passage 125] with Tenth Schedule Para 6 (Speaker&#x27;s power) [passage 530], referencing Kioto Hollohan (1992) to advocate for an independent tribunal for anti-defection cases (K. Meghachandra Singh case).<\/li><li><b>Continuity of Office:<\/b> Highlight Article 94 Proviso [passage 111] ensuring seamless transition of the Speaker&#x27;s office during Lok Sabha dissolution.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, refining parliamentary privileges under Article 105 [passage 126] and enforcing strict neutral standards on the Presiding Officers are essential steps to restore Parliament as the supreme forum of deliberation.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What are the four specific fields listed under Article 80(3) for Presidential nominations to the Rajya Sabha? [passage 94, passage 95] 2. Reverse Recall: Under which Article is the President required to obtain the opinion of the Election Commission and act according to such opinion when deciding disqualification questions under Article 102(1)? [passage 123, passage 125] 3. UPSC Prelims Analytical Trap: Does a Union Minister who is a member of the Rajya Sabha have the right to speak and take part in the proceedings of the Lok Sabha under Article 88? [passage 104] Can they vote in the Lok Sabha? [passage 104] 4. Mains Applied Question: Discuss the constitutional significance of the Supreme Court&#x27;s 7-judge bench ruling in Sita Soren v. Union of India (2024) regarding parliamentary immunity under Article 105(2) [passage 126].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; Vice-President (Articles 52–73) (Lesson<\/span><\/label><p>8)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part V: Council of Ministers, PM &amp; AG (Articles 74–78) (Lesson 9)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part V: Parliament — Composition, Officers, Conduct &amp; Privileges (Articles<\/span><\/label><p>79–106) (Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part V: Legislative Procedure &amp; Financial Business (Articles 107–123) (Up Next)<\/span><\/label>"}], "nchk": 10}, {"n": 11, "title": "Part V — Legislative Procedure, Financial Business, Money", "secs": [{"t": "Articles", "h": "<h4>Bills &amp; Ordinance Power (Articles<\/h4><p>107–123)<\/p><p>Chapters II and III of Part V (Articles 107–123) lay down the legislative process of Parliament, the budgetary mechanism, procedural safeguards, and the extraordinary legislative power of the President [passage 11, passage 12, passage 13].<\/p><h4>LEGISLATIVE PROCEDURE, FINANCIAL BUSINESS &amp; ORDINANCE POWER<\/h4><p>(ARTICLES 107–123) │<\/p><h4>┌─────────────────────────────┬───────────────┴─────────────<\/h4><p>──┬─────────────────────────────┐<\/p><pre>│ Ordinary Legislative Path │ Money Bills &amp; Assent       │ Financial Business      │<\/pre><pre>│ (Arts. 107 &amp; 108)      │ (Arts. 109, 110, 111)     │ (Arts. 112–117)       │<\/pre><h4>└─────────────────────────────┴─────────────────────────────<\/h4><p>──┴─────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ General Rules &amp;   │<\/pre><pre>│ Ordinance Power       │<\/pre><pre>│ (Arts. 118–123)   │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. Ordinary Legislative Procedure &amp; Lapsing Rules (Articles 107–108)<\/h4><ul><li><b>Article 107:<\/b> Provisions as to Introduction and Passing of Bills<\/li><ul><li><b>Art. 107(1):<\/b> An ordinary Bill may originate in either House of Parliament [passage 92].<\/li><li><b>Art. 107(2):<\/b> A Bill is not deemed passed unless agreed to by both Houses, either without amendment or with mutually agreed amendments [passage 93].<\/li><li><b>Art. 107(3):<\/b> Prorogation Non-Lapse Rule: A Bill pending in Parliament shall NOT lapse by reason of the prorogation of the Houses [passage 93].<\/li><li><b>Art. 107(4):<\/b> Pending RS Bill Rule: A Bill pending in the Rajya Sabha which has not been passed by the Lok Sabha shall NOT lapse on a dissolution of the Lok Sabha [passage 93].<\/li><li><b>Art. 107(5):<\/b> Dissolution Lapsing Rule: A Bill pending in the Lok Sabha, or passed by the Lok Sabha and pending in the Rajya Sabha, shall lapse on a dissolution of the Lok Sabha [passage 94].<\/li><\/ul><li><b>Article 108:<\/b> Joint Sitting of Both Houses in Certain Cases<\/li><ul><li><b>Trigger Grounds [Art. 108(1)]:<\/b> If after a Bill passed by one House is transmitted to the other House [passage 94]: 1. The Bill is rejected by the other House [passage 94]; or 2. The Houses have finally disagreed as to the amendments [passage 94]; or 3. More than 6 months elapse from the date of reception without being passed [passage 95].<\/li><li><b>Mechanism:<\/b> President notifies intention to summon a Joint Sitting [passage 95].<\/li><li><b>Exceptions:<\/b> Joint sitting applies ONLY to Ordinary Bills and Financial Bills. It is EXPLICITLY PROHIBITED for Money Bills (Art. 109) [passage 95, passage 99] and Constitutional Amendment Bills (Art. 368) [passage 385].<\/li><li><b>Voting &amp; Passage:<\/b> Passed by a simple majority of the total number of members of both Houses present and voting [passage 97].<\/li><\/ul><\/ul><h4>B. Money Bills &amp; Presidential Assent (Articles 109–111)<\/h4><ul><li><b>Article 109:<\/b> Special Procedure in Respect of Money Bills<\/li><ul><li><b>Art. 109(1):<\/b> A Money Bill shall NOT be introduced in the Rajya Sabha [passage 99].<\/li><li><b>Art. 109(2):<\/b> After Lok Sabha passes a Money Bill, it is transmitted to Rajya Sabha for recommendations [passage 99]. Rajya Sabha must return it within 14 days with recommendations [passage 99].<\/li><li><b>Art. 109(3) &amp; (4):<\/b> Lok Sabha may accept or reject any or all recommendations [passage 99, passage 100]. If Lok Sabha rejects recommendations, the Bill is deemed passed by both Houses in its original form [passage 100].<\/li><li><b>Art. 109(5) 14-Day Default Clause:<\/b> If Rajya Sabha fails to return the Money Bill within 14 days, it is deemed passed by both Houses at the expiration of that period [passage 101].<\/li><\/ul><li><b>Article 110:<\/b> Definition of &quot;Money Bills&quot;<\/li><ul><li><b>Art. 110(1):<\/b> A Bill is deemed a Money Bill if it deals ONLY with all or any of 6 specified subjects [passage 101]: 1. (a) Imposition, abolition, remission, alteration, or regulation of any tax [passage 102]. 2. (b) Regulation of borrowing of money or giving guarantees by the Government of India [passage 102]. 3. (c) Custody of or payments into/withdrawals from the Consolidated Fund or Contingency Fund of India [passage 102]. 4. (d) Appropriation of moneys out of the Consolidated Fund of India [passage 102]. 5. (e) Declaring or increasing any expenditure charged on the Consolidated Fund [passage 102, passage 103]. 6. (f) Receipt or audit of moneys on account of the Consolidated Fund or Public Account of India [passage 103].<\/li><li><b>Art. 110(2) Non-Money Bill Provisions:<\/b> Fines, local taxes, or fees for licences/services do NOT make a Bill a Money Bill [passage 103].<\/li><li>Art. 110(3) Finality of Speaker&#x27;s Decision: If any question arises whether a Bill is a Money Bill or not, the decision of the Speaker of the House of the People shall be final [passage 104].<\/li><\/ul><li><b>Article 111:<\/b> Assent to Bills<\/li><ul><li>When a Bill is passed by both Houses, presented to the President, the President declares either [passage 104]: 1. Assent to the Bill [passage 104]; or 2. Withhold assent therefrom [passage 104]; or 3. Return Option (Suspensive Veto): Return the Bill (if not a Money Bill) for reconsideration with a message [passage 104]. If passed again by the Houses with or without amendment, the President SHALL NOT withhold assent therefrom [passage 104].<\/li><\/ul><\/ul><h4>C. Procedure in Financial Matters (Articles 112–117)<\/h4><ul><li><b>Article 112:<\/b> Annual Financial Statement (The Budget)<\/li><ul><li><b>Art. 112(1):<\/b> President causes to be laid before both Houses the estimated receipts and expenditure of GoI for the financial year [passage 105].<\/li><li><b>Art. 112(2) &amp; (3):<\/b> Distinguishes Expenditure Charged upon the Consolidated Fund of India (non-votable) from Expenditure Made from the Consolidated Fund (votable) [passage 105, passage 106, passage 108].<\/li><li><b>Charged Expenditure Items [Art. 112(3)]:<\/b> President&#x27;s emoluments [passage 106], Presiding Officers&#x27; salaries [passage 106], Debt charges [passage 107], Supreme Court Judges&#x27; salaries/pensions [passage 107], CAG&#x27;s salary/pension [passage 108], and Court decrees [passage 108].<\/li><\/ul><li><b>Article 113:<\/b> Procedure in Parliament with Respect to Estimates<\/li><ul><li><b>Art. 113(1):<\/b> Charged expenditure shall not be submitted to vote, but can be discussed in either House [passage 108].<\/li><li><b>Art. 113(2):<\/b> Votable estimates are submitted as Demands for Grants exclusively to the Lok Sabha [passage 109].<\/li><li><b>Art. 113(3):<\/b> No demand for a grant shall be made except on the recommendation of the President [passage 110].<\/li><\/ul><li><b>Article 114:<\/b> Appropriation Bills<\/li><ul><li>Introduced in Lok Sabha after Demands for Grants are passed to authorize withdrawal of money from the Consolidated Fund of India [passage 110].<\/li><li>No money shall be withdrawn from the Consolidated Fund of India except under appropriation made by law [Art. 114(3)] [passage 111].<\/li><\/ul><li><b>Article 115 &amp; 116:<\/b> Grants &amp; Vote on Account<\/li><ul><li><b>Art. 115:<\/b> Supplementary, additional, or excess grants [passage 112].<\/li><li><b>Art. 116:<\/b> Vote on Account (grant in advance for part of the year pending Budget passage) [passage 114], Vote of Credit (for unexpected demands/blank check) [passage 114], and Exceptional Grants [passage 115].<\/li><\/ul><li><b>Article 117:<\/b> Special Provisions as to Financial Bills<\/li><ul><li><b>Financial Bill (Type I) [Art. 117(1)]:<\/b> Contains Article 110 matters plus general legislation. Can only be introduced in Lok Sabha on President&#x27;s recommendation, but otherwise treated as an ordinary Bill [passage 116].<\/li><li><b>Financial Bill (Type II) [Art. 117(3)]:<\/b> Involves expenditure from the Consolidated Fund of India. Can be introduced in either House without prior recommendation, but cannot be passed by either House unless recommended by the President for consideration [passage 117].<\/li><\/ul><\/ul><h4>D. General Procedure &amp; Ordinance Power (Articles 118–123)<\/h4><ul><li><b>Article 118:<\/b> Rules of Procedure<\/li><ul><li><b>Art. 118(4):<\/b> Presiding Officer of Joint Sitting: At a Joint Sitting of both Houses, the Speaker of the Lok Sabha (or in absence, person determined by rules) shall preside [passage 119].<\/li><\/ul><li><b>Article 120:<\/b> Language Used in Parliament<\/li><ul><li>Business transacted in Hindi or in English [passage 120]. Presiding officer may permit a member to address the House in their mother tongue [passage 121].<\/li><\/ul><li><b>Article 121:<\/b> Restriction on Discussion in Parliament<\/li><ul><li>No discussion shall take place in Parliament with respect to the conduct of any Judge of the Supreme Court or High Court in the discharge of duties, except upon a removal motion [passage 121].<\/li><\/ul><li><b>Article 122:<\/b> Courts Not to Inquire into Parliamentary Proceedings<\/li><ul><li>Validity of proceedings in Parliament shall NOT be called in question on the ground of any alleged irregularity of procedure [passage 122].<\/li><\/ul><li><b>Article 123:<\/b> Power of President to Promulgate Ordinances<\/li><ul><li><b>Art. 123(1) Recess Requirement:<\/b> President can promulgate Ordinances ONLY when both Houses of Parliament are NOT in session (or when either House is not in session) and is satisfied that immediate action is necessary [passage 123].<\/li><li><b>Art. 123(2)(a) Parliamentary Expiry:<\/b> Ordinance must be laid before both Houses and ceases to operate at the expiration of SIX WEEKS from the reassembly of Parliament [passage 123].<\/li><li><b>Maximum Life of an Ordinance:<\/b> 6 months + 6 weeks (since maximum gap between sessions under Art. 85 is 6 months) [passage 80, passage 123].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: The Lapsing Rules Matrix (Article 107)<\/h4><ul><li><b>Mnemonic:<\/b> &quot;P-R-S-P stays, L-S-P strays!&quot;<\/li><ul><li>Pending Rajya Sabha (Passed by none) → Does NOT Lapse [passage 93].<\/li><li>Prorogation of Houses → Does NOT Lapse [passage 93].<\/li><li>Pending in Lok Sabha or Passed by Lok Sabha → LAPSES on Dissolution [passage 94].<\/li><\/ul><\/ul><h4>Mnemonic 2: Financial Articles Core Sequence (110–117)<\/h4><ul><li><b>Mnemonic:<\/b> &quot;M-A-B-E-A-S-F&quot; (&quot;Money Assented, Budget Estimated, Appropriated, Supplementary, Financial&quot;)<\/li><ul><li><b>110:<\/b> Money Bill definition [passage 101]<\/li><li><b>111:<\/b> Assent to Bills [passage 104]<\/li><li><b>112:<\/b> Budget (Annual Financial Statement) [passage 105]<\/li><li><b>113:<\/b> Estimates / Demands for Grants [passage 108, passage 109]<\/li><li><b>114:<\/b> Appropriation Bill [passage 110]<\/li><li><b>115:<\/b> Supplementary Grants [passage 112]<\/li><li><b>117:<\/b> Financial Bills (Types I &amp; II) [passage 116, passage 117]<\/li><\/ul><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 108 (Joint Sitting):<\/b> கூட்டுத் தொடர் (Joint Session) → குடியரசுத் தலைவர் அழைப்பார், மக்களவை சபாநாயகர் தலைமை தாங்குவார் [passage 95, passage 119].<\/li><li><b>Art. 110 (Money Bill):<\/b> பண மசோதா (Money Bill) → சபாநாயகரின் முடிவே இறுதியானது [passage 104].<\/li><li><b>Art. 112 (Annual Financial Statement):<\/b> வரவு செலவுத் திட்டம் (Budget) → &quot;Budget&quot; என்ற வார்த்தை அரசியலமைப்பில் இல்லை [passage 105].<\/li><li><b>Art. 123 (Ordinance):<\/b> அவசரச் சட்டம் (Ordinance) → நாடாளுமன்றம் கூடாத போது குடியரசுத் தலைவரின் அவசரச் சட்ட அதிகாரம் [passage 123].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>BILL TYPE COMPARISON &amp; PROCEDURAL MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────┬───────────┴───────────┬───────<\/h4><p>────────────────────┐<\/p><pre>│                  │               │                  │<\/pre><pre>ORDINARY BILL              MONEY BILL (Art. 110) FINANCIAL BILL I (117(1)) FINANCIAL<\/pre><p>BILL II (117(3))<\/p><pre>✦ Introduced in either House ✦ Lok Sabha ONLY             ✦ Lok Sabha ONLY           ✦<\/pre><p>Introduced in either House<\/p><pre>✦ No prior recommendation ✦ Prior Rec. Required ✦ Prior Rec. Required               ✦ No prior<\/pre><p>rec. for intro<\/p><pre>✦ RS can delay 6 months       ✦ RS limit 14 days     ✦ RS equal power           ✦ RS equal<\/pre><p>power<\/p><pre>✦ Joint Sitting Available ✦ NO Joint Sitting     ✦ Joint Sitting Available ✦ Joint Sitting<\/pre><p>Available<\/p><ul><li>Article 110 vs. Article 117 (Money Bills vs. Financial Bills):<\/li><ul><li>&quot;All Money Bills are Financial Bills, but all Financial Bills are NOT Money Bills.&quot;<\/li><li><b>Money Bills (Art. 110):<\/b> Contain EXCLUSIVELY Article 110 matters [passage 101]. Certified by Speaker [passage 104]. Rajya Sabha restricted to 14 days [passage 99].<\/li><li><b>Financial Bills Type I (Art. 117(1)):<\/b> Contain Art. 110 matters plus general matter [passage 116]. Introduced only in Lok Sabha on President&#x27;s recommendation, but RS has full amending/rejecting powers [passage 116].<\/li><\/ul><li>Article 123 (President) vs. Article 213 (Governor) Ordinance Powers:<\/li><ul><li>Both have identical scope and 6-week expiry rules [passage 123, passage 193].<\/li><li><b>President (Art. 123):<\/b> Promulgates when Parliament is in recess [passage 123].<\/li><li><b>Governor (Art. 213):<\/b> Promulgates when State Legislature is in recess [passage 191]. Governor requires prior Presidential instructions for specific categories of state ordinances [passage 192].<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<p>1. Judicial Review of Speaker&#x27;s Money Bill Certification (Article 110(3)):<\/p><ul><ul><li>K.S. Puttaswamy v. Union of India (2018) [Aadhaar Case]: The Supreme Court held that the Speaker&#x27;s certificate under Article 110(3) [passage 104] is not immune from judicial review. If a non-money provision is passed as a Money Bill to bypass Rajya Sabha, it violates constitutional procedure.<\/li><li><b>Rojer Mathew v. South Indian Bank (2019):<\/b> Referred the question of Money Bill certification and bypassing of Rajya Sabha (Finance Act 2017 regarding tribunals) to a 7-judge Constitution Bench. 2. Ordinance Power &amp; Re-promulgation Fraud on the Constitution (Article 123):<\/li><li><b>D.C. Wadhwa v. State of Bihar (1987):<\/b> The Supreme Court held that re-promulgating ordinances continuously without placing them before the legislature is a subversion of the democratic process and a &quot;fraud on the Constitution&quot;.<\/li><li><b>Krishna Kumar Singh v. State of Bihar (2017):<\/b> A 7-judge bench ruled that ordinance-making power is not a parallel power of legislation. Ordinances cease to operate if not laid before Parliament/Legislature, and re-promulgation is unconstitutional. 3. Procedural Irregularity Immunity (Article 122):<\/li><li><b>Ramdas Athawale v. Union of India (2010):<\/b> Courts will not interfere in procedural irregularities inside Parliament under Article 122 [passage 122], but will intervene if the procedure violates substantive constitutional provisions or basic structure.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Money Bill Controversies, Ordinance Raj, and Parliamentary Control over Finances<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Articles 107–123 establish the legislative and financial framework of Parliament, ensuring that spending and taxation remain anchored in legislative authorization under Article 114(3) [passage 111]. Supported by the special Money Bill procedure (Article 109/110) [passage 99, passage 101] and emergency ordinance powers (Article 123) [passage 123], this architecture balances legislative supremacy with executive efficiency.&quot;<\/p><ul><li>Mains Body Arguments (Money Bill Scrutiny &amp; Executive Overreach):<\/li><ul><li>Judicial Review of Speaker&#x27;s Certification: Cite Puttaswamy (2018) to argue that Article 110(3) [passage 104] does not grant absolute immunity if money bill certification is used to bypass bicameral scrutiny in Rajya Sabha.<\/li><li><b>Executive Legislation via Ordinances:<\/b> Reference Krishna Kumar Singh (2017) and D.C. Wadhwa (1987) to demonstrate that Article 123 [passage 123] is an extraordinary power intended for urgent contingencies, not a substitute for parliamentary law-making.<\/li><li><b>No Taxation Without Representation:<\/b> Emphasize Article 265 (Taxes not to be imposed save by authority of law) [passage 271] read with Article 113(3) [passage 110] requiring executive grants to originate from legislative authorization.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, protecting bicameral scrutiny for Money Bills and ending ordinance re-promulgation are vital to uphold the doctrine of separation of powers.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact maximum period a Money Bill can be delayed by the Rajya Sabha under Article 109(2)? [passage 99] 2. Reverse Recall: Which Article explicitly states that no money shall be withdrawn from the Consolidated Fund of India except under appropriation made by law? [passage 111] 3. UPSC Prelims Analytical Trap: If a Bill passed by Lok Sabha and pending in Rajya Sabha is not passed when Lok Sabha dissolves, does it lapse? What if a Bill originated in Rajya Sabha and is still pending there without having been passed by Lok Sabha? [passage 93, passage 94] 4. Mains Applied Question: Discuss the constitutional implications of the Supreme Court&#x27;s ruling in Krishna Kumar Singh v. State of Bihar (2017) regarding the ordinance-making power under Article 123 [passage 123].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; Vice-President (Articles 52–73) (Lesson<\/span><\/label><p>8)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part V: Council of Ministers, PM &amp; AG (Articles 74–78) (Lesson 9)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part V: Parliament — Composition &amp; Privileges (Articles 79–106) (Lesson 10)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part V: Legislative Procedure, Money Bills, Budget &amp; Ordinance (Articles<\/span><\/label><p>107–123) (Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part V: The Union Judiciary — Supreme Court of India (Articles 124–147) (Up<\/span><\/label><p>Next)<\/p>"}], "nchk": 11}, {"n": 12, "title": "Part V — The Union Judiciary: Supreme Court of India (Articles 124–147)", "secs": [{"t": "Articles", "h": "<p>Chapter IV of Part V (Articles 124–147) defines the single integrated judicial system&#x27;s apex authority—The Supreme Court of India [passage 10].<\/p><h4>PART V CHAPTER IV: THE UNION JUDICIARY (ARTICLES 124–147)<\/h4><h4>│<\/h4><h4>┌─────────────────────────┬───────────┴───────────┬─────────<\/h4><p>────────────────┐<\/p><pre>│ Constitution &amp; Officers │ Jurisdictions     │ Extraordinary Powers      │<\/pre><pre>│ (Arts. 124–130)       │ (Arts. 131–136)     │ (Arts. 137–142)       │<\/pre><h4>└─────────────────────────┴───────────────────────┴─────────<\/h4><p>────────────────┘ │<\/p><h4>┌──────────┴──────────┐<\/h4><pre>│ Advisory &amp; Rules    │<\/pre><pre>│ (Arts. 143–147)    │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. Establishment, Constitution &amp; Appointments (Articles 124–130)<\/h4><ul><li><b>Article 124:<\/b> Establishment and Constitution of the Supreme Court<\/li><ul><li><b>Art. 124(1):<\/b> Consists of a Chief Justice of India (CJI) and, until Parliament by law prescribes a larger number, not more than 7 other Judges [passage 10, passage 111]. (Current statutory strength: 1 CJI + 33 Judges = 34 Judges, via the Supreme Court (Number of Judges) Amendment Act, 2019) [passage 112].<\/li><li><b>Art. 124(2) Appointment &amp; Retirement Age:<\/b> Every Judge of the Supreme Court is appointed by the President by warrant under hand and seal [passage 111]. Holds office until attaining the age of 65 years [passage 111]. (Resigns in writing to the President) [passage 112].<\/li><ul><li><b>(Note:<\/b> Articles 124A, 124B, and 124C creating the National Judicial Appointments Commission (NJAC) via 99th CAA 2014 were struck down as unconstitutional by the Supreme Court in 2015) [passage 10, passage 113, passage 118, passage 119, passage 122].<\/li><\/ul><li><b>Art. 124(3) Qualifications:<\/b> Must be a citizen of India AND [passage 115]:<\/li><ul><li>Has been for at least 5 years a Judge of a High Court (or two/more such courts in succession) [passage 115]; OR<\/li><li>Has been for at least 10 years an Advocate of a High Court [passage 115]; OR<\/li><li>Is, in the opinion of the President, a distinguished jurist [passage 116]. (Note: &quot;Distinguished jurist&quot; criterion exists for SC, but NOT for High Courts).<\/li><\/ul><li>Art. 124(4) Removal Procedure (Impeachment Address): A Judge can be removed ONLY by an order of the President passed after an address by each House of Parliament [passage 117]:<\/li><ul><li>Supported by a majority of total membership of that House AND by a majority of not less than 2/3rds of members present and voting [passage 117].<\/li><li>Presented in the same session [passage 117].<\/li><li><b>Grounds:<\/b> &quot;Proved misbehaviour or incapacity&quot; [passage 117].<\/li><\/ul><li><b>Art. 124(5):<\/b> Parliament may by law regulate procedure for investigation (Judges (Inquiry) Act, 1968) [passage 117].<\/li><li><b>Art. 124(6) Oath:<\/b> Taken before the President according to the Third Schedule [passage 118, passage 491].<\/li><li><b>Art. 124(7) Post-Retirement Bar:<\/b> No retired Supreme Court Judge shall plead or act in any court or before any authority within the territory of India [passage 118].<\/li><\/ul><li><b>Article 125:<\/b> Salaries and Allowances of Judges<\/li><ul><li>Determined by Parliament by law (specified in Second Schedule until determined) [passage 10, passage 123, passage 477]. Cannot be varied to a Judge&#x27;s disadvantage after appointment [passage 124].<\/li><\/ul><li><b>Article 126:<\/b> Appointment of Acting Chief Justice<\/li><ul><li>Appointed by the President when the CJI office is vacant or CJI is unable to perform duties [passage 10, passage 124].<\/li><\/ul><li><b>Article 127:<\/b> Appointment of Ad Hoc Judges<\/li><ul><li>If at any time there is no quorum of SC Judges available to hold/continue a session, the CJI (with prior consent of the President and after consultation with the concerned HC Chief Justice) can request a qualified High Court Judge to attend sittings as an ad hoc Judge [passage 10, passage 125].<\/li><\/ul><li><b>Article 128:<\/b> Attendance of Retired Judges at Sittings of the Supreme Court<\/li><ul><li>CJI may at any time, with prior consent of the President, request a retired SC or HC Judge to sit and act as an SC Judge [passage 10, passage 126].<\/li><\/ul><li><b>Article 129:<\/b> Supreme Court to be a Court of Record<\/li><ul><li>The Supreme Court is a court of record with all powers of such a court, including the power to punish for contempt of itself [passage 10, passage 128].<\/li><\/ul><li><b>Article 130:<\/b> Seat of the Supreme Court<\/li><ul><li>The Supreme Court shall sit in Delhi or in such other place or places as the CJI may, with the approval of the President, from time to time, appoint [passage 10, passage 128].<\/li><\/ul><\/ul><h4>B. Four-Fold Jurisdiction Architecture (Articles 131–136)<\/h4><h4>JURISDICTION OF THE SUPREME COURT<\/h4><h4>│<\/h4><p>┌──────────────────┬────────────────┴────────────────┬────── ────────────┐<\/p><pre>│             │                      │            │<\/pre><pre>ORIGINAL            APPELLATE                   SPECIAL LEAVE            ADVISORY<\/pre><pre>(Art. 131)        (Arts. 132–135)           (Art. 136)      (Art. 143)<\/pre><pre>Federal disputes Constitutional (132), Civil (133), Discretionary        Presidential<\/pre><pre>exclusively       Criminal (134), Certificate (134A) Plenary Power   Consultation<\/pre><ul><li><b>Article 131:<\/b> Original Jurisdiction of the Supreme Court<\/li><ul><li>Exclusive original jurisdiction in federal disputes involving questions of law or legal right [passage 10, passage 129]:<\/li><ul><li>Between Government of India and one or more States [passage 129];<\/li><li>Between GoI and any State(s) on one side and one or more States on the other [passage 129];<\/li><li>Between two or more States [passage 129].<\/li><\/ul><li><b>Proviso Exception:<\/b> Does NOT extend to pre-constitutional treaties, covenants, or agreements [passage 130].<\/li><\/ul><li><b>Articles 132–134A:<\/b> Appellate Jurisdiction<\/li><ul><li><b>Art. 132 Constitutional Matters:<\/b> Appeal lies from any HC order if HC certifies under Art. 134A that it involves a substantial question of law as to the interpretation of the Constitution [passage 11, passage 131].<\/li><li><b>Art. 133 Civil Matters:<\/b> Appeal lies if HC certifies under Art. 134A that the case involves a substantial question of law of general importance and needs SC decision [passage 11, passage 133, passage 134].<\/li><li><b>Art. 134 Criminal Matters:<\/b> Appeal lies if HC [passage 11, passage 135]:<\/li><ul><li>Reverses an acquittal and sentences an accused to death [passage 135]; or<\/li><li>Withdraws a case from subordinate court, convicts, and sentences to death [passage 135]; or<\/li><li>Certifies under Art. 134A that the case is fit for appeal [passage 136].<\/li><\/ul><li><b>Art. 134A Certificate for Appeal:<\/b> High Court determines certificate on its own motion or on oral application immediately after judgment [passage 11, passage 138].<\/li><\/ul><li><b>Article 136:<\/b> Special Leave to Appeal (SLP)<\/li><ul><li><b>Art. 136(1):<\/b> Plenary Discretionary Power: Supreme Court may, in its discretion, grant special leave to appeal from any judgment, decree, determination, sentence or order in any cause or matter passed by any court or tribunal in India [passage 12, passage 139].<\/li><li><b>Art. 136(2) Exclusion:<\/b> Does NOT apply to military courts/tribunals (Armed Forces) [passage 140].<\/li><\/ul><\/ul><h4>C. Extraordinary Powers &amp; Rule-Making (Articles 137–147)<\/h4><ul><li><b>Article 137:<\/b> Review of Judgments or Orders<\/li><ul><li>Power to review any judgment pronounced or order made by itself [passage 12, passage 140]. (Basis for Review Petitions and Curative Petitions).<\/li><\/ul><li><b>Article 139A:<\/b> Transfer of Cases<\/li><ul><li>SC can withdraw cases involving substantial questions of general importance pending before High Courts and dispose of them itself, or transfer cases from one High Court to another [passage 12, passage 142, passage 143].<\/li><\/ul><li><b>Article 141:<\/b> Law Declared by Supreme Court Binding on All Courts<\/li><ul><li>The law declared by the Supreme Court shall be binding on all courts within the territory of India [passage 12, passage 145]. (Doctrine of Stare Decisis).<\/li><\/ul><li><b>Article 142:<\/b> Complete Justice Power &amp; Order Enforcement<\/li><ul><li><b>Art. 142(1):<\/b> Supreme Court may pass such decree or order as is necessary for doing complete justice in any cause or matter pending before it [passage 12, passage 145]. Enforceable throughout India [passage 145].<\/li><\/ul><li><b>Article 143:<\/b> Advisory Jurisdiction (Power of President to Consult SC)<\/li><ul><li><b>Art. 143(1) Public Importance Question:<\/b> President refers a question of law or fact; SC may report its opinion [passage 12, passage 146]. (Opinion is advisory, not binding).<\/li><li><b>Art. 143(2) Pre-Constitutional Disputes:<\/b> President refers disputes arising out of pre-constitutional treaties (Art. 131 Proviso); SC must report its opinion [passage 12, passage 147].<\/li><\/ul><li><b>Article 144:<\/b> Civil &amp; Judicial Authorities to Act in Aid of SC<\/li><ul><li>All civil and judicial authorities across India shall act in aid of the Supreme Court [passage 12, passage 147].<\/li><\/ul><li><b>Article 145:<\/b> Rules of Court &amp; Constitution Bench Quorum<\/li><ul><li><b>Art. 145(3):<\/b> Minimum number of Judges for deciding cases involving substantial questions of constitutional interpretation or Art. 143 references SHALL BE FIVE (5 Bench) [passage 13, passage 152].<\/li><\/ul><li><b>Article 146:<\/b> Expenses &amp; Officers of Supreme Court<\/li><ul><li>Administrative expenses, salaries, pensions charged on the Consolidated Fund of India [passage 13, passage 156].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Core Sequence of Articles 124 to 143 —<\/h4><p>&quot;E-S-A-A-R-C-S-O-A-S-L-R-T-A-L-C-P&quot;<\/p><ul><li><b>124:<\/b> Establishment &amp; Qualifications [passage 10, passage 111, passage 115]<\/li><li><b>126:<\/b> Acting CJI [passage 10, passage 124]<\/li><li><b>127:<\/b> Ad hoc Judges [passage 10, passage 125]<\/li><li><b>128:<\/b> Retired Judges [passage 10, passage 126]<\/li><li><b>129:<\/b> Court of Record / Contempt [passage 10, passage 128]<\/li><li><b>130:<\/b> Seat of SC [passage 10, passage 128]<\/li><li><b>131:<\/b> Original Jurisdiction [passage 10, passage 129]<\/li><li><b>136:<\/b> Special Leave Petition (SLP) [passage 12, passage 139]<\/li><li><b>141:<\/b> Law binding on all courts [passage 12, passage 145]<\/li><li><b>142:<\/b> Complete Justice [passage 12, passage 145]<\/li><li><b>143:<\/b> Presidential Advisory Consultation [passage 12, passage 146]<\/li><\/ul><h4>Mnemonic 2: SC Qualifications (Art. 124(3)) — &quot;5-10-D&quot;<\/h4><ul><li>5 years High Court Judge [passage 115] OR<\/li><li>10 years High Court Advocate [passage 115] OR<\/li><li>Distinguished Jurist [passage 116].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 129:<\/b> பதிவு நீதிமன்றம் (Court of Record) → நீதிமன்ற அவமதிப்புக்குத் தண்டனை அளிக்கும் அதிகாரம் [passage 128].<\/li><li><b>Art. 131:<\/b> அசல் அதிகாரம் (Original Jurisdiction) → மத்திய-மாநில அரசு மோதல்களை விசாரிக்கும் பிரத்யேக அதிகாரம் [passage 129].<\/li><li><b>Art. 136:<\/b> சிறப்பு விடுப்பு மனு (SLP) → எந்த நீதிமன்றத் தீர்ப்பையும் மேல்முறையீடு செய்ய உச்சநீதிமன்றத்தின் சிறப்பு அதிகாரம் [passage 139].<\/li><li><b>Art. 142:<\/b> முழுமையான நீதி (Complete Justice) → நிலுவையில் உள்ள வழக்கில் முழுமையான நீதி வழங்க உச்சநீதிமன்றத்திற்குள்ள வரம்பற்ற அதிகாரம் [passage 145].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>WRIT &amp; REMEDIAL ARCHITECTURE (ART. 32 vs. ART. 136 vs. ART. 142)<\/h4><h4>│<\/h4><p>┌───────────────────────────────────────────┴─────────────── ────────────────────────────┐<\/p><pre>│                                                        │<\/pre><pre>ARTICLE 32 (REMEDIAL WRITS)               ARTICLE 136 (PLENARY SLP)                ARTICLE<\/pre><p>142 (COMPLETE JUSTICE)<\/p><pre>✦ Enforces Part III Rights ONLY       ✦ Discretionary appellate review       ✦ Enforceable<\/pre><p>decree/order<\/p><pre>✦ Guaranteed Fundamental Right           ✦ Covers all tribunals/courts       ✦ Equity power to<\/pre><p>bridge statutory<\/p><pre>✦ Cannot be refused                ✦ Excludes Armed Forces tribunals        gaps or grant<\/pre><p>complete relief<\/p><ul><li>Article 131 (Original) vs. Article 226 / 32 (Writ Original):<\/li><ul><li>Article 131 resolves federal disputes between Union and States [passage 129]. Private citizens cannot file petitions under Article 131.<\/li><li>Articles 32 and 226 resolve individual fundamental/legal rights violations against the State [passage 65, passage 210].<\/li><\/ul><li>Article 141 (Binding Precedent) ↔ Article 142 (Equity vs Statutory Law):<\/li><ul><li>Article 141 makes SC rulings binding law across India [passage 145]. Article 142 provides equitable power to grant complete justice [passage 145], but SC has held that Art. 142 cannot be used to directly override express statutory prohibitions (Supreme Court Bar Association v. Union of India, 1998).<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. The Evolution of Judicial Appointments (Articles 124(2) &amp; 217(1)):<\/h4><ul><ul><li><b>First Judges Case (S.P. Gupta, 1981):<\/b> Held that &quot;consultation&quot; with CJI does not mean &quot;concurrence&quot;; executive has primacy.<\/li><li><b>Second Judges Case (SCORA, 1993):<\/b> Overruled S.P. Gupta; held that &quot;consultation&quot; means concurrence. Created the Collegium System (CJI + 2 senior-most judges).<\/li><li><b>Third Judges Case (Re Advisory Opinion, 1998):<\/b> Expanded Collegium for SC appointments to CJI + 4 senior-most Judges.<\/li><li><b>Fourth Judges Case (NJAC Case, 2015):<\/b> Struck down the 99th CAA 2014 and Article 124A (NJAC) as a violation of Judicial Independence (Basic Structure) [passage 10, passage 113, passage 118, passage 119]. Restored Collegium system. 2. Complete Justice &amp; Marriage Dissolution (Article 142):<\/li><li><b>Shilpa Sailesh v. Varun Sreenivasan (2023):<\/b> A 5-judge Constitution Bench held that the SC can exercise its extraordinary power under Article 142(1) [passage 145] to dissolve a marriage on the ground of irretrievable breakdown, bypassing the mandatory 6-month waiting period under the Hindu Marriage Act, 1955. 3. Contempt Power Limits (Article 129):<\/li><li><b>In re Prashant Bhushan (2020):<\/b> Reaffirmed that SC&#x27;s power to punish for contempt under Article 129 [passage 128] is a constitutional power that cannot be abridged even by parliamentary legislation. 4. Advisory Opinions (Article 143):<\/li><li>In re Berubari Union (1960) [passage 146] &amp; In re Ayodhya Reference (1994): SC declined to answer part of the Ayodhya reference under Art. 143(1), establishing that SC is not bound to answer every advisory reference if it lacks judicial purpose.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Judicial Independence, Collegium vs. Executive, and Article 142 Equity Jurisdiction<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Chapter IV of Part V (Articles 124–147) establishes the Supreme Court as the guarantor of Fundamental Rights (Article 32) [passage 65], the final interpreter of the Constitution, and the ultimate arbiter of federal disputes (Article 131) [passage 129]. Grounded in judicial independence—declared part of the Basic Structure in the Fourth Judges Case (2015)—and plenary enforcement powers under Article 142 [passage 145], the Court maintains constitutional supremacy.&quot;<\/p><ul><li>Mains Body Arguments (Appointments &amp; Complete Justice Scope):<\/li><ul><li><b>Judicial Supremacy in Appointments:<\/b> Trace the transition from S.P. Gupta (1981) to the NJAC Judgment (2015) [passage 113], analyzing how &quot;consultation&quot; under Article 124(2) was judicially constructed into Collegium concurrence.<\/li><li><b>Boundaries of Article 142:<\/b> Cite Shilpa Sailesh (2023) alongside SCBA v. Union of India (1998) to argue that Article 142 [passage 145] serves as a vital equity tool to deliver complete justice, provided it does not supplant core statutory policy.<\/li><li>Precedential Authority &amp; Federal Mediation: Explain the operational synergy of Article 141 (stare decisis) [passage 145] and Article 144 [passage 147] in ensuring uniform compliance across state and central executive bodies.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, preserving judicial independence under Article 124 [passage 111] while establishing a transparent Memorandum of Procedure (MoP) remains critical to maintain public trust in the Union Judiciary.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the minimum number of Judges required to sit on a Constitution Bench for deciding cases involving a substantial question of constitutional law under Article 145(3)? [passage 152] 2. Reverse Recall: Under which Article is the law declared by the Supreme Court explicitly made binding on all courts within the territory of India? [passage 145] 3. UPSC Prelims Analytical Trap: Can a person who has held office as a permanent Judge of the Supreme Court plead or act before any High Court in India after retirement? [passage 118] Compare this with the restriction on High Court Judges under Article 220 [passage 198]. 4. Mains Applied Question: Discuss the scope and constitutional limitations of the Supreme Court&#x27;s power to do &quot;complete justice&quot; under Article 142(1) [passage 145], referencing recent judicial precedents.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; VP (Articles 52–73) (Lesson 8)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part V: Council of Ministers, PM &amp; AG (Articles 74–78) (Lesson 9)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part V: Parliament (Articles 79–106) (Lesson 10)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part V: Legislative Procedure, Money Bills &amp; Ordinances (Articles 107–123)<\/span><\/label><p>(Lesson 11)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part V: The Union Judiciary — Supreme Court (Articles 124–147) (Current<\/span><\/label><p>Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part V: Comptroller and Auditor-General of India (Articles 148–151) (Up Next)<\/span><\/label>"}], "nchk": 12}, {"n": 13, "title": "Part V — Comptroller and Auditor-General of India (Articles 148–151)", "secs": [{"t": "Articles", "h": "<h4>&amp; Module 3 Master Synthesis<\/h4><p>Chapter V of Part V (Articles 148–151) establishes the independent supreme audit institution of the Republic—The Comptroller and Auditor-General of India (CAG) [passage 10, passage 130].<\/p><p>Dr. B.R. Ambedkar famously remarked in the Constituent Assembly that the CAG is &quot;the most important officer in the Constitution of India&quot; because this office guarantees financial accountability across all legislative and executive operations.<\/p><h4>PART V CHAPTER V: COMPTROLLER AND AUDITOR-GENERAL (ARTICLES 148–151)<\/h4><h4>│<\/h4><h4>┌─────────────────────────┬───────────┴───────────┬─────────<\/h4><p>────────────────┐<\/p><pre>│ Office &amp; Independence │ Duties &amp; Powers           │ Forms of Account &amp;    │<\/pre><pre>│ (Art. 148)         │ (Art. 149)         │ Audit Reports       │<\/pre><pre>│                │                  │ (Arts. 150 &amp; 151)     │<\/pre><h4>└─────────────────────────┴───────────────────────┴─────────<\/h4><p><b>────────────────┘ Article 148:<\/b> Comptroller and Auditor-General of India<\/p><ul><li>Art. 148(1) Appointment &amp; Removal Security:<\/li><ul><li>Appointed by the President by warrant under hand and seal [passage 130].<\/li><li><b>Removal Safeguard:<\/b> Shall ONLY be removed from office in like manner and on the like grounds as a Judge of the Supreme Court [passage 130].<\/li><li><b>(Grounds:<\/b> &quot;Proved misbehaviour or incapacity&quot;; Procedure: Resolution passed by each House of Parliament supported by a majority of total membership AND a 2/3rd majority of members present and voting in the same session under Art. 124(4)) [passage 117].<\/li><\/ul><li><b>Art. 148(2) Oath:<\/b> Takes an oath/affirmation before the President according to the Third Schedule [passage 130, passage 476].<\/li><li><b>Art. 148(3) Conditions of Service:<\/b><\/li><ul><li>Salary and service conditions determined by Parliament by law (CAG Duties, Powers and Conditions of Service Act, 1971) [passage 131, passage 471].<\/li><li><b>Non-Disadvantage Proviso:<\/b> Neither salary nor rights in respect of leave of absence, pension, or age of retirement shall be varied to his disadvantage after appointment [passage 131].<\/li><\/ul><li><b>Art. 148(4) Post-Retirement Disqualification:<\/b><\/li><ul><li>CAG is NOT eligible for further office either under the Government of India or under the Government of any State after ceasing to hold office [passage 131]. (Ensures absolute impartiality during tenure).<\/li><\/ul><li><b>Art. 148(5) Staff Administration:<\/b><\/li><ul><li>Service conditions of Indian Audit and Accounts Department (IAAD) personnel and administrative powers of CAG are prescribed by Presidential rules made after consultation with the CAG [passage 132].<\/li><\/ul><li><b>Art. 148(6) Financial Independence:<\/b><\/li><ul><li>Administrative expenses of CAG office (salaries, allowances, pensions) are charged upon the Consolidated Fund of India (non-votable by Parliament) [passage 89, passage 132].<\/li><\/ul><\/ul><h4>Article 149: Duties and Powers of the Comptroller and Auditor-General<\/h4><ul><li>Performs duties and exercises powers in relation to accounts of the Union, States, and any other authority/body as prescribed by law made by Parliament [passage 133].<\/li><li>Pursuant to Art. 149, Parliament enacted the CAG (Duties, Powers and Conditions of Service) Act, 1971 [passage 133, passage 471], authorizing CAG to audit: 1. All expenditures from the Consolidated Fund of India, States, and UTs [passage 260]. 2. All transactions relating to the Contingency Funds and Public Accounts [passage 261]. 3. All trading, manufacturing, and balance-sheet accounts of government departments. 4. Receipts and expenditure of bodies substantially financed from Union/State revenues.<\/li><\/ul><h4>Article 150: Form of Accounts of the Union and of the States<\/h4><ul><li>The accounts of the Union and of the States shall be kept in such form as the President may, ON THE ADVICE OF the Comptroller and Auditor-General of India, prescribe [passage 134].<\/li><li><b>(Note:<\/b> The 44th Constitutional Amendment Act, 1978 substituted &quot;on the advice of&quot; for &quot;after consultation with&quot;, making CAG&#x27;s accounting advice binding on the President) [passage 134, passage 135].<\/li><\/ul><h4>Article 151: Audit Reports<\/h4><ul><li><b>Art. 151(1) Union Audit Reports:<\/b> Reports relating to accounts of the Union are submitted to the President, who causes them to be laid before each House of Parliament [passage 134].<\/li><li><b>Art. 151(2) State Audit Reports:<\/b> Reports relating to accounts of a State are submitted to the Governor, who causes them to be laid before the State Legislature [passage 134].<\/li><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: CAG Articles Sequence (148 to 151) — &quot;A-D-F-R&quot;<\/h4><ul><li><b>Mnemonic:<\/b> &quot;Auditor&#x27;s Duties Form Reports&quot;<\/li><li><b>Decoding:<\/b><\/li><ul><li><b>148:<\/b> Authority, Appointment &amp; Independence safeguards [passage 130]<\/li><li><b>149:<\/b> Duties and Statutory Audit Powers [passage 133]<\/li><li><b>150:<\/b> Form of Union/State Accounts [passage 134]<\/li><li><b>151:<\/b> Reports laid before Parliament/State Assemblies [passage 134]<\/li><\/ul><\/ul><h4>Mnemonic 2: Four Independence Shields of Article 148 — &quot;S-P-I-C&quot;<\/h4><ul><li>Supreme Court Judge removal procedure [passage 130]<\/li><li>Post-retirement job bar [passage 131]<\/li><li>Incurred expenses charged on Consolidated Fund [passage 132]<\/li><li>Cannot vary conditions to disadvantage [passage 131]<\/li><\/ul><p><b>Tamil-English Association Map:<\/b><\/p><ul><li><b>Art. 148:<\/b> தலைமை கணக்குத் தணிக்கையாளர் (CAG) → &quot;அரசு கருவூலத்தின் பாதுகாவலன் (Guardian of the Public Purse)&quot;.<\/li><li><b>Art. 148(4):<\/b> மறுபணி தடை (Post-Retirement Bar) → ஓய்வுக்குப் பின் அரசுப் பதவி பெற முடியாது [passage 131].<\/li><li><b>Art. 151:<\/b> தணிக்கை அறிக்கை (Audit Report) → நாடாளுமன்றம் மற்றும் மாநில சட்டமன்றத்தில் தாக்கல் செய்தல் [passage 134].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>THE FINANCIAL ACCOUNTABILITY &amp; AUDIT TRIAD<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────┼─────────────────────────<\/h4><p>────────┐<\/p><pre>│                     │                         │<\/pre><pre>CONSOLIDATED FUND OF INDIA                 COMPTROLLER &amp; AUDITOR-GENERAL               PUBLIC<\/pre><p>ACCOUNTS COMMITTEE<\/p><pre>(Art. 266)                (Art. 148)                (Parliamentary Committee)<\/pre><pre>✦ Public revenue &amp; expenditure         ✦ Audits all withdrawals &amp;   ✦ Examines CAG Audit<\/pre><p>Reports<\/p><pre>custody                  revenue accounts              ✦ CAG acts as &quot;Guide, Friend<\/pre><h4>&amp; Philosopher&quot;<\/h4><ul><li>CAG (Art. 148) vs. Attorney-General for India (Art. 76) [Constitutional Comparison]:<\/li><\/ul><pre>Feature            Comptroller &amp; Auditor-General         Attorney-General for India (Art.\n(Art. 148)                              76)\nSecurity of          Fixed (Removed like SC Judge           No Fixed Tenure (Pleasure of\nTenure               under Art. 124(4)) [passage 117,       President) [passage 63]<\/pre><p>passage 130]<\/p><pre>Post-Retirement      Strictly Barred from Union/State       No Bar on further practice or\njobs [passage 131]                     office [passage 62]<\/pre><pre>Financial            Salary charged on Consolidated         Remuneration determined by\nIndependence         Fund [passage 89, passage 132]         President [passage 63]<\/pre><pre>Parliamentary        Reports examined by Public             Speaks/participates under Art.\nRole                 Accounts Committee [passage            88 (No vote) [passage 72]<\/pre><p>134]<\/p><ul><li>CAG (Art. 148) ↔ Public Accounts Committee (PAC):<\/li><ul><li>CAG audit reports submitted under Art. 151 [passage 134] are automatically referred to the Public Accounts Committee (PAC) of Parliament/State Assemblies.<\/li><li>CAG attends PAC meetings and functions as the &quot;Guide, Friend, and Philosopher&quot; of the PAC in dissecting financial improprieties.<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Expansion into Performance &amp; Propriety Audit:<\/h4><ul><ul><li><b>Traditional Audit:<\/b> Checks formal compliance (Vouching &amp; Legal authorization).<\/li><li><b>Modern Audit:<\/b> CAG conducts Performance, Economy, Efficiency, and Effectiveness Audit to verify whether money spent yielded intended public outcomes.<\/li><li>Centre for Public Interest Litigation v. Union of India (2012) [2G Spectrum Case]: The Supreme Court recognized CAG&#x27;s authority under Article 149 [passage 133] to conduct propriety audits that quantify &quot;presumptive loss&quot; to the public exchequer due to arbitrary policy execution.<\/li><\/ul><\/ul><p>2. Audit of Private Telecoms &amp; Public-Private Partnerships (PPPs):<\/p><ul><ul><li>Association of Unified Telecom Service Providers of India v. Union of India (2014):<\/li><ul><li>Private telecom companies argued CAG could not audit their accounts.<\/li><li>The Supreme Court held that under Article 149 [passage 133] read with Section 13/16 of the CAG Act 1971, wherever private entities share revenue with the government (such as spectrum fees), the revenue directly impacts the Consolidated Fund of India (Art. 266) [passage 260]. Therefore, CAG has constitutional competence to audit the records of private telecom operators.<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Financial Accountability, Auditing PPPs, and Institutional Independence<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Article 148 establishes the Comptroller and Auditor-General of India as the supreme audit authority and &#x27;Guardian of the Public Purse&#x27; [passage 130]. Entrusted with upholding parliamentary financial control over executive expenditure under Article 149 [passage 133] and Article 151 [passage 134], the CAG ensures fiscal discipline across the federation.&quot;<\/p><ul><li>Mains Body Arguments (Independence &amp; Modern Audit Mandate):<\/li><ul><li><b>Constitutional Independence Architecture:<\/b> Highlight the four-fold protection under Article 148 (judicial removal standard, post-retirement job bar, charged salary status) [passage 89, passage 130, passage 131, passage 132].<\/li><li><b>Evolving Audit Horizon:<\/b> Reference Association of Unified Telecom Service Providers (2014) to explain how CAG&#x27;s scope extends beyond government departments into Public-Private Partnerships (PPPs) and revenue-sharing contracts that touch the Consolidated Fund [passage 133, passage 260].<\/li><li><b>Legislative Synergy:<\/b> Describe how CAG reports submitted under Article 151 [passage 134] power the Public Accounts Committee (PAC) to enforce executive accountability.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, granting CAG statutory authority to audit Panchayats and state SPVs will further strengthen financial accountability in Indian federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your memory and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> Under Article 148(1), what is the exact standard required for removing the CAG from office? [passage 130] 2. Reverse Recall: Which Article specifies that accounts of the Union and States shall be kept in such form as the President prescribes on the advice of the CAG? [passage 134] 3. UPSC Prelims Analytical Trap: Is a retired CAG eligible to be appointed as the Governor of a State or Chairman of a State Public Service Commission? [passage 131] Explain referencing Article 148(4). 4. Mains Applied Question: Analyze the Supreme Court&#x27;s decision in Association of Unified Telecom Service Providers (2014) regarding the CAG&#x27;s power to audit private entities under Article 149 [passage 133].<\/p><h4>MODULE 3 MASTER SYNTHESIS: THE<\/h4><p>UNION MACHINERY (ARTICLES 52–151) Congratulations! You have completed Module 3: The Union Machinery covering Parts V of the Indian Constitution! Here is your high-yield revision matrix across all 6 lessons:<\/p><h4>MODULE 3 MASTER REVISION MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────┬───────────┴───────────┬───────<\/h4><p>────────────────────┐<\/p><pre>│ Executive Architecture       │ Legislative Framework │ Judicial &amp; Audit Systems │<\/pre><pre>│ (Arts. 52–78)        │ (Arts. 79–123)        │ (Arts. 124–151)       │<\/pre><h4>└───────────────────────────┴───────────────────────┴───────<\/h4><p>────────────────────┘<\/p><pre>Lesson       Core Theme              Key Articles            Landmark Precedents /<\/pre><p>Mnemonics<\/p><pre>Lesson   President &amp;             Arts. 52–73 [passage    Kehar Singh (Art. 72 Clemency)\n8        Vice-President          55, passage 70,         [passage 81]; Mnemonic:\npassage 81]             PEEMT-EQCOI<\/pre><pre>Lesson   Council of Ministers,   Arts. 74–78 [passage    U.N.R. Rao (Advice Binding)\n9        PM &amp; AG                 60, passage 61,         [passage 56, passage 60];\npassage 65]             Mnemonic: AMABD<\/pre><pre>Lesson   Parliament &amp;            Arts. 79–106 [passage   Sita Soren 2024 (Art. 105 Bribery)\n10       Privileges              66, passage 75,         [passage 81]; Mnemonic: LSAS<\/pre><p>passage 81]<\/p><pre>Lesson   Legislative             Arts. 107–123           Puttaswamy (Money Bill) [passage\n11       Procedure, Budget &amp;     [passage 82, passage    83]; Krishna Kumar (Ordinance)\nOrdinance               86, passage 103]        [passage 103]<\/pre><pre>Lesson   Union Judiciary         Arts. 124–147        NJAC 2015 [passage 113]; Shilpa\n12       (Supreme Court)         [passage 111,        Sailesh (Art. 142) [passage 120];<\/pre><p><b>passage 129, passage Mnemonic:<\/b> 5-10-D 145]<\/p><pre>Lesson   Comptroller and         Arts. 148–151        Telecom Spectrum Case 2014\n13       Auditor-General         [passage 130,        (Art. 149 Audit) [passage 133];\n(CAG)                   passage 133, passage Mnemonic: ADFR<\/pre><p>134]<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Module 1: Foundational Architecture (Preamble &amp; Part I: Arts 1–4)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Module 2: People, Rights &amp; Directives (Parts II, III, IV, IVA: Arts 5–51A)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Module 3: The Union Machinery (Part V: Arts 52–151) (COMPLETE!)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Module 4: The State Machinery (Part VI: Arts 152–237) (Up Next)<\/span><\/label>"}], "nchk": 4}, {"n": 14, "title": "Part VI — The State Executive (Governor, Chief Minister, Council of", "secs": [{"t": "Articles", "h": "<h4>Ministers &amp; Advocate-General: Articles<\/h4><p>152–167)<\/p><p>Part VI of the Constitution governs &quot;The States&quot; [passage 8, passage 111]. Chapter I (General) and Chapter II (The Executive) outline the constitutional and real executive authorities at the state level [passage 8, passage 10, passage 111, passage 112].<\/p><h4>PART VI CHAPTER II: THE STATE EXECUTIVE (ARTICLES 152–167)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬──────────┴──────────┬───────<\/h4><p>──────────────────────┐<\/p><pre>│   Office of the Governor │       Executive Power │      Council of Ministers &amp; │<\/pre><pre>│   &amp; Conditions            │   &amp; Clemency       │   Chief Minister        │<\/pre><pre>│   (Arts. 152–159)         │    (Arts. 160–162) │     (Arts. 163–164)         │<\/pre><h4>└─────────────────────────────┴─────────────────────┴───────<\/h4><p>──────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Advocate-General &amp; │<\/h4><pre>│ State Business     │<\/pre><pre>│ (Arts. 165–167)    │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. The Governor of a State (Articles 152–160)<\/h4><ul><li><b>Article 152:<\/b> Definition<\/li><ul><li>Defines &quot;State&quot; for Part VI [passage 111].<\/li><\/ul><li><b>Article 153:<\/b> Governors of States<\/li><ul><li>Mandates that &quot;There shall be a Governor for each State&quot; [passage 112].<\/li><li><b>Proviso (7th CAA, 1956):<\/b> Clarifies that nothing prevents the appointment of the same person as Governor for two or more States [passage 112].<\/li><\/ul><li><b>Article 154:<\/b> Executive Power of State<\/li><ul><li><b>Art. 154(1):<\/b> Vests executive power of the State in the Governor, to be exercised either directly or through officers subordinate to him in accordance with the Constitution [passage 112].<\/li><\/ul><li><b>Article 155:<\/b> Appointment of Governor<\/li><ul><li>Appointed by the President by warrant under his hand and seal [passage 113]. (Not directly elected, nor chosen by an electoral college).<\/li><\/ul><li><b>Article 156:<\/b> Term of Office of Governor<\/li><ul><li><b>Art. 156(1):<\/b> Holds office during the pleasure of the President [passage 113].<\/li><li>Resignation is addressed in writing under hand to the President [passage 113].<\/li><li><b>Art. 156(3):<\/b> Subject to the pleasure clause, holds office for a term of 5 years [passage 113], continuing until a successor enters office [passage 114].<\/li><\/ul><li><b>Article 157:<\/b> Qualifications for Appointment as Governor<\/li><ul><li>Must be a citizen of India [passage 115].<\/li><li>Must have completed 35 years of age [passage 115].<\/li><\/ul><li><b>Article 158:<\/b> Conditions of Governor&#x27;s Office<\/li><ul><li><b>Art. 158(1):<\/b> Shall not be a member of either House of Parliament or State Legislature; if appointed, deemed to have vacated his seat on entering office [passage 115].<\/li><li><b>Art. 158(2):<\/b> Shall not hold any other office of profit [passage 116].<\/li><li>Entitled to official residence (Raj Bhavan) and emoluments specified in the Second Schedule [passage 116, passage 450].<\/li><li><b>Art. 158(3A) Dual Charge Allocation:<\/b> Where one person is Governor of two or more States, emoluments/allowances are allocated among those States in proportions determined by the President by order [passage 116].<\/li><li>Emoluments and allowances shall not be diminished during the term of office [passage 117].<\/li><\/ul><li><b>Article 159:<\/b> Oath or Affirmation by the Governor<\/li><ul><li>Administered by the Chief Justice of the High Court exercising jurisdiction in relation to the State, or in his absence, the senior-most Judge of that Court available [passage 117].<\/li><li><b>Text of Oath:<\/b> To &quot;preserve, protect and defend the Constitution and the law&quot; [passage 118]. (Identical core phrasing to the Presidential Oath under Art. 60).<\/li><\/ul><li><b>Article 160:<\/b> Discharge of Functions in Contingencies<\/li><ul><li>President may make provisions for discharging Governor&#x27;s functions in unprovided contingencies [passage 119].<\/li><\/ul><\/ul><h4>B. Clemency Power &amp; Executive Extent (Articles 161–162)<\/h4><ul><li><b>Article 161:<\/b> Power of Governor to Grant Pardons, etc.<\/li><ul><li>Power to grant pardons, reprieves, respites, or remissions or to suspend, remit, or commute sentences of any person convicted of any offence against any law relating to a matter to which executive power of the State extends [passage 119].<\/li><\/ul><li><b>Article 162:<\/b> Extent of Executive Power of State<\/li><ul><li>Co-extensive with the legislative power of the State Legislature (State List &amp; Concurrent List) [passage 120].<\/li><li><b>Concurrent Proviso:<\/b> On Concurrent List matters, State executive power is subject to and limited by executive power expressly conferred on Union authorities by the Constitution or Parliamentary law [passage 120].<\/li><\/ul><\/ul><h4>C. Real Executive: CM, Cabinet &amp; Advocate-General (Articles 163–167)<\/h4><ul><li><b>Article 163:<\/b> Council of Ministers to Aid and Advise Governor<\/li><ul><li><b>Art. 163(1):<\/b> Council of Ministers with Chief Minister at the head aids and advises the Governor, EXCEPT in so far as he is by or under this Constitution required to exercise his functions or any of them in his discretion [passage 121].<\/li><li><b>Art. 163(2) Finality of Discretion:<\/b> If any question arises whether a matter is within the Governor&#x27;s discretion, the decision of the Governor in his discretion shall be final, and validity cannot be questioned [passage 121].<\/li><li><b>Art. 163(3) Judicial Immunity:<\/b> Courts cannot inquire into whether any, and if so what, advice was tendered by Ministers to the Governor [passage 122].<\/li><\/ul><li><b>Article 164:<\/b> Other Provisions as to Ministers<\/li><ul><li><b>Art. 164(1):<\/b> CM appointed by Governor; other Ministers appointed by Governor on the advice of CM [passage 122]. Ministers hold office during the pleasure of the Governor [passage 122]. 1. Tribal Welfare Minister Proviso: In Chhattisgarh, Jharkhand, Madhya Pradesh, and Odisha, there shall be a Minister in charge of tribal welfare [passage 122].<\/li><li><b>Art. 164(1A) Size Cap (91st CAA, 2003):<\/b> Total number of Ministers (including CM) in a State shall not exceed 15% of total members of the Legislative Assembly, provided that the number shall not be less than 12 [passage 123].<\/li><li><b>Art. 164(2) Collective Responsibility:<\/b> Council of Ministers is collectively responsible to the Legislative Assembly of the State [passage 124].<\/li><li><b>Art. 164(3):<\/b> Oath administered by Governor according to the Third Schedule [passage 124, passage 458].<\/li><li><b>Art. 164(4):<\/b> A Minister who is not a member of the State Legislature for 6 consecutive months ceases to be a Minister [passage 125].<\/li><\/ul><li><b>Article 165:<\/b> Advocate-General for the State<\/li><ul><li><b>Art. 165(1):<\/b> Appointed by the Governor; must be a person qualified to be appointed a Judge of a High Court [passage 126]. (Citizen of India, and held judicial office or practiced as HC advocate for at least 10 years) [passage 184, passage 185].<\/li><li><b>Art. 165(2) &amp; (3):<\/b> Legal advisor to State Government; holds office during the pleasure of the Governor [passage 126, passage 127].<\/li><\/ul><li><b>Article 166:<\/b> Conduct of Business of the Government of a State<\/li><ul><li><b>Art. 166(1):<\/b> Executive action expressed to be taken in the name of the Governor [passage 127].<\/li><li><b>Art. 166(3):<\/b> Governor makes rules for convenient transaction of business (Rules of Business) [passage 128].<\/li><\/ul><li><b>Article 167:<\/b> Duties of Chief Minister as Respects Furnishing Information<\/li><ul><li>Duty of Chief Minister [passage 128, passage 129]: 1. Art. 167(a): Communicate all Cabinet decisions regarding administration and legislation to the Governor [passage 129]. 2. Art. 167(b): Furnish administrative/legislative information called for by the Governor [passage 129]. 3. Art. 167(c): Submit for Cabinet consideration any decision taken by an individual Minister that has not been considered by the Council [passage 129].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> Core Sequence of Articles 153 to 167 — &quot;G-E-A-T-Q-C-O-D-P-E-A-M-A-B-D&quot;<\/p><ul><li><b>153:<\/b> Governor of State [passage 112]<\/li><li><b>154:<\/b> Executive Power vested [passage 112]<\/li><li><b>155:<\/b> Appointment by President [passage 113]<\/li><li><b>156:<\/b> Term / Pleasure of President [passage 113]<\/li><li><b>157:<\/b> Qualifications (Citizen + 35 Years) [passage 115]<\/li><li><b>158:<\/b> Conditions of Office [passage 115]<\/li><li><b>159:<\/b> Oath by HC Chief Justice [passage 117]<\/li><li><b>161:<\/b> Pardoning / Clemency Power [passage 119]<\/li><li><b>163:<\/b> Aid and Advice (Discretionary Clause) [passage 121]<\/li><li><b>164:<\/b> Ministers &amp; 15% Size Limit [passage 122, passage 123]<\/li><li><b>165:<\/b> Advocate-General [passage 126]<\/li><li><b>166:<\/b> Business Conduct [passage 127]<\/li><li><b>167:<\/b> Duties of CM to inform Governor [passage 128, passage 129]<\/li><\/ul><p><b>Mnemonic 2:<\/b> Tribal Welfare Minister Mandatory States (Art. 164(1) Proviso) — &quot;C-J-M-O&quot;<\/p><ul><li>Chhattisgarh, Jharkhand, Madhya Pradesh, Odisha [passage 122].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 153 Proviso:<\/b> இரண்டு மாநில ஆளுநர் (Dual Charge) → ஒரே நபர் இரண்டு அல்லது அதற்கு மேற்பட்ட மாநிலங்களுக்கு ஆளுநராக செயல்படலாம் [passage 112].<\/li><li><b>Art. 163(1):<\/b> தன்னதிகாரம் (Constitutional Discretion) → குடியரசுத் தலைவரை விட ஆளுநருக்கு அரசியலமைப்பில் வெளிப்படையான தன்னதிகாரம் உள்ளது [passage 121].<\/li><li><b>Art. 164(1A):<\/b> 15% மற்றும் 12 எல்லை (Size Limit) → அமைச்சர்கள் எண்ணிக்கை சட்டப்பேரவையில் 15% மிகக்கூடாது, 12க்கு குறையக்கூடாது [passage 123].<\/li><li><b>Art. 165:<\/b> மாநில தலைமை வழக்கறிஞர் (Advocate-General) → மாநில அரசின் முதன்மை சட்ட ஆலோசகர் [passage 126].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>PRESIDENT vs. GOVERNOR CONSTITUTIONAL COMPARISON MATRIX<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                    │<\/pre><pre>PRESIDENT OF INDIA (PART V)                        GOVERNOR OF A STATE (PART VI)<\/pre><pre>✦ Art. 52 — Head of Union Republic                ✦ Art. 153 — Head of State Executive<\/pre><pre>✦ Art. 54 — Elected by Electoral College          ✦ Art. 155 — Appointed directly by<\/pre><p>President<\/p><pre>✦ Art. 61 — Impeached by Parliament                ✦ Art. 156 — Removed at Pleasure of<\/pre><p>President<\/p><pre>✦ Art. 72 — Pardon for Death &amp; Court Martial        ✦ Art. 161 — NO power over Court Martial<\/pre><p>or Death Pardon<\/p><pre>✦ Art. 74 — NO explicit discretionary text       ✦ Art. 163 — EXPLICIT Constitutional<\/pre><p>Discretion text<\/p><h4>A. Discretionary Text Paradox (Art. 74(1) vs. Art. 163(1))<\/h4><ul><li>Article 74(1) contains no textual mention of explicit discretion for the President [passage 59].<\/li><li>Article 163(1) explicitly provides that the Governor must act on aid and advice &quot;except in so far as he is by or under this Constitution required to exercise his functions or any of them in his discretion&quot; [passage 121].<\/li><li>Furthermore, under Article 163(2), if any question arises whether a matter falls under discretion, the Governor&#x27;s decision is final and non-questionable [passage 121].<\/li><\/ul><h4>B. Pardoning Power Divergence (Art. 72 vs. Art. 161)<\/h4><ul><li><b>Death Sentence:<\/b> The President under Article 72 has exclusive power to pardon death sentences [passage 56]. The Governor under Article 161 cannot fully pardon a death sentence (can only suspend, remit, or commute) [passage 119].<\/li><li><b>Court Martial:<\/b> President can pardon Court Martial sentences [passage 56]. Governor has no power over Court Martial sentences [passage 119].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Pleasure Doctrine Limits &amp; Removal Security:<\/h4><ul><ul><li><b>B.P. Singhal v. Union of India (2010):<\/b> A 5-judge Constitution Bench held that while the President can remove a Governor at pleasure under Article 156(1) [passage 113] without assigning reasons, this power is not absolute or arbitrary. Removal cannot be based on whimsical, arbitrary, or partisan political reasons. If a prima facie case of arbitrary removal is established, courts can compel the Union to produce records. 2. Constitutional Discretion &amp; Floor Test Mandate:<\/li><li><b>S.R. Bommai v. Union of India (1994):<\/b> Held that the assessment of whether a Ministry enjoys majority support must be tested ONLY on the floor of the Legislative Assembly (Floor Test), not in the Raj Bhavan.<\/li><li><b>Nabam Rebia v. Deputy Speaker (2016):<\/b> A 5-judge bench ruled that the Governor&#x27;s discretion under Article 163 [passage 121] is strictly bounded. The Governor cannot summon or prorogue the Assembly under Article 174 [passage 138, passage 139] without Cabinet advice when the Ministry enjoys majority. 3. Pardoning Power &amp; Statutory Bars (Article 161):<\/li><li>State of Haryana v. Nathi Ram (2021) &amp; Maru Ram (1980): The Supreme Court affirmed that the Governor&#x27;s pardoning power under Article 161 [passage 119] is exercised on the aid and advice of the State Cabinet, not in personal discretion.<\/li><li><b>Subhash Sharma Case (2021):<\/b> The SC held that the Governor&#x27;s power under Article 161 [passage 119] to grant remissions overrides statutory bars under Section 433A of the CrPC.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> The Office of the Governor, Federal Friction, and Executive Discretion<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Chapter II of Part VI (Articles 152–167) structures the State Executive, establishing the Governor as a dual entity—functioning as the constitutional Head of State and as a vital link to the Union under Article 155 [passage 112, passage 113]. Governed by parliamentary cabinet principles under Article 163(1) [passage 121] and collective responsibility under Article 164(2) [passage 124], this design balances state autonomy with federal integrity.&quot;<\/p><ul><li>Mains Body Arguments (Arbitrary Removal &amp; Discretionary Bounds):<\/li><ul><li><b>Protection Against Arbitrary Dismissal:<\/b> Cite B.P. Singhal (2010) to demonstrate that Article 156(1) [passage 113] pleasure doctrine does not legitimize political dismissals, enforcing judicial scrutiny against arbitrariness (Art. 14) [passage 45].<\/li><li><b>Floor Test Norm:<\/b> Reference S.R. Bommai (1994) and Nabam Rebia (2016) to explain that discretion under Article 163 [passage 121] cannot override the democratic mandate of the Legislative Assembly under Article 164(2) [passage 124].<\/li><li><b>Cabinet Size &amp; Reform:<\/b> Highlight Article 164(1A) [passage 123] (91st CAA 2003) capping state ministries at 15% to streamline executive functioning.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, implementing the Sarkaria and Punchhi Commission recommendations to appoint non-partisan figures as Governors will insulate the Raj Bhavan from political controversies and preserve cooperative federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the minimum floor number of Ministers (including the CM) specified in the proviso to Article 164(1A) for a State Cabinet? [passage 123] 2. Reverse Recall: Which Article explicitly states that the decision of the Governor on whether a matter falls within his discretion shall be final? [passage 121] 3. UPSC Prelims Analytical Trap: Does the Advocate-General for a State (Article 165) [passage 126] enjoy security of tenure like a High Court Judge? How is their remuneration determined? [passage 127] 4. Mains Applied Question: Discuss the constitutional limits of the Governor&#x27;s pleasure doctrine under Article 156(1) [passage 113] in light of the Supreme Court&#x27;s decision in B.P. Singhal v. Union of India (2010).<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; VP (Articles 52–73) (Lesson 8)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part V: Council of Ministers, PM &amp; AG (Articles 74–78) (Lesson 9)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part V: Parliament (Articles 79–106) (Lesson 10)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part V: Legislative Procedure, Money Bills &amp; Ordinances (Articles 107–123)<\/span><\/label><p>(Lesson 11)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part V: The Union Judiciary — Supreme Court (Articles 124–147) (Lesson 12)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part V: Comptroller and Auditor-General (Articles 148–151) (Lesson 13
