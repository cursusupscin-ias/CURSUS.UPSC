ticle 357:<\/li><li>When State Government machinery fails, Parliament exercises or delegates the legislative power of the State Legislature [passage 360, passage 362].<\/li><\/ul><li><b>Article 251:<\/b> Inconsistency Between Parliamentary Laws under Arts. 249/250 and State Laws<\/li><ul><li>State Legislature retains power to make laws on State List, but in case of repugnancy, Parliamentary law prevails so long as it continues to have effect [passage 252].<\/li><\/ul><li><b>Article 254:<\/b> Repugnancy Between Parliamentary Laws and State Laws on Concurrent List<\/li><ul><li><b>Art. 254(1) General Rule:<\/b> If any provision of a State law is repugnant to a Parliamentary law or existing law on List III (Concurrent List), the Parliamentary law prevails and the State law is void to the extent of repugnancy [passage 255].<\/li><li><b>Art. 254(2) Presidential Assent Exception:<\/b> If a State law on a Concurrent List subject contains provisions repugnant to an earlier Parliamentary law, the State law SHALL PREVAIL IN THAT STATE IF IT HAS BEEN RESERVED FOR CONSIDERATION OF THE PRESIDENT AND HAS RECEIVED HIS ASSENT [passage 256].<\/li><li><b>Parliamentary Override Proviso:<\/b> Nothing in Art. 254(2) prevents Parliament from enacting a subsequent law to add to, amend, vary, or repeal such State law [passage 256].<\/li><\/ul><li><b>Article 255:<\/b> Procedural Sanctions as Recommendations Only<\/li><ul><li>Failure to obtain prior recommendation or sanction of the Governor/President does not invalidate an Act if final assent was given by the required authority [passage 257, passage 258].<\/li><\/ul><\/ul><h4>B. Chapter II: Administrative Relations (Articles 256–263)<\/h4><ul><li><b>Article 256:<\/b> Obligation of States and the Union<\/li><ul><li>State executive power must be exercised to ensure compliance with Parliamentary laws [passage 258, passage 259]. Union executive power extends to giving directions to a State for that purpose [passage 259].<\/li><\/ul><li><b>Article 257:<\/b> Control of the Union Over States in Certain Cases<\/li><ul><li><b>Art. 257(1) Non-Impediment Rule:<\/b> State executive power must be exercised so as not to impede or prejudice Union executive power; Union may give directions [passage 259].<\/li><li><b>Art. 257(2) &amp; (3) Specific Directions:<\/b> Union directions for construction/maintenance of means of communication declared of national or military importance [passage 259] and protection of railways [passage 259].<\/li><li><b>(Note:<\/b> Non-compliance with directions under Art. 256/257 triggers Article 365, rendering it lawful for the President to hold that State Government cannot be carried on under the Constitution, inviting Article 356) [passage 37, passage 360].<\/li><\/ul><li><b>Articles 258 &amp; 258A:<\/b> Delegation / Entrustment of Functions<\/li><ul><li>Art. 258(1) Union to State (Executive Consent): President may, with consent of the State Government, entrust Union executive functions to that State [passage 260].<\/li><li>Art. 258(2) Union to State (Statutory Mandate): Parliamentary law may confer powers and impose duties on a State without requiring its consent [passage 261].<\/li><li><b>Art. 258A State to Union (Executive Consent):<\/b> Governor of a State may, with consent of the Government of India, entrust State executive functions to the Union [passage 262].<\/li><\/ul><li><b>Article 261:<\/b> Public Acts, Records, and Judicial Proceedings<\/li><ul><li><b>Art. 261(1) Full Faith &amp; Credit Clause:<\/b> Full faith and credit shall be given throughout India to public acts, records, and judicial proceedings of the Union and every State [passage 264].<\/li><li><b>Art. 261(3) Execution of Decrees:<\/b> Final civil court judgments passed anywhere in India are capable of execution anywhere within the territory [passage 265].<\/li><\/ul><li><b>Article 262:<\/b> Adjudication of Inter-State Water Disputes<\/li><ul><li><b>Art. 262(1):<\/b> Parliament may by law provide for the adjudication of any dispute/complaint regarding the use, distribution, or control of waters of any inter-State river or river valley [passage 265].<\/li><li><b>Art. 262(2) Court Exclusion Bar:<\/b> Notwithstanding anything in the Constitution, Parliament may by law provide that NEITHER the Supreme Court NOR any other court shall exercise jurisdiction in respect of any such dispute or complaint [passage 265]. (Enacted: Inter-State River Water Disputes Act, 1956).<\/li><\/ul><li><b>Article 263:<\/b> Provisions With Respect to an Inter-State Council<\/li><ul><li>President may by order establish an Inter-State Council if public interest would be served, charged with inquiring into disputes, investigating subjects of common interest, and recommending better policy co-ordination [passage 266, passage 267]. (Set up in 1990 based on Sarkaria Commission recommendations).<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> Five Parliamentary Bridges to State List (Articles 249, 250, 252, 253, 356)<\/p><ul><li><b>Mnemonic:<\/b> &quot;N-E-C-I-P&quot; (&quot;National, Emergency, Consent, International, President&#x27;s Rule&quot;)<\/li><ul><li><b>249 (N):<\/b> National Interest (2/3rd RS Resolution) [passage 250]<\/li><li><b>250 (E):<\/b> Emergency Proclamation (Art. 352) [passage 251]<\/li><li><b>252 (C):<\/b> Consent of 2+ States [passage 253]<\/li><li><b>253 (I):<\/b> International Agreements [passage 254]<\/li><li><b>356 (P):<\/b> President&#x27;s Rule [passage 360]<\/li><\/ul><\/ul><h4>Mnemonic 2: Administrative Coordination Sequence (Articles 256–263)<\/h4><ul><li><b>256:<\/b> Compliance Directions [passage 258, passage 259]<\/li><li><b>257:<\/b> Non-impediment &amp; Railways Directions [passage 259]<\/li><li><b>258 / 258A:<\/b> Delegation of functions (Union ↔ State) [passage 260, passage 262]<\/li><li><b>261:<\/b> Full Faith &amp; Credit [passage 264]<\/li><li><b>262:<\/b> Water Disputes (Courts Barred) [passage 265]<\/li><li><b>263:<\/b> Inter-State Council [passage 266]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 246A:<\/b> ஜி.எஸ்.டி அதிகாரம் (GST Power) → மத்திய-மாநில அரசுகளின் ஒரே நேரத்திலான சட்ட அதிகாரம் [passage 247].<\/li><li><b>Art. 254(2):<\/b> குடியரசுத் தலைவர் ஒப்புதல் விலக்கு (Presidential Assent Exception) → பொதுப்பட்டியலில் குடியரசுத் தலைவர் ஒப்புதல் பெற்ற மாநிலச் சட்டம் அம்மாநிலத்தில் செல்லும் [passage 256].<\/li><li><b>Art. 262:<\/b> நதிநீர்ச் சிக்கல் (River Water Dispute Bar) → நதிநீர் வழக்குகளில் உச்சநீதிமன்றத் தடை [passage 265].<\/li><li><b>Art. 263:<\/b> மாநிலங்களுக்கு இடையேயான கவுன்சில் (Inter-State Council) → குடியரசுத் தலைவரால் உருவாக்கப்படும் ஒருங்கிணைப்புக் குழு [passage 266].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>ARTICLE 254 REPUGNANCY &amp; ASSENT EXCEPTION MECHANISM<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                    │<\/pre><pre>ARTICLE 254(1): GENERAL UNION PRIMACY                        ARTICLE 254(2): PRESIDENTIAL<\/pre><p>ASSENT PROVISO<\/p><pre>✦ Conflict between Union &amp; State law on List III      ✦ State law on List III repugnant to Union<\/pre><p>law<\/p><pre>✦ Union law prevails; State law void to extent       ✦ Reserved for President &amp; receives<\/pre><p>Presidential Assent<\/p><pre>of repugnancy                            ✦ State law PREVAILS in that State<\/pre><h4>───────────────────────────────────────────────────────┴────<\/h4><p>─────────────────────────────────────<\/p><h4>PARLIAMENTARY OVERRIDE PROVISO (Art. 254(2) Proviso)<\/h4><p>✦ Parliament can enact a subsequent law at any time to add to, amend, vary, or repeal the State law<\/p><h4>The Enforcement Chain: Directions → Sanctions → Emergency<\/h4><p>\\[\\text{Art. 256 / 257 Directions} \\xrightarrow{\\text{Non-Compliance}} \\text{Art. 365 (Lawful Failure Presumption)} \\xrightarrow{\\text{Enforcement}} \\text{Art. 356 (President&#x27;s Rule)}\\] [passage 37, passage 258, passage 259, passage 360]<\/p>"}, {"t": "Cases", "h": "<p>1. Doctrine of Pith and Substance &amp; Colourable Legislation (Article 246):<\/p><ul><ul><li><b>State of Bombay v. F.N. Balsara (1951):<\/b> To determine which list a law falls under, courts look at its true nature and character (Pith and Substance), not incidental encroachments into another list.<\/li><li>K.C. Gajapati Narayan Deo v. State of Orissa (1953): A legislature cannot do indirectly what it cannot do directly (Colourable Legislation). 2. Repugnancy Test under Article 254:<\/li><li><b>M. Karunanidhi v. Union of India (1979):<\/b><\/li><ul><li><b>Established tests for repugnancy:<\/b> (i) Direct inconsistency between provisions, (ii) Parliament&#x27;s intent to occupy the entire field, or (iii) Inconsistency in exercising identical rights. 3. GST Council &amp; Cooperative Federalism (Article 246A):<\/li><\/ul><li><b>Union of India v. Mohit Minerals (2022):<\/b> The Supreme Court held that Article 246A grants simultaneous legislative power to Union and States [passage 247]. Recommendations of the GST Council under Article 279A are advisory, maintaining the federal balance between Parliament and State Assemblies. 4. Water Dispute Bar &amp; SC Jurisdiction (Article 262):<\/li><li>Cauvery Water Disputes Tribunal Re (1993) &amp; State of Tamil Nadu v. State of Karnataka (2018): SC held that while Article 262(2) bars courts from adjudicating water disputes directly [passage 265], once an arbitral tribunal issues its final award, the award becomes enforceable, and SC retains jurisdiction under Article 136 to hear appeals against tribunal decisions.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Cooperative vs. Assertive Federalism, Repugnancy Mechanics, and Inter-State Water Disputes<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XI (Articles 245–263) establishes the legislative and administrative spine of Indian federalism [passage 20, passage 22, passage 245, passage 258]. Designed with unitary tilt under Article 248 (Residuary Powers) [passage 250] and Articles 256/257 (Union Directions) [passage 258, passage 259], this structure balances national integration with state autonomy through cooperative bodies like the Inter-State Council (Article 263) [passage 266].&quot;<\/p><ul><li>Mains Body Arguments (Legislative Primacy &amp; Administrative Synergy):<\/li><ul><li><b>Simultaneous Tax Autonomy:<\/b> Reference Mohit Minerals (2022) and Article 246A [passage 247] to show how GST represents a unique model of cooperative federalism requiring fiscal consensus.<\/li><li><b>Judicial Bar over Water:<\/b> Analyze Article 262 [passage 265] excluding court jurisdiction to promote specialized tribunal resolution, while emphasizing the need to enforce final tribunal awards under Article 136.<\/li><li><b>Institutionalizing Coordination:<\/b> Highlight the Sarkaria and Punchhi Commission recommendations to transform the Inter-State Council (Article 263) [passage 266] into a active forum for federal dispute resolution.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, transitioning from central directions under Article 256 [passage 258] to consensual deliberation under Article 263 [passage 266] will strengthen cooperative federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact voting majority requirement in the Rajya Sabha for passing a resolution to authorize Parliament to legislate on a State List subject under Article 249? [passage 250] 2. Reverse Recall: Under which Article does a State law on a Concurrent List subject prevail in that State if it contains provisions repugnant to an earlier Parliamentary law but has received Presidential Assent? [passage 256] 3. UPSC Prelims Analytical Trap: Can a State Legislature amend or repeal a Parliamentary Act enacted under Article 252 (Legislation by Consent of two or more States)? [passage 253, passage 254] 4. Mains Applied Question: Discuss the constitutional mechanism for resolving inter-state river water disputes under Article 262 [passage 265] and the scope of judicial review over tribunal awards.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Legislative &amp; Administrative Relations (Articles 245–263)<\/span><\/label><p>(Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, Finance Commission, Borrowing &amp; Property<\/span><\/label><p>(Articles 264–300A) (Up Next)<\/p>"}], "nchk": 12}, {"n": 20, "title": "Part XII — Centre-State Financial Relations, Finance Commission,", "secs": [{"t": "Articles", "h": "<h4>Borrowing &amp; Right to Property (Articles<\/h4><p>264–300A)<\/p><p>Part XII of the Constitution governs fiscal federalism, public funds, tax distribution, government borrowing, state liability, and the constitutional right to property across four chapters [passage 28, passage 217, passage 260, passage 262, passage 274].<\/p><h4>PART XII: FINANCE, PROPERTY, CONTRACTS AND SUITS (ARTICLES 264–300A)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬──────────────────┴──────────<\/h4><p>────────┬─────────────────────────────┐<\/p><pre>│ Chapter I: Finance        │ Tax Devolution &amp; GST              │ Chapter II: Borrowing      │<\/pre><pre>│ (Arts. 264–267)          │ (Arts. 268–281)               │ (Arts. 292–293)          │<\/pre><h4>└─────────────────────────────┴─────────────────────────────<\/h4><p>────────┴─────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Chapters III &amp; IV: │<\/h4><p>│ Suits &amp; Property │<\/p><h4>│ (Arts. 294–300A) │<\/h4><h4>└─────────────────────┘<\/h4><h4>A. Chapter I: Finance — General &amp; Funds (Articles 264–267)<\/h4><ul><li><b>Article 264:<\/b> Interpretation<\/li><ul><li>Defines &quot;Finance Commission&quot; as the Finance Commission constituted under Article 280 [passage 217, passage 245].<\/li><\/ul><li><b>Article 265:<\/b> Taxes Not to be Imposed Save by Authority of Law<\/li><ul><li>Mandates that &quot;No tax shall be levied or collected except by authority of law&quot; [passage 217].<\/li><li>(Executive orders or administrative instructions cannot impose a tax without statutory authorization).<\/li><\/ul><li><b>Article 266:<\/b> Consolidated Funds and Public Accounts of India and of the States<\/li><ul><li><b>Art. 266(1) Consolidated Fund:<\/b> All revenues received, loans raised (treasury bills, ways and means advances), and loan repayments received by GoI form the Consolidated Fund of India; similarly for States, forming the Consolidated Fund of the State [passage 218].<\/li><li><b>Art. 266(2) Public Account:<\/b> All other public moneys received by or on behalf of GoI or a State (e.g., provident fund deposits, judicial deposits, savings bank deposits) are credited to the Public Account of India or Public Account of the State [passage 219, passage 252].<\/li><li><b>Art. 266(3) Appropriation Mandate:<\/b> No money out of the Consolidated Fund of India or a State shall be appropriated except in accordance with law (Appropriation Act) [passage 96, passage 135, passage 219]. Executive can withdraw from Public Account without parliamentary vote.<\/li><\/ul><li><b>Article 267:<\/b> Contingency Fund<\/li><ul><li><b>Art. 267(1) Contingency Fund of India:<\/b> Parliament may by law establish an imprest fund placed at the disposal of the President to meet unforeseen expenditure pending parliamentary authorization under Article 115 or 116 [passage 98, passage 219].<\/li><li><b>Art. 267(2) Contingency Fund of the State:<\/b> State Legislature may establish an imprest fund placed at the disposal of the Governor [passage 220].<\/li><\/ul><\/ul><p>B. Distribution of Revenues &amp; GST Mechanism (Articles 268–281)<\/p><ul><li><b>Article 268:<\/b> Duties Levied by the Union but Collected and Appropriated by the States<\/li><ul><li>Stamp duties on Union List items are levied by GoI but collected and retained by States (within UTs, collected by GoI) [passage 221]. Proceeds do not form part of the Consolidated Fund of India [passage 222].<\/li><\/ul><li><b>Article 269:<\/b> Taxes Levied and Collected by the Union but Assigned to the States<\/li><ul><li>Taxes on inter-State sale/purchase of goods (other than newspapers) and consignment of goods are levied and collected by GoI, but assigned to the States [passage 224].<\/li><\/ul><li><b>Article 269A:<\/b> Levy and Collection of Goods and Services Tax in Inter-State Trade or Commerce (IGST)<\/li><ul><li>Inserted by the 101st CAA, 2016 [passage 225, passage 226].<\/li><li>Goods and services tax on inter-State trade/commerce (IGST) is levied and collected by GoI and apportioned between Union and States based on law enacted on recommendations of the GST Council [passage 225]. Import of goods/services is deemed inter-State supply [passage 227].<\/li><\/ul><li><b>Article 270:<\/b> Taxes Levied and Distributed Between the Union and the States (Divisible Pool)<\/li><ul><li>All Union List taxes/duties (except Arts. 268, 269, 269A, surcharges under Art. 271, and specific cesses) are collected by GoI and distributed between Union and States [passage 228]. Prescribed percentage distributed on the recommendations of the Finance Commission [passage 231, passage 232].<\/li><\/ul><li><b>Article 271:<\/b> Surcharge on Certain Duties and Taxes for Purposes of the Union<\/li><ul><li>Parliament may at any time increase any duties/taxes (except GST under Art. 246A) by a surcharge exclusively for the Union [passage 232]. Whole proceeds form part of the Consolidated Fund of India and are not shared with States [passage 232].<\/li><\/ul><li><b>Article 274:<\/b> Prior Recommendation of President Required to Tax Bills Affecting States<\/li><ul><li>No Bill/amendment affecting taxes in which States are interested, agricultural income definitions, or Union surcharges can be introduced in Parliament except on the recommendation of the President [passage 235].<\/li><\/ul><li><b>Article 275:<\/b> Grants from the Union to Certain States (Statutory Grants-in-Aid)<\/li><ul><li>Charged on the Consolidated Fund of India as grants-in-aid to States determined by Parliament to be in need of assistance [passage 236].<\/li><li><b>Mandatory Provisos:<\/b> Specific grants for promoting welfare of Scheduled Tribes or raising administration levels of Scheduled Areas [passage 236, passage 237]. Orders made after considering Finance Commission recommendations [passage 238].<\/li><\/ul><li><b>Article 276:<\/b> Taxes on Professions, Trades, Callings and Employments<\/li><ul><li>State/local laws imposing taxes on professions, trades, callings, or employments are valid even if relating to income tax [passage 238].<\/li><li><b>Ceiling Limit [Art. 276(2)]:<\/b> Maximum total amount payable per person per annum shall NOT exceed Rs. 2,500 (raised from Rs. 250 by 60th CAA, 1988) [passage 239, passage 243].<\/li><\/ul><li><b>Article 279A:<\/b> Goods and Services Tax Council (GST Council)<\/li><ul><li>Inserted by 101st CAA, 2016 [passage 243].<\/li><li><b>Composition [Art. 279A(2)]:<\/b> Union Finance Minister (Chairperson), Union Minister of State for Finance, and State Finance/Taxation Ministers [passage 243].<\/li><li><b>Voting Structure [Art. 279A(9)]:<\/b> Decisions taken by a 3/4th weighted majority of members present and voting: 1. Central Government vote weightage = 1/3rd of total votes cast [passage 244]. 2. State Governments vote weightage = 2/3rds of total votes cast [passage 244].<\/li><\/ul><li><b>Article 280:<\/b> Finance Commission<\/li><ul><li><b>Art. 280(1) Constitution &amp; Tenure:<\/b> Constituted by the President every 5th year (or earlier) [passage 245, passage 246]. Consists of a Chairman and 4 other members appointed by the President [passage 246].<\/li><li><b>Art. 280(2):<\/b> Parliament determines qualifications by law (Finance Commission (Miscellaneous Provisions) Act, 1951).<\/li><li><b>Art. 280(3) Four Mandated Duties:<\/b> Recommends to the President as to [passage 246]: 1. (a) Distribution of net tax proceeds between Union and States (Vertical Devolution) and allocation among States (Horizontal Devolution) [passage 247]. 2. (b) Principles governing grants-in-aid under Article 275 [passage 236, passage 247]. 3. (bb) &amp; (c) Measures needed to augment State Consolidated Funds to supplement Panchayats (73rd CAA) and Municipalities (74th CAA) based on State Finance Commission recommendations [passage 247, passage 248]. 4. (d) Any other matter referred in the interests of sound finance [passage 248].<\/li><\/ul><li><b>Article 281:<\/b> Recommendations of the Finance Commission<\/li><ul><li>President causes every FC recommendation with an explanatory memorandum to be laid before each House of Parliament [passage 249].<\/li><\/ul><li><b>Article 282:<\/b> Discretionary Grants<\/li><ul><li>Union or State may make grants for any public purpose, notwithstanding that the purpose is outside its legislative sphere [passage 249, passage 250].<\/li><\/ul><li><b>Articles 285 &amp; 289:<\/b> Mutual Tax Exemption of Union and State Properties<\/li><ul><li><b>Article 285:<\/b> Property of the Union is exempt from all State/local taxation [passage 253].<\/li><li><b>Article 289:<\/b> Property and income of a State are exempt from Union taxation [passage 256]. (Exception: Union can tax trade/business carried on by a State unless declared incidental to ordinary functions) [passage 256, passage 257].<\/li><\/ul><\/ul><h4>C. Chapter II: Borrowing (Articles 292–293)<\/h4><ul><li><b>Article 292:<\/b> Borrowing by the Government of India<\/li><ul><li>Union executive power extends to borrowing upon the security of the Consolidated Fund of India within limits fixed by Parliament by law [passage 260]. (Can borrow domestically or externally).<\/li><\/ul><li><b>Article 293:<\/b> Borrowing by States<\/li><ul><li><b>Art. 293(1) Territorial Limit:<\/b> States can borrow ONLY WITHIN THE TERRITORY OF INDIA upon security of the State Consolidated Fund within limits fixed by State Legislature [passage 261]. (States cannot raise foreign loans directly).<\/li><li>Art. 293(3) &amp; (4) Mandatory Central Consent Clause: A State CANNOT raise any loan without Central consent if there is still outstanding any part of a loan made to the State by GoI or in respect of which GoI has given a guarantee [passage 262]. Central consent may impose conditions [passage 262].<\/li><\/ul><\/ul><p><b>D. Chapters III &amp; IV:<\/b> Property, Suits &amp; Right to Property (Articles 294–300A)<\/p><ul><li><b>Articles 294–297:<\/b> Succession &amp; Ocean Resources<\/li><ul><li><b>Art. 296 Escheat &amp; Bona Vacantia:<\/b> Property accruing by escheat, lapse, or bona vacantia (want of rightful owner) vests in the State where situated, otherwise in the Union [passage 268].<\/li><li><b>Art. 297 Maritime Resources:<\/b> All lands, minerals, and things of value underlying ocean waters within territorial waters, continental shelf, or Exclusive Economic Zone (EEZ) vest exclusively in the Union [passage 269, passage 270].<\/li><\/ul><li><b>Article 298:<\/b> Executive Power to Carry on Trade<\/li><ul><li>Executive power of Union and States extends to carrying on trade/business, acquiring property, and making contracts [passage 270].<\/li><\/ul><li><b>Article 299:<\/b> Government Contracts<\/li><ul><li>Contracts made in exercise of executive power must be expressed to be made by the President or Governor and executed by authorized persons [passage 272]. President/Governor is not personally liable [passage 273].<\/li><\/ul><li><b>Article 300:<\/b> Suits and Proceedings<\/li><ul><li>Government of India may sue or be sued as &quot;Union of India&quot;; State Government as the name of the State [passage 273]. (Governs tortious and contractual liability of the State).<\/li><\/ul><li><b>Article 300A:<\/b> Persons Not to be Deprived of Property Save by Authority of Law<\/li><ul><li>Inserted by the 44th Constitutional Amendment Act, 1978 [passage 58, passage 64, passage 274, passage 275].<\/li><li><b>Text:<\/b> &quot;No person shall be deprived of his property save by authority of law.&quot; [passage 274]<\/li><li><b>Constitutional Shift:<\/b> Transformed the Right to Property from a Fundamental Right (former Articles 19(1)(f) and 31) [passage 4, passage 57, passage 64] into a Constitutional / Legal Right under Part XII [passage 28, passage 274].<\/li><li><b>Legal Effect:<\/b> Cannot be enforced directly via Article 32 writ petition (must use Art. 226 or ordinary civil suit) [passage 73, passage 145]; however, executive deprivation without legislative authority violates Article 300A [passage 274].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<p><b>Mnemonic 1:<\/b> Core Financial Sequence (Articles 265 to 280) — &quot;L-C-C-D-G-F&quot;<\/p><ul><li><b>265:<\/b> Law required for Tax [passage 217]<\/li><li><b>266:<\/b> Consolidated Fund &amp; Public Account [passage 218, passage 219]<\/li><li><b>267:<\/b> Contingency Fund [passage 219, passage 220]<\/li><li><b>270:<\/b> Divisible Tax Pool [passage 228, passage 231]<\/li><li><b>275:<\/b> Grants-in-aid [passage 236]<\/li><li><b>280:<\/b> Finance Commission [passage 245, passage 246]<\/li><\/ul><h4>Mnemonic 2: Finance Commission Duties (Art. 280(3)) — &quot;V-H-L-S&quot;<\/h4><ul><li>Vertical &amp; Horizontal Tax Distribution [passage 247]<\/li><li>Help / Grants-in-Aid Principles (Art. 275) [passage 236, passage 247]<\/li><li>Local Bodies Augmentation (Panchayats &amp; Municipalities) [passage 247, passage 248]<\/li><li>Sound Finance References [passage 248]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 265:<\/b> சட்டம் இன்றி வரி இல்லை (No Tax Save by Law) → நிர்வாக உத்தரவு மூலம் வரி விதிக்க முடியாது [passage 217].<\/li><li><b>Art. 279A:<\/b> ஜிஎஸ்டி கவுன்சில் (GST Council) → 3/4 பங்கு பெரும்பான்மை வாக்கு முறைமை [passage 243, passage 244].<\/li><li><b>Art. 280:<\/b> நிதி ஆணையம் (Finance Commission) → 5 ஆண்டுகளுக்கு ஒருமுறை குடியரசுத் தலைவரால் அமைக்கப்படும் [passage 245, passage 246].<\/li><li><b>Art. 300A:<\/b> சொத்துரிமை (Right to Property) → 44-வது திருத்தம் (1978) மூலம் அடிப்படை உரிமையிலிருந்து சட்ட உரிமையாக மாற்றப்பட்டது [passage 58, passage 64, passage 274].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>EVOLUTION OF THE RIGHT TO PROPERTY<\/h4><h4>│<\/h4><h4>┌────────────────────────────────┴──────────────────────────<\/h4><p>──────┐<\/p><pre>│                                         │<\/pre><pre>ORIGINAL POSITION (1950–1979)                       CURRENT POSITION (1979–PRESENT)<\/pre><pre>✦ Fundamental Right under Art. 19(1)(f) &amp; Art. 31     ✦ Constitutional / Legal Right under Art.<\/pre><p>300A<\/p><pre>✦ Enforceable via Supreme Court (Art. 32)           ✦ Enforceable via High Court (Art. 226) /<\/pre><p>Civil Suits<\/p><pre>✦ Required explicit constitutional compensation       ✦ Requires statutory &quot;Authority of Law&quot;<\/pre><p>and<\/p><pre>guarantees                              fair procedure<\/pre><p>1. Article 280 (FC) vs. Article 279A (GST Council) [Fiscal Dual Architecture]<\/p><ul><li><b>Finance Commission (Art. 280):<\/b> Advisory body appointed every 5 years [passage 245, passage 246]; handles overall tax devolution and statutory grants [passage 236, passage 247].<\/li><li><b>GST Council (Art. 279A):<\/b> Permanent joint decision-making body on GST rates, exemptions, and floor bands [passage 243, passage 244].<\/li><\/ul><h4>2. Fiscal Control via Borrowing Consent (Article 293(3))<\/h4><ul><li>Almost all States have outstanding historical loans from the Central Government. Consequently, Article 293(3) obligates virtually every State to obtain Central consent before raising new market loans [passage 262], granting the Union executive effective control over State net borrowing ceilings.<\/li><\/ul>"}, {"t": "Cases", "h": "<p>1. Right to Property as a Constitutional &amp; Human Right (Article 300A):<\/p><ul><ul><li>K.T. Plantation Pvt. Ltd. v. State of Karnataka (2011): The SC held that while Article 300A is no longer a Fundamental Right [passage 58, passage 64, passage 274], it remains a Constitutional and Human Right. Deprivation of property requires a valid law, a public purpose, and non-arbitrary compensation.<\/li><li>Vidya Devi v. State of Himachal Pradesh (2020) &amp; Sukh Dutt Ratra (2022): The SC ruled that taking private land without formal acquisition proceedings under authority of law violates Article 300A [passage 274]. State cannot claim adverse possession against its own citizens to deny compensation. 2. GST Council Recommendations Advisory Nature (Article 279A):<\/li><li><b>Union of India v. Mohit Minerals (2022):<\/b> A 3-judge bench clarified that recommendations of the GST Council under Article 279A are advisory and not binding on Parliament or State Assemblies [passage 243], upholding cooperative federalism under Article 246A [passage 200]. 3. State Tortious Liability &amp; Sovereign Immunity (Article 300):<\/li><li><b>Kasturi Lal v. State of UP (1965):<\/b> Upheld sovereign immunity for police negligence (pre-constitutional doctrine).<\/li><li><b>Nilabati Behera (1993) &amp; Rudul Sah (1983):<\/b> Overruled Kasturi Lal&#x27;s applicability to public law remedies, holding that violations of Fundamental Rights by State officers entitle victims to constitutional compensation under Article 32 / Article 226 [passage 73, passage 145] regardless of Article 300 sovereign immunity defences [passage 273].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Fiscal Federalism, GST Governance, State Borrowing Ceilings, and Right to Property Rights<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XII (Articles 264–300A) defines the fiscal and proprietary foundation of the Indian Republic [passage 28, passage 217, passage 260, passage 262, passage 274]. Grounded in the principle of &#x27;No taxation save by law&#x27; (Article 265) [passage 217], the redistributive mechanics of the Finance Commission (Article 280) [passage 245, passage 246], and the property protection of Article 300A [passage 274], this framework balances Union integrity with State financial viability.&quot;<\/p><ul><li>Mains Body Arguments (Fiscal Friction &amp; Property Protections):<\/li><ul><li><b>GST Council Dynamics:<\/b> Reference Mohit Minerals (2022) and Article 279A [passage 243] to show how simultaneous tax powers under Article 246A [passage 200] require consensual fiscal federalism.<\/li><li><b>Net Borrowing Ceilings:<\/b> Analyze Article 293(3) [passage 262] Central consent mechanics, balancing state fiscal autonomy against macroeconomic debt stabilization.<\/li><li><b>Human Right to Property:<\/b> Cite K.T. Plantation (2011) and Vidya Devi (2020) to prove that Article 300A [passage 274] mandates procedural fairness and compensation for land acquisitions.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, expanding the divisible pool under Article 270 [passage 228] and streamlining Article 275 grants-in-aid [passage 236] will strengthen cooperative fiscal federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact maximum annual ceiling limit per person for taxes on professions, trades, callings, and employments under Article 276(2)? [passage 239] 2. Reverse Recall: Which Article specifies that property accruing by escheat, lapse, or as bona vacantia shall vest in the State or Union? [passage 268] 3. UPSC Prelims Analytical Trap: Can a State Government borrow loans directly from foreign international financial institutions under Article 293? [passage 261] What condition does Article 293(3) impose? [passage 262] 4. Mains Applied Question: Discuss the constitutional transformation of the Right to Property from Part III to Article 300A [passage 58, passage 64, passage 274] and its judicial interpretation in K.T. Plantation v. State of Karnataka (2011).<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Legislative &amp; Administrative Relations (Articles 245–263)<\/span><\/label><p>(Lesson 19)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce &amp; Intercourse (Articles 301–307) (Up Next)<\/span><\/label>"}], "nchk": 13}, {"n": 21, "title": "Part XIII — Freedom of Trade, Commerce and Intercourse within the", "secs": [{"t": "Articles", "h": "<h4>Territory of India (Articles 301–307)<\/h4><p>Part XIII of the Constitution (Articles 301–307) secures the economic unity of the Indian nation by guaranteeing free flow of trade, commerce, and intercourse across state boundaries, while establishing controlled exceptions for public interest and state revenue [passage 29, passage 175, passage 176]. PART XIII: TRADE, COMMERCE &amp; INTERCOURSE ARCHITECTURE (ARTICLES 301–307)<\/p><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                      │<\/pre><pre>ARTICLE 301: GENERAL FREEDOM GUARANTEE                          ARTICLES 302–305:<\/pre><p>CONTROLLED EXCEPTIONS<\/p><pre>✦ Free trade, commerce &amp; intercourse                ✦ Art. 302: Parliamentary Public Interest<\/pre><p>Power<\/p><pre>throughout the territory of India            ✦ Art. 303: Anti-Discrimination Rule &amp; Scarcity<\/pre><p>Exception<\/p><h4>✦ Art. 304: State Tax Non-Discrimination &amp; Reasonable<\/h4><p>Restrictions<\/p><h4>✦ Art. 305: Existing Laws &amp; State Monopolies<\/h4><h4>────────────────────────────────────────────────────────────<\/h4><p>─────────────────────────<\/p><h4>ARTICLE 307: REGULATORY AUTHORITY MECHANISM<\/h4><p>✦ Parliamentary authority to appoint a statutory regulatory authority for Arts. 301–304<\/p><h4>Article 301: Freedom of Trade, Commerce and Intercourse<\/h4><ul><li><b>Text &amp; Scope:<\/b> Subject to the other provisions of Part XIII, trade, commerce, and intercourse throughout the territory of India shall be free [passage 175].<\/li><li><b>Economic Integration Goal:<\/b> Eradicates internal tariff barriers and state borders to create a single seamless economic marketplace across all States and Union Territories [passage 175, passage 178].<\/li><\/ul><h4>Article 302: Power of Parliament to Impose Restrictions<\/h4><ul><li><b>Public Interest Restrictions:<\/b> Parliament may by law impose such restrictions on the freedom of trade, commerce, or intercourse between States or within any part of India as may be required in the public interest [passage 176].<\/li><\/ul><p><b>Article 303:<\/b> Restrictions on Legislative Powers of Union and States regarding Discrimination<\/p><ul><li><b>Art. 303(1) Anti-Discrimination Bar:<\/b> Neither Parliament nor a State Legislature has power to make any law giving preference to one State over another, or making any discrimination between States, by virtue of any entry relating to trade and commerce in the Seventh Schedule [passage 176].<\/li><li><b>Art. 303(2) Goods Scarcity Exception:<\/b> Parliament (and Parliament ONLY) may make discriminatory or preferential laws IF declared by such law that it is necessary to deal with a situation arising from scarcity of goods in any part of India [passage 177].<\/li><\/ul><p><b>Article 304:<\/b> Restrictions on Trade, Commerce and Intercourse Among States<\/p><p>Notwithstanding anything in Article 301 or Article 303, the Legislature of a State may by law [passage 177]:<\/p><ul><li>Art. 304(a) Equal Taxing Power (Non-Discriminatory Tax): Impose on goods imported from other States or Union Territories any tax to which similar goods manufactured or produced in that State are subject, provided it does NOT discriminate between imported goods and locally produced goods [passage 178].<\/li><li>Art. 304(b) Reasonable Restrictions in Public Interest: Impose reasonable restrictions on the freedom of trade, commerce, or intercourse with or within that State as required in the public interest [passage 178].<\/li><li><b>Mandatory Presidential Prior Sanction Proviso:<\/b> No Bill or amendment for the purposes of clause (b) shall be introduced or moved in the State Legislature WITHOUT the previous sanction of the President [passage 179].<\/li><\/ul><h4>Article 305: Saving of Existing Laws and State Monopolies<\/h4><ul><li><b>Saving Clause:<\/b> Saves existing pre-constitutional laws (unless the President otherwise directs) and laws creating State monopolies under Article 19(6)(ii) from being invalidated by Article 301 or Article 303 [passage 179].<\/li><\/ul><h4>Article 306: [Omitted]<\/h4><ul><li>Omitted by the Constitution (Seventh Amendment) Act, 1956 [passage 30, passage 180].<\/li><\/ul><p><b>Article 307:<\/b> Appointment of Authority for Carrying Out Purposes of Arts. 301 to 304<\/p><ul><li>Empowers Parliament by law to appoint such authority as it considers appropriate for carrying out the purposes of Articles 301, 302, 303, and 304, and confer on it necessary powers and duties [passage 180].<\/li><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Part XIII Article Flow (301 to 307) — &quot;F-P-N-S-M-A&quot;<\/h4><ul><li><b>301:<\/b> Freedom of trade, commerce &amp; intercourse [passage 175]<\/li><li><b>302:<\/b> Parliament&#x27;s public interest power [passage 176]<\/li><li><b>303:<\/b> No preference / Non-discrimination rule (with scarcity exception) [passage 176, passage 177]<\/li><li><b>304:<\/b> State taxation (a) &amp; State reasonable restrictions (b) + Presidential sanction [passage 178, passage 179]<\/li><li><b>305:<\/b> Monopolies &amp; existing laws saved [passage 179]<\/li><li><b>307:<\/b> Authority appointment by Parliament [passage 180]<\/li><\/ul><h4>Mnemonic 2: State Restrictions under Art. 304(b) — &quot;R-P-P&quot;<\/h4><ul><li>Reasonable restrictions [passage 178]<\/li><li>Public interest requirement [passage 178]<\/li><li>President&#x27;s prior sanction for Bill introduction [passage 179]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 301:<\/b> சுதந்திர வணிகம் (Freedom of Trade) → இந்திய எல்லைக்குள் மாநிலங்களுக்கு இடையேயான வர்த்தக சுதந்திரம் [passage 175].<\/li><li><b>Art. 304(a):<\/b> சமமான வரி (Non-Discriminatory Tax) → பிற மாநிலப் பொருட்களுக்கு உள்ளூர் பொருட்களுக்கு இணையான வரி [passage 178].<\/li><li><b>Art. 304(b) Proviso:<\/b> குடியரசுத் தலைவர் முன்-அனுமதி (Presidential Sanction) → மாநில வணிகக் கட்டுப்பாட்டு மசோதாவுக்கு குடியரசுத் தலைவரின் முன்-அனுமதி அவசியம் [passage 179].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>ARTICLE 19(1)(g) vs. ARTICLE 301 COMPARISON MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                    │<\/pre><pre>ARTICLE 19(1)(g) (PART III)                     ARTICLE 301 (PART XIII)<\/pre><pre>✦ Fundamental Right guaranteed to CITIZENS ONLY              ✦ Constitutional Guarantee<\/pre><p>applicable to ALL<\/p><pre>✦ Protects individual right to carry on trade     ✦ Protects freedom of the trade/flow ITSELF<\/pre><pre>or occupation                            across state borders<\/pre><pre>✦ Enforceable via Supreme Court under Art. 32            ✦ Enforceable via High Court under Art.<\/pre><p>226<\/p><pre>✦ Subject to Art. 19(6) reasonable restrictions     ✦ Subject to Arts. 302–305 statutory<\/pre><p>restrictions<\/p><p>The Presidential Prior Sanction Synergy (Art. 304(b) Proviso ↔ Art. 255)<\/p><ul><li>If a State law imposing reasonable restrictions under Article 304(b) is introduced without prior Presidential sanction [passage 178, passage 179], Article 255 saves the Act from invalidity if final assent was subsequently granted by the President [passage 117, passage 118].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Direct and Immediate Restriction Test:<\/h4><ul><ul><li><b>Atiabari Tea Co. v. State of Assam (1961):<\/b> The Supreme Court held that Article 301 [passage 175] is violated if a tax directly and immediately restricts the movement of trade and goods across state borders. 2. The Compensatory Tax Exception Doctrine &amp; Its Overruling:<\/li><li>Automobile Transport (Rajasthan) Ltd. v. State of Rajasthan (1962): Introduced the concept of &quot;Compensatory Taxes&quot; (taxes levied to build/maintain roads/bridges), holding that regulatory or compensatory taxes do not violate Article 301 [passage 175].<\/li><li>Jindal Stainless Ltd. v. State of Haryana (2016 - 9-Judge Constitution Bench):<\/li><ul><li>Overruled the &quot;Compensatory Tax&quot; doctrine created in Automobile Transport (1962).<\/li><li>Held that non-discriminatory entry taxes levied by States under Entry 52 List II (before GST) [passage 178] do not violate Article 301 [passage 175] as long as they comply with Article 304(a) [passage 178] (equal tax treatment for local and imported goods).<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Economic Integration, Internal Free Trade, and State Tax Autonomy<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XIII (Articles 301–307) establishes the constitutional architecture for India&#x27;s common economic market [passage 29, passage 175, passage 176]. Grounded in Article 301 (Freedom of Trade, Commerce, and Intercourse) [passage 175] and balanced by Parliamentary public interest powers (Article 302) [passage 176] and State non-discriminatory taxing powers (Article 304) [passage 177, passage 178], this framework ensures seamless inter-state economic intercourse.&quot;<\/p><ul><li>Mains Body Arguments (Entry Tax &amp; Fiscal Union):<\/li><ul><li><b>Eradicating Internal Barriers:<\/b> Explain how Article 301 [passage 175] read with Article 246A (GST) [passage 111] reinforces the vision of &#x27;One Nation, One Tax, One Market&#x27;.<\/li><li><b>Judicial Evolution on Tax Restrictions:<\/b> Cite Jindal Stainless (2016) to analyze how the 9-judge bench harmonized state taxing autonomy under Article 304(a) [passage 178] with national economic unity under Article 301 [passage 175].<\/li><li><b>Presidential Oversight:<\/b> Highlight the Article 304(b) Proviso [passage 179] requiring prior Presidential sanction to prevent parochial state legislation.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, implementing the GST framework while safeguarding Article 301 [passage 175] inter-state mobility upholds cooperative economic federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the mandatory requirement under the proviso to Article 304(b) before a Bill imposing reasonable restrictions on trade can be introduced in a State Legislature? [passage 179] 2. Reverse Recall: Which Article empowers Parliament to appoint a dedicated statutory authority for carrying out the purposes of Articles 301 to 304? [passage 180] 3. UPSC Prelims Analytical Trap: Can a State Legislature give preference to goods produced within its own State over goods imported from other States when levying taxes under Article 304(a)? [passage 178] 4. Mains Applied Question: Discuss the constitutional distinction between the individual right to carry on trade under Article 19(1)(g) [passage 57] and the general freedom of trade, commerce, and intercourse under Article 301 [passage 175].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Current Lesson<\/span><\/label><p>Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Up Next)<\/p>"}], "nchk": 14}, {"n": 22, "title": "Part XIV & XIVA — Services Under the Union and the States &", "secs": [{"t": "Articles", "h": "<h4>Administrative Tribunals (Articles<\/h4><p>308–323B)<\/p><p>Part XIV (Articles 308–323) and Part XIVA (Articles 323A–323B) govern the permanent civil executive of the Republic and the specialized dispute-resolution mechanism of Administrative Tribunals [passage 27, passage 28, passage 30].<\/p><h4>SERVICES &amp; TRIBUNALS ARCHITECTURE (ARTICLES 308–323B)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬─────────┴──────────┬────────<\/h4><p>─────────────────────┐<\/p><pre>│ Chapter I: Services        │ Chapter II: PSCs │ Part XIVA: Tribunals       │<\/pre><pre>│ (Arts. 308–314)         │ (Arts. 315–323) │ (Arts. 323A–323B)          │<\/pre><h4>└─────────────────────────────┴────────────────────┴────────<\/h4><p>─────────────────────┘<\/p><h4>│<\/h4><h4>┌────────────────┴────────────────┐<\/h4><pre>│ UPSC / SPSC / JSPSC             │<\/pre><h4>│ Appointments, Term, Removal &amp; │<\/h4><pre>│ Independence Safeguards          │<\/pre><h4>└─────────────────────────────────┘<\/h4><p><b>A. Part XIV Chapter I:<\/b> Services Under the Union and States (Articles 308–314)<\/p><ul><li><b>Article 308:<\/b> Interpretation<\/li><ul><li>Specifies that in Part XIV, the expression &quot;State&quot; does not include the State of Jammu and Kashmir [passage 28, passage 291].<\/li><\/ul><li><b>Article 309:<\/b> Recruitment and Conditions of Service<\/li><ul><li>Empowers Parliament and State Legislatures to regulate recruitment and service conditions of persons appointed to public services and posts [passage 291].<\/li><li><b>Proviso (Rule-Making Power):<\/b> Pending legislative enactments, the President (for Union posts) or the Governor (for State posts) may make rules regulating recruitment and service conditions [passage 292]. Such rules have statutory force until superseded by an Act of the appropriate Legislature [passage 292].<\/li><\/ul><li><b>Article 310:<\/b> Tenure of Office (The Doctrine of Pleasure)<\/li><ul><li><b>Art. 310(1) Tenure Rule:<\/b> Civil servants and defense personnel of the Union hold office during the pleasure of the President; civil servants of a State hold office during the pleasure of the Governor [passage 293].<\/li><li>Art. 310(2) Contractual Compensation Exception: Allows the Government to enter into a contract with a person possessing special qualifications specifying compensation if the post is abolished or vacated before the agreed term for reasons unrelated to misconduct [passage 294, passage 295].<\/li><\/ul><li><b>Article 311:<\/b> Dismissal, Removal or Reduction in Rank of Civil Servants<\/li><ul><li>Article 311 provides constitutional safeguards that restrict the absolute operation of the &quot;Doctrine of Pleasure&quot; under Article 310 [passage 293, passage 296].<\/li><li><b>Art. 311(1) Subordinate Authority Bar:<\/b> No civil servant shall be dismissed or removed by an authority subordinate to that by which he was appointed [passage 296].<\/li><li>Art. 311(2) Inquiry &amp; Reasonable Opportunity Rule: No civil servant shall be dismissed, removed, or reduced in rank except after an inquiry in which he has been informed of the charges and given a reasonable opportunity of being heard in respect of those charges [passage 296].<\/li><li>Three Express Exceptions to Art. 311(2) Inquiry: 1. Art. 311(2)(a) Criminal Conviction: Where a person is dismissed, removed, or reduced in rank on the ground of conduct which has led to his conviction on a criminal charge [passage 296]. 2. Art. 311(2)(b) Impracticability: Where the disciplinary authority is satisfied (recorded in writing) that it is not reasonably practicable to hold such an inquiry [passage 296, passage 297]. (Decision of authority is final under Art. 311(3)) [passage 297]. 3. Art. 311(2)(c) Security of State: Where the President or Governor is satisfied that in the interest of the security of the State, it is not expedient to hold such an inquiry [passage 297].<\/li><\/ul><li><b>Article 312:<\/b> All-India Services<\/li><ul><li><b>Art. 312(1) Creation Mechanism:<\/b> If the Council of States (Rajya Sabha) declares by resolution supported by not less than 2/3rds of members present and voting that it is necessary/expedient in the national interest, Parliament may by law create one or more All-India Services (common to Union and States) [passage 298].<\/li><li><b>Art. 312(2) Existing Services:<\/b> Deems IAS and IPS to be services created by Parliament under this Article [passage 299].<\/li><li>Art. 312(3) &amp; (4) All-India Judicial Service (AIJS): Parliament may create an AIJS (not lower than District Judge) [passage 298, passage 299]. Such law shall NOT be deemed an amendment of the Constitution for the purposes of Article 368 [passage 299].<\/li><\/ul><li><b>Article 312A &amp; 313:<\/b> Article 312A grants Parliament power to vary or revoke service conditions of officers appointed by the Secretary of State [passage 300]; Article 313 saves pre-constitutional service laws [passage 304].<\/li><\/ul><h4>B. Part XIV Chapter II: Public Service Commissions (Articles 315–323)<\/h4><ul><li><b>Article 315:<\/b> Public Service Commissions for Union and States<\/li><ul><li><b>Art. 315(1):<\/b> Establishes a Union Public Service Commission (UPSC) for the Union and a State Public Service Commission (SPSC) for each State [passage 305].<\/li><li>Art. 315(2) Joint State Public Service Commission (JSPSC): Two or more States may pass resolutions requesting Parliament to establish a JSPSC by law [passage 305].<\/li><\/ul><li><b>Article 316:<\/b> Appointment and Term of Office of Members<\/li><ul><li><b>Appointing Authority [Art. 316(1)]:<\/b> Chairman and members of UPSC and JSPSC are appointed by the President; members of SPSC are appointed by the Governor [passage 307].<\/li><li><b>Tenure Standard [Art. 316(2)]:<\/b> 1. UPSC Members: Term of 6 years or until attaining 65 years of age, whichever is earlier [passage 308]. 2. SPSC / JSPSC Members: Term of 6 years or until attaining 62 years of age, whichever is earlier (raised from 60 to 62 by 41st CAA, 1976) [passage 308].<\/li><li><b>Re-appointment Bar [Art. 316(3)]:<\/b> A member is ineligible for re-appointment to that same office upon term expiration [passage 308].<\/li><\/ul><li><b>Article 317:<\/b> Removal and Suspension of a Member<\/li><ul><li><b>Art. 317(1) Misbehaviour Inquiry Procedure:<\/b> Chairman or member of ANY Public Service Commission (UPSC, SPSC, or JSPSC) can be removed ONLY by order of the President on the ground of misbehaviour AFTER the Supreme Court, on reference by the President, reports after an inquiry under Article 145 that the member ought to be removed [passage 309].<\/li><li><b>Art. 317(2) Suspension Power:<\/b> President (for UPSC/JSPSC) or Governor (for SPSC) may suspend the member pending the SC inquiry report [passage 310].<\/li><li>Art. 317(3) Direct Presidential Removal Grounds: President may directly remove a member without SC inquiry if the member [passage 310]: 1. Is adjudged an insolvent [passage 311]; OR 2. Engages during term of office in any paid employment outside duties [passage 311]; OR 3. Is, in the opinion of the President, unfit to continue by reason of infirmity of mind or body [passage 311].<\/li><\/ul><li><b>Article 318:<\/b> Conditions of Service Protection<\/li><ul><li>Service conditions determined by President (UPSC/JSPSC) or Governor (SPSC) [passage 312]. Shall not be varied to a member&#x27;s disadvantage after appointment [passage 313].<\/li><\/ul><li><b>Article 319:<\/b> Post-Retirement Employment Disqualifications<\/li><ul><li><b>UPSC Chairman:<\/b> Ineligible for any further employment under GoI or State Govt [passage 313, passage 314].<\/li><li><b>SPSC Chairman:<\/b> Eligible to become UPSC Chairman/member or SPSC Chairman of another State, but barred from any other government employment [passage 314].<\/li><li><b>UPSC Member:<\/b> Eligible to become UPSC Chairman or SPSC Chairman, but no other government employment [passage 314].<\/li><li><b>SPSC Member:<\/b> Eligible to become UPSC Chairman/member or SPSC Chairman, but no other government employment [passage 315].<\/li><\/ul><li><b>Articles 320–323:<\/b> Functions, Expenses &amp; Reports<\/li><ul><li><b>Art. 320 Functions:<\/b> Conduct examinations for civil service appointments [passage 315]. Consulted on recruitment methods, principles, promotions, disciplinary matters, legal expense claims, and injury pensions [passage 316, passage 317, passage 318]. Excludes consultation for Art. 16(4) / 16(4A) reservations or Art. 335 ST/SC claims [passage 319].<\/li><li><b>Art. 322 Charged Expenses:<\/b> Administrative expenses charged on the Consolidated Fund of India (UPSC) or Consolidated Fund of the State (SPSC) [passage 321].<\/li><li><b>Art. 323 Annual Reports:<\/b> UPSC submits report annually to the President; SPSC to the Governor [passage 322]. Any case of non-acceptance of advice must be explained in a memorandum laid before Parliament / State Legislature [passage 322].<\/li><\/ul><\/ul><h4>C. Part XIVA: Administrative Tribunals (Articles 323A–323B)<\/h4><p>Inserted by the 42nd Constitutional Amendment Act, 1976 [passage 30, passage 323, passage 326].<\/p><ul><li><b>Article 323A:<\/b> Administrative Tribunals<\/li><ul><li><b>Exclusive Legislative Authority:<\/b> Parliament ONLY may by law establish administrative tribunals [passage 323].<\/li><li><b>Subject Scope:<\/b> Adjudication of recruitment and service condition disputes of civil servants under Union, States, local authorities, or public corporations [passage 323].<\/li><li><b>Hierarchy:<\/b> Single Central Administrative Tribunal (CAT) for the Union and State Administrative Tribunals (SATs) [passage 324].<\/li><\/ul><li><b>Article 323B:<\/b> Tribunals for Other Matters<\/li><ul><li><b>Legislative Authority:<\/b> Appropriate Legislature (Parliament or State Legislature according to legislative competence) [passage 326, passage 332].<\/li><li><b>Subject Scope (Art. 323B(2)):<\/b> 1. Levy, assessment, collection, and enforcement of any tax [passage 327]. 2. Foreign exchange, import and export [passage 327]. 3. Industrial and labour disputes [passage 327]. 4. Land reforms (Art. 31A) and agricultural land ceilings [passage 327]. 5. Ceiling on urban property [passage 327]. 6. Elections to Parliament/State Assemblies (excluding Art. 329 bar) [passage 328]. 7. Essential goods production, procurement, and price control [passage 328]. 8. Rent regulation and tenancy issues [passage 328].<\/li><li><b>Hierarchy Structure:<\/b> Allows a hierarchy of tribunals for specified subjects [passage 330].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Article 311(2) Inquiry Exception Reasons — &quot;C-I-S&quot;<\/h4><ul><li><b>Mnemonic:<\/b> &quot;C-I-S&quot; (&quot;Conviction, Impracticable, Security&quot;)<\/li><ul><li>Criminal conviction [passage 296]<\/li><li>Impracticable to hold inquiry [passage 296]<\/li><li>Security of the State [passage 297]<\/li><\/ul><\/ul><p><b>Mnemonic 2:<\/b> Direct Removal Grounds for PSC Members (Art. 317(3)) — &quot;I-P-I&quot;<\/p><ul><li>Insolvent declared [passage 311]<\/li><li>Paid employment outside [passage 311]<\/li><li>Infirmity of mind or body [passage 311]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 310:<\/b> அரசுப் பணியாளர் தன்னாட்சி கோட்பாடு (Doctrine of Pleasure) → குடியரசுத் தலைவர் / ஆளுநரின் விருப்பம் உள்ளவரை பதவி [passage 293].<\/li><li><b>Art. 311:<\/b> பணிப் பாதுகாப்பு (Constitutional Safeguards) → விசாரணை இன்றி பணிநீக்கம் செய்யத் தடை [passage 296].<\/li><li><b>Art. 312:<\/b> அனைத்திந்தியப் பணிகள் (All-India Services) → மாநிலங்களவையின் 2/3 பங்கு சிறப்புத் தீர்மானம் [passage 298].<\/li><li><b>Art. 323A vs 323B:<\/b> நிர்வாகத் தீர்ப்பாயங்கள் (Tribunals) → 323A நாடாளுமன்றத்திற்கு மட்டும்; 323B மத்திய-மாநில சட்டமன்றங்களுக்கு [passage 323, passage 326].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>ARTICLE 323A vs. ARTICLE 323B COMPARISON MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                  │<\/pre><pre>ARTICLE 323A (ADMINISTRATIVE TRIBUNALS)                     ARTICLE 323B (TRIBUNALS FOR<\/pre><p>OTHER MATTERS)<\/p><pre>✦ Created by PARLIAMENT ONLY                        ✦ Created by PARLIAMENT or STATE<\/pre><p>LEGISLATURE<\/p><pre>✦ Scope: Public Service recruitment &amp; conditions       ✦ Scope: Tax, Land Reforms, Labour,<\/pre><p>Rent, Elections<\/p><pre>✦ Single level / Hierarchy for Union &amp; States      ✦ Hierarchy of Tribunals permissible\n✦ No sub-classification of subjects            ✦ Covers 10 distinct subject categories<\/pre><p><b>The Constitutional Friction:<\/b> Article 310 (Pleasure) ↔ Article 311 (Safeguards)<\/p><ul><li>Article 310 establishes executive supremacy over public services [passage 293].<\/li><li>Article 311 restricts executive arbitrariness by guaranteeing procedural due process (principles of natural justice) before any dismissal, removal, or reduction in rank [passage 296].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Constitutional Protection Boundaries (Article 311):<\/h4><ul><ul><li>Parshotam Lal Dhingra v. Union of India (1958): The SC established that Article 311 applies to both permanent and temporary civil servants if the termination is by way of punishment (entailing loss of pay or forfeiture of accrued benefits). 2. Exclusion of Inquiry Grounds (Article 311(2) Proviso):<\/li><li><b>Union of India v. Tulsiram Patel (1985):<\/b> A 5-judge Constitution Bench upheld the validity of the 2nd proviso to Article 311(2) [passage 296]. The SC held that where an inquiry is dispensed with under clauses (a), (b), or (c), principles of natural justice are excluded by constitutional mandate, but the decision remains subject to judicial review for bad faith or arbitrariness. 3. Judicial Review over Administrative Tribunals (Articles 323A &amp; 323B):<\/li><li><b>S.P. Sampath Kumar v. Union of India (1987):<\/b> Initial SC ruling holding that CAT was an effective substitute for High Courts under Article 226 [passage 167, passage 324].<\/li><li>L. Chandra Kumar v. Union of India (1997 - 7-Judge Bench):<\/li><ul><li>Overruled Sampath Kumar regarding court exclusion.<\/li><li>Held that power of judicial review of High Courts under Articles 226/227 [passage 167, passage 171] and Supreme Court under Article 32 [passage 64] over decisions of Administrative Tribunals is an integral part of the Basic Structure.<\/li><li>Clauses in Articles 323A(2)(d) and 323B(3)(d) excluding High Court jurisdiction were struck down as unconstitutional [passage 324, passage 330]. Tribunals function as courts of first instance, but their decisions are subject to appeal before a Division Bench of the concerned High Court under Article 226 [passage 167].<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Civil Service Safeguards, Independence of PSCs, and Judicial Review of Tribunals<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XIV (Articles 308–323) and Part XIVA (Articles 323A–323B) structure the constitutional architecture for public administration and specialized adjudication in India [passage 28, passage 30, passage 291, passage 323]. Balancing executive flexibility under Article 310 (Doctrine of Pleasure) [passage 293] with civil service tenure security under Article 311 [passage 296] and merit-based recruitment via independent Public Service Commissions (Article 315) [passage 305], this design upholds administrative integrity.&quot;<\/p><ul><li>Mains Body Arguments (Safeguards &amp; Tribunal Jurisprudence):<\/li><ul><li><b>Insulating Civil Servants:<\/b> Explain how Article 311 [passage 296] protects bureaucrats against political victimisation while referencing Tulsiram Patel (1985) for public interest exception grounds.<\/li><li><b>Federal Civil Service Creation:<\/b> Analyze Article 312 [passage 298] granting Rajya Sabha exclusive federal power to establish All-India Services.<\/li><li><b>Basic Structure and Tribunals:<\/b> Cite L. Chandra Kumar (1997) proving that tribunal adjudication under Part XIVA [passage 323] cannot bypass High Court judicial review under Article 226 [passage 167].<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, implementing structural reforms in PSC appointments and streamlining tribunal functioning under High Court oversight (L. Chandra Kumar) will reinforce the rule of law.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact voting majority requirement in the Rajya Sabha for creating an All-India Service under Article 312(1)? [passage 298] 2. Reverse Recall: Under which Article is the Supreme Court empowered to hold an inquiry on a reference by the President regarding the misbehaviour of a UPSC or SPSC member? [passage 309] 3. UPSC Prelims Analytical Trap: Who appoints the members of a Joint State Public Service Commission (JSPSC) under Article 316(1)? [passage 307] What is their retirement age limit? [passage 308] 4. Mains Applied Question: Discuss the impact of the Supreme Court&#x27;s 7-judge bench judgment in L. Chandra Kumar v. Union of India (1997) on the constitutional validity of Articles 323A(2)(d) and 323B(3)(d) [passage 167, passage 324, passage 330].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Lesson 21)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Current Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"14\"><span>Part XV: Elections &amp; Electoral Machinery (Articles 324–329A) (Up Next)<\/span><\/label>"}], "nchk": 15}, {"n": 23, "title": "Part XV — Elections, Adult Suffrage & Election Commission", "secs": [{"t": "Articles", "h": "<h4>Architecture (Articles 324–329A)<\/h4><p>Part XV of the Constitution (Articles 324–329A) establishes the constitutional foundation of Indian democracy, guaranteeing free, fair, and periodic elections through an independent constitutional authority—The Election Commission of India (ECI) [passage 26, passage 308].<\/p><h4>PART XV: ELECTIONS &amp; ELECTORAL MACHINERY (ARTICLES 324–329A)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬────────────┴────────────┬───<\/h4><p>──────────────────────────┐<\/p><pre>│ Election Commission           │ Electoral Roll &amp;    │ Legislative &amp; Judicial   │<\/pre><pre>│ (Art. 324)            │ Adult Suffrage        │ Boundaries             │<\/pre><pre>│                    │ (Arts. 325–326)        │ (Arts. 327–329A)        │<\/pre><h4>└─────────────────────────────┴─────────────────────────┴───<\/h4><p>──────────────────────────┘<\/p><h4>A. The Election Commission of India (Article 324)<\/h4><ul><li><b>Article 324:<\/b> Superintendence, Direction and Control of Elections<\/li><ul><li><b>Art. 324(1) Plenary Scope:<\/b> The superintendence, direction, and control of the preparation of electoral rolls for, and the conduct of, all elections to Parliament, State Legislatures, and to the offices of President and Vice-President shall be vested in the Election Commission [passage 26, passage 308].<\/li><li><b>Art. 324(2) Composition &amp; Appointments:<\/b> Consists of the Chief Election Commissioner (CEC) and such number of other Election Commissioners (ECs), if any, as the President may from time to time fix [passage 309]. Appointments are made by the President, subject to the provisions of any law made by Parliament [passage 309].<\/li><li><b>Art. 324(3) Chairman Role:<\/b> When any other Election Commissioner is so appointed, the CEC acts as the Chairman of the Election Commission [passage 309].<\/li><li><b>Art. 324(4) Regional Commissioners:<\/b> Appointed by the President after consultation with the Election Commission before general or biennial elections to assist the Commission [passage 310].<\/li><li><b>Art. 324(5) Removal Safeguards &amp; Tenure:<\/b><\/li><ul><li><b>CEC Removal Security:<\/b> The Chief Election Commissioner shall NOT be removed from his office EXCEPT in like manner and on the like grounds as a Judge of the Supreme Court [passage 311].<\/li><li><b>Service Condition Protection:<\/b> Conditions of service of the CEC shall not be varied to his disadvantage after appointment [passage 311].<\/li><li><b>Other Commissioners&#x27; Removal:<\/b> Any other Election Commissioner or Regional Commissioner shall NOT be removed from office EXCEPT on the recommendation of the Chief Election Commissioner [passage 312].<\/li><\/ul><li><b>Art. 324(6) Staff Provision:<\/b> President or Governor shall, when requested by the Election Commission, make available necessary staff for discharging its functions [passage 313].<\/li><\/ul><\/ul><p>B. Universal Adult Suffrage &amp; Non-Discriminatory Rolls (Articles 325–326)<\/p><ul><li><b>Article 325:<\/b> Single General Electoral Roll<\/li><ul><li>There shall be one general electoral roll for every territorial constituency [passage 313].<\/li><li><b>No Discrimination Clause:<\/b> No person shall be ineligible for inclusion in an electoral roll or claim inclusion in a special roll on grounds ONLY of religion, race, caste, sex or any of them [passage 26, passage 313].<\/li><\/ul><li><b>Article 326:<\/b> Elections to Lok Sabha and Assemblies on the Basis of Adult Suffrage<\/li><ul><li>Mandates that elections to the House of the People (Lok Sabha) and State Legislative Assemblies shall be on the basis of adult suffrage [passage 26, passage 314].<\/li><li><b>Voting Age Criteria:<\/b> Every citizen who is not less than 18 years of age on the fixed date is entitled to be registered as a voter [passage 314]. (Note: Voting age was reduced from 21 years to 18 years by the 61st Constitutional Amendment Act, 1988) [passage 316].<\/li><li><b>Permissible Disqualifications:<\/b> Disqualified ONLY on grounds specified by law: non-residence, unsoundness of mind, crime, or corrupt/illegal practice [passage 314].<\/li><\/ul><\/ul><h4>C. Electoral Legislation &amp; Judicial Bar (Articles 327–329A)<\/h4><ul><li><b>Article 327:<\/b> Power of Parliament to Make Provisions with Respect to Elections<\/li><ul><li>Parliament may by law make provisions for all matters relating to elections to Parliament and State Legislatures, including preparation of electoral rolls, delimitation of constituencies, and seat allocation [passage 27, passage 315]. (Enacted under Art. 327: Representation of the People Acts 1950 &amp; 1951, Delimitation Commission Acts).<\/li><\/ul><li><b>Article 328:<\/b> Power of State Legislature to Make Provisions<\/li><ul><li>State Legislature may make election laws for its own House in so far as provision is not made by Parliament [passage 27, passage 316].<\/li><\/ul><li><b>Article 329:<\/b> Bar to Interference by Courts in Electoral Matters<\/li><ul><li><b>Art. 329(a) Delimitation Immunity:<\/b> The validity of any law relating to delimitation of constituencies or allotment of seats made under Art. 327 or 328 shall NOT be called in question in any court [passage 317].<\/li><li><b>Art. 329(b) Election Petition Mandate:<\/b> No election to Parliament or State Legislature shall be called in question EXCEPT by an election petition presented to such authority and in such manner as provided by legislative law [passage 317]. (High Court hears election petitions under the Representation of the People Act, 1951).<\/li><\/ul><li><b>Article 329A:<\/b> Special Provision as to PM and Speaker Elections [OMITTED]<\/li><ul><li>Inserted by 39th CAA 1975; OMITTED by the 44th Constitutional Amendment Act, 1978 [passage 27, passage 318].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Core Article Sequence (324 to 329) — &quot;C-R-A-P-S-B&quot;<\/h4><ul><li><b>324:<\/b> Commission Vested with Superintendence, Direction, and Control [passage 308]<\/li><li><b>325:<\/b> Roll is Universal &amp; Non-discriminatory [passage 313]<\/li><li><b>326:<\/b> Adult Suffrage (18 Years) [passage 314]<\/li><li><b>327:<\/b> Parliament&#x27;s Power over Election Laws [passage 315]<\/li><li><b>328:<\/b> State Legislature&#x27;s Supplementary Power [passage 316]<\/li><li><b>329:<\/b> Bar on Judicial Interference (Election Petitions ONLY) [passage 317]<\/li><\/ul><p><b>Mnemonic 2:<\/b> Prohibited Electoral Roll Discrimination Grounds (Art. 325) — &quot;R-R-C-S&quot;<\/p><ul><li>Religion, Race, Caste, Sex [passage 313].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 324:<\/b> தேர்தல் ஆணையம் (Election Commission) → சுதந்திரமான தேர்தல் நடத்தும் அதிகாரம் [passage 308].<\/li><li><b>Art. 326:<\/b> வாக்குரிமை (Adult Suffrage - 18 Years) → 61-வது திருத்தம் (1988) மூலம் வாக்களிக்கும் வயது 21-லிருந்து 18 ஆகக் குறைக்கப்பட்டது [passage 314, passage 316].<\/li><li><b>Art. 329(b):<\/b> தேர்தல் மனு (Election Petition) → தேர்தல் முடிவுகளை தேர்தல் மனு மூலமே நீதிமன்றத்தில் சவாலிட முடியும் [passage 317].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>ELECTION COMMISSION REMOVAL PROTECTION MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                                  │<\/pre><pre>CHIEF ELECTION COMMISSIONER (CEC)                       OTHER ELECTION<\/pre><p>COMMISSIONERS (ECs)<\/p><pre>✦ Art. 324(5) Proviso 1                   ✦ Art. 324(5) Proviso 2<\/pre><pre>✦ Removed ONLY like a Supreme Court Judge               ✦ Removed ONLY on the<\/pre><p>recommendation of the CEC<\/p><p>✦ Requires special majority impeachment in Parliament ✦ President cannot remove ECs independently<\/p><h4>1. Article 324(5) Removal Security Paradox<\/h4><ul><li>While the CEC enjoys Supreme Court Judge removal security under Art. 324(5) Proviso 1 [passage 311], other Election Commissioners can be removed simply on the CEC&#x27;s recommendation under Art. 324(5) Proviso 2 [passage 312].<\/li><\/ul><p><b>2. Federal Election Division:<\/b> ECI (Art. 324) vs. SEC (Art. 243K / 243ZA)<\/p><ul><li><b>ECI (Art. 324):<\/b> Conducts elections for Parliament, State Assemblies/Councils, President, and Vice-President [passage 308].<\/li><li>State Election Commission (SEC - Art. 243K / 243ZA): Conducts elections exclusively for Panchayats and Municipalities [passage 13, passage 15, passage 208, passage 228]. ECI has no jurisdiction over local body elections.<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Plenary Powers of the Election Commission (Article 324):<\/h4><ul><ul><li>Mohinder Singh Gill v. Chief Election Commissioner (1978):<\/li><ul><li>A 5-judge Constitution Bench held that Article 324 [passage 308] is a plenary reservoir of power that operates when statutory laws (RPA 1950/1951) are silent or inadequate to ensure free and fair elections. 2. Free and Fair Elections as Basic Structure (Article 329A Struck Down):<\/li><\/ul><li><b>Indira Nehru Gandhi v. Raj Narain (1975):<\/b><\/li><ul><li>The Supreme Court struck down Article 329A [passage 318] (inserted by 39th CAA) which placed the Prime Minister&#x27;s election beyond judicial review. The Court declared that Free and Fair Elections and Judicial Review are structural pillars of the Basic Structure. 3. Voter&#x27;s Right to Know &amp; NOTA Option (Articles 19(1)(a) &amp; 326):<\/li><\/ul><li>Union of India v. Association for Democratic Reforms (ADR) (2002): Held that voters have a fundamental right under Article 19(1)(a) [passage 54] to know the criminal antecedents, financial assets, liabilities, and educational qualifications of election candidates.<\/li><li><b>PUCL v. Union of India (2013) [NOTA Case]:<\/b> Directed ECI to introduce the None of the Above (NOTA) button on EVMs, affirming the voter&#x27;s right to reject candidates. 4. Appointment Reforms for Election Commissioners:<\/li><li>Anoop Baranwal v. Union of India (2023 - 5-Judge Bench):<\/li><ul><li>Held that to protect independence under Article 324(2) [passage 309], appointments of the CEC and ECs shall be made by the President on the advice of a 3-member Selection Committee comprising the Prime Minister, the Leader of Opposition in Lok Sabha, and the Chief Justice of India, until Parliament enacts a law.<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Electoral Reforms, Independence of Election Commission, and Judicial Review of Delimitation<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part XV (Articles 324–329A) establishes the constitutional architecture for electoral democracy in India [passage 26, passage 308]. Anchored in the independent regulatory authority of the Election Commission (Article 324) [passage 308], universal adult suffrage at 18 years (Article 326) [passage 314], and single non-discriminatory electoral rolls (Article 325) [passage 313], this framework guarantees democratic legitimacy.&quot;<\/p><ul><li>Mains Body Arguments (Plenary Authority &amp; Appointment Autonomy):<\/li><ul><li><b>Plenary Reserve Power:<\/b> Cite Mohinder Singh Gill (1978) to demonstrate how Article 324 [passage 308]
