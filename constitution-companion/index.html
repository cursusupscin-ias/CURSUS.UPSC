ution (e.g., judicial review, secularism, federalism, free elections), it is void.<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. The Basic Structure Doctrine &amp; Limits of Article 368:<\/h4><ul><ul><li>Kesavananda Bharati v. State of Kerala (1973 - 13-Judge Bench):<\/li><ul><li>Upheld the constituent power of Parliament to amend any part of the Constitution under Article 368 [passage 350], but held that Article 368 does not enable Parliament to alter the Basic Structure or framework of the Constitution.<\/li><\/ul><li><b>Minerva Mills Ltd. v. Union of India (1980):<\/b><\/li><ul><li>Struck down Clauses (4) and (5) of Article 368 [passage 355] inserted by the 42nd CAA. Reaffirmed that Judicial Review and a limited amending power are essential elements of the Basic Structure.<\/li><\/ul><li>I.R. Coelho v. State of Tamil Nadu (2007 - 9-Judge Bench):<\/li><ul><li>Ruled that laws placed in the Ninth Schedule after April 24, 1973 (date of Kesavananda verdict) are open to judicial scrutiny if they violate the Basic Structure or fundamental rights under Articles 14, 19, and 21. 2. Constitutional Abrogation of Article 370:<\/li><\/ul><li>In Re Article 370 of the Constitution (2023 - 5-Judge Constitution Bench):<\/li><ul><li>Unanimously upheld the constitutional validity of Presidential Orders C.O. 272 and C.O. 273 (2019) rendering Article 370 inoperative [passage 356, passage 357] and applying all provisions of the Indian Constitution to J&amp;K.<\/li><li>Held that Jammu and Kashmir held no internal sovereignty after acceding to India, and Article 370 was a temporary transitional provision.<\/li><\/ul><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Amending Power of Parliament, Basic Structure Jurisprudence, and Asymmetric Federalism (Arts. 371–371J)<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Parts XIX through XXII (Articles 361–395) seal the structural and amending machinery of the Indian Republic [passage 32, passage 33, passage 34, passage 35, passage 36, passage 330, passage 350, passage 371]. Anchored in the constituent amending power of Article 368 [passage 350], executive immunities (Article 361) [passage 330], and asymmetric federal provisions (Articles 371–371J) [passage 370, passage 371, passage 402], this architecture balances constitutional adaptability with structural permanence.&quot;<\/p><ul><li>Mains Body Arguments (Basic Structure &amp; Asymmetric Protection):<\/li><ul><li><b>Sovereign Amending Limits:<\/b> Analyze Article 368 [passage 350] through Kesavananda Bharati (1973) and I.R. Coelho (2007), proving how the Basic Structure doctrine prevents constitutional subversion.<\/li><li><b>Asymmetric Federal Dynamics:<\/b> Evaluate Articles 371A (Nagaland) [passage 371] and 371G (Mizoram) [passage 397] preserving customary indigenous land rights against central legislative encroachment.<\/li><li><b>Judicial Affirmation of Integration:<\/b> Cite In Re Article 370 (2023) regarding the constitutional integration of J&amp;K into full Indian federalism.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, balancing flexible amendment procedures under Article 368 [passage 350] with judicial protection of the Basic Structure guarantees the endurance of the Indian Constitutional Republic.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What are the two cumulative majority requirements specified in Article 368(2) for passing a Constitutional Amendment Bill in each House of Parliament? [passage 350] 2. Reverse Recall: Which Article provides absolute criminal immunity to the President and Governors during their term of office? [passage 331] 3. UPSC Prelims Analytical Trap: Does a Constitutional Amendment Bill amending the Seventh Schedule Lists under Article 368 require the ratification of at least 50% of State Legislatures? [passage 350, passage 352, passage 353] 4. Mains Applied Question: Discuss the constitutional evolution of Parliament&#x27;s amending power under Article 368 [passage 350] from Shankari Prasad (1951) to Kesavananda Bharati (1973) and I.R. Coelho (2007).<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: The Union Machinery (Articles 52–151) (Lessons 8–13)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part VI: The State Machinery (Articles 152–237) (Lessons 14–16)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Parts VIII, IX, IXA, IXB: UTs, Panchayats, Municipalities &amp; Co-operatives<\/span><\/label><p>(Articles 239–243ZT) (Lesson 17)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"9\"><span>Part X &amp; Schedules V/VI: Scheduled and Tribal Areas (Articles 244–244A)<\/span><\/label><p>(Lesson 18)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"10\"><span>Part XI: Centre-State Relations (Articles 245–263) (Lesson 19)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"11\"><span>Part XII: Financial Relations, FC, Borrowing &amp; Property (Articles 264–300A)<\/span><\/label><p>(Lesson 20)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"12\"><span>Part XIII: Trade, Commerce and Intercourse (Articles 301–307) (Lesson 21)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"13\"><span>Part XIV &amp; XIVA: Services Under Union/States &amp; Tribunals (Articles 308–323B)<\/span><\/label><p>(Lesson 22)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"14\"><span>Part XV: Elections &amp; Electoral Machinery (Articles 324–329A) (Lesson 23)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"15\"><span>Part XVI: Special Provisions Relating to Certain Classes (Articles 330–342A)<\/span><\/label><p>(Lesson 24)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"16\"><span>Part XVII: Official Language (Articles 343–351) (Lesson 25)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"17\"><span>Part XVIII: Emergency Provisions (Articles 352–360) (Lesson 26)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"18\"><span>Parts XIX, XX, XXI &amp; XXII: Miscellaneous, Amendment, Special Provisions &amp;<\/span><\/label><p>Repeals (Articles 361–395) (Lesson 27 Complete) 🎉 Congratulations! We have completed the entire 27-Lesson Master Course covering the Constitution of India from Preamble to Article 395!<\/p><p>Here is the ultimate master memory system to lock the entire Constitution of India (all 25 Parts) into your brain in a single go!<\/p>"}], "nchk": 19}, {"n": 99, "title": "Master Overview & Memory Palace", "secs": [{"t": "The Single Master Sentence (Th", "h": "<p>Memorize this single 26-word sentence, where every capitalized word stands for a Part of the Constitution in exact chronological order:<\/p><p>&quot;You Can Fly Directly From United States Using Para Military Cops To Run Fast Through System Tribunals, Eagerly Serving Language Emergency, Making Amendments To Short-titles.&quot;<\/p><h4>┌───────────────────────────────────────────────────────────<\/h4><p>──────────────────────────────────┐<\/p><pre>│ MASTER SENTENCE BREAKDOWN                                                                     │<\/pre><h4>├───────────────┬───────────────────────────────────────────<\/h4><p>──────┬───────────────────────────┤<\/p><pre>│ Word         │ Constitutional Subject                 │ Part Number                       │<\/pre><h4>├───────────────┼───────────────────────────────────────────<\/h4><p>──────┼───────────────────────────┤<\/p><pre>│ You          │ Union &amp; Its Territory               │ Part I               │<\/pre><pre>│ Can          │ Citizenship                       │ Part II            │<\/pre><pre>│ Fly        │ Fundamental Rights                      │ Part III               │<\/pre><pre>│ Directly     │ Directive Principles of State Policy (DPSP)    │ Part IV                       │<\/pre><pre>│ From         │ Fundamental Duties                     │ Part IVA                      │<\/pre><pre>│ United       │ Union Government                       │ Part V                    │<\/pre><pre>│ States       │ State Government                       │ Part VI                   │<\/pre><pre>│ (States-B)     │ [States in Part B of First Schedule - DELETED] │ (Part VII)                      │<\/pre><pre>│ Using        │ Union Territories                   │ Part VIII            │\n│ Para         │ Panchayats                         │ Part IX                  │<\/pre><pre>│ Military    │ Municipalities                      │ Part IXA                 │<\/pre><pre>│ Cops         │ Co-operative Societies                    │ Part IXB                  │<\/pre><pre>│ To          │ Tribal &amp; Scheduled Areas                   │ Part X                 │<\/pre><pre>│ Run          │ Relations between Union &amp; States              │ Part XI                   │<\/pre><pre>│ Fast        │ Finance, Property, Contracts &amp; Suits           │ Part XII                  │<\/pre><pre>│ Through       │ Trade, Commerce &amp; Intercourse                  │ Part XIII                   │<\/pre><pre>│ System        │ Services under Union &amp; States                │ Part XIV                      │<\/pre><pre>│ Tribunals     │ Tribunals                         │ Part XIVA                │<\/pre><pre>│ Eagerly       │ Elections                         │ Part XV                  │<\/pre><pre>│ Serving       │ Special Provisions for Certain Classes         │ Part XVI                    │<\/pre><pre>│ Language       │ Official Language                       │ Part XVII                 │<\/pre><pre>│ Emergency       │ Emergency Provisions                       │ Part XVIII                │<\/pre><pre>│ Making        │ Miscellaneous                        │ Part XIX                  │<\/pre><pre>│ Amendments       │ Amendment of the Constitution                 │ Part XX                           │<\/pre><pre>│ To          │ Temporary, Transitional &amp; Special Provisions     │ Part XXI                        │<\/pre><pre>│ Short-titles │ Short Title, Commencement &amp; Repeals                  │ Part XXII                      │<\/pre><h4>└───────────────┴───────────────────────────────────────────<\/h4><p>──────┴───────────────────────────┘<\/p>"}, {"t": "The \"Crazy Memory Palace\" Stor", "h": "<p>If you are a visual learner, picture walking through an 8-Room Constitutional Mansion:<\/p><p><b>1. The Entrance (Parts 1–4A):<\/b> At the main gate, a Citizen (Part II) holds up a Fundamental Rights passport (Part III), reading a Directive Principles guide (Part IV) while doing their Fundamental Duty (Part IVA) of sweeping the doorstep of the Union Territory (Part I). 2. The Executive Wing (Parts 5–8): Inside, the Union King (Part V) and State Governor (Part VI) sit at a table (Room VII is empty/demolished), sending orders down to the UT Administrator (Part VIII). 3. The Local Village &amp; City (Parts 9–9B): In the courtyard, a village Panchayat elder (Part IX) drinks tea with a Municipal Mayor (Part IXA) and a Co-operative Society manager (Part IXB). 4. The Highway &amp; Trade Route (Parts 10–13): A Tribal Chief (Part X) monitors Centre-State Relations (Part XI) as trucks carrying Finance &amp; Property (Part XII) speed along the Trade &amp; Commerce highway (Part XIII). 5. The Courtroom &amp; Election Booth (Parts 14–15): Civil Servants (Part XIV) appear before Tribunals (Part XIVA) while stepping out to vote at an Election booth (Part XV). 6. The Hall of Diversity (Parts 16–18): Special Classes (Part XVI) speak in 22 Official Languages (Part XVII) when suddenly a red Emergency siren blares (Part XVIII)! 7. The Vault (Parts 19–22): Miscellaneous documents (Part XIX) are stamped with a giant Amendment seal (Part XX), filed under Temporary storage (Part XXI), and locked away with a Short Title &amp; Repeals key (Part XXII).<\/p>"}, {"t": "Quick Number-Block Chunking (F", "h": "<ul><li><b>1 to 4A:<\/b> The Citizen&#x27;s Foundation (Territory → Citizenship → Rights → DPSP → Duties)<\/li><li><b>5 to 8:<\/b> The High Executive (Union → State → [Deleted] → UTs)<\/li><li><b>9, 9A, 9B:<\/b> Grassroots Democracy (Panchayats → Municipalities → Co-operatives)<\/li><li><b>10 to 13:<\/b> Federal Architecture (Tribal Areas → Relations → Finance → Trade)<\/li><li><b>14 &amp; 14A:<\/b> Administrative Adjudication (Services → Tribunals)<\/li><li><b>15 to 18:<\/b> Democratic Mechanics &amp; Crisis (Elections → Special Classes → Language → Emergency)<\/li><li><b>19 to 22:<\/b> Constitutional Closure (Misc → Amendment → Temporary/Special → Short Title)<\/li><\/ul>"}], "nchk": 0, "ref": 1}];

$('#th').onclick=()=>{const c=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.theme=c=='dark'?'light':'dark';theme();save()};
$('#mb').onclick=()=>$('#nv').classList.toggle('open');
function nav(){$('#nv').innerHTML='<a data-g="dash" class="'+(view=='dash'?'on':'')+'">Dashboard</a><h5>Lessons</h5>'+LS.map(l=>`<a data-g="l${l.n}" class="${view==l.n?'on':''}"><span>${l.n}. ${l.title}</span><i>${prog(l)}%</i></a>`).join('')+D.filter(l=>l.ref).map(l=>`<h5>Reference</h5><a data-g="l${l.n}" class="${view==l.n?'on':''}">${l.title}</a>`).join('')}
$('#nv').onclick=e=>{const a=e.target.closest('a');if(a){location.hash=a.dataset.g;$('#nv').classList.remove('open')}};
function dash(){
 const tot=Math.round(LS.reduce((a,l)=>a+prog(l),0)/LS.length),nx=LS.find(l=>!st(l.n).read),dl=due(),wk=LS.filter(l=>st(l.n).read>Date.now()-7*DAY).length;
 let wm=0;for(let i=0;i<7;i++)wm+=S.mins[new Date(Date.now()-i*DAY).toISOString().slice(0,10)]||0;
 return `<div class="hero"><img class="hi" src="${LOGO}" alt=""><div><h1 class="serif">Welcome back</h1><p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p></div></div>
 <div class="g"><div class="card"><h2>Overall progress</h2><div class="rg"><svg viewBox="0 0 120 120" width="116" height="116"><defs><linearGradient id="tg"><stop offset="0" stop-color="#ff9933"/><stop offset="1" stop-color="#138808"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ln)" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="url(#tg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${3.267*tot} 327" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .6s"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="currentColor">${tot}%</text></svg></div><span class="mu">${LS.filter(l=>st(l.n).read).length} of ${LS.length} lessons studied</span></div>
 <div class="card"><h2>Study next</h2>${nx?`<b class="serif">Lesson ${nx.n}</b><p class="mu">${nx.title}</p><button class="p" data-g="l${nx.n}">Open lesson</button>`:'<p>All lessons studied. Focus on revision.</p>'}</div>
 <div class="card"><h2>Revision due</h2>${dl.length?dl.map(l=>`<div class="row"><span>L${l.n} · ${l.title.slice(0,34)}</span><span><button data-g="l${l.n}">Open</button> <button data-rv="${l.n}">Done</button></span></div>`).join(''):'<p class="mu">Nothing due. Revisions are scheduled at 1, 3, 7 and 21 days after you mark a lesson studied.</p>'}</div>
 <div class="card"><h2>Weekly goal</h2><div class="row"><span><b class="big">${wk}</b> <span class="mu">/ ${S.goal} lessons</span></span><span><button data-gl="-1">−</button> <button data-gl="1">+</button></span></div><div class="bar"><div style="width:${Math.min(100,100*wk/S.goal)}%"></div></div></div>
 <div class="card"><h2>Focus timer</h2><div class="tm" id="tt"></div><div class="row"><span class="mu" id="tl"></span><span><button class="p" data-tm="go" id="tg"></button> <button data-tm="rs">Reset</button></span></div><div class="mu" id="tx">Today ${S.mins[dk()]||0} min · 7 days ${wm} min</div></div></div>`}
function lesson(l){
 const s=st(l.n),sc=l.secs[tab]||l.secs[0];
 return `<h1 class="serif">${l.ref?'':'Lesson '+l.n+' · '}${l.title}</h1>
 ${l.ref?'':`<div class="row"><div style="flex:1;min-width:180px"><div class="bar"><div style="width:${prog(l)}%"></div></div><span class="mu">${prog(l)}% complete</span></div><button data-rd class="${s.read?'':'p'}">${s.read?'✓ Studied':'Mark as studied'}</button></div>`}
 <div class="tabs">${l.secs.map((x,i)=>`<button data-tb="${i}" class="${i==tab?'on':''}">${x.t}</button>`).join('')}</div>
 <div class="card c">${sc.h}${sc.t=='Drill'?`<label class="ans"><input type="checkbox" data-an ${s.ans?'checked':''}> Answers written in my notebook</label>`:''}</div>
 ${l.ref?'':`<h2>My notes</h2><textarea data-nt placeholder="Corrections, doubts, things to revisit…">${s.note.replace(/</g,'&lt;')}</textarea>`}`}
function render(){nav();const l=get(view);$('#mn').innerHTML=view=='dash'?dash():lesson(l);if(view!='dash')document.querySelectorAll('[data-c]').forEach(c=>c.checked=!!st(view).chk[c.dataset.c]);tick()}
function tick(){const t=$('#tt');if(!t)return;t.textContent=String(Math.floor(tm.t/60)).padStart(2,'0')+':'+String(tm.t%60).padStart(2,'0');$('#tl').textContent=tm.m=='f'?'Focus · 25 min':'Break · 5 min';$('#tg').textContent=tm.r?'Pause':'Start'}
function route(){const h=location.hash.slice(1);view=/^l\d+$/.test(h)&&get(+h.slice(1))?+h.slice(1):'dash';tab=0;render();scrollTo(0,0)}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{const t=e.target,g=t.closest('[data-g]');
 if(g&&!t.closest('nav')){location.hash=g.dataset.g;return}
 let b;
 if(b=t.closest('[data-tb]')){tab=+b.dataset.tb;render()}
 else if(t.closest('[data-rd]')){const s=st(view);s.read=s.read?0:Date.now();if(!s.read)s.rev=[];save();render()}
 else if(b=t.closest('[data-rv]')){st(+b.dataset.rv).rev.push(Date.now());save();render()}
 else if(b=t.closest('[data-gl]')){S.goal=Math.max(1,S.goal+ +b.dataset.gl);save();render()}
 else if(b=t.closest('[data-tm]')){if(b.dataset.tm=='rs'){clearInterval(tm.id);tm={m:'f',t:1500,r:0,id:0}}else if(tm.r){clearInterval(tm.id);tm.r=0}else{tm.r=1;tm.id=setInterval(()=>{if(--tm.t<=0){if(tm.m=='f'){S.mins[dk()]=(S.mins[dk()]||0)+25;save();tm.m='b';tm.t=300}else{tm.m='f';tm.t=1500}clearInterval(tm.id);tm.r=0;const x=$('#tx');if(x)x.textContent='Session complete · Today '+S.mins[dk()]+' min'}tick()},1000)}tick()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.an!==undefined){st(view).ans=t.checked}else if(t.dataset.c!==undefined){st(view).chk[t.dataset.c]=t.checked}else return;save();nav();const b=$('.bar div');if(b&&view!='dash'){b.style.width=prog(get(view))+'%';b.parentNode.nextElementSibling.textContent=prog(get(view))+'% complete'}});
document.addEventListener('input',e=>{if(e.target.dataset.nt!==undefined){st(view).note=e.target.value;save()}});
theme();route();
</script></body></html>
