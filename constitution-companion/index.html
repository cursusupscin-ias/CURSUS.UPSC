e (Articles 36 &amp; 37)<\/h4><ul><li><b>Article 36:<\/b> Definition of &quot;The State&quot;<\/li><ul><li>States that in Part IV, unless the context otherwise requires, &quot;the State&quot; has the same meaning as in Part III (Article 12) [passage 100].<\/li><\/ul><li><b>Article 37:<\/b> Application of the Principles<\/li><ul><li>Explicitly establishes two governing rules [passage 100]: 1. Non-Justiciable: The provisions contained in Part IV shall not be enforceable by any court [passage 100]. 2. Fundamental in Governance: The principles are nevertheless fundamental in the governance of the country, and it shall be the duty of the State to apply these principles in making laws [passage 100].<\/li><\/ul><\/ul><h4>B. Socialistic Principles (Welfare State &amp; Socio-Economic Equity)<\/h4><ul><li><b>Article 38:<\/b> Social Order for Welfare &amp; Minimizing Inequalities<\/li><ul><li><b>Art. 38(1):<\/b> State shall strive to promote the welfare of the people by securing a social order in which justice—social, economic, and political—informs all institutions of national life [passage 101].<\/li><li><b>Art. 38(2):<\/b> Added by 44th CAA, 1978; mandates the State to minimize inequalities in income, status, facilities, and opportunities [passage 101, passage 103].<\/li><\/ul><li><b>Article 39:<\/b> Key Principles of Policy to be Followed by the State<\/li><ul><li><b>Art. 39(a):<\/b> Right to adequate means of livelihood for all citizens equally [passage 102].<\/li><li><b>Art. 39(b):<\/b> Ownership and control of material resources of the community distributed best to subserve the common good [passage 102].<\/li><li><b>Art. 39(c):<\/b> Operation of the economic system does not result in concentration of wealth and means of production to common detriment [passage 102].<\/li><li><b>Art. 39(d):<\/b> Equal pay for equal work for both men and women [passage 103].<\/li><li><b>Art. 39(e):<\/b> Health and strength of workers/children protected against abuse and economic compulsion [passage 103].<\/li><li><b>Art. 39(f):<\/b> Substituted by 42nd CAA, 1976; opportunities for children to develop in a healthy manner and protection of youth against exploitation/abandonment [passage 104, passage 107].<\/li><\/ul><li><b>Article 39A:<\/b> Equal Justice and Free Legal Aid<\/li><ul><li>Added by 42nd CAA, 1976; mandates free legal aid by suitable legislation or schemes to ensure justice is not denied due to economic or other disabilities [passage 104, passage 107]. (Legal Services Authorities Act, 1987 enacted under this).<\/li><\/ul><li><b>Article 41:<\/b> Right to Work, Education, and Public Assistance<\/li><ul><li>State shall, within the limits of its economic capacity, secure the right to work, to education, and to public assistance in cases of unemployment, old age, sickness, disablement, and undeserved want [passage 105]. (e.g., MGNREGA, National Social Assistance Programme).<\/li><\/ul><li><b>Article 42:<\/b> Humane Work Conditions and Maternity Relief<\/li><ul><li>Mandates provision for securing just and humane conditions of work and for maternity relief [passage 106]. (e.g., Maternity Benefit Act, 1961/2017).<\/li><\/ul><li><b>Article 43:<\/b> Living Wage for Workers &amp; Cottage Industries<\/li><ul><li>Endeavour to secure a living wage (beyond minimum wage), decent standard of life, and promote cottage industries [passage 106].<\/li><\/ul><li><b>Article 43A:<\/b> Participation of Workers in Management<\/li><ul><li>Added by 42nd CAA, 1976; steps to secure participation of workers in the management of industrial undertakings [passage 107].<\/li><\/ul><\/ul><h4>C. Gandhian Principles (Reconstruction &amp; Rural Upliftment)<\/h4><ul><li><b>Article 40:<\/b> Organisation of Village Panchayats<\/li><ul><li>Steps to organize village panchayats and endow them with powers/authority to function as units of self-government [passage 105]. (Constitutionalized via 73rd CAA, 1992 / Part IX) [passage 197].<\/li><\/ul><li><b>Article 43B:<\/b> Promotion of Co-operative Societies<\/li><ul><li>Added by 97th CAA, 2011; promote voluntary formation, autonomous functioning, democratic control, and professional management of co-operative societies [passage 108, passage 111].<\/li><\/ul><li><b>Article 46:<\/b> Educational &amp; Economic Interests of SCs, STs, and Weaker Sections<\/li><ul><li>Promote with special care the educational and economic interests of SCs, STs, and weaker sections and protect them from social injustice and exploitation [passage 109].<\/li><\/ul><li><b>Article 47:<\/b> Nutrition, Standard of Living, Public Health &amp; Prohibition<\/li><ul><li>Raise level of nutrition and standard of living, improve public health, and bring about prohibition of intoxicating drinks and health-injurious drugs [passage 109].<\/li><\/ul><li><b>Article 48:<\/b> Organisation of Agriculture, Animal Husbandry &amp; Cow Slaughter Ban<\/li><ul><li>Organise agriculture/animal husbandry on modern scientific lines, preserve/improve breeds, and prohibit the slaughter of cows, calves, and other milch/draught cattle [passage 110].<\/li><\/ul><\/ul><h4>D. Liberal-Intellectual Principles (Modern Administrative Ideals)<\/h4><ul><li><b>Article 44:<\/b> Uniform Civil Code (UCC)<\/li><ul><li>State shall endeavour to secure for citizens a Uniform Civil Code throughout the territory of India [passage 108].<\/li><\/ul><li><b>Article 45:<\/b> Early Childhood Care and Education (Below 6 Years)<\/li><ul><li>Substituted by 86th CAA, 2002; State shall endeavour to provide early childhood care and education for all children until they complete the age of six years [passage 108, passage 111]. (Reflects shift of 6–14 years to Article 21A) [passage 75].<\/li><\/ul><li><b>Article 48A:<\/b> Protection of Environment, Forests, and Wildlife<\/li><ul><li>Added by 42nd CAA, 1976; protect and improve the environment and safeguard forests and wildlife [passage 110, passage 111]. (Environment Protection Act, 1986, Wildlife Protection Act, 1972).<\/li><\/ul><li><b>Article 49:<\/b> Protection of Monuments and Objects of National Importance<\/li><ul><li>Obligation of the State to protect monuments, places, or objects of artistic/historic interest declared by Parliament to be of national importance from spoliation or destruction [passage 111].<\/li><\/ul><li><b>Article 50:<\/b> Separation of Judiciary from Executive<\/li><ul><li>State shall take steps to separate the judiciary from the executive in the public services of the State [passage 112]. (Achieved largely through Code of Criminal Procedure, 1973).<\/li><\/ul><li><b>Article 51:<\/b> Promotion of International Peace and Security<\/li><ul><li><b>State shall endeavour to [passage 112]:<\/b> 1. Art. 51(a): Promote international peace and security [passage 112]. 2. Art. 51(b): Maintain just and honourable relations between nations [passage 112]. 3. Art. 51(c): Foster respect for international law and treaty obligations [passage 112]. 4. Art. 51(d): Encourage settlement of international disputes by arbitration [passage 112].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: The 4 Constitutional Amendments that Added/Altered DPSPs<\/h4><ul><li><b>Mnemonic:<\/b> &quot;42 - 44 - 86 - 97&quot;<\/li><ul><li><b>42nd Amendment (1976) [4 Principles added]:<\/b><\/li><ul><li><b>39(f):<\/b> Healthy child development [passage 104].<\/li><li><b>39A:<\/b> Free legal aid [passage 104].<\/li><li><b>43A:<\/b> Workers in management [passage 107].<\/li><li><b>48A:<\/b> Environment &amp; wildlife protection [passage 110].<\/li><\/ul><li><b>44th Amendment (1978) [1 Principle added]:<\/b><\/li><ul><li><b>38(2):<\/b> Minimize inequalities in income, status, facilities [passage 101].<\/li><\/ul><li><b>86th Amendment (2002) [1 Principle altered]:<\/b><\/li><ul><li><b>45:<\/b> Changed scope to early childhood care under 6 years [passage 108].<\/li><\/ul><li><b>97th Amendment (2011) [1 Principle added]:<\/b><\/li><ul><li><b>43B:<\/b> Co-operative societies [passage 108].<\/li><\/ul><\/ul><\/ul><h4>Mnemonic 2: Liberal-Intellectual Articles (Arts. 44 to 51)<\/h4><ul><li><b>Mnemonic:<\/b> &quot;U-C-E-M-J-I&quot; (&quot;Uniform Child Environment Monuments Judiciary International&quot;)<\/li><ul><li><b>44:<\/b> Uniform Civil Code [passage 108]<\/li><li><b>45:<\/b> Childcare under 6 years [passage 108]<\/li><li><b>48/48A:<\/b> Environment &amp; Agriculture [passage 110]<\/li><li><b>49:<\/b> Monuments protection [passage 111]<\/li><li><b>50:<\/b> Judiciary separation [passage 112]<\/li><li><b>51:<\/b> International peace [passage 112]<\/li><\/ul><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 39A:<\/b> இலவச சட்டம் (Free Legal Aid) → &quot;ஏழைக்கும் நீதி&quot;.<\/li><li><b>Art. 40:<\/b> பஞ்சாயத்து (Panchayat) → &quot;கிராம சுயராஜ்யம்&quot;.<\/li><li><b>Art. 44:<\/b> பொது சிவில் சட்டம் (UCC) → &quot;அனைவருக்கும் ஒரே குடும்பச் சட்டம்&quot;.<\/li><li><b>Art. 50:<\/b> நீதி - நிர்வாக பிரிவினை (Judiciary-Executive Separation) → &quot;சுதந்திரமான நீதித்துறை&quot;.<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>FUNDAMENTAL RIGHTS (PART III) vs. DPSPs (PART IV) HARMONY<\/h4><p>│<\/p><h4>┌───────────────────────────────────────┴───────────────────<\/h4><p>────────────────────┐<\/p><pre>│                                               │\nEARLY CONFLICT ERA (1951–1973)                         HARMONIOUS CONSTRUCTION<\/pre><p>(1980 ONWARDS)<\/p><pre>✦ Champakam Dorairajan (1951): FRs &gt; DPSPs               ✦ Minerva Mills (1980): FRs &amp;<\/pre><p>DPSPs are<\/p><pre>✦ 25th CAA (1971): Art 31C added (39b/c &gt; 14/19)         twin wheels of the constitutional<\/pre><p>chariot.<\/p><pre>✦ Kesavananda Bharati (1973): Upheld 31C part 1         ✦ Unni Krishnan (1993): Read<\/pre><p>DPSPs into Art 21 to create new FRs.<\/p><ul><li>The Historical Conflict &amp; Fundamental Balance (The Part III vs. Part IV Saga):<\/li><ul><li>State of Madras v. Champakam Dorairajan (1951): The SC held that Fundamental Rights are sacrosanct and DPSPs must run as subsidiary to Fundamental Rights [passage 55, passage 100].<\/li><li><b>The 25th CAA, 1971 &amp; Article 31C:<\/b> Introduced Article 31C, giving primacy to DPSPs under Article 39(b) and 39(c) over Fundamental Rights under Articles 14 and 19 [passage 91, passage 102].<\/li><li><b>Kesavananda Bharati v. State of Kerala (1973):<\/b> Upheld the validity of the first part of Article 31C, establishing that laws securing Art. 39(b) &amp; (c) cannot be invalidated for violating Art. 14 or 19 [passage 91, passage 93, passage 102].<\/li><li><b>Minerva Mills v. Union of India (1980):<\/b> The Supreme Court struck down Parliament&#x27;s attempt via 42nd CAA to give primacy to all DPSPs over Articles 14 and 19 [passage 93, passage 382]. Justice Y.V. Chandrachud famously declared:<\/li><\/ul><\/ul><p>&quot;The Indian Constitution is founded on the bedrock of the balance between Part III and Part IV. To give absolute primacy to one over the other is to disturb the harmony of the Constitution.&quot;<\/p><ul><li>DPSP Expansion into Enforceable Fundamental Rights (Art. 21 Judicial Synthesis):<\/li><ul><li>The judiciary has progressively converted non-justiciable DPSPs into enforceable rights under Article 21 [passage 75, passage 100]:<\/li><ul><li>Art. 39A (Free Legal Aid) [passage 104] → Enforceable under Art. 21 (M.H. Hoskot v. State of Maharashtra, 1978).<\/li><li>Art. 45 (Education) [passage 108] → Enforceable under Art. 21A (Unni Krishnan v. State of A.P., 1993 &amp; 86th CAA) [passage 57, passage 75].<\/li><li>Art. 47 &amp; 48A (Clean Environment &amp; Health) [passage 109, passage 110] → Enforceable under Art. 21 (Subhash Kumar v. State of Bihar, 1991).<\/li><\/ul><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Equal Pay for Equal Work (Article 39(d)):<\/h4><ul><ul><li><b>Randhir Singh v. Union of India (1982):<\/b> The SC held that while &quot;Equal pay for equal work&quot; is a DPSP under Art. 39(d) [passage 103], it is a constitutional goal enforceable through Art. 14 [passage 57] and Art. 32 [passage 94].<\/li><\/ul><\/ul><p>2. Implementation of Uniform Civil Code (Article 44):<\/p><ul><ul><li>Sarla Mudgal v. Union of India (1995) &amp; Shayara Bano v. Union of India (2017): The Supreme Court urged the Union Government to secure a Uniform Civil Code under Article 44 [passage 108] to eliminate gender discrimination in personal laws and ensure national integration.<\/li><\/ul><\/ul><p>3. Environmental Protection &amp; Public Trust Doctrine (Article 48A):<\/p><ul><ul><li>M.C. Mehta v. Union of India (Taj Trapezium &amp; Oleum Gas Cases): Applied Article 48A [passage 110] read with Article 21 [passage 75] to establish the &quot;Polluter Pays Principle&quot; and the &quot;Precautionary Principle&quot; in environmental jurisprudence. 4. Liquor Bans &amp; Economic Freedom (Article 47 vs. Article 19(1)(g)):<\/li><li>State of Bombay v. F.N. Balsara (1951) &amp; State of Gujarat v. Mirzapur Moti Kureshi Kassab Jamat (2005): Restrictions imposed on trade/business (Art. 19(1)(g)) [passage 69] to implement total prohibition under Article 47 [passage 109] or cow slaughter bans under Article 48 [passage 110] are deemed reasonable restrictions under Art. 19(6) in the interest of the general public [passage 73].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Justiciability vs. Governance Duty, Socio-Economic Rights, and Constitutional Balance<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part IV of the Constitution (Articles 36–51) embeds the vision of a socio-economic welfare state, functioning as a constitutional directive to the executive and legislature [passage 4, passage 100]. As Article 37 explicitly affirms, while these principles are non-enforceable in courts of law, they remain &#x27;fundamental in the governance of the country&#x27; [passage 100].&quot;<\/p><ul><li>Mains Body Arguments (Judicial Synthesis &amp; Legislative Realization):<\/li><ul><li><b>Primacy Framework:<\/b> Cite Article 31C read with Kesavananda Bharati (1973) [passage 91, passage 93] to explain how statutory laws giving effect to Article 39(b) and (c) [passage 102] enjoy explicit protection against challenges under Articles 14 and 19 [passage 57, passage 69].<\/li><li><b>Bedrock Harmony Doctrine:<\/b> Reference Minerva Mills (1980) [passage 93] to argue that welfare governance must be achieved without destroying fundamental liberties.<\/li><li><b>Translating Directives into Acts:<\/b> Illustrate how non-justiciable directives have been transformed into rights-based statutory frameworks (e.g., Art. 40 → 73rd CAA Panchayats [passage 105, passage 197], Art. 41 → MGNREGA [passage 105], Art. 39A → NALSA [passage 104], Art. 45 → RTE Act [passage 75, passage 108]).<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, DPSPs provide the substantive moral compass for public policy in India. By progressively reading Part IV directives into Article 21, the judiciary and statutory legislature have converted abstract social goals into enforceable human rights [passage 75, passage 100].&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What are the four DPSPs added to Part IV by the 42nd Constitutional Amendment Act, 1976? [passage 104, passage 107, passage 110] 2. Reverse Recall: Which Article obligates the State to promote voluntary formation, autonomous functioning, and professional management of co-operative societies? Which Amendment inserted it? [passage 108, passage 111] 3. UPSC Prelims Analytical Trap: A citizen files a writ petition under Article 32 requesting the Supreme Court to issue a Mandamus directing Parliament to enact a Uniform Civil Code under Article 44 [passage 108]. Is this writ petition maintainable under Article 32? Explain by referencing Article 37 [passage 94, passage 100]. 4. Mains Applied Question: Discuss the significance of the Minerva Mills (1980) judgment [passage 93] in balancing Part III Fundamental Rights [passage 54] and Part IV Directive Principles of State Policy [passage 100].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Current Lesson<\/span><\/label><p>Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Up Next)<\/span><\/label>"}], "nchk": 6}, {"n": 7, "title": "Part IVA — Fundamental Duties (Article 51A)", "secs": [{"t": "Articles", "h": "<p>Part IVA contains a single Article—Article 51A—which sets out the Fundamental Duties expected of every citizen of India [passage 10, passage 99].<\/p><ul><li><b>Historical Context &amp; Origin:<\/b><\/li><ul><li>Fundamental Duties were not part of the original Constitution enacted in 1949 [passage 99].<\/li><li>Recommended by the Swaran Singh Committee (1976) during the National Emergency [passage 99].<\/li><li>Inserted into the Constitution by the 42nd Constitutional Amendment Act, 1976, introducing 10 Fundamental Duties (Clauses (a) through (j)) [passage 99, passage 101].<\/li><li>The 11th Fundamental Duty (Clause (k)) was added by the 86th Constitutional Amendment Act, 2002 [passage 101].<\/li><\/ul><\/ul><h4>PART IVA: FUNDAMENTAL DUTIES (ARTICLE 51A)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬──────────┴──────────┬───────<\/h4><p>──────────────────────┐<\/p><pre>│   Civic &amp; National Ideals │ Social Harmony &amp; │ Scientific &amp; Environmental│<\/pre><pre>│   [Clauses (a), (b), (c), │ Dignity of Women │ Progress                │<\/pre><pre>│    (d), (i)]         │ [Clause (e)]      │ [Clauses (f), (g), (h)] │<\/pre><h4>└─────────────────────────────┴─────────────────────┴───────<\/h4><p>──────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ Excellence &amp;       │<\/pre><pre>│ Child Education        │<\/pre><h4>│ [Clauses (j), (k)] │<\/h4><h4>└─────────────────────┘<\/h4><p><b>Text of Article 51A:<\/b> Duties of Every Citizen of India<\/p><h4>It shall be the duty of every citizen of India [passage 99]:<\/h4><p><b>1. Art. 51A(a) — Constitution &amp; Symbols:<\/b> To abide by the Constitution and respect its ideals and institutions, the National Flag and the National Anthem [passage 99]. 2. Art. 51A(b) — Freedom Struggle: To cherish and follow the noble ideals which inspired our national struggle for freedom [passage 99]. 3. Art. 51A(c) — Sovereignty &amp; Integrity: To uphold and protect the sovereignty, unity and integrity of India [passage 99]. 4. Art. 51A(d) — National Defence: To defend the country and render national service when called upon to do so [passage 100]. 5. Art. 51A(e) — Harmony &amp; Women&#x27;s Dignity: To promote harmony and the spirit of common brotherhood amongst all the people of India transcending religious, linguistic and regional or sectional diversities; to renounce practices derogatory to the dignity of women [passage 100]. 6. Art. 51A(f) — Composite Culture: To value and preserve the rich heritage of our composite culture [passage 100]. 7. Art. 51A(g) — Environment &amp; Compassion: To protect and improve the natural environment including forests, lakes, rivers and wild life, and to have compassion for living creatures [passage 100]. 8. Art. 51A(h) — Scientific Temper &amp; Humanism: To develop the scientific temper, humanism and the spirit of inquiry and reform [passage 101]. 9. Art. 51A(i) — Public Property: To safeguard public property and to abjure violence [passage 101]. 10.Art. 51A(j) — Collective Excellence: To strive towards excellence in all spheres of individual and collective activity so that the nation constantly rises to higher levels of endeavour and achievement [passage 101]. 11.Art. 51A(k) — Duty of Parent/Guardian for Education: Who is a parent or guardian to provide opportunities for education to his child or, as the case may be, ward between the age of six and fourteen years [passage 101].<\/p>"}, {"t": "Mnemonics", "h": "<p>To remember all 11 clauses (a to k) in exact sequence, use the Alphabetical Keyword Map:<\/p><ul><li>a → Anthem, Flag &amp; Constitution (Abide &amp; respect) [passage 99]<\/li><li>b → Brave Freedom Struggle (Cherish noble ideals) [passage 99]<\/li><li>c → Crown of Sovereignty (Uphold Unity &amp; Integrity) [passage 99]<\/li><li>d → Defend the Nation (Render national service) [passage 100]<\/li><li>e → Equal Brotherhood &amp; Respect Eves (Dignity of women) [passage 100]<\/li><li>f → Fort &amp; Culture (Composite culture heritage) [passage 100]<\/li><li>g → Green Environment (Forests, lakes, rivers, wildlife) [passage 100]<\/li><li>h → Humanism &amp; Scientific Temper (Spirit of inquiry) [passage 101]<\/li><li>i → Infrastructure (Safeguard public property) [passage 101]<\/li><li>j → Jump to Excellence (Individual and collective sphere) [passage 101]<\/li><li>k → Kids Education (Parental duty for ages 6–14) [passage 101]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>51A(a):<\/b> கொடி &amp; கீ தம் → அரசியலமைப்பு, தேசியக் கொடி, தேசியக் கீ தத்திற்கு மரியாதை [passage 99].<\/li><li><b>51A(e):<\/b> சகோதரத்துவம் &amp; பெண்கள் → சகோதரத்துவம் வளர்த்தல் மற்றும் பெண்களை இழிவுபடுத்தும் பழக்கங்களை துறத்தல் [passage 100].<\/li><li><b>51A(g):<\/b> இயற்கை பாதுகாப்பு → காடுகள், நதிகள், ஏரிகள், வனவிலங்குகளை பாதுகாத்தல் [passage 100].<\/li><li><b>51A(h):<\/b> அறிவியல் பார்வை (Scientific Temper) → பகுத்தறிவு மற்றும் மனிதநேயத்தை வளர்த்தல் [passage 101].<\/li><li><b>51A(k):<\/b> குழந்தை கல்வி → 6 முதல் 14 வயதுக் குழந்தைகளுக்கு கல்வி தருவது பெற்றோர் கடமை [passage 101].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>THE TRIAD OF RIGHTS, DIRECTIVES, AND DUTIES<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────┼─────────────────────────<\/h4><p>────────┐<\/p><pre>│                       │                     │<\/pre><pre>FUNDAMENTAL RIGHTS                  DIRECTIVE PRINCIPLES                FUNDAMENTAL DUTIES<\/pre><pre>(Part III)              (Part IV)                 (Part IVA)<\/pre><pre>✦ Claim of Individual         ✦ Duty of State              ✦ Duty of Individual<\/pre><pre>against the State          towards the Citizen            towards the Nation<\/pre><pre>✦ Justiciably Enforceable       ✦ Non-Justiciable Guidance         ✦ Non-Justiciable Duty<\/pre><h4>1. The Education Triad (21A ↔ 45 ↔ 51A(k))<\/h4><ul><li><b>Article 21A (Fundamental Right):<\/b> Mandates the State to provide free and compulsory education for children aged 6 to 14 years [passage 4, passage 61].<\/li><li><b>Article 45 (DPSP):<\/b> Directs the State to endeavour to provide early childhood care and education for children below six years [passage 8, passage 94].<\/li><li><b>Article 51A(k) (Fundamental Duty):<\/b> Obligates the parent or guardian to provide education opportunities to their child/ward aged 6 to 14 years [passage 10, passage 101].<\/li><\/ul><h4>2. The Environment Protection Triad (48A ↔ 51A(g) ↔ 21)<\/h4><ul><li><b>Article 48A (DPSP):<\/b> Obligation of the State to protect and improve the environment and safeguard forests and wildlife [passage 9, passage 96].<\/li><li><b>Article 51A(g) (Fundamental Duty):<\/b> Duty of every citizen to protect natural environment and show compassion for living creatures [passage 100].<\/li><li><b>Article 21 (Fundamental Right):<\/b> Judicial expansion guarantees the Right to a Clean Environment as a fundamental right to life (Subhash Kumar v. State of Bihar, 1991).<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>A. Statutory Backing &amp; Enforcement (Verma Committee, 1999)<\/h4><p>Though Fundamental Duties are non-justiciable directly under Part IVA, the Justice Verma Committee (1999) highlighted that several statutory laws already enforce specific duties legally:<\/p><p>1. Prevention of Insults to National Honour Act, 1971: Enforces Article 51A(a) [passage 99]. 2. Indian Penal Code (IPC Sections 153A, 153B, 505): Punishes acts disrupting national integration or promoting enmity, enforcing Article 51A(c) &amp; (e) [passage 99, passage 100]. 3. Protection of Civil Rights Act, 1955: Punishes offences related to caste discrimination and untouchability, enforcing Article 51A(e) [passage 100]. 4. Wildlife Protection Act, 1972 &amp; Forest Conservation Act, 1980: Enforces Article 51A(g) [passage 100]. 5. Representation of the People Act, 1951: Disqualifies candidates soliciting votes on religious or communal grounds, enforcing Article 51A(c) &amp; (e) [passage 99, passage 100].<\/p><h4>B. Key Supreme Court Rulings<\/h4><h4>1. Bijoe Emmanuel v. State of Kerala (1986) [National Anthem Case]:<\/h4><ul><ul><li><b>Ruling:<\/b> Three Jehovah&#x27;s Witness students refused to sing the National Anthem due to religious beliefs, though they stood up respectfully. The SC held that standing respectfully complies with Article 51A(a) [passage 99]. Forcing them to sing violated their rights under Article 19(1)(a) [passage 54] and Article 25 [passage 66]. 2. AIIMS Students Union v. AIIMS (2001):<\/li><li><b>Ruling:<\/b> The Supreme Court held that while Fundamental Duties are not directly enforceable by writs, they are equally important as Fundamental Rights. They serve as a vital tool for judicial interpretation of statutes and for determining the reasonableness of restrictions under Article 19(2)–(6) [passage 55, passage 56, passage 57, passage 59]. 3. Shyam Narayan Chouksey v. Union of India (2018):<\/li><li><b>Ruling:<\/b> The Supreme Court modified its earlier interim order, ruling that playing the National Anthem in cinema halls before movie screenings is optional, not mandatory, balancing national respect under Article 51A(a) [passage 99] with individual freedom.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Rights-Duty Correlation, Civic Responsibility, and Constitutional Interpretation<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part IVA (Article 51A), introduced via the 42nd Constitutional Amendment Act, 1976 on the recommendation of the Swaran Singh Committee, embeds the ethos of civic responsibility into Indian constitutionalism [passage 99, passage 101]. It operationalizes Mahatma Gandhi’s philosophy that &#x27;true rights are the result of duties performed&#x27;, balancing individual liberties under Part III with democratic duties [passage 4, passage 99].&quot;<\/p><ul><li>Mains Body Arguments (Judicial Utility &amp; Statutory Realization):<\/li><ul><li><b>Tool for Constitutional Interpretation:<\/b> Cite AIIMS Students Union (2001) to show how courts use Article 51A to determine whether legislative restrictions on fundamental rights satisfy the test of &quot;reasonableness&quot; under Article 19 [passage 55, passage 56, passage 57, passage 59].<\/li><li><b>Statutory Enforcement Synergy:<\/b> Reference the Justice Verma Committee (1999) findings to demonstrate that while Part IVA lacks self-executing penal provisions, specific parliamentary enactments (e.g., Wildlife Protection Act, 1972, Prevention of Insults to National Honour Act, 1971) give statutory teeth to several clauses [passage 99, passage 100].<\/li><li><b>The Education &amp; Environment Synthesis:<\/b> Highlight how Article 51A(k) [passage 101] complements Article 21A [passage 61] and Article 51A(g) [passage 100] complements Article 48A [passage 96] to form an integrated governance framework.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, far from being mere &#x27;pious declarations&#x27;, Fundamental Duties serve as a moral compass for constitutional citizenship, reminding citizens that sustainable democratic rights depend on active civic duty.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> How many Fundamental Duties were originally added by the 42nd Amendment Act, 1976 [passage 99, passage 101], and which specific duty was added by the 86th Amendment Act, 2002? [passage 101] 2. Reverse Recall: Which specific clause under Article 51A obligates every citizen to &quot;develop the scientific temper, humanism and the spirit of inquiry and reform&quot;? [passage 101] 3. UPSC Prelims Analytical Trap: A citizen fails to protect a public monument in their locality. Can a writ of Mandamus be issued directly under Article 32 by the Supreme Court to compel that citizen to perform their duty under Article 51A? Explain why or why not [passage 80, passage 99]. 4. Mains Applied Question: Discuss the findings of the Justice Verma Committee (1999) regarding the legal and statutory framework available for enforcing Fundamental Duties in India.<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; Vice-President (Articles 52–73) (Up Next)<\/span><\/label>"}], "nchk": 7}, {"n": 8, "title": "Part V — The Union Executive: President & Vice-President (Articles", "secs": [{"t": "Articles", "h": "<h4>52–73)<\/h4><p>Part V of the Constitution begins Chapter I (The Executive), covering the Constitutional Head of the Republic of India (The President) and the Second Highest Constitutional Authority (The Vice-President) [passage 3, passage 55].<\/p><h4>PART V CHAPTER I: THE EXECUTIVE (ARTICLES 52–73)<\/h4><h4>│<\/h4><h4>┌─────────────────────────┬───────────┴───────────┬─────────<\/h4><p>────────────────┐<\/p><pre>│ Presidential Office &amp; │ Qualification, Oath &amp; │ Vice-Presidential       │<\/pre><pre>│ Electoral Mechanism       │ Impeachment         │ System            │<\/pre><pre>│ (Arts. 52–55)        │ (Arts. 56–62)       │ (Arts. 63–70)     │<\/pre><h4>└─────────────────────────┴───────────────────────┴─────────<\/h4><p>────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Election Disputes &amp; │<\/h4><pre>│ Executive Powers     │<\/pre><pre>│ (Arts. 71–73)    │<\/pre><h4>└─────────────────────┘<\/h4><p>A. The President of India (Articles 52–62)<\/p><ul><li><b>Article 52:<\/b> The President of India<\/li><ul><li><b>Establishes the constitutional post:<\/b> &quot;There shall be a President of India.&quot; [passage 55]<\/li><\/ul><li><b>Article 53:<\/b> Executive Power of the Union<\/li><ul><li><b>Art. 53(1):<\/b> Vests executive power of the Union in the President, to be exercised either directly or through officers subordinate to him in accordance with the Constitution [passage 55].<\/li><li><b>Art. 53(2):<\/b> Vests the Supreme Command of the Defence Forces in the President, regulated by law [passage 55].<\/li><\/ul><li><b>Article 54:<\/b> Election of President (The Electoral College)<\/li><ul><li>The President is elected by an Electoral College consisting of [passage 56]: 1. Elected members of both Houses of Parliament (Lok Sabha &amp; Rajya Sabha) [passage 56]. 2. Elected members of the Legislative Assemblies of the States (MLAs) [passage 56]. 3. Explanation: State includes the National Capital Territory of Delhi and the Union Territory of Puducherry (inserted by the 70th CAA, 1992)<\/li><\/ul><\/ul><h4>🚨<\/h4><p>[passage 57].<\/p><pre>4.     Exclusions: Nominated members of Parliament, nominated members<\/pre><p>of State Assemblies, and all members (elected or nominated) of State Legislative Councils (MLCs) do NOT vote.<\/p><ul><li><b>Article 55:<\/b> Manner of Election of President<\/li><ul><li>Ensures uniformity in representation across States and parity between States as a whole and the Union [passage 57].<\/li><li>Conducted via Proportional Representation by means of the Single Transferable Vote through secret ballot [passage 58, passage 59].<\/li><li><b>Population Base Freeze (Explanation):<\/b> &quot;Population&quot; refers to the 1971 census, frozen until the first census taken after 2026 (via 84th CAA, 2001) [passage 59, passage 61].<\/li><\/ul><li><b>Article 56:<\/b> Term of Office of President<\/li><ul><li><b>Art. 56(1):<\/b> Holds office for a term of 5 years from the date of entering office [passage 60].<\/li><li>Resignation is addressed in writing under hand to the Vice-President [passage 60].<\/li><li>Can be removed before term expiration only by impeachment for &quot;violation of the Constitution&quot; under Article 61 [passage 60].<\/li><li>Continues to hold office, notwithstanding expiration of term, until his successor enters upon his office [passage 60].<\/li><\/ul><li><b>Article 57:<\/b> Eligibility for Re-election<\/li><ul><li>A person who holds or has held office is eligible for re-election to that office [passage 61]. (No constitutional bar on the number of terms).<\/li><\/ul><li><b>Article 58:<\/b> Qualifications for Election as President<\/li><ul><li>Must be a citizen of India [passage 62].<\/li><li>Must have completed 35 years of age [passage 62].<\/li><li>Must be qualified for election as a member of the House of the People (Lok Sabha) [passage 62].<\/li><li>Must not hold any office of profit under Government of India, State Government, or local authority [passage 62].<\/li><li><b>Exemption Explanation:<\/b> Existing President, Vice-President, Governor, or Minister (Union/State) is not deemed to hold an office of profit for this purpose [passage 63].<\/li><\/ul><li><b>Article 59:<\/b> Conditions of President&#x27;s Office<\/li><ul><li>Shall not be a member of either House of Parliament or State Legislature; if elected, deemed to have vacated that seat on entering office [passage 63].<\/li><li>Entitled without payment of rent to official residence (Rashtrapati Bhavan) and emoluments specified in the Second Schedule [passage 64, passage 496].<\/li><li>Emoluments and allowances shall not be diminished during the term of office [passage 64].<\/li><\/ul><li><b>Article 60:<\/b> Oath or Affirmation by the President<\/li><ul><li>Taken before the Chief Justice of India (CJI) or, in his absence, the senior-most Judge of the Supreme Court available [passage 65].<\/li><li><b>Key Text of Oath:<\/b> To &quot;faithfully execute the office... and to the best of my ability preserve, protect and defend the Constitution and the law and devote myself to the service and well-being of the people of India.&quot; [passage 66]<\/li><\/ul><li><b>Article 61:<\/b> Procedure for Impeachment of the President<\/li><ul><li><b>Sole Constitutional Ground:<\/b> &quot;Violation of the Constitution&quot; [passage 67].<\/li><li><b>Procedure:<\/b> 1. Initiation: Charge can be preferred by either House of Parliament [passage 67]. 2. Notice Requirement: Signed by at least 1/4th of total membership of the House with at least 14 days&#x27; written notice [passage 67]. 3. First House Passing: Passed by a majority of not less than 2/3rds of TOTAL MEMBERSHIP of that House [passage 68]. 4. Investigation by Second House: Investigated by the other House, where the President has the right to appear and be represented [passage 68]. 5. Final Adoption: If passed by a majority of not less than 2/3rds of TOTAL MEMBERSHIP of the investigating House, the President stands removed from the date of passing [passage 68].<\/li><\/ul><li><b>Article 62:<\/b> Time of Holding Election &amp; Casual Vacancy<\/li><ul><li>Election to fill a term-expiry vacancy must be completed before the term expires [passage 69].<\/li><li>Election for a casual vacancy (death, resignation, removal) must be held within 6 months [passage 69]. The new person holds office for the full 5-year term [passage 69].<\/li><\/ul><\/ul><h4>B. The Vice-President of India (Articles 63–70)<\/h4><ul><li><b>Article 63:<\/b> The Vice-President of India<\/li><ul><li>&quot;There shall be a Vice-President of India.&quot; [passage 70]<\/li><\/ul><li><b>Article 64:<\/b> Vice-President as Ex Officio Chairman of Rajya Sabha<\/li><ul><li>The Vice-President is ex officio Chairman of the Council of States (Rajya Sabha) [passage 70]. While acting as President under Art. 65, does not perform Chairman duties or draw Chairman salary [passage 70].<\/li><\/ul><li><b>Article 65:<\/b> Vice-President Acting as President<\/li><ul><li>Acts as President during casual vacancy (death, resignation, removal) until new President is elected, or discharges functions during absence/illness [passage 71].<\/li><\/ul><li><b>Article 66:<\/b> Election of Vice-President<\/li><ul><li><b>Electoral College:<\/b> Members of both Houses of Parliament (includes BOTH elected and nominated members) [passage 72]. No State Assemblies (MLAs) participate.<\/li><li><b>Method:<\/b> Proportional representation by single transferable vote via secret ballot [passage 72].<\/li><li><b>Qualifications:<\/b> Citizen of India, 35 years of age, qualified for election as a member of the Council of States (Rajya Sabha) [passage 73, passage 74].<\/li><\/ul><li><b>Article 67:<\/b> Term &amp; Removal of Vice-President<\/li><ul><li>Holds office for 5 years [passage 75]. Resigns in writing to the President [passage 75].<\/li><li><b>Removal Procedure [Art. 67(b)]:<\/b> 1. Resolution initiated ONLY in the Council of States (Rajya Sabha) with at least 14 days&#x27; notice [passage 76]. 2. Passed by a majority of ALL THE THEN members of the Council (Effective Majority) [passage 76]. 3. Agreed to by the House of the People (Lok Sabha) (Simple Majority) [passage 76].<\/li><\/ul><li><b>Article 68 &amp; 69:<\/b> Vacancy &amp; Oath of Vice-President<\/li><ul><li>Oath administered by the President or person appointed by him [passage 78]. Form: Bear true faith and allegiance to the Constitution [passage 78, passage 79].<\/li><\/ul><li><b>Article 70:<\/b> Discharge of President&#x27;s Functions in Other Contingencies<\/li><ul><li>Parliament can make provisions for unprovided contingencies [passage 79]. (e.g., President&#x27;s Discharge of Functions Act, 1969: CJI acts as President if both President and VP offices are vacant).<\/li><\/ul><\/ul><h4>C. Election Disputes, Pardoning Power &amp; Scope (Articles 71–73)<\/h4><ul><li><b>Article 71:<\/b> Disputes Connected with Presidential/Vice-Presidential Election<\/li><ul><li>Inquired into and decided exclusively by the Supreme Court, whose decision is final [passage 79].<\/li><li>Election cannot be challenged on the ground of any vacancy in the Electoral College [passage 81].<\/li><\/ul><li><b>Article 72:<\/b> Pardoning Power of the President<\/li><ul><li>Power to grant pardons, reprieves, respites, or remissions or to suspend, remit, or commute sentences in 3 cases [passage 81]: 1. Art. 72(1)(a): Cases where punishment/sentence is by a Court Martial [passage 82]. 2. Art. 72(1)(b): Offences against laws relating to matters to which Union executive power extends [passage 82]. 3. Art. 72(1)(c): All cases where sentence is a sentence of death [passage 83].<\/li><\/ul><li><b>Article 73:<\/b> Extent of Executive Power of the Union<\/li><ul><li>Co-extensive with Parliament&#x27;s legislative power (Union List &amp; Concurrent List) [passage 83, passage 84].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: President Articles (52 to 61) — &quot;P-E-E-M-T-E-Q-C-O-I&quot;<\/h4><ul><li><b>Mnemonic:<\/b> &quot;President Executive Elects Manner, Term Eligible Qualifies Conditions, Oath Impeaches&quot;<\/li><li><b>Decoding:<\/b><\/li><ul><li><b>52:<\/b> President of India [passage 55]<\/li><li><b>53:<\/b> Executive Power of Union [passage 55]<\/li><li><b>54:<\/b> Election Electoral College [passage 56]<\/li><li><b>55:<\/b> Manner of Election [passage 57]<\/li><li><b>56:<\/b> Term of Office [passage 60]<\/li><li><b>57:<\/b> Eligibility for Re-election [passage 61]<\/li><li><b>58:<\/b> Qualifications [passage 62]<\/li><li><b>59:<\/b> Conditions of Office [passage 63]<\/li><li><b>60:<\/b> Oath by CJI [passage 65]<\/li><li><b>61:<\/b> Impeachment Procedure [passage 67]<\/li><\/ul><\/ul><h4>Mnemonic 2: Vice-President Articles (63 to 69) — &quot;V-C-A-E-T-V-O&quot;<\/h4><ul><li><b>Mnemonic:<\/b> &quot;Vice-President Chairs, Acts, Elected, Term, Vacancy, Oath&quot;<\/li><li><b>Decoding:<\/b> 63: Vice-President [passage 70], 64: Chairman Rajya Sabha [passage 70], 65: Acting President [passage 71], 66: Election [passage 72], 67: Term/Removal [passage 75], 68: Vacancy timing [passage 77], 69: Oath [passage 78].<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 54 &amp; 66 (Electoral College Trap):<\/b><\/li><ul><li><b>President (54):<\/b> நாடாளுமன்ற + மாநில சட்டமன்ற தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்கள் மட்டுமே (No Nominated, No MLCs) [passage 56].<\/li><li><b>Vice-President (66):<\/b> நாடாளுமன்ற அனைத்து உறுப்பினர்கள் (Elected + Nominated), மாநில உறுப்பினர்கள் இல்லை [passage 72].<\/li><\/ul><li><b>Art. 60 (Oath):<\/b> பாதுகாப்பேன் (Preserve, Protect, Defend) → ஜனாதிபதி உறுதிமொழி [passage 66].<\/li><li><b>Art. 72 (Pardon):<\/b> மன்னிப்பு அதிகாரம் (Pardoning Power) [passage 81].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>PRESIDENT vs. VICE-PRESIDENT ELECTORAL &amp; REMOVAL MATRIX<\/h4><h4>│<\/h4><h4>┌───────────────────────────────────────────┴───────────────<\/h4><p>────────────────────────────┐<\/p><pre>│                                                       │<\/pre><pre>PRESIDENTIAL ELECTORAL COLLEGE (Art. 54)                    VICE-PRESIDENTIAL<\/pre><p>ELECTORAL COLLEGE (Art. 66)<\/p><pre>✦ Elected MPs (LS + RS)                       ✦ ALL MPs (Elected + Nominated)<\/pre><pre>✦ Elected MLAs (States + Delhi + Puducherry)          ✦ NO State Legislative Assembly<\/pre><p>Members (MLAs)<\/p><h4>✦ NO Nominated Members<\/h4><h4>───────────────────────────────────────────────────────┬────<\/h4><p>─────────────────────────────────────<\/p><pre>PRESIDENTIAL IMPEACHMENT (Art. 61)                     │ VICE-PRESIDENTIAL REMOVAL<\/pre><p>(Art. 67(b))<\/p><pre>✦ Initiated in EITHER House                   │ ✦ Initiated ONLY in Rajya Sabha<\/pre><pre>✦ Special Majority: 2/3rd of TOTAL MEMBERSHIP            │ ✦ Effective Majority in RS + Simple<\/pre><p>Majority in LS<\/p><pre>✦ Ground: &quot;Violation of the Constitution&quot;        │ ✦ No explicit constitutional ground specified<\/pre><ul><li>President (Art. 72) vs. Governor (Art. 161) Pardoning Power:<\/li><ul><li><b>Court Martial:<\/b> President can pardon Court Martial sentences [passage 82]; Governor has no power over Court Martials.<\/li><li><b>Death Sentence:<\/b> President has exclusive power to pardon death sentences [passage 83]. Governor cannot pardon death sentence (can only suspend, remit, or commute it).<\/li><\/ul><li>Presidential Oath (Art. 60) vs. All Other Constitutional Oaths (Third Schedule):<\/li><ul><li>The President&#x27;s Oath (&quot;Preserve, protect and defend the Constitution&quot;) is explicitly placed in Article 60 [passage 65, passage 66] and is NOT part of the Third Schedule [passage 504]. The Vice-President&#x27;s Oath is in Article 69 [passage 78].<\/li><\/ul><\/ul>"}, {"t": "Cases", "h": "<h4>1. Executive Head &amp; Constitutional Bound Duty:<\/h4><ul><ul><li>Shamsher Singh v. State of Punjab (1974) &amp; U.N.R. Rao v. Indira Gandhi (1971): The Supreme Court affirmed that the President is a constitutional/formal head. The President exercises executive powers under Art. 53 [passage 55] strictly in accordance with the aid and advice of the Council of Ministers headed by the Prime Minister (Art. 74) [passage 86]. 2. Judicial Review of Pardoning Power (Article 72):<\/li><li>Maru Ram v. Union of India (1980) &amp; Kehar Singh v. Union of India (1989):<\/li><ul><li>President&#x27;s power under Art. 72 [passage 81] is exercised on the advice of the Union Cabinet, not in personal discretion.<\/li><li>The exercise of Art. 72 power is subject to limited judicial review on grounds of arbitrary, mala fide, discriminatory, or irrelevant considerations.<\/li><\/ul><li><b>Shatrughan Chauhan v. Union of India (2014):<\/b> Inordinate and unexplained delay in deciding mercy petitions by the President constitutes a ground for commuting death sentence to life imprisonment under Article 21 [passage 57]. 3. Electoral Disputes (Article 71):<\/li><li><b>In re Presidential Election (1974):<\/b> The Supreme Court held that the election of the President can proceed even if a State Legislative Assembly is dissolved and its seats are vacant in the Electoral College [passage 81].<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Presidential vs. Parliamentary System, Executive Discretion, and Executive Clemency<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Part V (Articles 52–73) defines the executive architecture of the Union, embodying a parliamentary form of government where the President serves as the constitutional Head of State (De Jure) while executive power is exercised through the Council of Ministers (De Facto) [passage 55, passage 86]. Grounded in the checks and balances of Articles 54, 61, and 72, the Presidential office maintains constitutional continuity and federal representation [passage 56, passage 67, passage 81].&quot;<\/p><ul><li>Mains Body Arguments (Constitutional Status &amp; Clemency Framework):<\/li><ul><li><b>Formal vs. Real Executive:<\/b> Cite Shamsher Singh (1974) to explain why the President&#x27;s executive authority under Article 53 [passage 55] is tied to Cabinet advice under Article 74 [passage 86], except in rare situational discretions (hung Parliament, Prime Minister appointment, ordinance dissolution).<\/li><li><b>Judicial Scrutiny of Mercy Petitions:<\/b> Reference Kehar Singh (1989) and Shatrughan Chauhan (2014) to analyze Article 72 pardoning power [passage 81], emphasizing that executive clemency is a constitutional duty subject to anti-arbitrariness checks under Article 14 [passage 49].<\/li><li><b>Asymmetric Electoral Weightage:<\/b> Explain how Article 55 maintains parity between Union and State votes [passage 57], reflecting cooperative federalism.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, the President of India is neither a mere figurehead nor an absolute monarch, but the custodian of the Constitution who acts as a crucial balance in Indian federalism.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the exact majority requirement in both Houses of Parliament for passing a resolution to impeach the President under Article 61? [passage 68] 2. Reverse Recall: Which Article specifies that all doubts and disputes arising out of or in connection with the election of the President or Vice-President shall be inquired into and decided exclusively by the Supreme Court? [passage 79] 3. UPSC Prelims Analytical Trap: Are nominated members of the Rajya Sabha eligible to vote in the election of the President (Article 54) [passage 56] and in the election of the Vice-President (Article 66)? [passage 72] Explain the difference clearly. 4. Mains Applied Comparison: Compare the pardoning power of the President under Article 72 [passage 81] with the pardoning power of a Governor under Article 161 regarding Court Martial sentences and death sentences [passage 82, passage 83].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; Vice-President (Articles 52–73) (Current<\/span><\/label><p>Lesson Complete)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part V: Prime Minister, Council of Ministers &amp; Attorney-General (Articles 74–78)<\/span><\/label><p>(Up Next)<\/p>"}], "nchk": 8}, {"n": 9, "title": "Part V — Prime Minister, Council of Ministers & Attorney-General", "secs": [{"t": "Articles", "h": "<h4>for India (Articles 74–78)<\/h4><p>Articles 74 through 78 outline the real political executive of the Union (De Facto Executive) and the highest law officer of the land [passage 3, passage 4].<\/p><h4>UNION REAL EXECUTIVE &amp; LAW OFFICER ARCHITECTURE (ARTICLES 74–78)<\/h4><h4>│<\/h4><h4>┌─────────────────────────┬───────────┴───────────┬─────────<\/h4><p>────────────────┐<\/p><pre>│ Cabinet Governance &amp;       │ Parliamentary         │ Legal Advisor      │<\/pre><pre>│ Aid &amp; Advice         │ Accountability      │ to Union            │<\/pre><pre>│ (Art. 74)         │ (Art. 75)        │ (Art. 76)           │<\/pre><h4>└─────────────────────────┴───────────────────────┴─────────<\/h4><p>────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><h4>│ Government Business │<\/h4><pre>│ &amp; PM&#x27;s Duties      │<\/pre><pre>│ (Arts. 77 &amp; 78)   │<\/pre><h4>└─────────────────────┘<\/h4><p><b>Article 74:<\/b> Council of Ministers to Aid and Advise President<\/p><ul><li><b>Art. 74(1):<\/b> There shall be a Council of Ministers with the Prime Minister at the head to aid and advise the President, who shall, in the exercise of his functions, act in accordance with such advice [passage 76].<\/li><ul><li><b>The 42nd CAA, 1976:<\/b> Explicitly made the advice of the Council of Ministers binding on the President [passage 79].<\/li><li><b>The 44th CAA, 1978 Proviso:<\/b> Inserted the proviso enabling the President to require the Council of Ministers to reconsider such advice (generally or otherwise) [passage 77, passage 79]. However, the President shall act in accordance with the advice tendered after such reconsideration [passage 77].<\/li><\/ul><li><b>Art. 74(2) Judicial Immunity Clause:<\/b> The question whether any, and if so what, advice was tendered by Ministers to the President shall not be inquired into in any court [passage 77].<\/li><\/ul><h4>Article 75: Other Provisions as to Ministers<\/h4><ul><li><b>Art. 75(1) Appointment:<\/b> Prime Minister is appointed by the President, and other Ministers are appointed by the President on the advice of the Prime Minister [passage 77].<\/li><li><b>Art. 75(1A) Size Cap (91st CAA, 2003):<\/b> Total number of Ministers, including the PM, in the Council of Ministers shall not exceed 15% of the total number of members of the House of the People (Lok Sabha) [passage 78]. (Note: Not 15% of total Parliament!)<\/li><li>Art. 75(1B) Defection Disqualification (91st CAA, 2003): A member disqualified under the Tenth Schedule (Anti-Defection Law) is also disqualified from being appointed as a Minister [passage 78].<\/li><li><b>Art. 75(2) Individual Tenure:<\/b> Ministers hold office during the pleasure of the President (Individual Responsibility) [passage 79].<\/li><li><b>Art. 75(3) Collective Responsibility:<\/b> The Council of Ministers shall be collectively responsible to the House of the People (Lok Sabha) [passage 79]. (Not to Rajya Sabha or Parliament as a whole).<\/li><li><b>Art. 75(4) Oath:<\/b> Oaths of office and secrecy administered by the President according to forms in the Third Schedule [passage 79, passage 507, passage 508].<\/li><li><b>Art. 75(5) 6-Month Non-Member Window:<\/b> A Minister who for any period of six consecutive months is not a member of either House of Parliament ceases to be a Minister [passage 80].<\/li><li><b>Art. 75(6) Remuneration:<\/b> Salaries determined by Parliament (specified in Second Schedule until determined) [passage 80, passage 497].<\/li><\/ul><h4>Article 76: Attorney-General for India<\/h4><ul><li><b>Art. 76(1) Appointment &amp; Eligibility:<\/b> Appointed by the President; must be a person qualified to be appointed a Judge of the Supreme Court [passage 80, passage 81]. (Citizen of India, and either 5 years HC Judge or 10 years HC Advocate, or distinguished jurist) [passage 136, passage 212].<\/li><li><b>Art. 76(2) Functions:<\/b> Primary legal advisor to the Government of India, performing duties referred/assigned by the President [passage 81].<\/li><li><b>Art. 76(3) Right of Audience:<\/b> Right of audience in all courts in the territory of India [passage 81].<\/li><li><b>Art. 76(4) Tenure &amp; Remuneration:<\/b> Holds office during the pleasure of the President; remuneration is determined by the President [passage 82]. (Neither tenure nor salary is fixed by the Constitution).<\/li><\/ul><h4>Article 77: Conduct of Business of the Government of India<\/h4><ul><li><b>Art. 77(1):<\/b> All executive action of the Government of India shall be expressed to be taken in the name of the President [passage 82].<\/li><li><b>Art. 77(2):<\/b> Orders authenticated under rules made by the President cannot be questioned on grounds that it is not an order made by the President [passage 82].<\/li><li><b>Art. 77(3) Rules of Business:<\/b> President shall make rules for the more convenient transaction of business of the Government of India (Transaction of Business Rules) and allocation of business among Ministers (Allocation of Business Rules) [passage 83].<\/li><\/ul><p><b>Article 78:<\/b> Duties of Prime Minister as Respects Furnishing Information to the President<\/p><h4>It shall be the duty of the Prime Minister [passage 84]:<\/h4><p><b>1. Art. 78(a) Communication Duty:<\/b> To communicate to the President all decisions of the Council of Ministers relating to administration and proposals for legislation [passage 84]. 2. Art. 78(b) Information Supply: To furnish such information relating to administration and legislative proposals as the President may call for [passage 84]. 3. Art. 78(c) Reconsideration Submission: If the President so requires, to submit for consideration of the Council of Ministers any matter on which a decision was taken by an individual Minister but has not been considered by the Council [passage 85].<\/p>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Core Sequence of Articles 74 to 78 — &quot;A-M-A-B-D&quot;<\/h4><ul><li><b>Mnemonic:<\/b> &quot;Avise, Ministers, Attorney, Business, Duties&quot;<\/li><li><b>Decoding:<\/b><\/li><ul><li><b>Art. 74:<\/b> Advise President (Aid &amp; Advice) [passage 76]<\/li><li><b>Art. 75:<\/b> Ministers&#x27; appointment, 15% cap, responsibility [passage 77, passage 78, passage 79]<\/li><li><b>Art. 76:<\/b> Attorney-General for India [passage 80]<\/li><li><b>Art. 77:<\/b> Business Conduct of GoI [passage 82]<\/li><li><b>Art. 78:<\/b> Duties of Prime Minister to inform President [passage 84]<\/li><\/ul><\/ul><h4>Mnemonic 2: Article 75 Clauses — &quot;A-C-I-O-N-S&quot;<\/h4><ul><li><b>Art. 75(1):<\/b> Appointment by President [passage 77]<\/li><li><b>Art. 75(1A):<\/b> Cap on size (15% Lok Sabha) [passage 78]<\/li><li><b>Art. 75(2):<\/b> Individual Pleasure [passage 79]<\/li><li><b>Art. 75(3):<\/b> Overarching Collective Responsibility [passage 79]<\/li><li><b>Art. 75(5):<\/b> Non-Member (6 months limit) [passage 80]<\/li><li><b>Art. 75(6):<\/b> Salaries [passage 80]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 74:<\/b> ஆலோசனை (Advice Binding) → &quot;பிரதமர் தலைமை அமைச்சரவை ஆலோசனைப்படி குடியரசுத் தலைவர் செயல்பட வேண்டும்&quot; [passage 76].<\/li><li><b>Art. 75(3):<\/b> கூட்டுப் பொறுப்பு (Collective Responsibility) → &quot;மக்களவைக்கு அமைச்சரவை கூட்டாக பொறுப்புடையது&quot; [passage 79].<\/li><li><b>Art. 76:<\/b> அரசின் தலைமை வழக்கறிஞர் (Attorney General) → &quot;இந்திய அரசாங்கத்தின் உச்சகட்ட சட்ட ஆலோசகர்&quot; [passage 80, passage 81].<\/li><li><b>Art. 78:<\/b> பிரதமரின் கடமை (PM&#x27;s Communication Duty) → &quot;குடியரசுத் தலைவருக்கு தகவல் அளிப்பது பிரதமரின் அரசியலமைப்பு கடமை&quot; [passage 84].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>UNION EXECUTIVE vs. STATE EXECUTIVE PARALLEL MATRIX<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                      │<\/pre><pre>UNION PROVISION (PART V)                           STATE PROVISION (PART VI)<\/pre><pre>✦ Art. 74 — Aid &amp; Advice to President              ✦ Art. 163 — Aid &amp; Advice to Governor\n✦ Art. 75 — Provisions as to Ministers          ✦ Art. 164 — Provisions as to Ministers<\/pre><pre>✦ Art. 76 — Attorney-General for India           ✦ Art. 165 — Advocate-General for the State<\/pre><pre>✦ Art. 77 — Conduct of Business of GoI            ✦ Art. 166 — Conduct of Business of State<\/pre><pre>✦ Art. 78 — Duties of PM to President            ✦ Art. 167 — Duties of CM to Governor<\/pre><p>A. Special Constitutional Powers of the Attorney-General (Art. 76 ↔ Art. 88)<\/p><ul><li>While Article 76 defines the AG&#x27;s appointment and duties [passage 80, passage 81], Article 88 grants the AG the right to speak and take part in proceedings of either House of Parliament, any joint sitting, or any parliamentary committee where named a member, BUT WITHOUT THE RIGHT TO VOTE [passage 94].<\/li><\/ul><h4>B. &quot;Council of Ministers&quot; (Art. 74/75) vs. &quot;Cabinet&quot; (Art. 352)<\/h4><ul><li>The term &quot;Cabinet&quot; was not in the original Constitution.<\/li><li>Inserted into Article 352(3) by the 44th CAA, 1978 [passage 414].<\/li><li><b>Council of Ministers (Arts. 74, 75):<\/b> Wider body comprising Cabinet Ministers, Ministers of State, and Deputy Ministers [passage 76, passage 77].<\/li><li><b>Cabinet (Art. 352):<\/b> Inner core body consisting exclusively of Prime Minister and Ministers of Cabinet rank [passage 414].<\/li><\/ul>"}, {"t": "Cases", "h": "<h4>1. Continuity of Council of Ministers &amp; Aid and Advice:<\/h4><ul><ul><li><b>U.N.R. Rao v. Indira Gandhi (1971):<\/b> The Supreme Court held that even after the dissolution of Lok Sabha, the Council of Ministers does not cease to hold office. Article 74(1) is mandatory—the President cannot exercise executive power without the aid and advice of the Council of Ministers [passage 56, passage 76]. 2. Scope of Article 74(2) Immunity:<\/li><li><b>S.R. Bommai v. Union of India (1994):<\/b> Clarified that while Article 74(2) bars courts from inquiring into the actual advice tendered by Ministers [passage 77], it does not bar judicial review of the material on the basis of which the advice was tendered (e.g., Governor&#x27;s report under Art. 356) [passage 420]. 3. Appointment of Non-Member as Prime Minister / Minister:<\/li><li><b>S.P. Anand v. H.D. Deve Gowda (1996):<\/b> The Supreme Court upheld that a person who is not a member of either House of Parliament can be appointed Prime Minister, provided they get elected to either House within 6 months under Article 75(5) [passage 80].<\/li><li><b>B.R. Kapoor v. State of Tamil Nadu (2001):<\/b> Held that a person disqualified from contesting elections under the Representation of the People Act, 1951 cannot be appointed Chief Minister/Minister under the 6-month non-member clause. 4. Constitutional Morality &amp; Criminal Antecedents:<\/li><li><b>Manoj Narula v. Union of India (2014):<\/b> A 5-judge Constitution bench observed that Prime Ministers and Chief Ministers, while exercising power under Art. 75(1) / Art. 164(1) [passage 77, passage 169], are expected not to appoint persons with serious criminal charges framed against them, upholding Constitutional Trust and Morality.<\/li><\/ul><\/ul>"}, {"t": "Mains", "h": "<p><b>Mains Topic:<\/b> Cabinet Government, Ministerial Responsibility, and Executive Accountability<\/p><ul><li><b>Mains Introduction Framework:<\/b><\/li><\/ul><p>&quot;Articles 74–78 establish the parliamentary executive architecture of the Union, embodying West-minster-style collective responsibility under Article 75(3) [passage 79]. Guided by the constitutional obligation of the Prime Minister under Article 78 [passage 84] and the binding nature of cabinet advice under Article 74(1) [passage 76], this design balances democratic responsiveness with executive stability.&quot;<\/p><ul><li>Mains Body Arguments (Collective Responsibility &amp; Advisory Mechanics):<\/li><ul><li><b>Mandatory Character of Aid &amp; Advice:<\/b> Cite U.N.R. Rao (1971) to show that Article 74(1) is non-negotiable—the President can never act without a Council of Ministers [passage 56, passage 76].<\/li><li><b>Judicial Review Limits:<\/b> Explain the distinction established in S.R. Bommai (1994) regarding Article 74(2) [passage 77]: advice is immune, but underlying factual materials remain open to judicial scrutiny.<\/li><li><b>Federal &amp; Size Rationalization:<\/b> Highlight the 91st Amendment Act, 2003 (Article 75(1A)) [passage 78] which capped cabinet size at 15% of Lok Sabha to prevent jumbo cabinets and political patronage.<\/li><\/ul><li><b>Mains Conclusion Framework:<\/b><\/li><\/ul><p>&quot;Thus, the Cabinet architecture under Part V ensures that executive power remains anchored in parliamentary oversight, preserving the rule of law and constitutional morality.&quot;<\/p>"}, {"t": "Drill", "h": "<h4>Test your recall and analytical synthesis:<\/h4><p><b>1. Direct Recall:<\/b> What is the maximum permissible ceiling on the total number of Ministers (including the PM) under Article 75(1A) [passage 78], and which House forms the numerical basis for this calculation? 2. Reverse Recall: Under which Article does the Attorney-General for India hold the right of audience in all courts within the territory of India? [passage 81] 3. UPSC Prelims Analytical Trap: Does the Attorney-General for India have the right to vote in a Joint Sitting of Parliament under Article 88? [passage 94] Explain why or why not. 4. Mains Applied Question: Discuss how the 42nd Amendment Act (1976) and the 44th Amendment Act (1978) altered the constitutional relationship between the President and the Council of Ministers under Article 74(1) [passage 76, passage 77].<\/p>"}, {"t": "Checklist", "h": "<label class=\"ck\"><input type=\"checkbox\" data-c=\"0\"><span>Schedules 1 to 12 (Lesson 0)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"1\"><span>Preamble &amp; Part I (Articles 1–4) (Lesson 1)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"2\"><span>Part II: Citizenship (Articles 5–11) (Lesson 2)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"3\"><span>Part III: Fundamental Rights (Articles 12–35) (Lessons 3, 4, 5)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"4\"><span>Part IV: Directive Principles of State Policy (Articles 36–51) (Lesson 6)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"5\"><span>Part IVA: Fundamental Duties (Article 51A) (Lesson 7)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"6\"><span>Part V: Union Executive — President &amp; Vice-President (Articles 52–73) (Lesson<\/span><\/label><p>8)<\/p><label class=\"ck\"><input type=\"checkbox\" data-c=\"7\"><span>Part V: Council of Ministers, PM &amp; AG (Articles 74–78) (Current Lesson Complete)<\/span><\/label><label class=\"ck\"><input type=\"checkbox\" data-c=\"8\"><span>Part V: Parliament — Composition, Officers &amp; Sessions (Articles 79–106) (Up<\/span><\/label><p>Next)<\/p>"}], "nchk": 9}, {"n": 10, "title": "Part V — Parliament: Composition, Officers, Conduct of", "secs": [{"t": "Articles", "h": "<h4>Business &amp; Privileges (Articles 79–106)<\/h4><p>Chapter II of Part V (Articles 79–122) establishes the legislative organ of the Union—The Parliament of India [passage 8, passage 93]. This lesson covers Articles 79 through 106, detailing parliamentary composition, qualifications, officers, voting, disqualifications, and constitutional privileges [passage 8, passage 9, passage 10, passage 11, passage 12].<\/p><h4>PART V CHAPTER II: PARLIAMENT ARCHITECTURE (ARTICLES 79–106)<\/h4><h4>│<\/h4><h4>┌─────────────────────────────┬──────────────┴──────────────<\/h4><p>┬─────────────────────────────┐<\/p><pre>│ Structure &amp; Composition        │ Sessions, Address &amp; Rights │ Presiding Officers &amp;       │<\/pre><pre>│ (Arts. 79–84)           │ (Arts. 85–88)             │ Secretariat (Arts. 89–98) │<\/pre><h4>└─────────────────────────────┴─────────────────────────────<\/h4><p>┴─────────────────────────────┘<\/p><h4>│<\/h4><h4>┌──────────┴──────────┐<\/h4><pre>│ Conduct, Quorum,          │<\/pre><h4>│ Disqualifications &amp; │<\/h4><pre>│ Privileges        │<\/pre><pre>│ (Arts. 99–106)        │<\/pre><h4>└─────────────────────┘<\/h4><h4>A. General Architecture &amp; Composition (Articles 79–84)<\/h4><ul><li><b>Article 79:<\/b> Constitution of Parliament<\/li><ul><li>Parliament consists of the President and two Houses: the Council of States (Rajya Sabha) and the House of the People (Lok Sabha) [passage 8, passage 93].<\/li><\/ul><li><b>Article 80:<\/b> Composition of the Council of States (Rajya Sabha)<\/li><ul><li><b>Maximum Strength:<\/b> 250 members [passage 93, passage 94]: 1. 12 members nominated by the President having special knowledge or practical experience in Literature, Science, Art, and Social Service (L-S-A-S) [passage 94, passage 95]. 2. Not more than 238 representatives of the States and Union Territories [passage 94].<\/li><li>Allocation of seats is specified in the Fourth Schedule [passage 40, passage 94].<\/li><li>Representatives of States are elected by elected members of State Legislative Assemblies via proportional representation by single transferable vote [passage 440, passage 482].<\/li><\/ul><li><b>Article 81:<\/b> Composition of the House of the People (Lok Sabha)<\/li><ul><li><b>Maximum Strength:<\/b> 1. Not more than 530 members chosen by direct election from territorial constituencies in the States [passage 96]. 2. Not more than 20 members to represent Union Territories [passage 96]. (Note: Nomination of 2 Anglo-Indians under Art. 331 was discontinued by the 104th CAA, 2019) [passage 350, passage 355].<\/li><li>Ratio between seats allotted to a State and its population must be uniform across all States [passage 96].<\/li><\/ul><li><b>Article 82:<\/b> Readjustment after each Census (Delimitation)<\/li><ul><li>Upon completion of each census, seat allocation and territorial division are readjusted by an authority (Delimitation Commission) determined by law [passage 9, passage 98].<\/li><li><b>Freeze Proviso:<\/b> Allocation of seats as readjusted on the basis of the 1971 census and territorial division on the basis of the 2001 census remain frozen until figures for the first census taken after the year 2026 are published (84th CAA 2001 &amp; 87th CAA 2003) [passage 98, passage 99, passage 100].<\/li><\/ul><li><b>Article 83:<\/b> Duration of Houses of Parliament<\/li><ul><li><b>Art. 83(1) Rajya Sabha:<\/b> Not subject to dissolution; as nearly as possible 1/3rd of its members retire every second year [passage 100].<\/li><li><b>Art. 83(2) Lok Sabha:<\/b> Duration is 5 years from its first meeting [passage 100, passage 102]. 1. Emergency Proviso: Can be extended by Parliament by law during a Proclamation of Emergency for a period not exceeding 1 year at a time, and not extending beyond 6 months after the emergency ceases [passage 100, passage 194].<\/li><\/ul><li><b>Article 84:<\/b> Qualifications for Membership of Parliament<\/li><ul><li><b>A person must [passage 101]:<\/b> 1. Be a citizen of India and make an oath/affirmation before a person authorized by the Election Commission according to the Third Schedule [passage 101, passage 473]. 2. Be not less than 30 years of age for Rajya Sabha, and not less than 25 years of age for Lok Sabha [passage 101]. 3. Possess other qualifications prescribed by law made by Parliament (e.g., Representation of the People Act, 1951) [passage 102].<\/li><\/ul><\/ul><h4>B. Sessions, Address &amp; Rights of Ministers/AG (Articles 85–88)<\/h4><ul><li><b>Article 85:<\/b> Sessions of Parliament, Prorogation, and Dissolution<\/li><ul><li><b>Art. 85(1):<\/b> President summons each House. Six months shall not intervene between its last sitting in one session and the date appointed for its first sitting in the next session [passage 103].<\/li><li><b>Art. 85(2):<\/b> President may from time to time prorogue either House or dissolve the House of the People [passage 103].<\/li><\/ul><li><b>Article 86:<\/b> Right of President to Address and Send Messages<\/li><ul><li>President may address either House or both Houses jointly, and send messages regarding pending Bills [passage 103].<\/li><\/ul><li><b>Article 87:<\/b> Special Address by the President<\/li><ul><li>At the commencement of the first session after each general election to Lok Sabha AND at the commencement of the first session of each year, the President shall address both Houses assembled together [passage 104]. (Debated via the Motion of Thanks).<\/li><\/ul><li><b>Article 88:<\/b> Rights of Ministers and Attorney-General as Respects Houses<\/li><ul><li>Every Union Minister and the Attorney-General for India has the right to speak and take part in proceedings of either House, joint sittings, or any parliamentary committee where named a member, BUT SHALL NOT BE ENTITLED TO VOTE [passage 104].<\/li><\/ul><\/ul><h4>C. Officers of Parliament (Articles 89–98)<\/h4><ul><li><b>Articles 89–92:<\/b> Council of States (Rajya Sabha) Officers<\/li><ul><li><b>Art. 89:<\/b> Vice-President is ex officio Chairman; Rajya Sabha chooses a member as Deputy Chairman [passage 105, passage 106].<\/li><li><b>Art. 90:<\/b> Deputy Chairman vacates office if ceasing to be a member, resigns to the Chairman, or is removed by a resolution passed by a majority of all the then members (Effective Majority) with at least 14 days&#x27; notice [passage 106, passage 107].<\/li><li><b>Art. 91:<\/b> Deputy Chairman or President-appointed member performs Chairman duties when the office is vacant or VP acts as President [passage 107].<\/li><li><b>Art. 92:<\/b> Chairman or Deputy Chairman shall not preside while a removal<\/li><\/ul><\/ul><h4>🚨<\/h4><p>resolution against them is under consideration [passage 108].<\/p><ul><ul><ul><li><b>Voting Rule:<\/b> The VP (Chairman) has no vote at all during removal proceedings [passage 109].<\/li><\/ul><\/ul><li><b>Articles 93–96:<\/b> House of the People (Lok Sabha) Officers<\/li><ul><li><b>Art. 93:<\/b> Lok Sabha chooses two members as Speaker and Deputy Speaker [passage 109].<\/li><li><b>Art. 94:<\/b> Speaker/Deputy Speaker vacates office if ceasing to be an MP; Speaker resigns to Deputy Speaker (and vice versa); removed by a resolution passed by an Effective Majority (14 days&#x27; notice) [passage 110].<\/li><ul><li><b>Proviso (Continuity of Speaker):<\/b> Whenever Lok Sabha is dissolved, the Speaker shall NOT vacate office until immediately before the first meeting of the new Lok Sabha [passage 111].<\/li><\/ul><li><b>Art. 95:<\/b> Deputy Speaker or President-appointed member performs Speaker duties when the office is vacant [passage 111].<\/li><li><b>Art. 96:<\/b> Speaker/Deputy Speaker shall not preside during their removal<\/li><\/ul><\/ul><h4>🚨<\/h4><p>resolution [passage 112].<\/p><ul><ul><ul><li><b>Voting Rule:<\/b> The Speaker has the right to speak and vote in the FIRST INSTANCE on their removal resolution, but NOT in case of an equality of votes (no casting vote) [passage 113].<\/li><\/ul><\/ul><li><b>Article 97 &amp; 98:<\/b> Salaries &amp; Secretariat<\/li><ul><li><b>Art. 97:<\/b> Salaries of Presiding Officers fixed by Parliament (charged on Consolidated Fund) [passage 113, passage 135].<\/li><li><b>Art. 98:<\/b> Each House shall have a separate secretarial staff [passage 114].<\/li><\/ul><\/ul><h4>D. Conduct of Business, Voting &amp; Quorum (Articles 99–100)<\/h4><ul><li><b>Article 99:<\/b> Oath or Affirmation by Members<\/li><ul><li>Every MP before taking seat must take an oath/affirmation before the President or person appointed by him according to the Third Schedule [passage 115, passage 475].<\/li><\/ul><li><b>Article 100:<\/b> Voting, Action Notwithstanding Vacancies, and Quorum<\/li><ul><li><b>Art. 100(1):<\/b> All questions determined by a majority of votes of members present and voting [passage 115]. Presiding Officer shall not vote in the first instance, but exercises a casting vote in case of a tie [passage 115, passage 116].<\/li><li><b>Art. 100(3):<\/b> Quorum: Quorum to constitute a meeting of either House is 1/10th of the total number of members of the House [passage 116].<\/li><\/ul><\/ul><h4>E. Disqualifications, Anti-Defection &amp; Vacancies (Articles 101–104)<\/h4><ul><li><b>Article 101:<\/b> Vacation of Seats<\/li><ul><li>Seats become vacant on double membership, disqualification, resignation, or unauthorized absence for 60 consecutive days (excluding prorogation/adjournment &gt; 4 consecutive days) [passage 117, passage 118, passage 119, passage 120].<\/li><li>Resignation Rule [Art. 101(3)(b) Proviso - 33rd CAA 1974]: Speaker/Chairman shall not accept resignation if satisfied after inquiry that it is not voluntary or genuine [passage 119].<\/li><\/ul><li><b>Article 102:<\/b> Disqualifications for Membership<\/li><ul><li><b>Art. 102(1) Statutory Grounds:<\/b> A person is disqualified if they [passage 122, passage 123]: 1. Hold any office of profit under GoI/State Govt (other than declared exempt by Parliament) [passage 122]. 2. Are of unsound mind declared by a competent court [passage 122]. 3. Are an undischarged insolvent [passage 122]. 4. Are not a citizen of India or voluntarily acquire foreign citizenship [passage 122]. 5. Are disqualified by or under any law made by Parliament (e.g., RPA 1951) [passage 123].<\/li><li><b>Art. 102(2) Defection Ground:<\/b> Disqualified if disqualified under the Tenth Schedule (Anti-Defection Law) [passage 123, passage 524].<\/li><\/ul><li><b>Article 103:<\/b> Decision on Disqualifications under Art. 102(1)<\/li><ul><li><b>Art. 103(1):<\/b> Questions regarding Art. 102(1) disqualifications are referred to the President, whose decision is final [passage 123].<\/li><li><b>Art. 103(2):<\/b> President MUST obtain the opinion of the Election Commission and ACT ACCORDING TO SUCH OPINION [passage 125].<\/li><li><b>(Note:<\/b> Disqualification under 102(2)/10th Schedule is decided by the Speaker/Chairman under Para 6 of the 10th Schedule) [passage 530].<\/li><\/ul><li><b>Article 104:<\/b> Penalty for Sitting and Voting Before Oath or When Disqualified<\/li><ul><li>Penalty of Rs. 500 per day recovered as a debt due to the Union [passage 125].<\/li><\/ul><\/ul><h4>F. Powers, Privileges &amp; Immunities (Articles 105–106)<\/h4><ul><li><b>Article 105:<\/b> Powers, Privileges, etc., of Houses and Members<\/li><ul><li><b>Art. 105(1):<\/b> Freedom of speech in Parliament [passage 126].<\/li><li><b>Art. 105(2) Absolute Court Immunity:<\/b> No MP shall be liable to any proceedings in any court in respect of anything said or any vote given by him in Parliament or any committee thereof [passage 126].<\/li><li><b>Art. 105(3):<\/b> Other privileges defined by Parliament by law [passage 127].<\/li><li><b>Art. 105(4):<\/b> Privileges extend to non-member participants (Ministers and Attorney-General) [passage 128].<\/li><\/ul><li><b>Article 106:<\/b> Salaries and Allowances of Members<\/li><ul><li>Determined from time to time by Parliament by law [passage 129].<\/li><\/ul><\/ul>"}, {"t": "Mnemonics", "h": "<h4>Mnemonic 1: Core Sequence of Articles 79 to 88 — &quot;S-C-H-E-D-U-L-E&quot;<\/h4><ul><li><b>79:<\/b> Sstructure of Parliament [passage 93]<\/li><li><b>80:<\/b> Co-opted Rajya Sabha (250 members) [passage 93]<\/li><li><b>81:<\/b> House of People (Lok Sabha) [passage 96]<\/li><li><b>82:<\/b> Equalized seats / Delimitation [passage 98]<\/li><li><b>83:<\/b> Duration of Houses [passage 100]<\/li><li><b>84:<\/b> Under-age / Qualifications (30 RS / 25 LS) [passage 101]<\/li><li><b>85:<\/b> Lapse-free Sessions (6 months gap limit) [passage 103]<\/li><li><b>88:<\/b> Entitled Non-Voters (Ministers &amp; AG) [passage 104]<\/li><\/ul><h4>Mnemonic 2: Rajya Sabha Nominated Fields (Art. 80(3)) — &quot;L-S-A-S&quot;<\/h4><h4>🚨<\/h4><ul><li>Literature, Science, Art, Social Service [passage 95].<\/li><li><b>UPSC Trap:<\/b> &quot;Co-operation&quot; is NOT in Article 80(3) for Rajya Sabha! It exists only in Article 171(5) for State Legislative Councils [passage 193].<\/li><\/ul><h4>Mnemonic 3: Article 102(1) Disqualifications — &quot;O-U-I-C-P&quot;<\/h4><ul><li>Office of profit [passage 122]<\/li><li>Unsound mind [passage 122]<\/li><li>Insolvent [passage 122]<\/li><li>Citizenship foreign [passage 122]<\/li><li>Parliamentary law (RPA 1951) [passage 123]<\/li><\/ul><h4>Tamil-English Association Map:<\/h4><ul><li><b>Art. 80(3):<\/b> நியமன உறுப்பினர்கள் (LSAS) → இலக்கியம், அறிவியல், கலை, சமூக சேவை [passage 95].<\/li><li><b>Art. 88:<\/b> வாக்களிக்க உரிமையில்லை (No Vote) → அமைச்சர்கள் &amp; AG பேசலாம், ஆனால் வாக்களிக்க முடியாது [passage 104].<\/li><li><b>Art. 94 Proviso:<\/b> சபாநாயகர் பதவி விலகமாட்டார் → மக்களவை கலைக்கப்பட்டாலும் புதிய மக்களவை முதல் கூட்டம் வரை சபாநாயகர் பதவியில் நீடிப்பார் [passage 111].<\/li><li><b>Art. 103 vs 10th Schedule:<\/b> யார் முடிவெடுப்பார்? → Art. 102(1) தகுதிநீக்கம் = குடியரசுத் தலைவர் (தேர்தல் ஆணைய ஆலோசனையின்படி) [passage 123, passage 125]. Art. 102(2) கட்சித் தாவல் = சபாநாயகர் / தலைவர் [passage 530].<\/li><\/ul>"}, {"t": "Connections", "h": "<h4>PARLIAMENT (PART V) vs. STATE LEGISLATURE (PART VI) PARALLEL<\/h4><h4>│<\/h4><h4>┌─────────────────────────────────────────┴─────────────────<\/h4><p>────────────────────────┐<\/p><pre>│                                                   │<\/pre><pre>PARLIAMENT PROVISION                            STATE LEGISLATURE PROVISION<\/pre><pre>✦ Art. 79 — Parliament Composition              ✦ Art. 168 — State Legislature Composition<\/pre><pre>✦ Art. 80 — Rajya Sabha (250 max)                ✦ Art. 171 — Legislative Council (1/3rd<\/pre><p>Assembly)<\/p><pre>✦ Art. 81 — Lok Sabha (550 max)                ✦ Art. 170 — Legislative Assembly (500 max<\/pre><p>/ 60 min)<\/p><pre>✦ Art. 84 — Qualifications (30 RS / 25 LS)       ✦ Art. 173 — Qualifications (30 Council / 25<\/pre><p>Assembly)<\/p><pre>✦ Art. 85 — Sessions &amp; Dissolution              ✦ Art. 174 — Sessions &amp; Dissolution<\/pre><pre>✦ Art. 88 — Rights of AG &amp; Ministers            ✦ Art. 177 — Rights of Advocate-General &amp;<\/pre><p>Ministers<\/p><pre>✦ Art. 102 — Disqualifications               ✦ Art. 191 — Disqualifications<\/pre><pre>✦ Art. 103 — President&#x27;s Decision (EC advice)      ✦ Art. 192 — Governor&#x27;s Decision (EC<\/pre><p>advice)<\/p><pre>✦ Art. 105 — Parliamentary
